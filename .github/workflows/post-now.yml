# Post today's message to the Facebook Page right now (Actions tab → "Post now" → Run workflow).
# The daily release workflow already posts every morning; use this for a test or a missed day.
name: Post now
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/daily-post.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
