  scene: (() => {

      // bhangra: both arms up, one leg lifted

      ctx.beginPath(); ctx.moveTo(x - 6 * s, y - 20 * s); ctx.lineTo(x - 8 * s, y); ctx.moveTo(x + 6 * s, y - 20 * s); ctx.lineTo(x + 12 * s + Math.max(0, b) * 8 * s, y - Math.max(0, b) * 14 * s); ctx.stroke();
    };
    const draw = (ctx, S, now, dt) => {
      const sky = ctx.createLinearGradient(0, 0, 0, S.H); sky.addColorStop(0, '#070512'); sky.addColorStop(0.65, '#1c0f2b'); sky.addColorStop(1, '#3a1608');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      stars.forEach((st) => { ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(now / 1300 + st.p)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      const mr = Math.min(S.W, S.H) * 0.04; ctx.fillStyle = '#f1f3f5'; ctx.beginPath(); ctx.arc(S.W * 0.15, S.H * 0.1, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#070512'; ctx.beginPath(); ctx.arc(S.W * 0.15 + mr * 0.45, S.H * 0.1 - mr * 0.2, mr * 0.9, 0, Math.PI * 2); ctx.fill();
      const s = Math.max(0.75, Math.min(S.W, 640) / 640), base = S.H - 30, cx = S.W / 2;
      // ground and glow of the fire
      const glowR = S.W * (0.45 + 0.1 * S.light);
      const gl = ctx.createRadialGradient(cx, base - 30 * s, 10, cx, base - 30 * s, glowR); gl.addColorStop(0, `rgba(255, 140, 40, ${0.35 + 0.25 * S.light})`); gl.addColorStop(1, 'rgba(255, 120, 30, 0)');
      ctx.fillStyle = gl; ctx.fillRect(0, 0, S.W, S.H);
      ctx.fillStyle = '#2a1206'; ctx.fillRect(0, base, S.W, S.H - base);
      dancers.forEach((d) => dancer(ctx, d, base, s, now));
      // logs
      ctx.fillStyle = '#5c3a1e'; ctx.save(); ctx.translate(cx, base - 6 * s); [-0.35, 0.35, 0].forEach((a) => { ctx.save(); ctx.rotate(a); ctx.fillRect(-46 * s, -6 * s, 92 * s, 12 * s); ctx.restore(); }); ctx.restore();
      // flames: layered flickering tongues
      const H = (90 + 50 * S.light) * s;
      ctx.globalCompositeOperation = 'lighter';
      [['rgba(255, 80, 20, 0.75)', 1, 46], ['rgba(255, 150, 30, 0.8)', 0.75, 34], ['rgba(255, 230, 120, 0.9)', 0.45, 20]].forEach(([c, hk, w]) => {
        for (let k = -2; k <= 2; k += 1) {
          const fx = cx + k * w * 0.45 * s, fh = H * hk * (0.75 + 0.25 * Math.sin(now / 110 + k * 1.7)) * (1 - Math.abs(k) * 0.15);
          ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(fx - w * 0.5 * s, base - 8 * s);
          ctx.quadraticCurveTo(fx - w * 0.4 * s, base - fh * 0.5, fx + Math.sin(now / 150 + k) * 8 * s, base - fh);
          ctx.quadraticCurveTo(fx + w * 0.4 * s, base - fh * 0.5, fx + w * 0.5 * s, base - 8 * s); ctx.closePath(); ctx.fill();
        }
      });
      // sparks rising
      acc += dt; while (acc > 0.03) { acc -= 0.03; sparks.push({ x: cx + (Math.random() - 0.5) * 60 * s, y: base - 40 * s, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 90, life: 1.5 + Math.random() }); }
      sparks.forEach((p) => { p.x += p.vx * dt + Math.sin(now / 300 + p.y) * 0.3; p.y += p.vy * dt; p.life -= dt; ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = '#ffd43b'; ctx.fillRect(p.x, p.y, 2, 2); });
      sparks = sparks.filter((p) => p.life > 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      // rewri, peanuts and popcorn tossed into the fire after opening
      if (S.playing && Math.random() < dt * 2.2) { const side = Math.random() < 0.5 ? -1 : 1; snacks.push({ x: cx + side * S.W * 0.3, y: base - 60 * s, vx: -side * (90 + Math.random() * 60) * s, vy: -140, e: ['🥜', '🍿', '🍬', '🌰'][Math.floor(Math.random() * 4)] }); }
      ctx.font = `${16 * s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center';
      snacks.forEach((n) => { n.vy += 260 * dt; n.x += n.vx * dt; n.y += n.vy * dt; ctx.fillText(n.e, n.x, n.y); });
      snacks = snacks.filter((n) => n.y < base - 20 * s);
    };
    return { resize, draw };
  })(),
};
