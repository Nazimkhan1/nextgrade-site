      ctx.fillRect(cx - bw / 2, top, bw, bh);
      ctx.globalAlpha = 1; ctx.fillStyle = '#0c1736';
      ctx.fillRect(cx - bw / 2, top, bw, bh);
      ctx.fillRect(cx - bw / 2 - 6 * s, top - 8 * s, bw + 12 * s, 8 * s);
      ctx.fillRect(cx - 70 * s, top - 40 * s, 140 * s, 34 * s);
      onion(ctx, cx, top - 40 * s, 150 * s, 120 * s); kalash(ctx, cx, top - 160 * s, s);
      [-1, 1].forEach((d) => {
        [bw / 2 - 8 * s, 50 * s].forEach((off) => {
          const kx = cx + d * off;
          ctx.fillRect(kx - 13 * s, top - 30 * s, 26 * s, 22 * s);
          onion(ctx, kx, top - 30 * s, 34 * s, 30 * s); kalash(ctx, kx, top - 60 * s, s * 0.6);
        });
      });
      // lit arches
      ctx.fillStyle = `rgba(255, 200, 90, ${0.3 + 0.65 * S.light})`; ctx.shadowColor = 'rgba(255, 190, 80, 0.9)'; ctx.shadowBlur = 12 * S.light;
      for (let i = -3; i <= 3; i += 1) {
        const w = (i === 0 ? 34 : 18) * s, h = (i === 0 ? 62 : 38) * s, x = cx + i * 44 * s - w / 2, y = base - h - (i === 0 ? 0 : 30 * s);
        ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + w / 2); ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
      }
      ctx.shadowBlur = 0;
      // strings of lights along the roof and the dome
      const pts = [];
      for (let x = -bw / 2 - 6 * s; x <= bw / 2 + 6 * s; x += 9 * s) pts.push([cx + x, top - 8 * s]);
      for (let a = 0; a <= 1; a += 0.04) { const yy = top - 40 * s - 120 * s * Math.sin(Math.PI * a) * 0.92; pts.push([cx - 75 * s + 150 * s * a, yy]); }
      bulbs(ctx, pts, S.light, now);
      // Nishan Sahib: a tall pole with a saffron flag waving
      const px = cx + bw / 2 + 52 * s, ph = 300 * s;
      ctx.fillStyle = '#c9d4f0'; ctx.fillRect(px - 2 * s, base - ph, 4 * s, ph);
      ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.moveTo(px + 2 * s, base - ph + 4 * s);
      for (let k = 0; k <= 10; k += 1) { const fx = px + 2 * s + k * 8 * s; const fy = base - ph + 4 * s + (k * 3 * s) + Math.sin(now / 300 - k * 0.6) * 4 * s; ctx.lineTo(fx, fy); }
      ctx.lineTo(px + 2 * s, base - ph + 70 * s); ctx.closePath(); ctx.fill();
    };
    const draw = (ctx, S, now, dt) => {
      const sky = ctx.createLinearGradient(0, 0, 0, S.H);
      sky.addColorStop(0, '#040a1f'); sky.addColorStop(0.6, '#0b1f4d'); sky.addColorStop(1, '#1d2f6b');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      stars.forEach((st) => { ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(now / 1100 + st.p)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      // the full moon of Kartik Purnima
      const mx = S.W * 0.85, my = S.H * 0.08, mr = Math.min(S.W, S.H) * 0.05;
      const mg = ctx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 3.2); mg.addColorStop(0, 'rgba(255, 244, 214, 0.35)'); mg.addColorStop(1, 'rgba(255, 244, 214, 0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, mr * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff4d6'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      // a few gentle fireworks once it is open
      if (S.playing) { acc += dt; if (acc > 1.1) { acc = 0; rockets.push({ x: S.W * (0.1 + Math.random() * 0.8), y: S.H * 0.7, ty: S.H * (0.1 + Math.random() * 0.2), c: COLORS[Math.floor(Math.random() * COLORS.length)] }); } }
      rockets.forEach((r) => { r.y -= 420 * dt; ctx.fillStyle = '#ffe8cc'; ctx.beginPath(); ctx.arc(r.x, r.y, 2, 0, Math.PI * 2); ctx.fill(); if (r.y <= r.ty) { r.done = true; for (let i = 0; i < 60; i += 1) { const a = (Math.PI * 2 * i) / 60, sp = 50 + Math.random() * 110; sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.3, c: r.c }); } } });
      rockets = rockets.filter((r) => !r.done);
      ctx.globalCompositeOperation = 'lighter';
      sparks.forEach((p) => { p.vy += 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 0.8; ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * 0.85; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      sparks = sparks.filter((p) => p.life > 0);
      gurdwara(ctx, S, now);
      // ground and a row of diyas
      ctx.fillStyle = '#081129'; ctx.fillRect(0, S.H - 34, S.W, 34);
      diyas.forEach((d, i) => {
        const lit = S.light > i / diyas.length; const y = S.H - 14;
        ctx.fillStyle = '#b5651d'; ctx.beginPath(); ctx.ellipse(d.x, y, 9, 4.5, 0, 0, Math.PI); ctx.fill();
        if (!lit) return;
        const fl = 1 + Math.sin(now / 120 + d.p) * 0.15;
        const g = ctx.createRadialGradient(d.x, y - 8, 1, d.x, y - 8, 18); g.addColorStop(0, 'rgba(255, 200, 80, 0.55)'); g.addColorStop(1, 'rgba(255, 200, 80, 0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, y - 8, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.ellipse(d.x, y - 6 * fl, 2.6, 6 * fl, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(d.x, y - 4 * fl, 1, 2.5 * fl, 0, 0, Math.PI * 2); ctx.fill();
      });
    };
    return { resize, draw };
  })(),
};
