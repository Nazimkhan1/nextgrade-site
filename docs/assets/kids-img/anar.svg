    <ellipse cx="80" cy="86" rx="4" ry="5"/><ellipse cx="98" cy="78" rx="3.5" ry="4.5"/><ellipse cx="88" cy="93" rx="4" ry="5"/>
  </g>
  <g fill="#ff8a9a" opacity=".8">
