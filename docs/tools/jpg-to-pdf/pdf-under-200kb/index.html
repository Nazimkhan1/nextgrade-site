<script>window.JP_PAGE = {"slug": "pdf-under-200kb", "kb": 200, "base": "../", "T": {"hinglish": {"title": "Photo se PDF, 200 KB se kam", "sub": "Marksheet aur certificate ki photos ko ek PDF mein jodo jo 200 KB ki upload limit mein aaye — padhne laayak saaf, form ke liye kaafi chhoti.", "aboutH": "200 KB: sabse aam beech wali limit", "about": "<p>Bahut se application portal ek document ke liye 200 KB ko sabse badi file maante hain. Yeh samajhdaar size hai: rangeen mein kuch pages ke padhne laayak text ke liye kaafi bada, aur dheemi connection aur bheed wale server ke liye kaafi chhota. Mushkil yeh hai ki phone ki photos isse kai guna badi hoti hain, isliye unhe chhota karna padta hai — bina woh baarikiyan khoye jo jaanchne wala adhikari dekhega.<\/p><p>Is page par 200 KB pehle se chuna hai. PDF banate waqt tool pehle sabse oonchi quality aazmaata hai aur use utna hi ghatata hai jitna zaroori ho, har baar asli PDF naap kar. Sirf quality se baat na bane to tasveeron ko thoda chhota karta hai. Result ke neeche likha note batata hai ki dono mein se kya kiya gaya.<\/p>", "howH": "200 KB ki PDF, step by step", "how": ["Document ki photos ikattha karo — jaise marksheet ke dono taraf.", "Unhe <b>Gallery se chuno<\/b> se daalo ya <b>Camera se lo<\/b> se nayi lo.", "<b>↑ ↓<\/b> se order lagao; leta hua page <b>⟳<\/b> se seedha karo.", "Limit <b>200 KB<\/b> rehne do, ya form jo sahi number deta hai woh likho.", "<b>PDF banao<\/b> dabao, page 1 ki jhalak dekho, file ka naam document ke naam par rakho aur download karo."], "whenH": "Kaun se uploads aksar 200 KB maangte hain", "when": "<ul><li><b>College aur university admission<\/b>: 10th/12th ki marksheet, transfer aur migration certificate.<\/li><li><b>Naukri ki applications<\/b>: degree certificate, experience letter, caste ya disability certificate.<\/li><li><b>Entrance exam ke forms<\/b>: category ya domicile certificate aksar isi range mein maanga jaata hai.<\/li><li><b>Scholarship forms<\/b>: income certificate, bank passbook ka pehla page, fees ki raseed.<\/li><\/ul><p>Limit portal-portal mein, aur ek hi form ke alag upload box mein bhi badal sakti hai, isliye har upload button ke neeche likhi line padho.<\/p>", "tipsH": "Admission aur naukri ke uploads ke liye tips", "tips": ["Har file ka naam uske kaam par rakho — \"income-certificate.pdf\" — taaki sahi file sahi box mein jaaye.", "Document par rangeen mohar, hologram ya photo ho to rang rehne do; adhikari kabhi-kabhi use dekhte hain.", "Lagbhag chaar pages tak 200 KB mein rangeen text aam taur par saaf rehta hai. Zyada pages hon to black & white chuno.", "Final PDFs ki copy phone ke ek folder mein rakho; agle form mein aksar phir chahiye hoti hain.", "Submit karne se pehle PDF ek baar kholo aur roll number, naam aur marks padh kar pakka karo ki saaf hain."], "probH": "Aksar aane wali dikkatein", "probs": [["File 200 KB se kam hai phir bhi portal mana kar raha hai", "Ho sakta hai portal 200 KB ko 2,00,000 bytes maanta ho. Box mein 195 likho aur PDF dobara banao."], ["Rangeen mohar feeki pad gayi", "Black & white chalu hai. Page settings mein use band karo taaki mohar ka rang bana rahe."], ["200 KB ke liye pages bahut zyada hain", "Result kahe ki fit nahi hui to woh pages hatao jo form ne nahi maange, ya unhe alag documents ki tarah upload karo."], ["Dheeme network par upload beech mein ruk jaata hai", "Chhoti file aasaani se jaati hai. 150 KB jaisi kam limit aazmao, ya achhe signal ka intezaar karo."]], "faqH": "200 KB PDF ke sawaal", "faq": [["Kya 200 KB mein marksheet padhne laayak rahegi?", "Haan. 200 KB mein ek-do A4 pages par chhape marks aur naam saaf rehte hain, rangeen mein bhi — bas asli photo saaf honi chahiye."], ["Kya kai certificates ko ek 200 KB PDF mein jod sakte hain?", "Jod sakte ho, lekin limit sabmein bantti hai, isliye har page ko kam jagah milti hai. Portal mein alag box hon to har certificate ki alag PDF banao."], ["Form \"50 se 200 KB ke beech\" kahe to?", "200 KB limit rakho. Poore page ki photo wali PDF lagbhag hamesha 50 KB se upar hoti hai, aur result mein sahi size dikhta hai to aap jaanch sakte ho."], ["Kya tool mere document ki baatein badalta hai?", "Nahi. Woh sirf tasveeron ka size aur quality ghatata hai. Pages par na kuch likha jaata hai, na hataya, na joda jaata hai."], ["Kya computer par bhi chalega?", "Haan. Kisi bhi naye browser mein chalta hai; computer par photos ko page par khinch kar daal sakte ho aur list ko khinch kar order badal sakte ho."]], "privH": "Aapke application ke kaagaz aapke hi", "privText": "Admission aur naukri ke documents mein aisi jaankari hoti hai jo anjaan servers par nahi pahunchni chahiye. Yahan PDF aapke apne phone ya computer ka browser jodta hai. Koi copy upload ya save nahi hoti, aur page band karte hi photos memory se hat jaati hain."}, "hi": {"title": "फ़ोटो से PDF, 200 KB से कम", "sub": "मार्कशीट और सर्टिफ़िकेट की फ़ोटो को एक PDF में जोड़ें जो 200 KB की अपलोड सीमा में आए — पढ़ने लायक साफ़, फ़ॉर्म के लिए काफ़ी छोटी।", "aboutH": "200 KB: सबसे आम बीच वाली सीमा", "about": "<p>बहुत से आवेदन पोर्टल एक डॉक्यूमेंट के लिए 200 KB को सबसे बड़ी फ़ाइल मानते हैं। यह समझदारी भरा साइज़ है: रंगीन में कुछ पेज की पढ़ने लायक लिखावट के लिए काफ़ी बड़ा, और धीमे कनेक्शन व भीड़ वाले सर्वर के लिए काफ़ी छोटा। मुश्किल यह है कि फ़ोन की फ़ोटो इससे कई गुना बड़ी होती हैं, इसलिए उन्हें छोटा करना पड़ता है — बिना वे बारीकियाँ खोए जो जाँचने वाला अधिकारी देखेगा।<\/p><p>इस पेज पर 200 KB पहले से चुना है। PDF बनाते समय टूल पहले सबसे ऊँची क्वालिटी आज़माता है और उसे उतना ही घटाता है जितना ज़रूरी हो, हर बार असली PDF नापकर। सिर्फ़ क्वालिटी से बात न बने तो तस्वीरों को थोड़ा छोटा करता है। नतीजे के नीचे लिखा नोट बताता है कि दोनों में से क्या किया गया।<\/p>", "howH": "200 KB की PDF, क़दम दर क़दम", "how": ["डॉक्यूमेंट की फ़ोटो इकट्ठा करें — जैसे मार्कशीट के दोनों तरफ़।", "उन्हें <b>गैलरी से चुनें<\/b> से डालें या <b>कैमरा से लें<\/b> से नई लें।", "<b>↑ ↓<\/b> से क्रम लगाएँ; लेटा हुआ पेज <b>⟳<\/b> से सीधा करें।", "सीमा <b>200 KB<\/b> रहने दें, या फ़ॉर्म जो सही नंबर देता है वह लिखें।", "<b>PDF बनाएँ<\/b> दबाएँ, पेज 1 की झलक देखें, फ़ाइल का नाम डॉक्यूमेंट के नाम पर रखें और डाउनलोड करें।"], "whenH": "कौन से अपलोड अक्सर 200 KB माँगते हैं", "when": "<ul><li><b>कॉलेज और विश्वविद्यालय एडमिशन<\/b>: 10वीं/12वीं की मार्कशीट, ट्रांसफ़र और माइग्रेशन सर्टिफ़िकेट।<\/li><li><b>नौकरी के आवेदन<\/b>: डिग्री सर्टिफ़िकेट, अनुभव पत्र, जाति या दिव्यांगता प्रमाण पत्र।<\/li><li><b>प्रवेश परीक्षा के फ़ॉर्म<\/b>: श्रेणी या निवास प्रमाण पत्र अक्सर इसी दायरे में माँगा जाता है।<\/li><li><b>स्कॉलरशिप फ़ॉर्म<\/b>: आय प्रमाण पत्र, बैंक पासबुक का पहला पेज, फ़ीस की रसीद।<\/li><\/ul><p>सीमा पोर्टल-पोर्टल में, और एक ही फ़ॉर्म के अलग अपलोड बॉक्स में भी बदल सकती है, इसलिए हर अपलोड बटन के नीचे लिखी लाइन पढ़ें।<\/p>", "tipsH": "एडमिशन और नौकरी के अपलोड के लिए सुझाव", "tips": ["हर फ़ाइल का नाम उसके काम पर रखें — \"income-certificate.pdf\" — ताकि सही फ़ाइल सही बॉक्स में जाए।", "डॉक्यूमेंट पर रंगीन मुहर, होलोग्राम या फ़ोटो हो तो रंग रहने दें; अधिकारी कभी-कभी उसे देखते हैं।", "लगभग चार पेज तक 200 KB में रंगीन लिखावट आम तौर पर साफ़ रहती है। ज़्यादा पेज हों तो ब्लैक एंड व्हाइट चुनें।", "अंतिम PDF की कॉपी फ़ोन के एक फ़ोल्डर में रखें; अगले फ़ॉर्म में अक्सर फिर चाहिए होती हैं।", "सबमिट करने से पहले PDF एक बार खोलें और रोल नंबर, नाम और अंक पढ़कर पक्का करें कि साफ़ हैं।"], "probH": "अक्सर आने वाली दिक़्क़तें", "probs": [["फ़ाइल 200 KB से कम है फिर भी पोर्टल मना कर रहा है", "हो सकता है पोर्टल 200 KB को 2,00,000 बाइट मानता हो। बॉक्स में 195 लिखें और PDF दोबारा बनाएँ।"], ["रंगीन मुहर फीकी पड़ गई", "ब्लैक एंड व्हाइट चालू है। पेज सेटिंग में उसे बंद करें ताकि मुहर का रंग बना रहे।"], ["200 KB के लिए पेज बहुत ज़्यादा हैं", "नतीजा कहे कि फ़िट नहीं हुई तो वे पेज हटाएँ जो फ़ॉर्म ने नहीं माँगे, या उन्हें अलग डॉक्यूमेंट की तरह अपलोड करें।"], ["धीमे नेटवर्क पर अपलोड बीच में रुक जाता है", "छोटी फ़ाइल आसानी से जाती है। 150 KB जैसी कम सीमा आज़माएँ, या अच्छे सिग्नल का इंतज़ार करें।"]], "faqH": "200 KB PDF के सवाल", "faq": [["क्या 200 KB में मार्कशीट पढ़ने लायक रहेगी?", "हाँ। 200 KB में एक-दो A4 पेज पर छपे अंक और नाम साफ़ रहते हैं, रंगीन में भी — बस असली फ़ोटो साफ़ होनी चाहिए।"], ["क्या कई सर्टिफ़िकेट को एक 200 KB PDF में जोड़ सकते हैं?", "जोड़ सकते हैं, लेकिन सीमा सबमें बँटती है, इसलिए हर पेज को कम जगह मिलती है। पोर्टल में अलग बॉक्स हों तो हर सर्टिफ़िकेट की अलग PDF बनाएँ।"], ["फ़ॉर्म \"50 से 200 KB के बीच\" कहे तो?", "200 KB सीमा रखें। पूरे पेज की फ़ोटो वाली PDF लगभग हमेशा 50 KB से ऊपर होती है, और नतीजे में सही साइज़ दिखता है तो आप जाँच सकते हैं।"], ["क्या टूल मेरे डॉक्यूमेंट की बातें बदलता है?", "नहीं। वह सिर्फ़ तस्वीरों का साइज़ और क्वालिटी घटाता है। पेज पर न कुछ लिखा जाता है, न हटाया, न जोड़ा जाता है।"], ["क्या कंप्यूटर पर भी चलेगा?", "हाँ। किसी भी नए ब्राउज़र में चलता है; कंप्यूटर पर फ़ोटो को पेज पर खींचकर डाल सकते हैं और सूची को खींचकर क्रम बदल सकते हैं।"]], "privH": "आपके आवेदन के काग़ज़ आपके ही", "privText": "एडमिशन और नौकरी के डॉक्यूमेंट में ऐसी जानकारी होती है जो अनजान सर्वर पर नहीं पहुँचनी चाहिए। यहाँ PDF आपके अपने फ़ोन या कंप्यूटर का ब्राउज़र जोड़ता है। कोई कॉपी अपलोड या सेव नहीं होती, और पेज बंद करते ही फ़ोटो मेमोरी से हट जाती हैं।"}, "en": {"title": "Photo to PDF under 200 KB", "sub": "Join marksheet and certificate photos into one PDF that fits a 200 KB upload limit — clear enough to read, small enough for the form.", "aboutH": "200 KB: the most common middle limit", "about": "<p>Many application portals settle on 200 KB as the largest file for one document. It is a sensible size: big enough for a few pages of readable text in colour, small enough for slow connections and crowded servers. The catch is that phone photos are many times bigger, so they must be made smaller without losing the details the checking officer will look at.<\/p><p>This page has 200 KB already selected. When you make the PDF, the tool tries the highest quality first and lowers it only as much as needed, measuring the real PDF each time. If quality alone is not enough, it makes the pictures slightly smaller. The note under the result tells you which of the two was done.<\/p>", "howH": "Making a 200 KB PDF, step by step", "how": ["Gather the photos of the document — for example both sides of a marksheet.", "Add them with <b>From gallery<\/b>, or take new ones with <b>Use camera<\/b>.", "Put them in order with <b>↑ ↓<\/b>; turn a page lying on its side with <b>⟳<\/b>.", "Leave the limit at <b>200 KB<\/b>, or type the exact number your form gives.", "Tap <b>Make PDF<\/b>, look at the page 1 preview, name the file after the document and download it."], "whenH": "Uploads that often ask for 200 KB", "when": "<ul><li><b>College and university admission<\/b>: Class 10/12 marksheets, transfer and migration certificates.<\/li><li><b>Job applications<\/b>: degree certificates, experience letters, caste or disability certificates.<\/li><li><b>Entrance exam forms<\/b>: a category or domicile certificate is often asked for in this range.<\/li><li><b>Scholarship forms<\/b>: income certificate, the first page of a bank passbook, a fee receipt.<\/li><\/ul><p>Limits change from portal to portal, and even between upload boxes on the same form, so read the line under each upload button.<\/p>", "tipsH": "Tips for admission and job uploads", "tips": ["Name each file after what it is — \"income-certificate.pdf\" — so the right file goes into the right box.", "Keep colour when the document has a coloured stamp, hologram or photo; officers sometimes look for it.", "Up to about four pages, 200 KB usually keeps colour text clear. With more pages, switch to black & white.", "Keep a copy of your final PDFs in one folder on your phone; the next form will often ask for them again.", "Before you submit, open the PDF once and read the roll number, name and marks to be sure they are clear."], "probH": "Problems people often run into", "probs": [["The file is under 200 KB but the portal rejects it", "The portal may count 200 KB as 200,000 bytes. Type 195 in the box and make the PDF again."], ["The coloured stamp turned faint", "Black & white is on. Turn it off under Page settings so the stamp keeps its colour."], ["Too many pages for 200 KB", "If the result says it could not fit, remove pages the form did not ask for, or upload them as separate documents."], ["The upload stops halfway on a slow network", "Smaller files go through more easily. Try a lower limit such as 150 KB, or wait for a better signal."]], "faqH": "Questions about a 200 KB PDF", "faq": [["Will a marksheet stay readable at 200 KB?", "Yes. At 200 KB, one or two A4 pages keep printed marks and names clear, even in colour — as long as the original photo is sharp."], ["Can I join several certificates into one 200 KB PDF?", "You can, but the limit is shared, so each page gets less room. If the portal has separate boxes, make one PDF per certificate instead."], ["What if the form says \"between 50 and 200 KB\"?", "Keep 200 KB as the limit. A PDF with a full-page photo is almost always above 50 KB, and the result shows the exact size so you can check."], ["Does the tool change what my document says?", "No. It only reduces the size and quality of the pictures. Nothing is written on, removed from or added to your pages."], ["Does it work on a computer too?", "Yes. It runs in any modern browser; on a computer you can drag photos onto the page and drag the list to change the order."]], "privH": "Your application papers stay yours", "privText": "Admission and job documents hold details that should not end up on unknown servers. Here the PDF is put together by the browser on your own phone or computer. No copy is uploaded or kept, and closing the page clears the photos from memory."}, "bn": {"title": "ছবি থেকে PDF, 200 KB-র কম", "sub": "মার্কশিট আর সার্টিফিকেটের ছবি জুড়ে এমন একটা PDF বানান যা 200 KB আপলোড-সীমায় আঁটে — পড়ার মতো পরিষ্কার, ফর্মের জন্য যথেষ্ট ছোট।", "aboutH": "200 KB: সবচেয়ে চেনা মাঝারি সীমা", "about": "<p>অনেক আবেদন পোর্টাল একটা ডকুমেন্টের জন্য 200 KB-কেই সবচেয়ে বড় ফাইল ধরে। মাপটা যুক্তিসঙ্গত: রঙিনে কয়েক পাতার পড়ার মতো লেখার জন্য যথেষ্ট বড়, আর ধীর সং     probH: 'Aam dikkatein aur unka hal', probs: [['PDF form ki limit se badi hai', 'Upar wahi KB chuno jo form likhta hai. Phir bhi fit na ho to black & white chuno, faltu pages hatao ya photos crop karke dobara daalo.'], ['Pages galat order mein aa gaye', 'List ka upar se neeche ka order hi PDF ka order hai. ↑ ↓ se theek karo aur "PDF banao" phir dabao — purani PDF apne aap nahi badalti.'], ['Koi page tedha hai', 'Us photo par ⟳ dabao jab tak woh seedhi na dikhe. Phone ki apni rotation (EXIF) tool pehle hi theek kar deta hai.'], ['PDF mein text dhundhla hai', 'Aksar photo hi dhundhli hoti hai. Achhi roshni mein, haath sthir rakh kar dobara photo lo, ya KB limit thodi badhao.'], ['Photo khul hi nahi rahi', 'Yeh aksar iPhone ki HEIC photo hoti hai. Camera ki setting "Most Compatible" karo ya photo ka screenshot daalo.']],
    faqH: 'Aksar pooche jaane wale sawaal',
    faq: [['Kya yeh free hai, aur kya photos upload hoti hain?', 'Haan, poora free hai, koi sign-up nahi. Photos kahin upload nahi hoti — PDF aapke phone/browser ke andar hi banti hai.'], ['Kai photos ko ek PDF mein kaise jodein?', 'Gallery se saari photos ek saath chuno (ya baad mein "Aur photo" dabao). Har photo ek page banti hai, aur upar wali photo pehla page.'], ['PDF ko 200 KB se kam kaise karein?', 'Upar 200 KB chuno. Tool pehle JPG quality kam karta hai, phir bhi badi ho to photos ka px thoda kam karta hai — jab tak PDF 200 KB ke andar na aa jaaye.'], ['A4 aur "Photo jitna" mein kya fark hai?', 'A4 mein har page print wale kaagaz ke size ka hota hai aur photo uske andar aati hai — forms aur print ke liye yahi theek hai. "Photo jitna" mein page photo ke aakaar ka hota hai, koi safed jagah nahi.'], ['Kya yeh bina internet ke chalega?', 'Haan. Page ek baar khul jaaye to internet band karke bhi photos daal kar PDF bana sakte ho, kyunki saara kaam phone mein hi hota hai.']],
    privH: 'Aapke documents, aapke paas', privText: 'Marksheet, Aadhaar jaise documents personal hote hain. Isliye yeh tool bina kisi server ke aapke phone/browser mein chalta hai. Photos ya PDF kahin upload nahi hoti, kahin save nahi hoti, aur hum unhe dekh bhi nahi sakte. Page band karte hi sab mit jaata hai.',
    footer: 'Free tool · kuch bhi upload nahi hota',

    dl: '⬇️ PDF डाउनलोड', share: '📲 शेयर', saved: '✅ फ़ोन में सेव हो गया', badKb: 'KB 20 से 20000 के बीच लिखें।', libFail: 'PDF बनाने वाला हिस्सा लोड नहीं हुआ। इंटरनेट चालू करके पेज एक बार रिफ़्रेश करें।', pdfFail: 'PDF नहीं बन पाई। कम फ़ोटो के साथ दोबारा कोशिश करें।',

    aboutH: 'यह JPG to PDF टूल क्या करता है',
    about: '<p>बहुत से ऑनलाइन फ़ॉर्म डॉक्यूमेंट PDF में माँगते हैं, लेकिन आपके काग़ज़ फ़ोन में फ़ोटो की तरह पड़े होते हैं — मार्कशीट, आधार कार्ड, जाति या आय प्रमाण पत्र, फ़ीस की रसीद। यह टूल उन फ़ोटो को जोड़कर एक PDF फ़ाइल बनाता है: हर फ़ोटो एक पेज, और पेज उसी क्रम में जो आप चुनें। JPG, PNG और WebP फ़ोटो चलती हैं, और iPhone की HEIC फ़ोटो भी, अगर आपका ब्राउज़र उसे खोल सके।</p><p>सारा काम आपके ब्राउज़र के अंदर होता है। फ़ोटो आपके फ़ोन से पढ़ी जाती हैं, वहीं पेज बनते हैं और वहीं PDF तैयार होती है — किसी सर्वर पर कुछ नहीं जाता। इसलिए काम जल्दी भी होता है: अपलोड का इंतज़ार नहीं, और पेज एक बार खुल जाए तो बिना इंटरनेट के भी चलता है।</p>',
    howH: 'फ़ोटो को PDF कैसे बनाएँ — क़दम दर क़दम', how: ['<b>गैलरी से चुनें</b> दबाएँ और सारी फ़ोटो एक साथ चुनें, या <b>कैमरा से लें</b> से सीधे काग़ज़ की फ़ोटो खींचें।', 'सूची में सबसे ऊपर वाली फ़ोटो पेज 1 बनती है। क्रम <b>↑ ↓</b> से बदलें (कंप्यूटर पर फ़ोटो को खींचकर भी)।', 'कोई फ़ोटो टेढ़ी या उल्टी हो तो <b>⟳</b> दबाएँ; हर बार 90° घूमती है। ग़लत फ़ोटो <b>✕</b> से हटाएँ।', 'फ़ॉर्म KB की सीमा दे तो <b>100 KB</b>, <b>200 KB</b> या अपना KB चुनें। सीमा न हो तो "कोई सीमा नहीं" रहने दें।', 'ज़रूरत हो तो "पेज सेटिंग" में A4/Letter, पेज की दिशा, मार्जिन या ब्लैक एंड व्हाइट चुनें।', '<b>PDF बनाएँ</b> दबाएँ, पेज 1 की झलक देखें, नाम बदलें और <b>डाउनलोड</b> या <b>शेयर</b> करें।'],
    whenH: 'फ़ोटो की PDF कब चाहिए होती है?',
    when: '<p>नीचे वे जगहें हैं जहाँ अक्सर फ़ोटो को PDF बनाना पड़ता है। हर पोर्टल की सीमा अलग होती है, इसलिए फ़ॉर्म पर लिखी बात ही सबसे पहले मानें।</p><ul><li><b>कॉलेज एडमिशन और स्कॉलरशिप पोर्टल</b> अक्सर मार्कशीट और सर्टिफ़िकेट PDF में माँगते हैं, ज़्यादातर 100 KB से 500 KB के बीच की सीमा के साथ।</li><li><b>सरकारी नौकरी के फ़ॉर्म</b> में जाति, निवास या अनुभव प्रमाण पत्र अक्सर PDF में, कई बार 200–300 KB तक माँगे जाते हैं।</li><li><b>बैंक, KYC और दफ़्तर का काम</b>: पहचान पत्र के दोनों तरफ़ अक्सर एक ही फ़ाइल में चाहिए होते हैं।</li><li><b>ईमेल और चैट</b>: दस अलग फ़ोटो से एक PDF भेजना और खोलना कहीं आसान है।</li></ul>',
    tipsH: 'काम की बातें', tips: ['फ़ोटो दिन की रोशनी में, काग़ज़ के ठीक ऊपर से लें। छाया और टेढ़ा कोण लिखावट को पढ़ना मुश्किल बनाते हैं।', 'आधार के दोनों तरफ़ एक PDF में चाहिए तो आगे और पीछे की दो फ़ोटो डालें — दो पेज बन जाएँगे।', 'साइज़ सीमा कम हो और फ़ोटो ज़्यादा हों तो <b>ब्लैक एंड व्हाइट</b> चुनें। लिखावट साफ़ रहती है और फ़ाइल काफ़ी छोटी हो जाती है।', 'पहले गैलरी में फ़ोटो क्रॉप कर लें, सिर्फ़ काग़ज़ वाला हिस्सा रखें। फ़ालतू बैकग्राउंड हटने से उसी KB में लिखावट ज़्यादा साफ़ आती है।', 'पोर्टल में हर डॉक्यूमेंट का अलग बॉक्स हो तो हर डॉक्यूमेंट की अलग PDF बनाएँ, सब एक में न जोड़ें।'],
    probH: 'आम दिक़्क़तें और उनका हल', probs: [['PDF फ़ॉर्म की सीमा से बड़ी है', 'ऊपर वही KB चुनें जो फ़ॉर्म लिखता है। फिर भी फ़िट न हो तो ब्लैक एंड व्हाइट चुनें, फ़ालतू पेज हटाएँ या फ़ोटो क्रॉप करके दोबारा डालें।'], ['पेज ग़लत क्रम में आ गए', 'सूची का ऊपर से नीचे का क्रम ही PDF का क्रम है। ↑ ↓ से ठीक करें और "PDF बनाएँ" फिर दबाएँ — पुरानी PDF अपने आप नहीं बदलती।'], ['कोई पेज टेढ़ा है', 'उस फ़ोटो पर ⟳ दबाएँ जब तक वह सीधी न दिखे। फ़ोन का अपना रोटेशन (EXIF) टूल पहले ही ठीक कर देता है।'], ['PDF में लिखावट धुँधली है', 'अक्सर फ़ोटो ही धुँधली होती है। अच्छी रोशनी में, हाथ स्थिर रखकर दोबारा फ़ोटो लें, या KB सीमा थोड़ी बढ़ाएँ।'], ['फ़ोटो खुल ही नहीं रही', 'यह अक्सर iPhone की HEIC फ़ोटो होती है। कैमरा की सेटिंग "Most Compatible" करें या फ़ोटो का स्क्रीनशॉट डालें।']],
    faqH: 'अक्सर पूछे जाने वाले सवाल',
    faq: [['क्या यह फ़्री है, और क्या फ़ोटो अपलोड होती हैं?', 'हाँ, पूरी तरह फ़्री है, कोई साइन-अप नहीं। फ़ोटो कहीं अपलोड नहीं होती — PDF आपके फ़ोन/ब्राउज़र के अंदर ही बनती है।'], ['कई फ़ोटो को एक PDF में कैसे जोड़ें?', 'गैलरी से सारी फ़ोटो एक साथ चुनें (या बाद में "और फ़ोटो" दबाएँ)। हर फ़ोटो एक पेज बनती है, और ऊपर वाली फ़ोटो पहला पेज।'], ['PDF को 200 KB से कम कैसे करें?', 'ऊपर 200 KB चुनें। टूल पहले JPG क्वालिटी कम करता है, फिर भी बड़ी हो तो फ़ोटो का px थोड़ा कम करता है — जब तक PDF 200 KB के अंदर न आ जाए।'], ['A4 और "फ़ोटो जितना" में क्या फ़र्क है?', 'A4 में हर पेज प्रिंट वाले काग़ज़ के साइज़ का होता है और फ़ोटो उसके अंदर आती है — फ़ॉर्म और प्रिंट के लिए यही ठीक है। "फ़ोटो जितना" में पेज फ़ोटो के आकार का होता है, कोई सफ़ेद जगह नहीं।'], ['क्या यह बिना इंटरनेट के चलेगा?', 'हाँ। पेज एक बार खुल जाए तो इंटरनेट बंद करके भी फ़ोटो डालकर PDF बना सकते हैं, क्योंकि सारा काम फ़ोन में ही होता है।']],
    privH: 'आपके डॉक्यूमेंट, आपके पास', privText: 'मार्कशीट, आधार जैसे डॉक्यूमेंट निजी होते हैं। इसलिए यह टूल बिना किसी सर्वर के आपके फ़ोन/ब्राउज़र में चलता है। फ़ोटो या PDF कहीं अपलोड नहीं होती, कहीं सेव नहीं होती, और हम उन्हें देख भी नहीं सकते। पेज बंद करते ही सब मिट जाता है।',

  en: {
    brandSub: 'Free · your photo never leaves your phone', title: 'Photo to PDF — JPG to PDF, free',
    sub: 'Join many photos of a marksheet, Aadhaar or certificate into one PDF. Change the order, rotate, pick a page size, and keep the PDF under a limit like 200 KB when a form asks.',
    privacy: 'Your photos are never uploaded. The PDF is made on your phone/browser.',
    pickTitle: 'Choose photos — one or many', pickHint: 'JPG, PNG, WebP (and iPhone HEIC if your browser can open it). Each photo becomes one page.', pickBtn: '🖼️ From gallery', camBtn: '📸 Use camera',
    listH: 'Pages in the PDF', count: (n) => `${n} photo${n > 1 ? 's' : ''} = ${n} page${n > 1 ? 's' : ''}`, dragHint: 'Use ↑ ↓ to change the order (on a computer you can also drag). ⟳ turns a photo upright.',

    linksH: 'More ways', links: { home: ['JPG to PDF', 'Any size, all settings'], 'photo-to-pdf': ['Photo to PDF', 'Marksheet, Aadhaar, certificate'], 'pdf-under-100kb': ['PDF under 100 KB', 'Forms with a small limit'], 'pdf-under-200kb': ['PDF under 200 KB', 'Admission and job forms'], compress: ['Compress a photo', 'JPG to 20 / 50 / 100 KB'], scanner: ['Document Scanner', 'Straightens paper, then PDF'] },
    aboutH: 'What this JPG to PDF tool does',
    about: '<p>Many online forms want documents as a PDF, but the papers you have are photos on your phone — a marksheet, an Aadhaar card, a caste or income certificate, a fee receipt. This tool joins those photos into one PDF file: one photo per page, in the order you choose. It takes JPG, PNG and WebP pictures, and iPhone HEIC photos too when your browser can open them.</p><p>All the work happens inside your browser. The photos are read from your phone, turned into pages and packed into a PDF right there — nothing goes to a server. That also makes it quick: there is no upload to wait for, and once the page has opened it keeps working without internet.</p>',
    howH: 'How to turn photos into a PDF, step by step', how: ['Tap <b>From gallery</b> and pick all the photos at once, or tap <b>Use camera</b> to photograph the paper directly.', 'The photo at the top of the list becomes page 1. Change the order with <b>↑ ↓</b> (on a computer you can also drag).', 'If a photo is sideways or upside down, tap <b>⟳</b>; each tap turns it 90°. Remove a wrong photo with <b>✕</b>.', 'If the form gives a KB limit, choose <b>100 KB</b>, <b>200 KB</b> or type your own. With no limit, leave "No limit" on.', 'If needed, open "Page settings" for A4/Letter, page direction, margin or black & white.', 'Tap <b>Make PDF</b>, check the page 1 preview, rename the file and <b>download</b> or <b>share</b> it.'],
    whenH: 'When do you need a photo PDF?',
    when: '<p>These are the places where people most often have to turn photos into a PDF. Every portal sets its own limit, so whatever the form itself says comes first.</p><ul><li><b>College admission and scholarship portals</b> often ask for marksheets and certificates as a PDF, usually with a limit somewhere between 100 KB and 500 KB.</li><li><b>Government job applications</b> often want caste, domicile or experience certificates as PDFs, frequently up to 200–300 KB each.</li><li><b>Bank, KYC and office paperwork</b> often needs both sides of an ID proof in a single file.</li><li><b>Email and chat</b>: one PDF is far easier to send and open than ten loose photos.</li></ul>',
    tipsH: 'Good to know', tips: ['Take the photo in daylight, straight above the paper. Shadows and a slanted angle make text hard to read.', 'Need both sides of an Aadhaar in one PDF? Add a photo of the front and one of the back — you get two pages.', 'With a small limit and many photos, choose <b>black & white</b>. Text stays clear and the file gets much smaller.', 'Crop the photo in your gallery first so only the paper is left. Without the extra background, text looks sharper at the same KB.', 'If the portal has a separate upload box for each document, make a separate PDF for each instead of joining them all.'],
    probH: 'Common problems and fixes', probs: [['The PDF is bigger than the form allows', 'Choose the same KB limit the form gives. If it still does not fit, switch to black & white, remove extra pages, or crop the photos and add them again.'], ['The pages are in the wrong order', 'The list from top to bottom is the page order. Fix it with ↑ ↓ and tap "Make PDF" again — a PDF already made does not change by itself.'], ['A page is sideways', 'Tap ⟳ on that photo until it looks upright. The rotation saved by the phone camera (EXIF) is already fixed by the tool.'], ['The text in the PDF is blurry', 'Usually the photo itself is blurry. Retake it in good light with a steady hand, or allow a few more KB.'], ['A photo does not open at all', 'This is usually an iPhone HEIC photo. Set the camera format to "Most Compatible", or add a screenshot of the photo.']],
    faqH: 'Frequently asked questions',
    faq: [['Is it free, and are my photos uploaded?', 'Yes, it is completely free with no sign-up. Your photos are not uploaded anywhere — the PDF is made inside your phone/browser.'], ['How do I put many photos in one PDF?', 'Pick all the photos from the gallery at once (or tap "More photos" later). Each photo becomes one page, and the top one is page 1.'], ['How do I make a PDF under 200 KB?', 'Choose 200 KB above. The tool first lowers the JPG quality; if it is still too big, it reduces the photos\' px a little until the PDF is under 200 KB.'], ['What is the difference between A4 and "Same as photo"?', 'With A4 every page is the size of printing paper and the photo sits inside it — best for forms and printing. With "Same as photo" the page takes the photo\'s shape, with no white space.'], ['Does it work without internet?', 'Yes. Once the page has opened you can switch the internet off and still add photos and make a PDF, because all the work happens on your phone.']],
    privH: 'Your documents stay with you', privText: 'A marksheet or Aadhaar is personal. That is why this tool runs inside your phone/browser without any server. Photos and the PDF are never uploaded or stored, and we cannot see them. Closing the page clears everything.',
    footer: 'Free tool · nothing is uploaded',

    linksH: 'আরও উপায়', links: { home: ['JPG to PDF', 'যেকোনো মাপ, সব সেটিং'], 'photo-to-pdf': ['ছবি থেকে PDF', 'মার্কশিট, আধার, সার্টিফিকেট'], 'pdf-under-100kb': ['PDF 100 KB-র কম', 'ছোট সীমার ফর্ম'], 'pdf-under-200kb': ['PDF 200 KB-র কম', 'ভর্তি আর চাকরির ফর্ম'], compress: ['ছবির KB কমান', 'JPG 20 / 50 / 100 KB'], scanner: ['ডকুমেন্ট স্ক্যানার', 'কাগজ সোজা করে PDF'] },
    aboutH: 'এই JPG to PDF টুল কী করে',
    about: '<p>অনেক অনলাইন ফর্ম ডকুমেন্ট PDF-এ চায়, কিন্তু আপনার কাগজগুলো ফোনে ছবি হয়ে আছে — মার্কশিট, আধার কার্ড, জাতি বা আয়ের শংসাপত্র, ফি-র রসিদ। এই টুল সেই ছবিগুলো জুড়ে একটা PDF ফাইল বানায়: প্রতিটি ছবি একটা পাতা, আর পাতাগুলো আপনার বাছা ক্রমে। JPG, PNG আর WebP ছবি চলে, আর iPhone-এর HEIC ছবিও, যদি আপনার ব্রাউজার খুলতে পারে।</p><p>সব কাজ আপনার ব্রাউজারের ভেতরেই হয়। ছবি আপনার ফোন থেকে পড়া হয়, সেখানেই পাতা তৈরি হয় আর সেখানেই PDF তৈরি হয় — কোনো সার্ভারে কিছু যায় না। তাই কাজও তাড়াতাড়ি হয়: আপলোডের অপেক্ষা নেই, আর পেজ একবার খুলে গেলে ইন্টারনেট ছাড়াও চলে।</p>',
    howH: 'ছবি থেকে PDF কীভাবে করবেন — ধাপে ধাপে', how: ['<b>গ্যালারি থেকে</b> চাপুন আর সব ছবি একসাথে বাছুন, বা <b>ক্যামেরায় তুলুন</b> চেপে সরাসরি কাগজের ছবি তুলুন।', 'তালিকার সবচেয়ে ওপরের ছবি পাতা 1 হয়। ক্রম <b>↑ ↓</b> দিয়ে বদলান (কম্পিউটারে ছবি টেনেও)।', 'কোনো ছবি কাত বা উল্টো হলে <b>⟳</b> চাপুন; প্রতিবার 90° ঘোরে। ভুল ছবি <b>✕</b> দিয়ে সরান।', 'ফর্ম KB-র সীমা দিলে <b>100 KB</b>, <b>200 KB</b> বা নিজের KB বাছুন। সীমা না থাকলে "কোনো সীমা নেই" রাখুন।', 'দরকার হলে "পাতার সেটিং"-এ A4/Letter, পাতার দিক, মার্জিন বা সাদা-কালো বাছুন।', '<b>PDF তৈরি করুন</b> চাপুন, পাতা 1-এর ঝলক দেখুন, নাম বদলান আর <b>ডাউনলোড</b> বা <b>শেয়ার</b> করুন।'],
    whenH: 'ছবির PDF কখন লাগে?',
    when: '<p>নিচে সেই জায়গাগুলো, যেখানে প্রায়ই ছবিকে PDF করতে হয়। প্রতিটি পোর্টালের সীমা আলাদা, তাই ফর্মে যা লেখা সেটাই আগে মানুন।</p><ul><li><b>কলেজে ভর্তি আর স্কলারশিপ পোর্টাল</b> প্রায়ই মার্কশিট আর সার্টিফিকেট PDF-এ চায়, সাধারণত 100 KB থেকে 500 KB-র মধ্যে কোনো সীমায়।</li><li><b>সরকারি চাকরির ফর্মে</b> জাতি, বাসস্থান বা অভিজ্ঞতার শংসাপত্র প্রায়ই PDF-এ, অনেক সময় 200–300 KB পর্যন্ত চাওয়া হয়।</li><li><b>ব্যাংক, KYC আর অফিসের কাজে</b> পরিচয়পত্রের দুই দিক প্রায়ই একটা ফাইলেই লাগে।</li><li><b>ইমেল আর চ্যাট</b>: দশটা আলাদা ছবির চেয়ে একটা PDF পাঠানো আর খোলা অনেক সহজ।</li></ul>',
    tipsH: 'কাজের কথা', tips: ['দিনের আলোয়, কাগজের ঠিক ওপর থেকে ছবি তুলুন। ছায়া আর বাঁকা কোণে লেখা পড়া কঠিন হয়।', 'আধারের দুই দিক এক PDF-এ চাইলে সামনে আর পেছনের দুটো ছবি দিন — দুটো পাতা হবে।', 'সীমা কম আর ছবি বেশি হলে <b>সাদা-কালো</b> বাছুন। লেখা পরিষ্কার থাকে আর ফাইল অনেক ছোট হয়।', 'আগে গ্যালারিতে ছবি ক্রপ করে শুধু কাগজের অংশ রাখুন। বাড়তি ব্যাকগ্রাউন্ড না থাকলে একই KB-তে লেখা বেশি পরিষ্কার হয়।', 'পোর্টালে প্রতিটি ডকুমেন্টের আলাদা বাক্স থাকলে প্রতিটির আলাদা PDF বানান, সব একটায় জুড়বেন না।'],

    privH: 'আপনার ডকুমেন্ট আপনার কাছেই', privText: 'মার্কশিট, আধারের মতো ডকুমেন্ট ব্যক্তিগত। তাই এই টুল কোনো সার্ভার ছাড়াই আপনার ফোন/ব্রাউজারে চলে। ছবি বা PDF কোথাও আপলোড বা সেভ হয় না, আমরা দেখতেও পাই না। পেজ বন্ধ করলেই সব মুছে যায়।',
    footer: 'ফ্রি টুল · কিছুই আপলোড হয় না',

};

// ---------- helpers
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
const params = new URLSearchParams(location.search);
const LANGS = ['hinglish', 'hi', 'en', 'bn'];
const deviceLang = () => { const l = (navigator.language || '').toLowerCase(); if (l.startsWith('bn')) return 'bn'; if (l.startsWith('hi')) return 'hi'; return l.endsWith('-in') ? 'hinglish' : 'en'; };
let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : LANGS.includes(store.get('jp-lang')) ? store.get('jp-lang') : deviceLang();
const t = (k) => T[lang][k];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtSize = (b) => (b >= 1024 * 1024 ? `${(b / 1048576).toFixed(2)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);
const tick = () => new Promise((r) => setTimeout(r, 0));
let toastTimer = 0;
const toast = (msg) => { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = msg; el.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 3200); };

// Sub-pages (e.g. ./pdf-under-200kb/) set window.JP_PAGE = { slug, kb, base, T: { lang: { title, sub, about, how, when, tips, probs, faq, … } } }
// before this script; their own text replaces the main page's text.
const PAGE = window.JP_PAGE || null;
const BASE = PAGE ? PAGE.base || '../' : './';
if (PAGE) for (const l in PAGE.T) { if (T[l]) Object.assign(T[l], PAGE.T[l]); }
const stripTags = (h) => String(h).replace(/<[^>]+>/g, '');
const faqLd = () => JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', inLanguage: lang === 'hinglish' ? 'hi-Latn' : lang,
  mainEntity: t('faq').map(([q, a]) => ({ '@type': 'Question', name: stripTags(q), acceptedAnswer: { '@type': 'Answer', text: stripTags(a) } })) });

// ---------- settings
const savedKb = Number(store.get('jp-kb'));
let limitKb = PAGE && PAGE.kb !== undefined ? PAGE.kb : savedKb >= 20 && savedKb <= 20000 ? savedKb : 0;
const opt = { size: 'a4', orient: 'auto', margin: '18', fit: 'fit' };
const OPT_OK = { size: ['a4', 'letter', 'photo'], orient: ['auto', 'portrait', 'landscape'], margin: ['0', '18', '36'], fit: ['fit', 'fill'] };
for (const k in opt) { const v = store.get(`jp-${k}`); if (OPT_OK[k].includes(v)) opt[k] = v; }
const opts = () => ({ ...opt, margin: Number(opt.margin), gray: $('gray').checked, kb: limitKb });

// ---------- photos: decoded once, EXIF direction applied, scaled down, kept as a JPEG blob (low memory)
const MAX_SIDE = 2000;  // ~240 dpi on A4: sharp text, safe for phone memory
const BASE_Q = 0.92;
const decode = async (file) => {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* fall back */ } }
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; } finally { URL.revokeObjectURL(url); }
};
const dims = (s) => [s.naturalWidth || s.width, s.naturalHeight || s.height];
// Halve step by step before the last draw: a big jump down in one draw looks jagged.
const drawScaled = (src, w, h) => {
  let cur = src; let [cw, ch] = dims(src);
  while (cw / 2 >= w && ch / 2 >= h) {
    const c = mk(cw / 2, ch / 2); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, c.width, c.height);
    if (cur !== src) { cur.width = cur.height = 0; }
    cur = c; cw = c.width; ch = c.height;
  }
  const out = mk(w, h); const x = out.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height); // transparent PNG → white paper
  x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, out.width, out.height);
  if (cur !== src) { cur.width = cur.height = 0; }
  return out;
};
const encode = (c, type, q) => new Promise((r) => c.toBlob(r, type, q));

const loadPhoto = async (file) => {
  const src = await decode(file);
  try {
    const [w0, h0] = dims(src);
    if (!w0 || !h0) throw new Error('empty');
    const k = Math.min(1, MAX_SIDE / Math.max(w0, h0));
    const c = drawScaled(src, w0 * k, h0 * k);
    const base = await encode(c, 'image/jpeg', BASE_Q);
    const tk = 128 / Math.max(c.width, c.height); const tc = drawScaled(c, c.width * tk, c.height * tk);
    const thumb = await encode(tc, 'image/jpeg', 0.8);
    const r = { base, w: c.width, h: c.height, w0, h0, thumb };
    c.width = c.height = 0; tc.width = tc.height = 0;
    return r;
  } finally { if (src.close) src.close(); }
};

// ---------- page layout (PDF points: 72 per inch)
const SIZES = { a4: [595.28, 841.89], letter: [612, 792] };
const rotDims = (it) => (it.rot % 180 ? [it.h, it.w] : [it.w, it.h]);
// → { pw, ph, bx, by, bw, bh }: page size and the box the photo goes in
const layout = (iw, ih, o) => {
  const m = o.margin;
  if (o.size === 'photo') { const L = 841.89; const k = L / Math.max(iw, ih); const w = iw * k; const h = ih * k; return { pw: w + 2 * m, ph: h + 2 * m, bx: m, by: m, bw: w, bh: h }; }
  let [pw, ph] = SIZES[o.size] || SIZES.a4;
  const land = o.orient === 'landscape' || (o.orient === 'auto' && iw > ih);
  if (land) [pw, ph] = [ph, pw];
  return { pw, ph, bx: m, by: m, bw: pw - 2 * m, bh: ph - 2 * m };
};

// One photo → canvas ready for the PDF: rotated, cropped for "fill", scaled by s, grey if asked.
const prep = async (it, s, o) => {
  const bmp = await decode(it.base);
  try {
    const [rw, rh] = rotDims(it);
    const L = layout(rw, rh, o);
    // crop (in rotated photo px) for "fill"
    let cx = 0; let cy = 0; let cw = rw; let ch = rh;
    if (o.fit === 'fill' && o.size !== 'photo') {
      const ba = L.bw / L.bh;
      if (rw / rh > ba) { cw = rh * ba; cx = (rw - cw) / 2; } else { ch = rw / ba; cy = (rh - ch) / 2; }
    }
    const ow = Math.max(8, Math.round(cw * s)); const oh = Math.max(8, Math.round(ch * s));
    // full rotated picture at scale s, then copy the crop
    const fw = Math.round(rw * s); const fh = Math.round(rh * s);
    const src = s < 0.5 ? drawScaled(bmp, Math.round(it.w * s), Math.round(it.h * s)) : bmp;
    const full = mk(fw, fh); const x = full.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, fw, fh); x.imageSmoothingQuality = 'high';
    x.translate(fw / 2, fh / 2); x.rotate((it.rot * Math.PI) / 180);
    const dw = it.rot % 180 ? fh : fw; const dh = it.rot % 180 ? fw : fh;
    x.drawImage(src, -dw / 2, -dh / 2, dw, dh);
    if (src !== bmp) { src.width = src.height = 0; }
    let c = full;
    if (ow !== fw || oh !== fh) { c = mk(ow, oh); c.getContext('2d').drawImage(full, cx * s, cy * s, cw * s, ch * s, 0, 0, ow, oh); full.width = full.height = 0; }
    if (o.gray) {
      const cx2 = c.getContext('2d'); const d = cx2.getImageData(0, 0, c.width, c.height); const p = d.data;
      for (let i = 0; i < p.length; i += 4) { const v = (p[i] * 77 + p[i + 1] * 150 + p[i + 2] * 29) >> 8; p[i] = p[i + 1] = p[i + 2] = v; }
      cx2.putImageData(d, 0, 0);
    }
    return { c, L };
  } finally { if (bmp.close) bmp.close(); }
};

// ---------- jsPDF, loaded only when the first PDF is made (also cached for offline by sw.js)
let libP = null;
const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => (window.jspdf ? res() : rej(new Error('lib'))); s.onerror = () => { s.remove(); rej(new Error('lib')); }; document.head.appendChild(s); });
const loadLib = () => {
  if (window.jspdf) return Promise.resolve();
  // one retry: a weak phone connection can drop the first try
  if (!libP) libP = loadScript(`${BASE}lib/jspdf.umd.min.js`).catch(() => loadScript(`${BASE}lib/jspdf.umd.min.js?r=1`)).catch((e) => { libP = null; throw e; });
  return libP;
};

// Every page picture as a JPEG at quality q and scale s → { pages: [{ bytes, blob, L, iw, ih }], sum, q, s }
const encodeAll = async (list, o, q, s, cache) => {
  const pages = []; let sum = 0;
  for (const it of list) {
    let pc = cache && cache.get(it.id);
    if (!pc) { pc = await prep(it, s, o); if (cache) cache.set(it.id, pc); }
    const blob = await encode(pc.c, 'image/jpeg', q);
    const bytes = new Uint8Array(await blob.arrayBuffer());
    pages.push({ bytes, blob, L: pc.L, iw: pc.c.width || 1, ih: pc.c.height || 1 });
    sum += bytes.length;
    if (!cache) { pc.c.width = pc.c.height = 0; }
    await tick();
  }
  return { pages, sum, q, s };
};
// JPEGs → PDF (the pictures go in as they are, so the PDF is their sum plus a small fixed overhead)
// → { blob, pages, first, q, s } (first: page 1 picture + layout for the preview)
const pdfFrom = (enc) => {
  const { jsPDF } = window.jspdf;
  let doc = null; let first = null;
  enc.pages.forEach((pg, i) => {
    const { L, iw, ih } = pg;
    const fmt = L.pw > L.ph ? 'landscape' : 'portrait';
    if (!doc) doc = new jsPDF({ unit: 'pt', format: [L.pw, L.ph], orientation: fmt, compress: true });
    else doc.addPage([L.pw, L.ph], fmt);
    const k = Math.min(L.bw / iw, L.bh / ih); const w = iw * k; const h = ih * k;
    const x = L.bx + (L.bw - w) / 2; const y = L.by + (L.bh - h) / 2;
    doc.addImage(pg.bytes, 'JPEG', x, y, w, h, `p${i}`, 'NONE');
    if (i === 0) first = { blob: pg.blob, L, x, y, w, h };
  });
  doc.setProperties({ title: 'photos', creator: 'NextGrade Tools' });
  return { blob: doc.output('blob'), pages: doc.getNumberOfPages(), first, q: enc.q, s: enc.s };
};

const Q_HI = 0.9;      // best quality used
const Q_MID = 0.7;     // when the px must shrink, keep at least this quality
const Q_FLOOR = 0.5;   // below this, shrink the px instead (looks better than heavy blocks)
const MIN_SIDE = 300;  // smallest page picture (longest side, px)
const CACHE_AREA = 24e6; // keep prepared pictures between tries when they fit in memory

// Best PDF within the limit: highest quality first, then smaller px only if needed. → { blob, pages, first, q, s, ok, note }
// The search measures the JPEGs (fast); the PDF itself is built once at the end and checked.
const buildPdf = async (o, progress) => {
  await loadLib();
  const list = items.filter((it) => it.base && !it.err);
  const area = list.reduce((a, it) => a + it.w * it.h, 0);
  let cache = null; let cacheS = -1; let overhead = 0;
  const at = async (q, s) => {
    if (s !== cacheS) { if (cache) cache.forEach((pc) => { pc.c.width = pc.c.height = 0; }); cache = area * s * s <= CACHE_AREA ? new Map() : null; cacheS = s; }
    if (progress) progress(q, s);
    const e = await encodeAll(list, o, q, s, cache); e.size = e.sum + overhead; return e;
  };
  try {
    const limit = o.kb ? o.kb * 1024 : 0;
    const e0 = await at(Q_HI, 1);
    const r0 = pdfFrom(e0); overhead = r0.blob.size - e0.sum;
    if (!limit || r0.blob.size <= limit) return { ...r0, ok: true, note: '' };
    // real PDF for the chosen JPEGs; if it is somehow still over, step the quality down a little
    const finish = async (e, note) => {
      let r = pdfFrom(e);
      for (let i = 0; i < 4 && r.blob.size > limit && e.q > 0.15; i += 1) { e = await at(e.q - 0.05, e.s); r = pdfFrom(e); }
      return { ...r, ok: r.blob.size <= limit, note: r.blob.size <= limit ? note : 'nTooBig' };
    };
    // 1) same px, lower quality
    let e = await at(Q_FLOOR, 1);
    if (e.size <= limit) {
      let lo = Q_FLOOR; let hi = Q_HI; let best = e;
      for (let i = 0; i < 5; i += 1) { const q = (lo + hi) / 2; const t2 = await at(q, 1); if (t2.size <= limit) { best = t2; lo = q; } else hi = q; }
      return finish(best, 'nQuality');
    }
    // 2) smaller px at Q_MID until it fits, then search back up between the last miss and the first fit
    const longest = Math.max(...list.map((it) => Math.max(it.w, it.h)));
    let s = 1; let fail = 1; let okS = 0; let okE = null; let last = e.size; let smallest = e;
    for (let round = 0; round < 14; round += 1) {
      s *= Math.min(0.9, Math.sqrt(limit / last) * 0.95); // bytes grow about with the area
      if (longest * s < MIN_SIDE) break;
      const t2 = await at(Q_MID, s); last = t2.size;
      if (t2.size < smallest.size) smallest = t2;
      if (t2.size <= limit) { okS = s; okE = t2; break; }
      fail = s;
    }
    if (!okE) {
      const lastTry = await at(0.3, Math.max(MIN_SIDE / longest, Math.min(s, 1)));
      if (lastTry.size <= limit) return finish(lastTry, 'nShrunk');
      const r = pdfFrom(lastTry.size < smallest.size ? lastTry : smallest);
      return { ...r, ok: false, note: 'nTooBig' };
    }
    for (let i = 0; i < 3; i += 1) { const mid = Math.sqrt(okS * fail); const t2 = await at(Q_MID, mid); if (t2.size <= limit) { okS = mid; okE = t2; } else fail = mid; }
    let best = okE; let lo = Q_MID; let hi = Q_HI;
    for (let i = 0; i < 3; i += 1) { const q = (lo + hi) / 2; const t2 = await at(q, okS); if (t2.size <= limit) { best = t2; lo = q; } else hi = q; }
    return finish(best, 'nShrunk');
  } finally { if (cache) cache.forEach((pc) => { pc.c.width = pc.c.height = 0; }); }
};

// ---------- items
let items = []; // { id, file, name, base, w, h, w0, h0, thumbUrl, rot, err, busy }
let nextId = 1;
let result = null; // last PDF
let loadQueue = Promise.resolve();

const markStale = () => { if (result) $('stale').classList.remove('hidden'); };
const renderList = () => {
  $('pagesBox').classList.toggle('hidden', !items.length);
  const ready = items.filter((it) => it.base);
  $('total').textContent = ready.length ? t('count')(ready.length) : '';
  const fine = matchMedia('(pointer: fine)').matches;
  let n = 0;
  $('list').innerHTML = items.map((it, i) => {
    const no = it.base ? ++n : 0;
    if (it.err) return `<div class="item" data-id="${it.id}"><div class="thumb">⚠️</div><div><div class="iname">${esc(it.name)}</div><div class="inote bad">${esc(t('failed')(it.name))}</div><div class="iact"><button class="btn btn-sm btn-ic" type="button" data-act="del" title="${esc(t('del'))}" aria-label="${esc(t('del'))}">✕</button></div></div></div>`;
    if (!it.base) return `<div class="item" data-id="${it.id}"><div class="thumb"></div><div><div class="iname">${esc(it.name)}</div><div class="inote"><span class="spin"></span>${esc(t('loading'))}</div></div></div>`;
    return `<div class="item" data-id="${it.id}"${fine ? ' draggable="true"' : ''}><div class="thumb"><img src="${it.thumbUrl}" alt="" style="transform:rotate(${it.rot}deg)"><span class="pno">${no}</span></div>
<div><div class="iname">${esc(t('page'))} ${no} · ${esc(it.name)}</div><div class="ipx">${it.w0}×${it.h0} px · ${fmtSize(it.file.size)}</div>
<div class="iact"><button class="btn btn-sm btn-ic" type="button" data-act="up" title="${esc(t('up'))}" aria-label="${esc(t('up'))}"${i === 0 ? ' disabled' : ''}>↑</button><button class="btn btn-sm btn-ic" type="button" data-act="down" title="${esc(t('down'))}" aria-label="${esc(t('down'))}"${i === items.length - 1 ? ' disabled' : ''}>↓</button><button class="btn btn-sm btn-ic" type="button" data-act="rot" title="${esc(t('rot'))}" aria-label="${esc(t('rot'))}">⟳</button><button class="btn btn-sm btn-ic" type="button" data-act="del" title="${esc(t('del'))}" aria-label="${esc(t('del'))}">✕</button></div></div></div>`;
  }).join('');
};

const addFiles = (files) => {
  const list = [...files].filter((f) => f && (f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|gif|bmp|avif)$/i.test(f.name)));
  if (!list.length) return Promise.resolve();
  const added = list.map((f) => ({ id: nextId++, file: f, name: f.name || 'photo.jpg', base: null, rot: 0, err: false }));
  items.push(...added); renderList(); markStale();
  // one photo at a time keeps the phone's memory low
  added.forEach((it) => { loadQueue = loadQueue.then(async () => {
    if (!items.includes(it)) return;
    try { const r = await loadPhoto(it.file); Object.assign(it, r); it.thumbUrl = URL.createObjectURL(r.thumb); } catch (e) { it.err = true; }
    renderList();
  }); });
  return loadQueue;
};
const removeItem = (it) => { if (it.thumbUrl) URL.revokeObjectURL(it.thumbUrl); items = items.filter((x) => x !== it); renderList(); markStale(); };
const move = (it, to) => { const from = items.indexOf(it); if (from < 0 || to < 0 || to >= items.length || to === from) return; items.splice(from, 1); items.splice(to, 0, it); renderList(); markStale(); };

// ---------- make the PDF
let building = false; let lastError = null; let stepHook = null; // self test only
const pdfName = () => (($('fname').value || '').trim().replace(/\.pdf$/i, '').replace(/[^\p{L}\p{N}_\- ]+/gu, '').replace(/\s+/g, '-').slice(0, 60) || 'photos') + '.pdf';
const make = async () => {
  if (building) return null;
  if (!items.some((it) => it.base)) { toast(items.some((it) => !it.base && !it.err) ? t('stillLoading') : t('needPhoto')); return null; }
  if (items.some((it) => !it.base && !it.err)) { toast(t('stillLoading')); await loadQueue; }
  building = true; const btn = $('makeBtn'); btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(t('making'))}`;
  const o = opts();
  try {
    await tick();
    result = await buildPdf(o, stepHook);
    result.kb = o.kb;
    await showResult();
    return result;
  } catch (e) {
    lastError = e;
    toast(e && e.message === 'lib' ? t('libFail') : t('pdfFail'));
    return null;
  } finally { building = false; btn.disabled = false; btn.textContent = t('makeBtn'); }
};
const resultNote = () => {
  if (!result) return '';
  if (result.note) return t(result.note)(result.kb);
  return result.kb ? t('nUnder')(result.kb) : '';
};
const showResult = async () => {
  if (!result) return;
  $('out').classList.remove('hidden'); $('stale').classList.add('hidden');
  $('outInfo').textContent = t('outInfo')(result.pages, fmtSize(result.blob.size)); $('outInfo').className = `big${result.ok ? '' : ' bad'}`;
  $('outNote').textContent = resultNote(); $('outNote').className = `onote${result.ok ? '' : ' bad'}`;
  // page 1 preview, drawn from the same JPEG that went into the PDF
  const f = result.first; const cv = $('pv'); const W = 340; const k = W / f.L.pw;
  cv.width = W; cv.height = Math.round(f.L.ph * k);
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
  try { const b = await decode(f.blob); x.drawImage(b, f.x * k, f.y * k, f.w * k, f.h * k); if (b.close) b.close(); } catch (e) { /* preview only */ }
  if (!result.ok) return;
  $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
const sharePdf = async () => {
  if (!result) return;
  const f = new File([result.blob], pdfName(), { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) { /* cancelled */ } return; }
  download(f, f.name); toast(t('saved'));
};

// ---------- UI text
const applyChips = () => {
  let custom = true;
  document.querySelectorAll('#limitChips .chip').forEach((b) => { const on = Number(b.dataset.kb) === limitKb; b.classList.toggle('on', on); if (on) custom = false; });
  $('kbinBox').classList.toggle('on', custom);
  if (custom) $('kbIn').value = String(limitKb); else if (document.activeElement !== $('kbIn')) $('kbIn').value = '';
  document.querySelectorAll('[data-opt]').forEach((g) => g.querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.v === opt[g.dataset.opt])));
  // direction does not apply when the page takes the photo's shape
  document.querySelectorAll('[data-opt=orient] .chip, [data-opt=fit] .chip').forEach((b) => { b.disabled = opt.size === 'photo'; });
};
const applyLang = () => {
  document.documentElement.lang = lang === 'hinglish' ? 'hi-Latn' : lang;
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  $('langSel').value = lang;
  $('howList').innerHTML = t('how').map((s) => `<li>${s}</li>`).join('');
  $('tipList').innerHTML = t('tips').map((s) => `<li>${s}</li>`).join('');
  $('faqList').innerHTML = t('faq').map(([q, a]) => `<details class="faq" open><summary>${q}</summary><p>${a}</p></details>`).join('');
  $('aboutBox').innerHTML = t('about'); $('whenBox').innerHTML = t('when');
  $('probList').innerHTML = t('probs').map(([q, a]) => `<div class="prob"><b>${q}</b><p>${a}</p></div>`).join('');
  $('faqLd').textContent = faqLd();
  const L = t('links'); const here = PAGE ? PAGE.slug : 'home';
  const card = (href, key, icon) => `<a href="${href}?lang=${lang}"${key === here ? ' class="here"' : ''}>${icon} ${esc(L[key][0])}<small>${esc(L[key][1])}</small></a>`;
  $('pageLinks').innerHTML = card(BASE, 'home', '📄') + SUBPAGES.map((p) => card(`${BASE}${p}/`, p, '📄')).join('')
    + card(`${BASE}../image-compress/`, 'compress', '🗜️') + card(`${BASE}../doc-scanner/`, 'scanner', '📑');
  if (building) $('makeBtn').innerHTML = `<span class="spin"></span>${esc(t('making'))}`;
  applyChips(); renderList(); if (result) { $('outInfo').textContent = t('outInfo')(result.pages, fmtSize(result.blob.size)); $('outNote').textContent = resultNote(); }
};

// ---------- events
$('langSel').addEventListener('change', (e) => { lang = e.target.value; store.set('jp-lang', lang); applyLang(); });
$('limitChips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  limitKb = Number(b.dataset.kb); if (!PAGE) store.set('jp-kb', String(limitKb)); applyChips(); markStale();
});
$('kbIn').addEventListener('input', () => {
  const v = Math.round(Number($('kbIn').value));
  if (!v) return;
  if (v < 20 || v > 20000) { if (String(v).length >= 2) toast(t('badKb')); return; }
  limitKb = v; if (!PAGE) store.set('jp-kb', String(v));
  document.querySelectorAll('#limitChips .chip').forEach((b) => b.classList.toggle('on', Number(b.dataset.kb) === v));
  $('kbinBox').classList.toggle('on', ![0, 100, 200, 500, 1024].includes(v)); markStale();
});
document.querySelectorAll('[data-opt]').forEach((g) => g.addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b || b.disabled) return;
  opt[g.dataset.opt] = b.dataset.v; store.set(`jp-${g.dataset.opt}`, b.dataset.v); applyChips(); markStale();
}));
$('gray').addEventListener('change', () => { store.set('jp-gray', $('gray').checked ? '1' : ''); markStale(); });
$('pickBtn').addEventListener('click', (e) => { e.stopPropagation(); $('file').click(); });
$('camBtn').addEventListener('click', (e) => { e.stopPropagation(); $('cam').click(); });
$('moreBtn').addEventListener('click', () => $('file').click());
$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
$('drop').addEventListener('dragover', (e) => { if (dragIt) return; e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', (e) => { e.preventDefault(); $('drop').classList.remove('over'); addFiles(e.dataTransfer.files); });
document.addEventListener('paste', (e) => { const f = [...(e.clipboardData ? e.clipboardData.files : [])]; if (f.length) addFiles(f); });
$('file').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
$('cam').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
const itemOf = (el) => { const row = el && el.closest('.item'); return row ? items.find((x) => String(x.id) === row.dataset.id) : null; };
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const it = itemOf(b); if (!it) return; const i = items.indexOf(it);
  if (b.dataset.act === 'up') move(it, i - 1);
  if (b.dataset.act === 'down') move(it, i + 1);
  if (b.dataset.act === 'rot') { it.rot = (it.rot + 90) % 360; renderList(); markStale(); }
  if (b.dataset.act === 'del') removeItem(it);
});
// drag to reorder (mouse); phones use the ↑ ↓ buttons
let dragIt = null;
const clearDropMarks = () => document.querySelectorAll('.dropbefore, .dropafter, .dragging').forEach((el) => el.classList.remove('dropbefore', 'dropafter', 'dragging'));
$('list').addEventListener('dragstart', (e) => { dragIt = itemOf(e.target); if (!dragIt) return; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragIt.id)); } catch (er) { /* old browsers */ } e.target.closest('.item').classList.add('dragging'); });
$('list').addEventListener('dragover', (e) => {
  if (!dragIt) return; e.preventDefault();
  const row = e.target.closest('.item'); clearDropMarks(); if (!row) return;
  const r = row.getBoundingClientRect(); row.classList.add(e.clientY < r.top + r.height / 2 ? 'dropbefore' : 'dropafter');
});
$('list').addEventListener('drop', (e) => {
  if (!dragIt) return; e.preventDefault(); e.stopPropagation();
  const row = e.target.closest('.item'); const target = itemOf(row);
  if (target && target !== dragIt) {
    const after = row.classList.contains('dropafter');
    items.splice(items.indexOf(dragIt), 1);
    items.splice(items.indexOf(target) + (after ? 1 : 0), 0, dragIt);
    renderList(); markStale();
  }
  clearDropMarks(); dragIt = null;
});
$('list').addEventListener('dragend', () => { clearDropMarks(); dragIt = null; });
$('clearBtn').addEventListener('click', () => { items.forEach((it) => it.thumbUrl && URL.revokeObjectURL(it.thumbUrl)); items = []; result = null; $('out').classList.add('hidden'); renderList(); });
$('makeBtn').addEventListener('click', make);
$('dlBtn').addEventListener('click', () => { if (result) { download(result.blob, pdfName()); toast(t('saved')); } });
$('shareBtn').addEventListener('click', sharePdf);

// ---------- start
$('year').textContent = new Date().getFullYear();
$('gray').checked = store.get('jp-gray') === '1';
$('fname').value = 'photos';
applyLang();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(`${BASE}sw.js`).catch(() => {});

// ---------- self test (?selftest): sample photos → full pipeline → results written into #selftest
if (params.has('selftest')) (async () => {
  const out = $('selftest'); out.classList.remove('hidden');
  const lines = []; let pass = true;
  // Headless Chrome's --virtual-time-budget does not wait for image decoding, but it pauses while a network
  // request is open. Keep one tiny local request open the whole time so the test can finish (test mode only).
  let alive = true; let kaN = 0;
  // each finished request moves virtual time on a little, so make each one slow-ish: a 16 MB in-memory blob
  const kaUrl = URL.createObjectURL(new Blob([new Uint8Array(16 << 20)]));
  const keepAlive = async () => { while (alive) { try { kaN += 1; await (await fetch(kaUrl)).arrayBuffer(); } catch (e) { await tick(); } } };
  keepAlive();
  const check = (name, ok, info) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${info ? ` — ${info}` : ''}`); if (!ok) pass = false; out.textContent = `SELFTEST RUNNING t=${Math.round(performance.now())}ms ka=${kaN}\n${lines.join('\n')}`; };
  const stage = (s) => { out.textContent = `SELFTEST RUNNING (${s})\n${lines.join('\n')}`; };
  try {
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    // sample "documents": lines of text-like marks + noise, so the files are heavy like real photos
    const sample = (w, h, hue) => {
      const c = mk(w, h); const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, `hsl(${hue},40%,92%)`); g.addColorStop(1, `hsl(${hue + 40},35%,80%)`);
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = '#222'; x.font = `${Math.round(h / 40)}px sans-serif`;
      for (let y = h / 12; y < h - 20; y += h / 30) x.fillText('Roll No 123456 · Marks 87 / 100 · Sample line of text', w / 20, y);
      const d = x.getImageData(0, 0, w, h); const p = d.data;
      for (let i = 0; i < p.length; i += 4) { const n = (rnd() - 0.5) * 16; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
      x.putImageData(d, 0, 0);
      x.fillStyle = `hsl(${hue},70%,45%)`; x.fillRect(w * 0.6, h * 0.05, w * 0.3, h * 0.12); // a "stamp" to see orientation
      return c;
    };
    const toFile = async (c, type, name) => new File([await encode(c, type, 0.92)], name, { type });
    stage('drawing samples');
    const files = [
      await toFile(sample(3000, 4000, 210), 'image/jpeg', 'marksheet-12mp.jpg'), // 12 MP portrait → must be scaled down
      await toFile(sample(1600, 1000, 20), 'image/png', 'aadhaar-landscape.png'),
      await toFile(sample(900, 900, 120), 'image/webp', 'certificate-square.webp'),
    ];
    stage('samples ready, loading photos');
    await addFiles(files);
    check('3 photos loaded', items.filter((it) => it.base).length === 3, items.map((it) => `${it.name} ${it.w0}×${it.h0}→${it.w}×${it.h}`).join(', '));
    check('12 MP photo scaled to ≤ 2000 px', Math.max(items[0].w, items[0].h) <= MAX_SIDE && Math.max(items[0].w, items[0].h) >= MAX_SIDE - 1);
    const head = async (b) => new TextDecoder().decode(new Uint8Array(await b.slice(0, 5).arrayBuffer()));
    const pagesIn = async (b) => ((await b.text()).match(/\/Type \/Page\b(?!s)/g) || []).length;
    const runs = [
      ['A4, no limit', { size: 'a4', orient: 'auto', margin: '18', fit: 'fit' }, false, 0],
      ['A4, 200 KB limit', { size: 'a4', orient: 'auto', margin: '18', fit: 'fit' }, false, 200],
      ['photo size + B&W + rotate + reorder, 100 KB limit', { size: 'photo', orient: 'auto', margin: '0', fit: 'fit' }, true, 100],
      ['Letter landscape fill, 60 KB limit', { size: 'letter', orient: 'landscape', margin: '36', fit: 'fill' }, false, 60],
    ];
    const summary = [];
    for (const [name, o, gray, kb] of runs) {
      Object.assign(opt, o); $('gray').checked = gray; limitKb = kb; applyChips();
      if (name.includes('rotate')) { items[1].rot = 90; move(items[2], 0); }
      const t0 = performance.now();
      const r = await make();
      const ms = Math.round(performance.now() - t0);
      if (!r) { check(name, false, `no PDF: ${lastError && (lastError.stack || lastError)}`); continue; }
      const pg = await pagesIn(r.blob); const hd = await head(r.blob);
      const sizeOk = kb ? r.blob.size <= kb * 1024 : true;
      check(name, r.pages === 3 && pg === 3 && hd === '%PDF-' && sizeOk && r.ok,
        `pages ${r.pages} (in file ${pg}), ${(r.blob.size / 1024).toFixed(1)} KB${kb ? ` ≤ ${kb} KB` : ''}, q ${r.q.toFixed(2)}, scale ${r.s.toFixed(2)}, note "${resultNote()}", ${ms} ms`);
      summary.push({ run: name, pages: r.pages, kb: +(r.blob.size / 1024).toFixed(1), q: +r.q.toFixed(2), s: +r.s.toFixed(2), ok: r.ok });
    }
    check('no-limit PDF is bigger than the 200 KB one', summary.length > 1 && summary[0].kb > summary[1].kb, `${summary[0] && summary[0].kb} > ${summary[1] && summary[1].kb}`);
    // quality-only path, on one small page (cheaper): remove two photos, then ask for 75% of its full-quality size
    {
      Object.assign(opt, { size: 'a4', orient: 'auto', margin: '18', fit: 'fit' }); $('gray').checked = false;
      const keep = items.find((it) => it.name.startsWith('certificate')); items.filter((it) => it !== keep).forEach(removeItem);
      limitKb = 0; const full = await make();
      const kb = Math.max(20, Math.round((full.blob.size / 1024) * 0.75)); limitKb = kb; applyChips();
      const r = await make();
      check('remove 2 photos + quality-only limit (px kept)', items.length === 1 && r && r.pages === 1 && r.blob.size <= kb * 1024 && r.s === 1 && r.q < Q_HI && r.ok,
        r ? `1 page, ${(full.blob.size / 1024).toFixed(1)} KB → ${(r.blob.size / 1024).toFixed(1)} KB ≤ ${kb} KB, q ${r.q.toFixed(2)}, scale ${r.s.toFixed(2)}, note "${resultNote()}"` : 'no PDF');
    }
    check('preview drawn', $('pv').height > 0 && !$('out').classList.contains('hidden'));
    const empty = [...document.querySelectorAll('[data-t]')].filter((el) => !el.textContent.trim()).map((el) => el.dataset.t);
    check(`all texts filled (${lang})`, empty.length === 0, empty.join(','));
    const words = ['aboutBox', 'howList', 'whenBox', 'tipList', 'probList', 'faqList'].map((id) => $(id).textContent).join(' ').split(/\s+/).filter(Boolean).length
      + (t('privText').split(/\s+/).length);
    check(`page text ≥ 500 words (${lang})`, words >= 500, `${words} words`);
    const ld = JSON.parse($('faqLd').textContent); check('FAQPage JSON-LD matches visible FAQ', ld['@type'] === 'FAQPage' && ld.mainEntity.length === t('faq').length && ld.mainEntity.length >= 4, `${ld.mainEntity.length} questions`);
    check('download name', pdfName() === 'photos.pdf', pdfName());
  } catch (e) { check('exception', false, String(e && e.stack || e)); }
  out.textContent = `SELFTEST ${pass ? 'PASS' : 'FAIL'} (lang ${lang}${PAGE ? `, page ${PAGE.slug}` : ''}, ${Math.round(performance.now())} ms page time)\n${lines.join('\n')}`;
  out.dataset.result = pass ? 'pass' : 'fail';
  alive = false; setTimeout(() => URL.revokeObjectURL(kaUrl), 1000);
  console.log(out.textContent);
})();
</script>
</body>
</html>
