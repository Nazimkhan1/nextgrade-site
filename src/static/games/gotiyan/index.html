  };

  let board = [], sel = -1, hist = [], over = false, hints = 0, hintMove = null;
  const kit = window.PuzzleKit({ key: 'gt', site: 'https://nextgrade.in/games/gotiyan/', emoji: '⚪', titleTail: 'Peg Solitaire / Brainvita', T, levels: LEVELS.length, levelLabel: (i, lang) => T[lang].levelLabel(i), onLevel: (i) => start(i), onLang: () => draw() });
  const t = kit.t;
  const count = () => board.reduce((s, x) => s + x, 0);
  const legal = (b) => MOVES.filter(([a, m, c]) => b[a] && b[m] && !b[c]);

  // ---- hint: depth-first search with a memo of dead positions; prefers finishing in the centre; time-limited
  const solve = (b0, mustCenter, ms) => {
    const b = b0.slice(), dead = new Set(), path = [], until = Date.now() + ms; let pegs = b.reduce((s, x) => s + x, 0);
    const go = () => {
      if (Date.now() > until) throw new Error('slow');
      if (pegs === 1) return !mustCenter || b[CENTER] === 1;
      const key = b.join(''); if (dead.has(key)) return false;
      for (const [a, m, c] of MOVES) {
        if (b[a] && b[m] && !b[c]) {
          b[a] = 0; b[m] = 0; b[c] = 1; pegs -= 1; path.push([a, m, c]);
          if (go()) return true;
          b[a] = 1; b[m] = 1; b[c] = 0; pegs += 1; path.pop();
        }
      }
      dead.add(key); return false;
    };
    try { return go() ? path : null; } catch (e) { return undefined; }
  };

  const draw = () => {
    kit.$('rules').innerHTML = t('rules');
    const targets = sel >= 0 ? legal(board).filter(([a]) => a === sel).map(([, , c]) => c) : [];
    let html = '';
    for (let r = 0; r < 7; r += 1) for (let c = 0; c < 7; c += 1) {
      const i = IDX[r * 7 + c];
      if (i === undefined) { html += '<span class="hole x"></span>'; continue; }
      const hinted = hintMove && (hintMove[0] === i || hintMove[2] === i) ? ' hinted' : '';
      html += `<button type="button" class="hole${board[i] ? ' peg' : ''}${sel === i ? ' sel' : ''}${targets.includes(i) ? ' target' : ''}${hinted}" data-i="${i}" aria-label="${board[i] ? 'marble' : 'empty'}"></button>`;
    }
    kit.$('pegs').innerHTML = html;
    kit.$('left').textContent = t('left')(count());
    kit.status(null, t('target')());
  };
  const after = () => {
    if (count() === 1) { over = true; const center = board[CENTER] === 1; draw(); kit.win({ stars: center ? (hints ? 2 : 3) : (hints ? 1 : 2), line: t('winLine')(center, hints), share: t('share')(t('levelLabel')(kit.lv)), bestKey: kit.lv, score: hints }); return; }
    if (!legal(board).length) { kit.sfx.fail(); kit.say(t('stuck')(count()), 'bad'); }
  };
  kit.$('pegs').addEventListener('click', (e) => {
    const h = e.target.closest('[data-i]'); if (!h || over) return;
    const i = Number(h.dataset.i);
    if (board[i]) { if (!legal(board).some(([a]) => a === i)) { kit.sfx.no(); kit.say(t('noJump'), 'bad'); sel = -1; draw(); return; } sel = sel === i ? -1 : i; kit.sfx.tap(); kit.say(''); draw(); return; }
    const mv = legal(board).find(([a, , c]) => a === sel && c === i);
    if (!mv) { sel = -1; draw(); return; }
    hist.push(board.slice()); board[mv[0]] = 0; board[mv[1]] = 0; board[mv[2]] = 1; sel = -1; hintMove = null;
    kit.sfx.move(); kit.say(''); draw(); after();
  });
  kit.$('undo').addEventListener('click', () => { if (over || !hist.length) return; board = hist.pop(); sel = -1; hintMove = null; kit.say(''); draw(); });
  kit.$('hint').addEventListener('click', () => {
    if (over) return;
    kit.say(t('thinking'));
    setTimeout(() => {
      let p = solve(board, true, 1200);
      if (!p) p = solve(board, false, 1500);
      if (!p || !p.length) { kit.say(t('noHint'), 'bad'); return; }
      hints += 1; hintMove = p[0]; sel = -1; kit.say(t('hintSay'), 'good'); draw();
    }, 30);
  });
  kit.$('reset').addEventListener('click', () => start(kit.lv, true));
  let saved = {};
  const start = (i, same) => {
    const L = LEVELS[i];
    if (same && saved[i]) board = saved[i].slice();
    else if (L.full) board = CELLS.map((_, k) => (k === CENTER ? 0 : 1));
    else {
      // play backwards from a single marble in the centre: the puzzle is always solvable (ending in the centre)
      for (let tries = 0; tries < 50; tries += 1) {
        board = CELLS.map((_, k) => (k === CENTER ? 1 : 0));
        let made = 0;
        for (let s = 0; s < 200 && made < L.back; s += 1) {
          const opts = MOVES.filter(([a, m, c]) => !board[a] && !board[m] && board[c]);
          if (!opts.length) break;
          const [a, m, c] = opts[Math.floor(Math.random() * opts.length)];
          board[a] = 1; board[m] = 1; board[c] = 0; made += 1;
        }
        if (made === L.back) break;
      }
    }
    saved[i] = board.slice();
    sel = -1; hist = []; over = false; hints = 0; hintMove = null;
    kit.hideWin(); kit.say(t('tap')); draw();
  };
  kit.start();
})();

</script>
