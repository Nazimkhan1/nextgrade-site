        f8: 'হোলির বিশেষ মিষ্টি গুজিয়া — ময়দার খোলে খোয়া, সুজি আর বাদাম ভরে ভাজা হয়। সঙ্গে থাকে ঠান্ডাই।',
      },
      moreGames: 'আরও গেম খেলো →',
      privacyTitle: 'তোমার ডেটা',
      privacyText: 'নাম আর সেরা স্কোর শুধু তোমার ফোনেই থাকে। শেয়ার লিংকে যায় শুধু নাম আর স্কোর। কোনো লগইন নেই, কোনো সার্ভার নেই।',
    },
  };

  // ---------- helpers
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
  };
  const params = new URLSearchParams(location.search);
  const LANGS = ['hinglish', 'hi', 'en', 'bn'];
  const deviceLang = () => {
    const l = (navigator.language || '').toLowerCase();
    if (l.startsWith('bn')) return 'bn';
    if (l.startsWith('hi')) return 'hi';

  };
  const urlLang = params.get('lang');
  const savedLang = store.get('rb-lang');
  let lang = LANGS.includes(urlLang) ? urlLang : LANGS.includes(savedLang) ? savedLang : deviceLang();
  const t = (k) => T[lang][k];
  const cleanName = (s) => String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 30);
  const fromName = cleanName(params.get('from'));
  const fromScore = Math.max(0, Math.min(99999, parseInt(params.get('score'), 10) || 0));
  const best = () => parseInt(store.get('rb-best'), 10) || 0;
  const debug = params.has('debug') ? 1 : 0;

  // ---------- page texts
  let last = null, selected = 0;
  const renderTray = () => {
    $('tray').innerHTML = COLS.map((c, i) => `<button type="button" data-i="${i}" class="${i === selected ? 'on' : ''}"><i style="background:${c}"></i>${t('colours')[i]}</button>`).join('');
  };
  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    document.title = `${t('title')} — Holi Game | NextGrade`;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    const F = t('facts');
    $('factList').innerHTML = FACT_KEYS.map((k) => `<li>${F[k]}</li>`).join('');
    const p = PREFIX[lang];
    $('home').href = `https://nextgrade.in${p}/`;
    $('moreGames').href = `https://nextgrade.in${p}/games/`;
    $('guideLink').href = `https://nextgrade.in${p}/festivals/holi/`;
    const c = $('challenge');
    if (fromName && fromScore) { c.textContent = t('challenge')(fromName, fromScore); c.style.display = 'block'; }
    $('bestLine').textContent = best() ? t('best')(best()) : '';
    renderTray();
    if (last) fillEnd();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('rb-lang', lang); applyLang(); });
  $('name').value = store.get('rb-name') || '';
  $('year').textContent = new Date().getFullYear();

  // ---------- sound: soft effects only, no music
  let muted = store.get('rb-muted') === '1';
  let ac = null, master = null;
  const setIcons = () => { $('mute').textContent = muted ? '🔇' : '🔊'; };
  setIcons();
  $('mute').addEventListener('click', () => { muted = !muted; store.set('rb-muted', muted ? '1' : '0'); setIcons(); if (master) master.gain.value = muted ? 0 : 0.8; });
  const initAudio = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
  };
  const tone = (f, dur, type = 'sine', vol = 0.07, delay = 0, f2 = null) => {
    if (!ac) return;
    const w = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, w);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(vol, w + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, w + dur);
    o.connect(g); g.connect(master); o.start(w); o.stop(w + dur + 0.03);
  };
  // a soft "poof" of powder: filtered noise burst
  const poof = (vol = 0.12) => {
    if (!ac) return;
    const len = Math.floor(ac.sampleRate * 0.25), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i += 1) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.7; g.gain.value = vol;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start();
  };
  const sfx = {
    pick: () => tone(660, 0.08, 'triangle', 0.05),
    hit: (match) => { poof(); if (match) tone(988, 0.2, 'sine', 0.05, 0.05); },
    oops: () => tone(300, 0.2, 'triangle', 0.06, 0, 220),
    yum: () => { tone(660, 0.12, 'sine', 0.05); tone(880, 0.16, 'sine', 0.05, 0.08); },
    end: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.6, 'sine', 0.06, i * 0.15)); },
  };

  // ---------- state
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  let W = 400, H = 600, dpr = 1;
  let state = 'idle'; // idle | play | over
  let spots = [], T0 = 0, nextSpawn = 0, score = 0, coloured = 0, oops = 0;
  let pops = [], clouds = [], playerName = '';
  const SKIN = ['#e0a370', '#c68642', '#f1c27d', '#8d5524', '#d9a066'];
  const HOUSE = ['#ffd8a8', '#d0ebff', '#ffdeeb', '#d3f9d8'];

  const layout = () => {
    const cols = W < 520 ? 3 : 4;
    const old = spots;
    spots = [];
    for (let r = 0; r < 2; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const i = r * cols + c;
        const o = old[i] || { kind: '', born: 0, life: 0, want: 0, hit: 0, splats: [], skin: SKIN[i % SKIN.length], wait: 0 };
        spots.push(Object.assign(o, { x: ((c + 0.5) / cols) * W, y: r ? H * 0.66 : H * 0.36, door: r === 1, size: Math.min(W / cols * 0.62, H * 0.17) }));
      }
    }
  };
  const resize = () => {
    const r = $('stage').getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(280, r.width); H = Math.max(420, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    layout();
  };

  const elapsed = (now) => (state === 'play' ? now - T0 : 0);
  const lifeFor = (now) => 2300 - (elapsed(now) / GAME_MS) * 1100; // 2.3 s → 1.2 s
  const spawnGap = (now) => 900 - (elapsed(now) / GAME_MS) * 420; // 0.9 s → 0.48 s
  const updateHud = (now = performance.now()) => {
    $('hudScore').textContent = `🎨 ${score}`;
    $('hudTime').textContent = `⏱ ${state === 'play' ? Math.max(0, Math.ceil((GAME_MS - elapsed(now)) / 1000)) : 60}`;
  };
  const pop = (x, y, text, col) => { pops.push({ x, y, text, col, t0: performance.now() }); };

  const spawn = (now) => {
    const free = spots.filter((s) => !s.kind && now - s.wait > 500);
    if (!free.length) return;
    const s = free[Math.floor(Math.random() * free.length)];
    const r = Math.random();
    // most are friends; some say no, a few animals (only in doors) and a rare gujiya plate
    s.kind = r < 0.64 ? 'friend' : r < 0.82 ? 'no' : r < 0.94 ? (s.door ? 'animal' : 'no') : 'gujiya';
    s.animal = Math.random() < 0.5 ? '🐄' : '🐕';
    s.want = Math.floor(Math.random() * COLS.length);
    s.born = now; s.life = lifeFor(now) * (s.kind === 'friend' ? 1 : 0.85); s.hit = 0; s.splats = [];
    s.skin = SKIN[Math.floor(Math.random() * SKIN.length)];
  };

  const tapSpot = (s, now) => {
    if (state !== 'play' || !s.kind || s.hit) return;
    const top = s.y - s.size * 1.2;
    if (s.kind === 'friend') {
      const match = s.want === selected;
      const pts = match ? 20 : 10;
      score += pts; coloured += 1; s.hit = now;
      for (let k = 0; k < 7; k += 1) s.splats.push({ dx: (Math.random() - 0.5) * s.size * 0.9, dy: -s.size * (0.3 + Math.random() * 0.75), r: s.size * (0.08 + Math.random() * 0.12), c: COLS[k % 3 === 2 ? (selected + 1) % COLS.length : selected] });
      clouds.push({ x: s.x, y: s.y - s.size * 0.6, col: COLS[selected], t0: now });
      const h = t('hits');
      pop(s.x, top, match ? t('match') : h[coloured % h.length], match ? '#c2255c' : '#2b8a3e');
      sfx.hit(match);
    } else if (s.kind === 'gujiya') {
      score += 5; s.hit = now; pop(s.x, top, t('gujiya'), '#e67700'); sfx.yum();
    } else {
      score = Math.max(0, score - 10); oops += 1; s.hit = now;
      pop(s.x, top, s.kind === 'animal' ? t('animalTap') : t('noTap'), '#c92a2a'); sfx.oops();
    }
    updateHud(now);
  };

  // ---------- frame
  const step = (now) => {
    if (state === 'play') {
      if (now >= nextSpawn) { spawn(now); nextSpawn = now + spawnGap(now); }
      spots.forEach((s) => {
        if (!s.kind) return;
        const gone = s.hit ? now - s.hit > 650 : now - s.born > s.life;
        if (gone) { s.kind = ''; s.wait = now; }
      });
      if (debug) {
        const target = spots.find((s) => s.kind === 'friend' && !s.hit && now - s.born > 380);
        if (target) { selected = target.want; renderTray(); tapSpot(target, now); }
      }
      if (elapsed(now) >= GAME_MS) gameOver();
      updateHud(now);
    }
    draw(now);
    requestAnimationFrame(step);
  };

  // ---------- drawing
  const drawLane = (now) => {
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.2);
    sky.addColorStop(0, '#fff0f6'); sky.addColorStop(1, '#ffe3e3');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // bunting across the lane
    const flags = ['#e64980', '#fab005', '#2f9e44', '#1c7ed6', '#ae3ec9', '#fd7e14'];
    ctx.strokeStyle = '#868e96'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, H * 0.13); ctx.quadraticCurveTo(W / 2, H * 0.19, W, H * 0.13); ctx.stroke();
    for (let x = 10, k = 0; x < W; x += 22, k += 1) {
      const y = H * 0.13 + Math.sin((x / W) * Math.PI) * H * 0.03;
      ctx.fillStyle = flags[k % flags.length]; ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.lineTo(x, y + 14); ctx.closePath(); ctx.fill();
    }
    // houses: one coloured block per column, with a window and a door
    const cols = W < 520 ? 3 : 4;
    for (let c = 0; c < cols; c += 1) {
      const x0 = (c / cols) * W, w = W / cols;
      ctx.fillStyle = HOUSE[c % HOUSE.length]; ctx.fillRect(x0, H * 0.2, w, H * 0.6);
      ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(x0 + w - 4, H * 0.2, 4, H * 0.6);
      ctx.fillStyle = '#c2884d'; ctx.fillRect(x0, H * 0.2 - 8, w, 10);
    }
    spots.forEach((s) => {
      const ww = s.size * 1.25, wh = s.size * (s.door ? 1.55 : 1.15);
      const x = s.x - ww / 2, y = s.y - wh + s.size * 0.25;
      ctx.fillStyle = '#5c3d2e'; ctx.fillRect(x - 5, y - 5, ww + 10, wh + 5);
      ctx.fillStyle = '#2b1f17'; ctx.fillRect(x, y, ww, wh);
      if (s.door) { ctx.fillStyle = '#5c3d2e'; ctx.beginPath(); ctx.arc(s.x, y, ww / 2 + 5, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#2b1f17'; ctx.beginPath(); ctx.arc(s.x, y, ww / 2, Math.PI, 0); ctx.fill(); }
    });
    // road and old colour stains on it
    ctx.fillStyle = '#e9d8c4'; ctx.fillRect(0, H * 0.8, W, H * 0.2);
    ctx.globalAlpha = 0.35;
    [[0.15, 0.86, 0], [0.5, 0.9, 1], [0.8, 0.84, 2], [0.33, 0.95, 3]].forEach(([px, py, c]) => { ctx.fillStyle = COLS[c]; ctx.beginPath(); ctx.ellipse(px * W, py * H, 26, 9, 0, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1;
  };
  const drawWho = (s, now) => {
    if (!s.kind) return;
    const z = s.size;
    const rise = Math.min(1, (now - s.born) / 160);
    const x = s.x, base = s.y + z * 0.25, y = base - z * 0.95 * rise;
    ctx.save();
    // clip to the window / door opening so people rise from inside
    const ww = z * 1.25, wh = z * (s.door ? 1.55 : 1.15);
    ctx.beginPath(); ctx.rect(x - ww / 2, base - wh - (s.door ? ww / 2 : 0), ww, wh + (s.door ? ww / 2 : 0)); ctx.clip();
    if (s.kind === 'animal' || s.kind === 'gujiya') {
      ctx.font = `${z * (s.kind === 'animal' ? 0.95 : 0.75)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (s.kind === 'gujiya') { ctx.fillStyle = '#dee2e6'; ctx.beginPath(); ctx.ellipse(x, y + z * 0.15, z * 0.48, z * 0.14, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillText(s.kind === 'animal' ? s.animal : '🥟', x, y);
      ctx.restore();
      return;
    }
    // body: white kurta
    ctx.fillStyle = '#f8f9fa'; ctx.beginPath(); ctx.ellipse(x, y + z * 0.75, z * 0.5, z * 0.5, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - z * 0.5, y + z * 0.74, z, z * 0.6);
    // head
    const hr = z * 0.28, hy = y + z * 0.12;
    ctx.fillStyle = s.skin; ctx.beginPath(); ctx.arc(x, hy, hr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#212529'; ctx.beginPath(); ctx.ellipse(x, hy - hr * 0.55, hr * 1.02, hr * 0.55, 0, Math.PI, 0); ctx.fill();
    // face
    ctx.fillStyle = '#212529';
    [-1, 1].forEach((d) => { ctx.beginPath(); ctx.arc(x + d * hr * 0.38, hy, hr * 0.09, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = '#7a3e1d'; ctx.lineWidth = 2; ctx.beginPath();
    if (s.kind === 'no') ctx.moveTo(x - hr * 0.3, hy + hr * 0.45), ctx.lineTo(x + hr * 0.3, hy + hr * 0.45);
    else ctx.arc(x, hy + hr * 0.2, hr * 0.38, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
    if (s.kind === 'no') {
      // both palms raised: "no, please"
      ctx.fillStyle = s.skin;
      [-1, 1].forEach((d) => {
        const px = x + d * z * 0.5, py = hy - z * 0.22;
        ctx.strokeStyle = '#f8f9fa'; ctx.lineWidth = z * 0.12; ctx.beginPath(); ctx.moveTo(x + d * z * 0.3, y + z * 0.8); ctx.lineTo(px, py + z * 0.12); ctx.stroke();
        ctx.fillStyle = s.skin; ctx.beginPath(); ctx.ellipse(px, py, z * 0.11, z * 0.15, 0, 0, Math.PI * 2); ctx.fill();
        for (let f = -1.5; f <= 1.5; f += 1) { ctx.beginPath(); ctx.ellipse(px + f * z * 0.045, py - z * 0.15, z * 0.022, z * 0.06, 0, 0, Math.PI * 2); ctx.fill(); }
      });
    }
    // colour splats once hit
    s.splats.forEach((p) => { ctx.fillStyle = p.c; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(x + p.dx, y + z * 0.7 + p.dy, p.r, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.restore();
    // bubble: favourite colour, or a "no" sign
    if (!s.hit && rise >= 1) {
      const br = Math.max(14, z * 0.22), bx = x + z * 0.48, by = hy - hr - br * 0.6;
      const left = Math.max(0, 1 - (now - s.born) / s.life);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      if (s.kind === 'friend') {
        ctx.fillStyle = COLS[s.want]; ctx.beginPath(); ctx.arc(bx, by, br * 0.62, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = left > 0.4 ? '#40c057' : '#fa5252'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(bx, by, br + 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke();
      } else {
        ctx.font = `${br * 1.2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      }
    }
  };
  const draw = (now) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawLane(now);
    spots.forEach((s) => drawWho(s, now));
    // gulal clouds
    clouds = clouds.filter((c) => now - c.t0 < 700);
    clouds.forEach((c) => {
      const k = (now - c.t0) / 700;
      ctx.globalAlpha = 0.55 * (1 - k); ctx.fillStyle = c.col;
      for (let i = 0; i < 6; i += 1) { const a = (i / 6) * Math.PI * 2; ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * 30 * k, c.y + Math.sin(a) * 22 * k, 16 + 22 * k, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    });
    pops = pops.filter((p) => now - p.t0 < 900);
    pops.forEach((p) => {
      const a = 1 - (now - p.t0) / 900;
      ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.font = `800 15px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", Inter, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      const hw = ctx.measureText(p.text).width / 2 + 6, y = Math.max(50, p.y - (1 - a) * 24), x = Math.min(W - hw, Math.max(hw, p.x));
      ctx.strokeText(p.text, x, y); ctx.fillText(p.text, x, y);
      ctx.globalAlpha = 1;
    });
  };

  // ---------- start / end
  const start = () => {
    initAudio();
    playerName = cleanName($('name').value);
    store.set('rb-name', playerName);
    score = 0; coloured = 0; oops = 0; pops = []; clouds = []; last = null;
    spots.forEach((s) => { s.kind = ''; s.wait = 0; s.hit = 0; });
    ['startScreen', 'endScreen', 'pauseScreen'].forEach((id) => $(id).classList.add('hidden'));

    updateHud();
  };
  const gameOver = () => {
    state = 'over';
    spots.forEach((s) => { s.kind = ''; });
    sfx.end();
    const prev = best();
    if (score > prev) store.set('rb-best', String(score));
    last = { score, coloured, oops, isNew: score > prev && prev > 0, name: playerName, fact: FACT_KEYS[Math.floor(Math.random() * FACT_KEYS.length)] };
    fillEnd();
    $('endScreen').classList.remove('hidden');
  };
  const fillEnd = () => {
    $('endTitle').textContent = t('endTitle')(last.name);
    $('finalScore').textContent = String(last.score);
    $('endNote').textContent = t('endNote')(last.coloured, last.oops, best(), last.isNew);
    $('endFact').textContent = `💡 ${t('facts')[last.fact]}`;
    $('bestLine').textContent = best() ? t('best')(best()) : '';
  };
  const pause = () => {
    if (state !== 'play') return;
    state = 'idle';
    spots.forEach((s) => { s.kind = ''; });
    $('pauseScreen').classList.remove('hidden');
  };

  // ---------- input
  $('tray').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    initAudio();
    selected = +b.dataset.i; renderTray(); sfx.pick();
  });
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    e.preventDefault();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let bs = null, bd = 1e9;
    spots.forEach((s) => {
      if (!s.kind || s.hit) return;
      const d = Math.hypot(x - s.x, y - (s.y - s.size * 0.4));
      if (d < bd) { bd = d; bs = s; }
    });
    if (bs && bd < bs.size * 1.05) tapSpot(bs, performance.now());
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    const n = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[e.code];
    if (n !== undefined) { selected = n; renderTray(); }
  });

  // ---------- share
  const shareText = () => {
    const u = new URL(SITE);
    if (playerName) u.searchParams.set('from', playerName);
    u.searchParams.set('score', String(score));
    u.searchParams.set('lang', lang);
    return t('shareText')(playerName, score, u.toString());
  };
  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('restart').addEventListener('click', start);
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
  $('shareWa').addEventListener('click', () => { window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', () => {
    const text = shareText();
    if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { $('shareOther').textContent = t('copied'); })
      .catch(() => window.prompt(t('copyPrompt'), text));
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);
  resize();
  applyLang();
  requestAnimationFrame(step);
  if (debug && params.has('auto')) start();
  window.__rb = { get state() { return state; }, get score() { return score; }, get coloured() { return coloured; }, get oops() { return oops; } };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
