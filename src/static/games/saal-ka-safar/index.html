    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(5, -97, 1.8, 0, Math.PI * 2); ctx.arc(-4, -97, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a2b2b'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(1, -91, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    if (o.hat) { ctx.fillStyle = o.hat; ctx.beginPath(); ctx.moveTo(-10, -108); ctx.lineTo(10, -108); ctx.lineTo(2, -136); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(2, -137, 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  };

  const PLAYER = { shirt: '#f03e3e', pants: '#1c7ed6', skin: '#e0ac69', hair: '#2b1d16' };
  const DANCERS = [
    { shirt: '#e64980', pants: '#5f3dc4', skin: '#c68642', hair: '#1b1b1b', long: true, hat: '#4dabf7', style: 0 },
    { shirt: '#ffd43b', pants: '#495057', skin: '#8d5524', hair: '#111', hat: '#e64980', style: 1 },
    { shirt: '#69db7c', pants: '#343a40', skin: '#f1c27d', hair: '#3b2219', long: true, hat: '#ffd43b', style: 0 },
    { shirt: '#4dabf7', pants: '#212529', skin: '#e0ac69', hair: '#1b1b1b', hat: '#69db7c', style: 1 },
    { shirt: '#ff922b', pants: '#364fc7', skin: '#c68642', hair: '#2b1d16', long: true, hat: '#b197fc', style: 0 },
    { shirt: '#b197fc', pants: '#2b2b2b', skin: '#8d5524', hair: '#111', hat: '#ff922b', style: 1 },
  ];
  const DOFF = [-1, -0.62, -0.3, 0.3, 0.62, 1];

  const drawGate = () => {
    const x = GC - camX;
    if (x < -260 || x > LW + 260) return;
    const top = GROUND - 200;
    ctx.fillStyle = '#7b2d26'; ctx.fillRect(x - 128, top, 26, 200); ctx.fillRect(x + 102, top, 26, 200);
    ctx.fillStyle = '#a8432f'; ctx.fillRect(x - 134, top - 10, 38, 14); ctx.fillRect(x + 96, top - 10, 38, 14);
    // marigold garland
    for (let k = 0; k <= 20; k += 1) {
      const gx = x - 115 + k * 11.5, gy = top + 20 + Math.sin((k / 20) * Math.PI) * 46;
      ctx.fillStyle = k % 2 ? '#ff922b' : '#ffd43b'; ctx.beginPath(); ctx.arc(gx, gy, 6, 0, Math.PI * 2); ctx.fill();
    }
    // banner
    const bw = 220, bh = 56, by = top - 70;
    ctx.fillStyle = gateLit ? '#3b1d6e' : '#2a2448';
    ctx.strokeStyle = gateLit ? '#ffd43b' : '#6c5f9c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - bw / 2, by, bw, bh, 12) : ctx.rect(x - bw / 2, by, bw, bh); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 40px ${FONT}`;
    if (gateLit) { ctx.shadowColor = '#ffd43b'; ctx.shadowBlur = 18 + Math.sin(time * 6) * 6; }
    ctx.fillStyle = gateLit ? '#ffe066' : '#8d83b8'; ctx.fillText(String(NEW), x, by + bh / 2 + 2);
    ctx.shadowBlur = 0;
    for (let k = 0; k < 14; k += 1) {
      const on = gateLit ? Math.sin(time * 8 + k) > -0.2 : k % 3 === 0;
      ctx.fillStyle = on ? `hsl(${(k * 37) % 360},95%,65%)` : 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(x - bw / 2 + 8 + k * ((bw - 16) / 13), by - 6, 4, 0, Math.PI * 2); ctx.fill();
    }
  };

  const drawDancers = () => {
    const spread = clamp(LW * 0.42, 140, 340);
    DANCERS.forEach((d, i) => {
      const wx = PARTY_X + DOFF[i] * spread;
      const x = wx - camX;
      if (x < -60 || x > LW + 60) return;
      const party = state === 'party' || state === 'cross';
      drawKid(x, GROUND, { ...d, dance: party, idle: !party, off: i * 0.9, alpha: party ? 1 : 0.85, s: 0.92 });
    });
  };

  const drawPlayer = () => {
    const x = px - camX;
    const blink = hurt > 0 && Math.floor(hurt * 12) % 2 === 0;
    if (blink) return;
    const m = monthAt(px);
    const party = state === 'party';
    drawKid(x, py, { ...PLAYER, phase: runPhase, air: py < GROUND - 1, dance: party, idle: state === 'count' || state === 'idle', scarf: (m === 0 || m === 11) && !party, hat: party ? '#f06595' : null, off: 0.4 });
  };

  const drawFloats = () => {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    floats.forEach((f) => {
      ctx.globalAlpha = clamp(f.life / 0.6, 0, 1);
      ctx.font = `800 ${f.gold ? 28 : 24}px ${FONT}`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,18,56,0.75)';
      ctx.strokeText(f.text, f.x - camX, f.y);
      ctx.fillStyle = f.gold ? '#ffd43b' : '#fff';
      ctx.fillText(f.text, f.x - camX, f.y);
    });
    ctx.globalAlpha = 1;
  };

  const drawFireworks = () => {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    rockets.forEach((r) => {
      const x = r.x - camX;
      ctx.fillStyle = `hsl(${r.hue},100%,80%)`; ctx.beginPath(); ctx.arc(x, r.y, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `hsla(${r.hue},100%,70%,0.55)`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, r.y); ctx.lineTo(x, r.y + 40); ctx.stroke();
    });
    ctx.lineCap = 'round';
    sparks.forEach((s) => {
      const a = clamp(s.life / s.max, 0, 1);
      const x = s.x - camX;
      if (s.fw) {
        ctx.strokeStyle = `hsla(${s.hue},100%,62%,${a * 0.85})`; ctx.lineWidth = s.size * (0.5 + a * 0.6);
        ctx.beginPath(); ctx.moveTo(x - s.vx * 0.06, s.y - s.vy * 0.06); ctx.lineTo(x, s.y); ctx.stroke();
        ctx.fillStyle = `hsla(${s.hue},100%,85%,${a})`; ctx.beginPath(); ctx.arc(x, s.y, s.size * 0.55 * (0.5 + a), 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = `hsla(${s.hue},100%,70%,${a})`; ctx.beginPath(); ctx.arc(x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();
    confetti.forEach((c) => {
      ctx.save(); ctx.translate(c.x - camX, c.y); ctx.rotate(c.spin);
      ctx.fillStyle = `hsl(${c.hue},90%,60%)`; ctx.fillRect(-4, -2, 8, 4 + c.r * 0.3); ctx.restore();
    });
  };

  const drawTexts = () => {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (state === 'run' && banner > 0) {
      const a = clamp(banner / 0.5, 0, 1) * clamp((2.4 - banner) / 0.3, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = `800 48px ${FONT}`;
      ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(20,18,56,0.7)';
      const txt = `${t('months')[curMonth]} ${OLD}`;
      ctx.strokeText(txt, LW / 2, TOP + 130); ctx.fillStyle = '#fff'; ctx.fillText(txt, LW / 2, TOP + 130);
      ctx.font = `34px ${EMOJI}`; ctx.fillText(MEM[curMonth].map((x) => x[0]).join(' '), LW / 2, TOP + 180);
      ctx.globalAlpha = 1;
    }
    if (state === 'idle') {
      ctx.font = `800 26px ${FONT}`; ctx.fillStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(20,18,56,0.6)';
      const txt = `${OLD} → ${NEW}`; ctx.strokeText(txt, LW / 2, TOP + 110); ctx.fillText(txt, LW / 2, TOP + 110);
    }
    if (state === 'count') {
      ctx.fillStyle = 'rgba(5,5,25,0.35)'; ctx.fillRect(0, TOP, LW, VH);
      ctx.font = `800 28px ${FONT}`; ctx.fillStyle = '#ffe8a3';
      ctx.fillText(t('countLine'), LW / 2, TOP + 110);
      const n = 10 - Math.floor(countT);
      const fr = countT - Math.floor(countT);
      const sc = 1.5 - Math.min(fr, 0.3) * 1.6;
      ctx.save(); ctx.translate(LW / 2, TOP + 215); ctx.scale(sc, sc);
      ctx.font = `800 130px ${FONT}`; ctx.shadowColor = '#f06595'; ctx.shadowBlur = 30;
      ctx.fillStyle = n <= 3 ? '#ff6b6b' : '#ffd43b'; ctx.fillText(String(Math.max(1, n)), 0, 0);
      ctx.restore(); ctx.shadowBlur = 0;
    }
    if (state === 'cross' || state === 'party') {
      const k = state === 'party' ? 1 : 0.6;
      const beat = 1 + Math.abs(Math.sin(time * 4.3)) * 0.06;
      ctx.save(); ctx.translate(LW / 2, TOP + 140); ctx.scale(beat, beat);
      ctx.font = `800 ${Math.min(110, LW * 0.24)}px ${FONT}`;
      ctx.shadowColor = '#ffd43b'; ctx.shadowBlur = 30; ctx.globalAlpha = k;
      const g = ctx.createLinearGradient(-150, -40, 150, 40); g.addColorStop(0, '#ffe066'); g.addColorStop(0.5, '#ff922b'); g.addColorStop(1, '#f06595');
      ctx.fillStyle = g; ctx.fillText(String(NEW), 0, 0); ctx.restore(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      const hn = `${t('happy')}${playerName ? `, ${playerName}` : ''}! 🎉`;
      ctx.font = `800 ${clamp(LW * 0.065, 26, 36)}px ${FONT}`; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(20,18,56,0.7)';
      ctx.strokeText(hn, LW / 2, TOP + 215); ctx.fillStyle = '#fff'; ctx.fillText(hn, LW / 2, TOP + 215);
      if (state === 'party') {
        const L = t('lyrics'); const li = Math.floor(partyT / 2.6) % L.length;
        ctx.font = `700 ${clamp(LW * 0.05, 22, 28)}px ${FONT}`; ctx.fillStyle = '#ffe8a3';
        ctx.globalAlpha = clamp(((partyT % 2.6)) / 0.3, 0, 1);
        ctx.fillText(L[li], LW / 2, TOP + 258); ctx.globalAlpha = 1;
        if (!endShown || $('endScreen').classList.contains('hidden')) { ctx.font = `700 20px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText(t('tapHint'), LW / 2, TOP + 294); }
      }
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, TOP, LW, VH); }
  };

  const draw = () => {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, OY * scale * dpr);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 8);
    const f = state === 'idle' ? 0 : monthF(px);
    const night = nightness();
    const m = state === 'idle' ? 0 : monthAt(px);
    drawSky(f, night);
    drawHills(f, night);
    drawMid(state === 'idle' ? 0 : (night >= 1 ? 11 : m), night);
    drawWeather(state === 'run' ? m : -1, f);
    drawGround(f, night);
    for (let k = 0; k < 12; k += 1) drawSign(k);
    drawRocks();
    drawItems();
    drawGate();
    drawDancers();
    drawPlayer();
    drawFloats();
    drawFireworks();
    drawTexts();
    ctx.restore();
  };

  // ---------- loop
  let last = performance.now();
  const frame = (ts) => {
    const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  };

  const pause = () => {
    if (!(state === 'run' || state === 'count' || state === 'cross') || paused) return;
    paused = true; $('pauseScreen').classList.remove('hidden');
    if (ac) ac.suspend();
  };
  const resume = () => { paused = false; $('pauseScreen').classList.add('hidden'); initAudio(); last = performance.now(); };

  // ---------- share
  const shareUrl = () => {
    const u = new URL(SITE);
    if (playerName) u.searchParams.set('from', playerName);
    u.searchParams.set('score', String(got));
    u.searchParams.set('lang', lang);
    return u.toString();
  };
  const shareText = () => t('shareText')(playerName, got, total, shareUrl());

  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('resume').addEventListener('click', resume);
  ['name', 'mem0', 'mem1', 'mem2'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); }));
  $('shareWa').addEventListener('click', () => { window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', () => {
    const text = shareText();
    if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { $('shareOther').textContent = t('copied'); })
      .catch(() => window.prompt(t('copyPrompt'), text));
  });
  $('watch').addEventListener('click', () => { $('endScreen').classList.add('hidden'); $('showResult').classList.remove('hidden'); });
  $('showResult').addEventListener('click', () => { $('showResult').classList.add('hidden'); $('endScreen').classList.remove('hidden'); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pause(); if (ac && state === 'party') ac.suspend(); }
    else if (ac && state === 'party') ac.resume();
  });
  window.addEventListener('resize', resize);

  applyLang();
  resize();
  requestAnimationFrame(frame);
  if (bot && params.has('auto')) start();
  window.__ss = { get state() { return state; }, get got() { return got; }, get total() { return total; }, get hits() { return hits; }, get px() { return px; } };

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
