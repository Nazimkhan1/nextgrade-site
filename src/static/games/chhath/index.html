  const pop = (x, y, text, gold) => pops.push({ x, y, text, gold, life: 1 });
  const add = (k, n) => { parts[k] += n; score += n; };

  // the sun: sunT 0 → below the water, 1 → fully risen; the arghya window is around 0.78–0.95
  const sunPos = () => {
    const r = Math.min(W, H) * 0.075;
    const y = horizon + r * 1.3 - sunT * (r * 2.6 + H * 0.06);
    return { x: W * 0.5, y, r };
  };

  // ---- drawing helpers
  const drawSky = (clock) => {
    const light = stage === 'idle' ? 0.55 : stage === 'dip' ? 0.15 + 0.2 * (1 - dipsLeft / DIPS) : stage === 'arghya' ? 0.35 + 0.5 * sunT : 1;
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    const top = [Math.round(20 + 60 * light), Math.round(18 + 70 * light), Math.round(60 + 90 * light)];
    const low = [Math.round(120 + 135 * light), Math.round(60 + 110 * light), Math.round(60 + 30 * light)];
    g.addColorStop(0, `rgb(${top})`); g.addColorStop(1, `rgb(${low})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon);
    // fading stars at early dawn
    if (light < 0.6) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 40; i += 1) { ctx.globalAlpha = (0.6 - light) * (0.5 + 0.5 * Math.sin(clock * 2 + i)); ctx.fillRect((i * 97) % W, ((i * 53) % (horizon * 0.7)), 1.5, 1.5); }
      ctx.globalAlpha = 1;
    }
    // sun with glow
    const s = sunPos();
    const glowR = s.r * (3 + 2 * sunT);
    const sg = ctx.createRadialGradient(s.x, s.y, s.r * 0.5, s.x, s.y, glowR);
    sg.addColorStop(0, `rgba(255, 200, 80, ${0.35 + 0.3 * sunT})`); sg.addColorStop(1, 'rgba(255, 140, 40, 0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(s.x, s.y, glowR, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, horizon); ctx.clip();
    const sun = ctx.createRadialGradient(s.x - s.r * 0.3, s.y - s.r * 0.3, s.r * 0.2, s.x, s.y, s.r);
    sun.addColorStop(0, '#fff3bf'); sun.addColorStop(1, '#ff8c1a');
    ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // far bank with trees and a temple shape
    ctx.fillStyle = 'rgba(40, 20, 15, 0.85)';
    ctx.beginPath(); ctx.moveTo(0, horizon);
    for (let x = 0; x <= W; x += 18) ctx.lineTo(x, horizon - 6 - 6 * Math.abs(Math.sin(x * 0.07)) - (x % 90 < 18 ? 10 : 0));
    ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();
  };

  const drawWater = (clock) => {
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, stage === 'prasad' ? '#e8a25a' : '#b5653a'); g.addColorStop(1, '#2b1a2e');
    ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
    // sun reflection
    const s = sunPos();
    if (s.y < horizon + s.r) {
      ctx.fillStyle = `rgba(255, 200, 90, ${0.25 + 0.35 * sunT})`;
      for (let i = 0; i < 9; i += 1) { const yy = horizon + 6 + i * 10; const w = (s.r * 1.6) * (1 - i / 11) * (0.8 + 0.2 * Math.sin(clock * 3 + i)); ctx.fillRect(s.x - w / 2, yy, w, 3); }
    }
    // gentle waves
    ctx.strokeStyle = 'rgba(255, 230, 200, 0.18)'; ctx.lineWidth = 1.5;
    for (let row = 0; row < 7; row += 1) {
      const y = horizon + 20 + row * ((H - horizon) / 7);
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, y + Math.sin(x * 0.05 + clock * 1.6 + row) * 2.5);
      ctx.stroke();
    }
    // floating diyas
    for (let i = 0; i < 6; i += 1) {
      const x = ((i * 0.19 + clock * 0.012 * (i % 2 ? 1 : -1)) % 1 + 1) % 1 * W;
      const y = horizon + 18 + (i % 3) * 22;
      ctx.fillStyle = '#8a4b1f'; ctx.beginPath(); ctx.ellipse(x, y, 7, 3, 0, 0, Math.PI); ctx.fill();
      const fl = 1 + 0.15 * Math.sin(clock * 9 + i);
      ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.ellipse(x, y - 4 * fl, 2, 4.5 * fl, 0, 0, Math.PI * 2); ctx.fill();
    }
  };

  // sugarcane kosi on the near bank (left and right)
  const drawGhat = () => {
    const base = H;
    ctx.fillStyle = '#5c3a22';
    ctx.fillRect(0, base - 26, W * 0.16, 26); ctx.fillRect(W * 0.84, base - 26, W * 0.16, 26);
    [W * 0.07, W * 0.93].forEach((cx) => {
      ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 4;
      [-14, -5, 5, 14].forEach((dx) => { ctx.beginPath(); ctx.moveTo(cx + dx, base - 26); ctx.lineTo(cx + dx * 0.25, base - 110); ctx.stroke(); });
      ctx.fillStyle = '#69db7c';
      [-1, 1].forEach((d) => { ctx.beginPath(); ctx.ellipse(cx + d * 12, base - 112, 18, 5, d * 0.6, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(cx, base - 36, 4, 0, Math.PI * 2); ctx.fill();
    });
  };

  // the vrati in a yellow saree with a red border, standing waist-deep; depth 0 = standing, 1 = under water
  const drawDevotee = (depth, arms) => {
    const s = Math.min(W, H) / 420;
    const x = W * 0.5, waterY = H * 0.8;
    const top = waterY - 104 * s + depth * 116 * s; // top of the head
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, waterY); ctx.clip();
    const skin = '#a0612f', saree = '#fcc419', border = '#e03131';
    // torso: shoulders and blouse under the saree
    ctx.fillStyle = saree;
    ctx.beginPath();
    ctx.moveTo(x - 30 * s, top + 120 * s);
    ctx.lineTo(x - 27 * s, top + 44 * s);
    ctx.quadraticCurveTo(x - 25 * s, top + 32 * s, x - 12 * s, top + 30 * s);
    ctx.lineTo(x + 12 * s, top + 30 * s);
    ctx.quadraticCurveTo(x + 25 * s, top + 32 * s, x + 27 * s, top + 44 * s);
    ctx.lineTo(x + 30 * s, top + 120 * s);
    ctx.closePath(); ctx.fill();
    // pallu falling diagonally across the chest, with a red border
    ctx.fillStyle = '#ffd43b';
    ctx.beginPath(); ctx.moveTo(x - 14 * s, top + 30 * s); ctx.lineTo(x + 6 * s, top + 30 * s); ctx.lineTo(x + 30 * s, top + 92 * s); ctx.lineTo(x + 16 * s, top + 100 * s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 3.5 * s;
    ctx.beginPath(); ctx.moveTo(x + 6 * s, top + 30 * s); ctx.lineTo(x + 30 * s, top + 92 * s); ctx.stroke();
    // neck and head
    ctx.fillStyle = skin; ctx.fillRect(x - 5 * s, top + 22 * s, 10 * s, 10 * s);
    ctx.beginPath(); ctx.ellipse(x, top + 13 * s, 11 * s, 13 * s, 0, 0, Math.PI * 2); ctx.fill();
    // saree drawn over the head (ghoonghat) with the red border
    ctx.fillStyle = saree;
    ctx.beginPath(); ctx.moveTo(x - 16 * s, top + 34 * s); ctx.quadraticCurveTo(x - 18 * s, top - 6 * s, x, top - 6 * s); ctx.quadraticCurveTo(x + 18 * s, top - 6 * s, x + 16 * s, top + 34 * s); ctx.lineTo(x + 11 * s, top + 34 * s); ctx.quadraticCurveTo(x + 12 * s, top + 2 * s, x, top + 1 * s); ctx.quadraticCurveTo(x - 12 * s, top + 2 * s, x - 11 * s, top + 34 * s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.moveTo(x - 11 * s, top + 34 * s); ctx.quadraticCurveTo(x - 12 * s, top + 2 * s, x, top + 1 * s); ctx.quadraticCurveTo(x + 12 * s, top + 2 * s, x + 11 * s, top + 34 * s); ctx.stroke();
    // face: closed eyes, smile, bindi and sindoor
    ctx.strokeStyle = '#3b1d0b'; ctx.lineWidth = 1.4 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x - 4.5 * s, top + 13 * s, 2.2 * s, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 4.5 * s, top + 13 * s, 2.2 * s, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, top + 18 * s, 3 * s, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.fillStyle = border; ctx.beginPath(); ctx.arc(x, top + 7.5 * s, 1.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - 0.8 * s, top + 1 * s, 1.6 * s, 4 * s);
    // arms: hands joined (namaste) while dipping, raised with the soop for arghya
    ctx.strokeStyle = skin; ctx.lineWidth = 6 * s;
    if (arms) {
      const hy = top - 26 * s;
      ctx.beginPath(); ctx.moveTo(x - 24 * s, top + 40 * s); ctx.quadraticCurveTo(x - 34 * s, top + 8 * s, x - 22 * s, hy + 6 * s); ctx.moveTo(x + 24 * s, top + 40 * s); ctx.quadraticCurveTo(x + 34 * s, top + 8 * s, x + 22 * s, hy + 6 * s); ctx.stroke();
      ctx.fillStyle = '#c99a5b'; ctx.beginPath(); ctx.moveTo(x - 38 * s, hy); ctx.quadraticCurveTo(x, hy + 22 * s, x + 38 * s, hy); ctx.lineTo(x + 32 * s, hy - 6 * s); ctx.lineTo(x - 32 * s, hy - 6 * s); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.2;
      for (let k = -3; k <= 3; k += 1) { ctx.beginPath(); ctx.moveTo(x + k * 9 * s, hy - 5 * s); ctx.lineTo(x + k * 7 * s, hy + 8 * s); ctx.stroke(); }
      ctx.font = `${15 * s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('🍌🪔🥥', x, hy - 7 * s);
    } else {
      ctx.beginPath(); ctx.moveTo(x - 24 * s, top + 42 * s); ctx.quadraticCurveTo(x - 20 * s, top + 66 * s, x - 2 * s, top + 52 * s); ctx.moveTo(x + 24 * s, top + 42 * s); ctx.quadraticCurveTo(x + 20 * s, top + 66 * s, x + 2 * s, top + 52 * s); ctx.stroke();
      ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(x, top + 46 * s, 3.5 * s, 8 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // water around the waist
    ctx.strokeStyle = 'rgba(255, 236, 210, 0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, waterY, 42 * s, 7 * s, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 236, 210, 0.25)';
    ctx.beginPath(); ctx.ellipse(x, waterY + 2, 62 * s, 11 * s, 0, 0, Math.PI * 2); ctx.stroke();
    return { x, waterY, s };
  };

  const drawDipBar = () => {
    const bw = Math.min(W * 0.8, 420), bx = (W - bw) / 2, by = H - 46;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(bx - 6, by - 6, bw + 12, 28);
    const zone = 0.16 - (DIPS - dipsLeft) * 0.012; // green zone shrinks a little each dip
    ctx.fillStyle = '#e03131'; ctx.fillRect(bx, by, bw, 16);
    ctx.fillStyle = '#fab005'; ctx.fillRect(bx + bw * (0.5 - zone), by, bw * zone * 2, 16);
    ctx.fillStyle = '#40c057'; ctx.fillRect(bx + bw * (0.5 - zone / 2), by, bw * zone, 16);
    const nx = bx + bw * needle;
    ctx.fillStyle = '#fff'; ctx.fillRect(nx - 3, by - 8, 6, 32);
    return zone;
  };

  const drawSoop = () => {
    const sw = Math.min(110, W * 0.26), x = soopX * W, y = H - 38;
    ctx.fillStyle = '#c99a5b'; ctx.beginPath(); ctx.moveTo(x - sw / 2, y - 10); ctx.quadraticCurveTo(x, y + 26, x + sw / 2, y - 10); ctx.lineTo(x + sw / 2 - 8, y - 16); ctx.lineTo(x - sw / 2 + 8, y - 16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.5;
    for (let k = -4; k <= 4; k += 1) { ctx.beginPath(); ctx.moveTo(x + k * sw / 10, y - 15); ctx.lineTo(x + k * sw / 12, y + 6); ctx.stroke(); }
    return { x, y, sw };
  };

  const ITEMS = [
    { e: '🍪', p: 10, w: 5, name: 'thekua' }, { e: '🍌', p: 10, w: 4 }, { e: '🎋', p: 15, w: 2 }, { e: '🥥', p: 15, w: 2 }, { e: '🍊', p: 10, w: 3 }, { e: '✨', p: 30, w: 1, gold: true },
  ];
  const pickItem = () => { const total = ITEMS.reduce((a, b) => a + b.w, 0); let r = Math.random() * total; return ITEMS.find((it) => (r -= it.w) < 0) || ITEMS[0]; };

  // ---- input
  const press = () => {
    if (stage === 'dip' && dipCool <= 0) {
      const off = Math.abs(needle - 0.5);
      const zone = 0.16 - (DIPS - dipsLeft) * 0.012;
      let pts = 0;
      if (off <= zone / 2) { pts = 30; say(t('perfect')); } else if (off <= zone) { pts = 15; say(t('good')); } else { say(t('miss')); }
      if (pts) add('dip', pts);
      pop(W / 2, H * 0.4, pts ? `+${pts}` : '·', pts === 30);
      dipAnim = 1; dipCool = 0.9; splash(pts === 30);
      ripples.push({ x: W / 2, y: H * 0.8, r: 10, life: 1 });
      if (navigator.vibrate) navigator.vibrate(pts === 30 ? 30 : 12);
      dipsLeft -= 1; needleSpeed += 0.25;
      if (dipsLeft <= 0) setTimeout(() => { if (stage === 'dip') { stage = 'arghya'; sunT = 0; say(t('waitSun')); updateHud(); } }, 900);
      updateHud();
      return;
    }
    if (stage === 'arghya' && !arghyaDone && arghyaCool <= 0) {
      if (sunT < 0.72) { say(t('early')); arghyaCool = 0.6; tone(220, 0.1, 'triangle', 0.06); return; }
      const off = Math.abs(sunT - 0.86);
      const pts = off < 0.06 ? 100 : Math.max(30, Math.round(100 - off * 300));
      add('arghya', pts); arghyaDone = true; arghyaAnim = 1;
      say(off < 0.06 ? t('arghyaPerfect') : sunT > 0.95 ? t('arghyaLate') : t('arghyaGood'));
      pop(W / 2, H * 0.3, `+${pts}`, off < 0.06);
      bell(0); bell(0.5);
      for (let i = 0; i < 40; i += 1) drops.push({ x: W / 2 + (Math.random() - 0.5) * 30, y: H * 0.5, vx: (Math.random() - 0.5) * 50, vy: -40 - Math.random() * 60, life: 1.2 });
      setTimeout(() => { if (stage === 'arghya') { stage = 'prasad'; prasadLeft = PRASAD_TIME; items = []; say(t('catchHint')); updateHud(); } }, 2200);
      updateHud();
    }
  };
  const moveTo = (clientX) => { const b = canvas.getBoundingClientRect(); soopX = Math.max(0.08, Math.min(0.92, (clientX - b.left) / b.width)); };
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); if (stage === 'prasad') moveTo(e.clientX); else press(); });
  canvas.addEventListener('pointermove', (e) => { if (stage === 'prasad') moveTo(e.clientX); });
  document.addEventListener('keydown', (e) => {
    if (stage === 'prasad' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { soopX = Math.max(0.08, Math.min(0.92, soopX + (e.key === 'ArrowLeft' ? -0.06 : 0.06))); e.preventDefault(); }
    if ((stage === 'dip' || stage === 'arghya') && (e.key === ' ' || e.key === 'Enter') && document.activeElement === document.body) { e.preventDefault(); press(); }
  });

  const updateHud = () => {
    $('hudScore').textContent = `⭐ ${score}`;
    $('hudStage').textContent = stage === 'dip' ? t('stDip') : stage === 'arghya' ? t('stArghya') : stage === 'prasad' ? t('stPrasad') : '';
    $('hudInfo').textContent = stage === 'dip' ? t('dipLeft')(dipsLeft) : stage === 'prasad' ? t('timeLeft')(Math.max(0, Math.ceil(prasadLeft))) : '';
  };

  // ---- loop
  let lastT = 0, clock = 0;
  const tick = (now) => {
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
    lastT = now; clock += dt;
    dipCool -= dt; arghyaCool -= dt;
    if (stage === 'idle') sunT = 0.55 + 0.05 * Math.sin(clock * 0.5);
    if (stage === 'dip') {
      needle += needleDir * needleSpeed * dt;
      if (needle > 1) { needle = 1; needleDir = -1; } if (needle < 0) { needle = 0; needleDir = 1; }
      sunT = 0;
    }
    if (stage === 'arghya' && !arghyaDone) {
      sunT = Math.min(1.08, sunT + dt / 5.5);
      if (sunT >= 1.08) { arghyaDone = true; add('arghya', 20); say(t('arghyaLate')); bell(0); setTimeout(() => { if (stage === 'arghya') { stage = 'prasad'; prasadLeft = PRASAD_TIME; items = []; say(t('catchHint')); updateHud(); } }, 1500); }
    }
    if (stage === 'prasad') {
      prasadLeft -= dt;
      spawnAcc += dt;
      const every = Math.max(0.38, 0.8 - (PRASAD_TIME - prasadLeft) * 0.02);
      while (spawnAcc > every) { spawnAcc -= every; const it = pickItem(); items.push({ ...it, x: 0.08 + Math.random() * 0.84, y: -20, v: 140 + (PRASAD_TIME - prasadLeft) * 9 + Math.random() * 40, rot: Math.random() * 6 }); }
      const sp = { x: soopX * W, y: H - 38, sw: Math.min(110, W * 0.26) };
      items.forEach((it) => {
        it.y += it.v * dt; it.rot += dt * 2;
        if (!it.got && it.y > sp.y - 22 && it.y < sp.y + 6 && Math.abs(it.x * W - sp.x) < sp.sw / 2) { it.got = true; add('prasad', it.p); pop(it.x * W, sp.y - 30, `+${it.p}`, it.gold); blip(it.gold); if (navigator.vibrate) navigator.vibrate(8); }
      });
      items = items.filter((it) => !it.got && it.y < H + 30);
      if (prasadLeft <= 0) end();
      updateHud();
    }
    // draw
    drawSky(clock);
    drawWater(clock);
    if (stage !== 'prasad') {
      dipAnim = Math.max(0, dipAnim - dt * 1.4);
      arghyaAnim = Math.max(0, arghyaAnim - dt * 0.35);
      const depth = Math.sin(Math.min(1, 1 - dipAnim) * Math.PI) * (dipAnim > 0 ? 1 : 0);
      drawDevotee(depth, stage === 'arghya' || stage === 'idle');
    }
    drawGhat();
    ripples.forEach((r) => { r.r += 90 * dt; r.life -= dt; ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, r.life) * 0.6})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.25, 0, 0, Math.PI * 2); ctx.stroke(); });
    ripples = ripples.filter((r) => r.life > 0);
    drops.forEach((d) => { d.vy += 120 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; ctx.fillStyle = `rgba(190, 230, 255, ${Math.max(0, d.life)})`; ctx.beginPath(); ctx.arc(d.x, d.y, 2.2, 0, Math.PI * 2); ctx.fill(); });
    drops = drops.filter((d) => d.life > 0);
    if (stage === 'dip') drawDipBar();
    if (stage === 'arghya' && !arghyaDone && sunT > 0.72) {
      const s = sunPos();
      ctx.strokeStyle = `rgba(255, 244, 200, ${0.5 + 0.5 * Math.sin(clock * 8)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.35, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '800 18px Inter, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t('tapArghya'), W / 2, H - 30);
    }
    if (stage === 'prasad') {
      ctx.font = '30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      items.forEach((it) => { ctx.save(); ctx.translate(it.x * W, it.y); ctx.rotate(Math.sin(it.rot) * 0.3); if (it.gold) { ctx.shadowColor = '#ffd43b'; ctx.shadowBlur = 16; } ctx.fillText(it.name === 'thekua' ? '🍪' : it.e, 0, 0); ctx.restore(); });
      ctx.textBaseline = 'alphabetic';
      drawSoop();
    }
    pops.forEach((p) => { p.y -= 36 * dt; p.life -= dt * 1.1; ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.gold ? '#ffd43b' : '#fff'; ctx.font = '800 22px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); });
    ctx.globalAlpha = 1; pops = pops.filter((p) => p.life > 0);
    if (msgLife > 0) {
      msgLife -= dt;
      ctx.globalAlpha = Math.min(1, msgLife * 2);
      ctx.font = '800 20px Inter, "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif'; ctx.textAlign = 'center';
      const mw = ctx.measureText(msg).width + 24;
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(W / 2 - mw / 2, 46, mw, 34);
      ctx.fillStyle = '#fff3bf'; ctx.fillText(msg, W / 2, 70);
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(tick);
  };

  const start = () => {
    store.set('ch-name', cleanName($('name').value));
    score = 0; parts = { dip: 0, arghya: 0, prasad: 0 }; lastEnd = null;
    dipsLeft = DIPS; needle = 0; needleDir = 1; needleSpeed = 0.9; dipAnim = 0; dipCool = 0.3;
    sunT = 0; arghyaDone = false; arghyaCool = 0; prasadLeft = PRASAD_TIME; items = []; spawnAcc = 0; soopX = 0.5;
    pops = []; ripples = []; drops = [];
    $('startScreen').classList.add('hidden'); $('endScreen').classList.add('hidden');
    $('shareOther').textContent = t('shareOther');
    stage = 'dip'; say(t('tapDip')); ac(); bell(0); updateHud();
  };

  const showEnd = (prev) => {
    $('finalScore').textContent = score;
    const max = DIPS * 30 + 100 + 300;
    const stars = score >= max * 0.7 ? 3 : score >= max * 0.45 ? 2 : 1;
    $('endStars').textContent = '☀️'.repeat(stars) + '·'.repeat(3 - stars);
    $('endTitle').textContent = score > prev && prev > 0 ? t('record') : t('endTitle');
    $('endBreak').textContent = t('breakdown')(parts.dip, parts.arghya, parts.prasad);
    $('endNote').textContent = fromName && fromScore ? (score > fromScore ? t('beat')(fromName, fromScore) : t('notBeat')(fromName, fromScore)) : t('bestNote')(Math.max(score, prev));
  };

  const end = () => {
    stage = 'done';
    const prev = best();
    if (score > prev) store.set('ch-best', String(score));
    lastEnd = { prev };
    showEnd(prev);
    $('endScreen').classList.remove('hidden');
    $('bestLine').textContent = t('best')(best());
    updateHud(); bell(0); bell(0.6); bell(1.2);
  };

  const shareText = () => {
    const name = cleanName($('name').value);
    const u = new URL(SITE);
    if (name) u.searchParams.set('from', name);
    u.searchParams.set('score', String(score));
    u.searchParams.set('lang', lang);
    return t('shareText')(name, score, u.toString());
  };

  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
  $('shareWa').addEventListener('click', () => { window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', () => {
    const text = shareText();
    if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { $('shareOther').textContent = t('copied'); })
      .catch(() => window.prompt(t('copyPrompt'), text));
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && (stage === 'dip' || stage === 'arghya' || stage === 'prasad')) { stage = 'idle'; $('startScreen').classList.remove('hidden'); $('play').textContent = t('resume'); updateHud(); }
  });
  window.addEventListener('resize', resize);

  applyLang();
  resize();
  requestAnimationFrame(tick);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<script src="/assets/game-share.js?v=1" defer></script>
</body>
