    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    const F = t('facts');
    $('factList').innerHTML = FACT_KEYS.map((k) => `<li>${F[k]}</li>`).join('');
    const p = PREFIX[lang];
    $('home').href = `https://nextgrade.in${p}/`;
    $('moreGames').href = `https://nextgrade.in${p}/games/`;
    const c = $('challenge');
    if (fromName && fromScore) { c.textContent = t('challenge')(fromName, fromScore); c.style.display = 'block'; }
    renderLevels();
    updateHud();
    if (last) fillEnd();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('kc-lang', lang); applyLang(); });
  $('name').value = store.get('kc-name') || '';
  $('year').textContent = new Date().getFullYear();

  // ---------- sound: clicks of glass, no music
  let muted = store.get('kc-muted') === '1';
  let ac = null, master = null;
  const setIcons = () => { $('mute').textContent = muted ? '🔇' : '🔊'; };
  setIcons();
  $('mute').addEventListener('click', () => { muted = !muted; store.set('kc-muted', muted ? '1' : '0'); setIcons(); if (master) master.gain.value = muted ? 0 : 0.8; });
  const initAudio = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
  };
  const tone = (f, dur, type = 'sine', vol = 0.07, delay = 0, f2 = null) => {

    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, w);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(vol, w + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, w + dur);
    o.connect(g); g.connect(master); o.start(w); o.stop(w + dur + 0.03);
  };
  let lastClick = 0;
  const sfx = {
    click: (hard) => { const n = performance.now(); if (n - lastClick < 40) return; lastClick = n; tone(2600 + Math.random() * 600, 0.05, 'sine', Math.min(0.09, 0.02 + hard * 0.07)); },
    flick: () => tone(500, 0.06, 'triangle', 0.05, 0, 900),
    out: () => { tone(880, 0.12, 'sine', 0.05); tone(1320, 0.18, 'sine', 0.04, 0.07); },
    hole: () => { tone(400, 0.25, 'triangle', 0.06, 0, 200); tone(1047, 0.3, 'sine', 0.05, 0.2); },
    win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, 'sine', 0.06, i * 0.13)); },
    lose: () => tone(330, 0.4, 'triangle', 0.05, 0, 220),
  };

  // ---------- geometry
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  let W = 400, H = 600, dpr = 1, CX = 200, CY = 250, RC = 120, r = 9, LINE = 500;
  const geometry = () => {
    RC = Math.min(W * 0.36, H * 0.27);
    CX = W / 2; CY = H * 0.4; r = RC * 0.075; LINE = H * 0.84;
  };
  const resize = () => {
    const rect = $('stage').getBoundingClientRect();
    const oldW = W, oldH = H, oldCX = CX, oldCY = CY, oldR = r;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(280, rect.width); H = Math.max(420, rect.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    geometry();
    // keep the marbles in the same place relative to the circle when the size changes
    if (oldW && (oldW !== W || oldH !== H)) {
      const k = r / oldR;
      balls.concat(shooter ? [shooter] : []).forEach((b) => { b.x = CX + (b.x - oldCX) * k; b.y = CY + (b.y - oldCY) * k; b.vx *= k; b.vy *= k; b.r = b.shooter ? r * 1.3 : r; });
      if (shooter && state === 'aim') { lineX = Math.min(W * 0.88, Math.max(W * 0.12, W / 2 + (lineX - oldW / 2) * (W / oldW))); shooter.x = lineX; shooter.y = LINE; }
    }
  };
  const HOLE = () => ({ x: CX, y: CY - RC * 0.15, r: r * 1.75 });
  const VMAX = () => RC * 4.5;
  const DECEL = () => RC * 1.5;

  const swirl = () => `hsl(${Math.floor(Math.random() * 360)}, 75%, 50%)`;
  const loadLevel = (i) => {
    level = i;
    const L = LEVELS[i];
    shotsLeft = L.shots; outCount = 0; sunk = 0; pops = []; last = null;
    balls = (L.at || []).map(([dx, dy]) => ({ x: CX + dx * r * 2, y: CY + dy * r * 2, vx: 0, vy: 0, r, m: 1, out: 0, col: swirl() }));
    need = balls.length;
    stonesAt = (L.stones || []).map(([dx, dy]) => ({ dx, dy }));
    lineX = W / 2;
    shooter = { x: lineX, y: LINE, vx: 0, vy: 0, r: r * 1.3, m: 1.6, shooter: true, out: 0, col: '#1c7ed6' };
    state = 'aim';
    updateHud();
  };
  const stones = () => stonesAt.map((s) => ({ x: CX + s.dx * RC, y: CY + s.dy * RC, r: r * 1.6 }));

  const updateHud = () => {
    $('hudLevel').textContent = t('level')(level + 1);
    const L = LEVELS[level];
    $('hudGoal').textContent = L.mode === 'ring' ? `🔵 ${outCount}/${need}` : `🕳️ ${sunk ? '✔' : '—'}`;
    $('hudShots').textContent = `🎯 ${shotsLeft}`;
  };
  const pop = (x, y, text, col) => { pops.push({ x, y, text, col, t0: performance.now() }); };

  // ---------- physics
  const speed = (b) => Math.hypot(b.vx, b.vy);
  const slow = (b, dt) => {
    const s = speed(b);
    if (!s) return;
    const ns = Math.max(0, s - (DECEL() + 0.4 * s) * dt);
    if (ns < r * 0.6) { b.vx = 0; b.vy = 0; return; }
    b.vx *= ns / s; b.vy *= ns / s;
  };
  const collide = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d, im = 1 / a.m + 1 / b.m, push = (min - d) / im;
    a.x -= nx * push / a.m; a.y -= ny * push / a.m; b.x += nx * push / b.m; b.y += ny * push / b.m;
    const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (rel <= 0) return;
    const j = (1.92 * rel) / im;
    a.vx -= (j / a.m) * nx; a.vy -= (j / a.m) * ny; b.vx += (j / b.m) * nx; b.vy += (j / b.m) * ny;
    sfx.click(Math.min(1, rel / VMAX()));
  };
  const hitStone = (b, s) => {
    const dx = b.x - s.x, dy = b.y - s.y, d = Math.hypot(dx, dy), min = b.r + s.r;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d;
    b.x = s.x + nx * min; b.y = s.y + ny * min;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny; sfx.click(0.5); }
  };
  const walls = (b) => {
    const top = 46;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.5; }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.5; }
    if (b.y < top + b.r) { b.y = top + b.r; b.vy = Math.abs(b.vy) * 0.5; }
    if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.5; }
  };
  // the gucchi: a slow marble over the pit drops in; a fast one is pulled a little and rolls over
  const holeCheck = (b, dt) => {
    const h = HOLE(), dx = h.x - b.x, dy = h.y - b.y, d = Math.hypot(dx, dy);
    if (d > h.r) return false;
    const s = speed(b);
    if (s < RC * 0.9 && d < h.r * 0.8) return true;
    const pullK = RC * 6 * (1 - d / h.r);
    b.vx += (dx / (d || 1)) * pullK * dt; b.vy += (dy / (d || 1)) * pullK * dt;
    return false;
  };
  const physics = (dt, now) => {
    const L = LEVELS[level];
    const all = balls.filter((b) => !b.out).concat(shooter && !shooter.out ? [shooter] : []);
    const st = stones();
    all.forEach((b) => { b.x += b.vx * dt; b.y += b.vy * dt; slow(b, dt); walls(b); });
    for (let i = 0; i < all.length; i += 1) for (let j = i + 1; j < all.length; j += 1) collide(all[i], all[j]);
    all.forEach((b) => st.forEach((s) => hitStone(b, s)));
    if (L.mode === 'ring') {
      balls.forEach((b) => {
        if (b.out) return;
        if (Math.hypot(b.x - CX, b.y - CY) > RC + b.r) {
          b.out = now; outCount += 1;
          const o = t('out'); pop(b.x, b.y - 18, o[outCount % o.length], '#2b8a3e'); sfx.out(); updateHud();
        }
      });
    } else if (!sunk && holeCheck(shooter, dt)) {
      sunk = now; shooter.vx = 0; shooter.vy = 0;
      const h = HOLE(); shooter.x = h.x; shooter.y = h.y;
      pop(h.x, h.y - 26, t('inHole'), '#2b8a3e'); sfx.hole(); updateHud();
    }
  };
  const moving = () => balls.some((b) => !b.out && speed(b) > 0) || (shooter && speed(shooter) > 0);

  const afterShot = () => {
    const L = LEVELS[level];
    const won = L.mode === 'ring' ? outCount >= need : !!sunk;

    if (shotsLeft <= 0) return finish(false);

    state = 'aim';
    if (debug) setTimeout(botShot, 250);
  };
  const shoot = (vx, vy) => {
    if (state !== 'aim') return;

  };

  // ---------- test helper (?debug): aims straight at a marble (or rolls to the hole) and shoots
  const rollDistance = (v0) => { const b = { vx: v0, vy: 0 }; let x = 0; const dt = 1 / 240; for (let k = 0; k < 4000 && b.vx > 0; k += 1) { x += b.vx * dt; slow(b, dt); } return x; };
  const botShot = () => {
    if (state !== 'aim') return;
    const L = LEVELS[level];
    let tx, ty, v;
    if (L.mode === 'ring') {
      lineX = W * (0.2 + (((L.shots - shotsLeft) * 0.37) % 0.6)); shooter.x = lineX;
      const left = balls.filter((b) => !b.out).sort((a, b) => Math.hypot(a.x - shooter.x, a.y - shooter.y) - Math.hypot(b.x - shooter.x, b.y - shooter.y));
      tx = left[0].x; ty = left[0].y; v = VMAX();
    } else {
      if (L.stones.length) { lineX = W * 0.88; shooter.x = lineX; }
      const h = HOLE(); tx = h.x; ty = h.y;
      const d = Math.hypot(tx - shooter.x, ty - shooter.y);
      let lo = 0, hi = VMAX();
      for (let k = 0; k < 30; k += 1) { const mid = (lo + hi) / 2; if (rollDistance(mid) < d) lo = mid; else hi = mid; }
      v = lo + (hi - lo) * 0.5;
    }
    const d = Math.hypot(tx - shooter.x, ty - shooter.y);
    shoot(((tx - shooter.x) / d) * v, ((ty - shooter.y) / d) * v);
  };

  // ---------- drawing
  const drawGround = () => {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#d9b98c'); g.addColorStop(1, '#bf9a6a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // little pebbles and grass tufts (fixed pattern)
    for (let i = 0; i < 40; i += 1) {
      const x = ((i * 97) % 100) / 100 * W, y = 50 + ((i * 61) % 100) / 100 * (H - 60);
      ctx.fillStyle = i % 3 ? 'rgba(120,90,50,0.25)' : 'rgba(80,140,60,0.35)';
      ctx.beginPath(); ctx.arc(x, y, i % 3 ? 2 : 3, 0, Math.PI * 2); ctx.fill();
    }
    const L = LEVELS[level];
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.setLineDash([]);
    if (L.mode === 'ring') { ctx.beginPath(); ctx.arc(CX, CY, RC, 0, Math.PI * 2); ctx.stroke(); }
    else {

      ctx.fillStyle = '#5c4326'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b2a14'; ctx.beginPath(); ctx.arc(h.x, h.y + 2, h.r * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 6, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(W * 0.08, LINE); ctx.lineTo(W * 0.92, LINE); ctx.stroke(); ctx.setLineDash([]);
    stones().forEach((s) => {
      ctx.fillStyle = '#868e96'; ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r * 1.1, s.r * 0.9, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#adb5bd'; ctx.beginPath(); ctx.ellipse(s.x - s.r * 0.3, s.y - s.r * 0.25, s.r * 0.45, s.r * 0.3, 0.4, 0, Math.PI * 2); ctx.fill();
    });
  };
  const drawMarble = (b, alpha = 1) => {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(b.x + b.r * 0.25, b.y + b.r * 0.35, b.r, b.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, b.shooter ? '#74c0fc' : 'rgba(230,245,255,0.95)'); g.addColorStop(1, b.shooter ? '#1864ab' : 'rgba(165,216,255,0.9)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    if (!b.shooter) { ctx.strokeStyle = b.col; ctx.lineWidth = Math.max(1.5, b.r * 0.28); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0.3, 2.6); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(b.x - b.r * 0.38, b.y - b.r * 0.4, b.r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  };
  const drawAim = () => {
    if (!aiming || state !== 'aim') return;
    const p = Math.min(1, Math.hypot(pull.x, pull.y) / (RC * 1.1));
    if (p < 0.05) return;
    const a = Math.atan2(pull.y, pull.x), len = RC * (0.4 + p * 1.6);
    // rubber band back to the finger
    ctx.strokeStyle = 'rgba(92,67,38,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(shooter.x, shooter.y); ctx.lineTo(shooter.x - Math.cos(a) * p * RC * 1.1, shooter.y - Math.sin(a) * p * RC * 1.1); ctx.stroke();
    // dotted arrow in the shot direction
    ctx.strokeStyle = p > 0.8 ? '#e03131' : p > 0.45 ? '#f08c00' : '#2f9e44'; ctx.lineWidth = 3; ctx.setLineDash([6, 7]);
    ctx.beginPath(); ctx.moveTo(shooter.x, shooter.y); ctx.lineTo(shooter.x + Math.cos(a) * len, shooter.y + Math.sin(a) * len); ctx.stroke(); ctx.setLineDash([]);
    const ex = shooter.x + Math.cos(a) * len, ey = shooter.y + Math.sin(a) * len;
    ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(ex + Math.cos(a) * 10, ey + Math.sin(a) * 10); ctx.lineTo(ex + Math.cos(a + 2.5) * 10, ey + Math.sin(a + 2.5) * 10); ctx.lineTo(ex + Math.cos(a - 2.5) * 10, ey + Math.sin(a - 2.5) * 10); ctx.closePath(); ctx.fill();
  };
  const draw = (now) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGround();
    balls.forEach((b) => { if (!b.out) drawMarble(b); else if (now - b.out < 500) drawMarble(b, 1 - (now - b.out) / 500); });
    if (shooter) drawMarble(shooter, sunk ? Math.max(0.35, 1 - (now - sunk) / 600) : 1);
    drawAim();
    if (state === 'aim' && !aiming && shooter && shotsLeft === LEVELS[level].shots) {
      ctx.fillStyle = 'rgba(59,42,20,0.85)'; ctx.font = '700 14px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(LEVELS[level].mode === 'ring' ? t('goalRing')(need) : t('goalHole'), W / 2, Math.min(H - 14, LINE + 34));
    }
    pops = pops.filter((p) => now - p.t0 < 900);
    pops.forEach((p) => {
      const a = 1 - (now - p.t0) / 900;
      ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.font = `800 16px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", Inter, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      const hw = ctx.measureText(p.text).width / 2 + 6, y = Math.max(56, p.y - (1 - a) * 24), x = Math.min(W - hw, Math.max(hw, p.x));
      ctx.strokeText(p.text, x, y); ctx.fillText(p.text, x, y);
      ctx.globalAlpha = 1;
    });
  };

  let lastT = 0, settle = 0;
  const frame = (now) => {
    const dt = Math.min(0.033, lastT ? (now - lastT) / 1000 : 0.016);
    lastT = now;
    if (state === 'roll') {
      for (let k = 0; k < 6; k += 1) physics(dt / 6, now);
      if (!moving()) { settle += dt; if (settle > 0.25) { settle = 0; afterShot(); } } else settle = 0;
    }
    draw(now);
    requestAnimationFrame(frame);
  };

  // ---------- start / end
  const hideOverlays = () => ['startScreen', 'endScreen'].forEach((id) => $(id).classList.add('hidden'));
  const play = (i) => {
    initAudio();
    playerName = cleanName($('name').value);
    store.set('kc-name', playerName);
    hideOverlays();
    $('menuBtn').classList.remove('hidden');
    $('shareOther').textContent = t('shareOther');
    loadLevel(i);
    if (debug) setTimeout(botShot, 300);
  };
  const finish = (won) => {
    state = 'over';
    const got = won ? (shotsLeft >= 2 ? 3 : shotsLeft === 1 ? 2 : 1) : 0;
    if (got > stars[level]) { stars[level] = got; store.set('kc-stars', JSON.stringify(stars)); }
    (won ? sfx.win : sfx.lose)();
    last = { won, got, level, left: shotsLeft, name: playerName, fact: FACT_KEYS[Math.floor(Math.random() * FACT_KEYS.length)] };
    fillEnd();
    renderLevels();
    setTimeout(() => $('endScreen').classList.remove('hidden'), won ? 500 : 200);
  };
  const fillEnd = () => {
    $('endTitle').textContent = last.won ? t('winTitle')(last.name) : t('loseTitle');
    $('endStars').textContent = last.won ? `${'★'.repeat(last.got)}${'☆'.repeat(3 - last.got)}` : '☆☆☆';
    $('endNote').textContent = `${last.won ? t('winNote')(last.level + 1, last.left) : t('loseNote')(last.level + 1)} · ${t('starLine')(totalStars(), LEVELS.length * 3)}`;
    $('endFact').textContent = `💡 ${t('facts')[last.fact]}`;
    $('nextBtn').classList.toggle('hidden', !(last.won && last.level + 1 < LEVELS.length));
  };
  const toMenu = () => {
    state = 'menu'; aiming = false;
    hideOverlays(); renderLevels();
    $('menuBtn').classList.add('hidden');
    $('startScreen').classList.remove('hidden');
  };

  // ---------- input: pull back from the marble to aim; touch the line elsewhere to slide
  const point = (e) => { const rc = cv.getBoundingClientRect(); return { x: e.clientX - rc.left, y: e.clientY - rc.top }; };
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'aim') return;
    e.preventDefault();
    initAudio();
    const p = point(e);
    if (Math.hypot(p.x - shooter.x, p.y - shooter.y) < Math.max(36, shooter.r * 3)) { aiming = true; pull = { x: 0, y: 0 }; }
    else if (Math.abs(p.y - LINE) < 46) { sliding = true; lineX = Math.min(W * 0.88, Math.max(W * 0.12, p.x)); shooter.x = lineX; }
    else return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
  });
  cv.addEventListener('pointermove', (e) => {
    if (state !== 'aim') return;
    const p = point(e);
    if (aiming) pull = { x: shooter.x - p.x, y: shooter.y - p.y };
    else if (sliding) { lineX = Math.min(W * 0.88, Math.max(W * 0.12, p.x)); shooter.x = lineX; }
  });
  const release = () => {
    if (aiming && state === 'aim') {
      const len = Math.hypot(pull.x, pull.y), p = Math.min(1, len / (RC * 1.1));
      if (p >= 0.05) shoot((pull.x / len) * p * VMAX(), (pull.y / len) * p * VMAX());
    }
    aiming = false; sliding = false;
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', () => { aiming = false; sliding = false; });

  $('levels').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.disabled) play(+b.dataset.l); });
  $('nextBtn').addEventListener('click', () => play(Math.min(LEVELS.length - 1, level + 1)));
  $('retryBtn').addEventListener('click', () => play(level));
  $('toLevels').addEventListener('click', toMenu);
  $('menuBtn').addEventListener('click', toMenu);

  // ---------- share
  const shareText = () => {
    const u = new URL(SITE);
    if (playerName) u.searchParams.set('from', playerName);
    u.searchParams.set('score', String(totalStars()));
    u.searchParams.set('lang', lang);
    return t('shareText')(playerName, totalStars(), u.toString());
  };
  $('shareWa').addEventListener('click', () => { window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', () => {
    const text = shareText();
    if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { $('shareOther').textContent = t('copied'); })
      .catch(() => window.prompt(t('copyPrompt'), text));
  });

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);
  resize();
  loadLevel(0); state = 'menu';
  applyLang();
  requestAnimationFrame(frame);
  if (debug && params.has('auto')) play(Math.max(0, Math.min(LEVELS.length - 1, (parseInt(params.get('level'), 10) || 1) - 1)));
  window.__kc = { get state() { return state; }, get level() { return level; }, get stars() { return stars.slice(); }, get last() { return last; }, get out() { return `${outCount}/${need}`; } };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
