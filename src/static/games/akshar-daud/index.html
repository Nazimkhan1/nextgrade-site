    win: (n) => `Well done, ${n}! 🎉`, winP: (s, t) => `You caught the whole "${s}" — in ${t} seconds!`, shareT: (n, s) => `${n} learnt the whole "${s}" in Akshar Daud! 🏃 Play too:`,
    info: '<h2>What is Akshar Daud?</h2><p>A running game for young children: the child types a name, the runner sets off and numbers (1, 2, 3…), A B C, क ख ग or অ আ ই come one by one. Whatever you catch is spoken aloud — like “A for Apple”. A missed one comes back again, so the order sticks by itself.</p><h2>How to play</h2><ul><li>Type your name and pick a set.</li><li>Tap the screen to jump; tap again in the air for a second jump.</li><li>Jump over stones — bumping one just slows the runner, the game does not end.</li><li>Catch them all and win stars.</li></ul><h2>What children get from it</h2><p>Seeing, hearing and catching each letter or number together helps it stick, and the timing builds hand-eye coordination. For ages 3–7; parents can sit along and repeat each one aloud.</p>' },
  bn: { title: 'অক্ষর দৌড় 🏃', sub: 'নিজের নাম লেখো, সেট বাছো আর দৌড়াও! যা আসে ধরো — সেটা বলে শোনাবে।', ph: 'তোমার নাম', start: '▶ শুরু করো', how: 'লাফাতে স্ক্রিনে ট্যাপ করো (বা Space)। দুবার ট্যাপ = উঁচু লাফ।', keys: 'ফোন: স্ক্রিনে ট্যাপ · কম্পিউটার: Space / ↑', again: '↺ আবার', next: '➡ পরের সেট', share: '📤 WhatsApp', missed: 'ফসকে গেল — আবার আসবে!', oops: 'উফ! 🪨',
    sets: { g20: ['গোনা ১–২০', 'হিন্দিতে'], g50: ['গোনা ১–৫০', 'হিন্দিতে'], e20: ['Counting 1–20', 'English'], abc: ['A B C', 'English'], varna: ['क ख ग', 'হিন্দি বর্ণমালা'], borno: ['অ আ ক খ', 'বাংলা বর্ণমালা'] },

};
const SET_IDS = ['g20', 'g50', 'e20', 'abc', 'varna', 'borno'];
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const qLang = new URLSearchParams(location.search).get('lang');
let lang = T[qLang] ? qLang : (T[store.get('ad-lang')] ? store.get('ad-lang') : 'hinglish');
let setId = SET_IDS.includes(store.get('ad-set')) ? store.get('ad-set') : (lang === 'en' ? 'abc' : lang === 'bn' ? 'borno' : 'g20');
const t = (k) => T[lang][k];

// items of a set: { show (big text), label (popup), audio, speak, voice }
function itemsOf(id) {
  if (id === 'g20' || id === 'g50' || id === 'e20') {
    const n = id === 'g50' ? 50 : 20, en = id === 'e20', bnShow = lang === 'bn' && !en;
    return DATA.ginti.slice(0, n).map((x) => ({ show: bnShow ? x.sb : x.s, label: `${bnShow ? x.sb : x.s} — ${en ? x.en : x.hi}`, audio: en ? x.a.en : x.a.hi, speak: en ? x.en : x.hi, voice: en ? 'en-IN' : 'hi-IN' }));
  }
  if (id === 'abc') return DATA.abc.map((x) => ({ show: x.s, label: `${x.s} — ${x.w} ${x.e}`, audio: x.a, speak: x.sp, voice: 'en-IN' }));
  if (id === 'varna') return DATA.varna.map((x) => ({ show: x.s, label: `${x.s} — ${x.w} ${x.e}`, audio: x.a, speak: `${x.s} से ${x.w}`, voice: 'hi-IN' }));
  return DATA.borno.map((x) => ({ show: x.s, label: `${x.s} — ${x.w} ${x.e}`, audio: x.a, speak: x.sp, voice: 'bn-IN' }));
}

// ---------- sound: recorded mp3 first, the phone's voice as a fallback
let audio = null;
function speak(it) {
  try { if (audio) audio.pause(); } catch (e) {}
  const tts = () => { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(it.speak); u.lang = it.voice; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {} };
  if (!it.audio) return tts();
  audio = new Audio('/assets/kids-audio/' + it.audio);
  audio.play().catch(tts);
}
function blip(f, d) { try { const C = blip.c || (blip.c = new (window.AudioContext || window.webkitAudioContext)()); const o = C.createOscillator(), g = C.createGain(); o.frequency.value = f; g.gain.value = 0.06; o.connect(g); g.connect(C.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, C.currentTime + d); o.stop(C.currentTime + d); } catch (e) {} }

// ---------- game state
const cv = $('cv');
// phones: a narrower, taller canvas so the letters stay big enough to read
if (Math.min(window.innerWidth, screen.width || 9999) < 700) { cv.width = 600; cv.height = 520; }
const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, GROUND = H - 70;
let items = [], queue = [], caught = 0, total = 0, playerName = '', running = false, t0 = 0, hits = 0;
let speed = 5, dist = 0, last = 0, slowUntil = 0;
const P = { x: 120, y: GROUND, vy: 0, jumps: 0, r: 28 };
let bubbles = [], stones = [], sparks = [], nextBubbleAt = 0, nextStoneAt = 0, sayTimer = 0;
const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 220 + 40, y: 40 + (i % 3) * 30, s: 0.6 + (i % 2) * 0.4 }));
const trees = Array.from({ length: 6 }, (_, i) => ({ x: i * 190 + 60, h: 60 + (i * 37) % 50 }));

function startGame() {
  playerName = ($('name').value.trim() || (lang === 'en' ? 'Champ' : lang === 'bn' ? 'বন্ধু' : 'Champion')).slice(0, 20);
  store.set('ad-name', playerName); store.set('ad-set', setId);
  items = itemsOf(setId); queue = items.map((_, i) => i); caught = 0; total = items.length; hits = 0;
  bubbles = []; stones = []; sparks = []; speed = 5; dist = 0; P.y = GROUND; P.vy = 0; P.jumps = 0;
  nextBubbleAt = 40; nextStoneAt = 260; t0 = performance.now(); running = true;
  $('start').hidden = true; $('end').hidden = true; hud();
  last = performance.now(); requestAnimationFrame(loop);
}
function hud() { $('hudName').textContent = '🏃 ' + (playerName || ''); $('hudCount').textContent = `${caught} / ${total}`; }
function say(text) { const s = $('say'); s.textContent = text; s.classList.add('on'); clearTimeout(sayTimer); sayTimer = setTimeout(() => s.classList.remove('on'), 1300); }
function jump() {
  if (!running) return;
  if (P.jumps < 2) { P.vy = P.jumps ? -13 : -15; P.jumps++; blip(520 + P.jumps * 120, 0.12); }
}

function spawnBubble() {
  if (!queue.length) return;
  // only one bubble of the next letter on screen at a time, so they come in order
  if (bubbles.some((b) => !b.done)) return;
  const idx = queue[0];
  const high = Math.random() < 0.5;
  bubbles.push({ idx, x: W + 40, y: high ? GROUND - 150 - Math.random() * 40 : GROUND - 30, r: 34, done: false, bob: Math.random() * 6 });
}
function spawnStone() { if (dist > 120) stones.push({ x: W + 20, w: 34 + Math.random() * 16, h: 22 + Math.random() * 10 }); }

function loop(now) {
  if (!running) return;
  const dt = Math.min(2, (now - last) / 16.67); last = now;
  const sp = (now < slowUntil ? speed * 0.45 : speed) * dt;
  dist += sp;
  speed = 5 + Math.min(3, caught * 0.12);
  // player physics
  P.vy += 0.8 * dt; P.y += P.vy * dt;
  if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.jumps = 0; }
  // spawning
  nextBubbleAt -= sp; if (nextBubbleAt <= 0) { spawnBubble(); nextBubbleAt = 230 + Math.random() * 120; }
  nextStoneAt -= sp; if (nextStoneAt <= 0) { spawnStone(); nextStoneAt = 380 + Math.random() * 420; }
  // move + collide
  bubbles.forEach((b) => {
    b.x -= sp; b.bob += 0.08 * dt;
    if (b.done) return;
    const by = b.y + Math.sin(b.bob) * 6, dx = b.x - P.x, dy = by - (P.y - 40);
    if (dx * dx + dy * dy < (b.r + P.r) * (b.r + P.r)) {
      b.done = true; queue.shift(); caught++; hud();
      const it = items[b.idx]; speak(it); say(it.label); blip(880, 0.15);
      for (let k = 0; k < 14; k++) sparks.push({ x: b.x, y: by, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.8) * 8, life: 40 });
      if (!queue.length) setTimeout(win, 1100);
    } else if (b.x < -40) { b.done = true; say(t('missed')); }
  });
  bubbles = bubbles.filter((b) => !b.done || b.x > -60);
  bubbles = bubbles.filter((b) => !(b.done && b.x < -40));
  stones.forEach((s) => {
    s.x -= sp;
    if (!s.hit && s.x < P.x + 18 && s.x + s.w > P.x - 18 && P.y > GROUND - s.h) { s.hit = true; hits++; slowUntil = now + 900; say(t('oops')); blip(160, 0.25); }
  });
  stones = stones.filter((s) => s.x > -60);
  sparks.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; });
  sparks = sparks.filter((p) => p.life > 0);
  draw(now);
  requestAnimationFrame(loop);
}

function draw(now) {
  // sky + sun
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#74c0fc'); g.addColorStop(1, '#e7f5ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(W - 90, 70, 34, 0, 7); ctx.fill();
  // clouds (slow parallax)
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  clouds.forEach((c) => { const x = ((c.x - dist * 0.15 * c.s) % (W + 200) + W + 200) % (W + 200) - 100; ctx.beginPath(); ctx.arc(x, c.y, 22, 0, 7); ctx.arc(x + 24, c.y - 8, 26, 0, 7); ctx.arc(x + 50, c.y, 20, 0, 7); ctx.fill(); });
  // hills
  ctx.fillStyle = '#8ce99a';
  ctx.beginPath(); ctx.moveTo(0, GROUND - 40);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND - 60 - Math.sin((x + dist * 0.3) / 120) * 25);
  ctx.lineTo(W, GROUND); ctx.lineTo(0, GROUND); ctx.fill();
  // trees
  trees.forEach((tr) => { const x = ((tr.x - dist * 0.6) % (W + 120) + W + 120) % (W + 120) - 60; ctx.fillStyle = '#8d5b2c'; ctx.fillRect(x - 5, GROUND - tr.h, 10, tr.h); ctx.fillStyle = '#2f9e44'; ctx.beginPath(); ctx.arc(x, GROUND - tr.h - 14, 28, 0, 7); ctx.fill(); });
  // road
  ctx.fillStyle = '#c08a52'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#a9743f';
  for (let x = -((dist) % 60); x < W; x += 60) ctx.fillRect(x, GROUND + 26, 30, 6);
  ctx.fillStyle = '#51cf66'; ctx.fillRect(0, GROUND - 4, W, 6);
  // stones
  stones.forEach((s) => { ctx.fillStyle = s.hit ? '#adb5bd' : '#868e96'; ctx.beginPath(); ctx.ellipse(s.x + s.w / 2, GROUND - s.h / 2 + 2, s.w / 2, s.h / 2, 0, 0, 7); ctx.fill(); });
  // bubbles
  bubbles.forEach((b) => {
    if (b.done) return;
    const it = items[b.idx], y = b.y + Math.sin(b.bob) * 6;
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = '#fab005'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1b263b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fs = it.show.length > 2 ? 26 : 34; ctx.font = `800 ${fs}px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif`;
    ctx.fillText(it.show, b.x, y + 2);
  });
  // sparks
  sparks.forEach((p) => { ctx.fillStyle = p.life % 2 ? '#fab005' : '#f06595'; ctx.fillRect(p.x, p.y, 5, 5); });
  drawRunner(now);
}

function drawRunner(now) {
  const x = P.x, y = P.y, air = y < GROUND - 1, step = air ? 0 : Math.sin(dist / 9);
  const flash = now < slowUntil && Math.floor(now / 100) % 2;
  ctx.save(); ctx.globalAlpha = flash ? 0.5 : 1;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#1b263b'; ctx.lineWidth = 7;
  // legs
  ctx.beginPath(); ctx.moveTo(x, y - 34); ctx.lineTo(x + step * 14, y - 2); ctx.moveTo(x, y - 34); ctx.lineTo(x - step * 14, y - 2); ctx.stroke();
  // body (school shirt) + backpack
  ctx.fillStyle = '#e03131'; ctx.fillRect(x - 22, y - 60, 12, 26);
  ctx.fillStyle = '#4dabf7'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 13, y - 66, 26, 34, 8) : ctx.rect(x - 13, y - 66, 26, 34); ctx.fill();
  // arms
  ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y - 58); ctx.lineTo(x + 16 - step * 8, y - 42); ctx.moveTo(x, y - 58); ctx.lineTo(x - 12 + step * 8, y - 44); ctx.stroke();
  // head
  ctx.fillStyle = '#f4c39a'; ctx.beginPath(); ctx.arc(x + 2, y - 82, 16, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b263b'; ctx.beginPath(); ctx.arc(x + 2, y - 88, 16, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 9, y - 82, 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1b263b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 6, y - 77, 5, 0.2, Math.PI - 0.6); ctx.stroke();
  ctx.restore();
  // name tag
  ctx.font = '800 20px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(playerName).width + 16;
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(x - w / 2, y - 128, w, 26);
  ctx.fillStyle = '#2f9e44'; ctx.fillText(playerName, x, y - 108);
}

function win() {
  running = false;
  const secs = Math.round((performance.now() - t0) / 1000), stars = hits === 0 ? 3 : hits <= 3 ? 2 : 1;
  const label = t('sets')[setId][0];
  $('stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  $('endH').textContent = t('win')(playerName); $('endP').textContent = t('winP')(label, secs);
  $('end').hidden = false; blip(660, 0.2); setTimeout(() => blip(990, 0.3), 180);
  draw(performance.now());
}

// ---------- setup UI
function renderSetup() {
  document.documentElement.lang = lang === 'hinglish' ? 'hi-Latn' : lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  $('name').placeholder = t('ph');
  $('sets').innerHTML = SET_IDS.map((id) => `<button type="button" data-set="${id}"${id === setId ? ' class="on"' : ''}>${t('sets')[id][0]}<small>${t('sets')[id][1]}</small></button>`).join('');
  $('info').innerHTML = t('info'); $('lang').value = lang;
}
$('sets').addEventListener('click', (e) => { const b = e.target.closest('[data-set]'); if (!b) return; setId = b.dataset.set; renderSetup(); });
$('lang').addEventListener('change', (e) => { lang = e.target.value; store.set('ad-lang', lang); renderSetup(); });
$('goBtn').addEventListener('click', startGame);
$('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });
$('again').addEventListener('click', startGame);
$('next').addEventListener('click', () => { setId = SET_IDS[(SET_IDS.indexOf(setId) + 1) % SET_IDS.length]; renderSetup(); $('end').hidden = true; $('start').hidden = false; });
$('share').addEventListener('click', () => { location.href = 'https://wa.me/?text=' + encodeURIComponent(t('shareT')(playerName, t('sets')[setId][0]) + ' https://nextgrade.in/games/akshar-daud/'); });
$('stage').addEventListener('pointerdown', (e) => { if (e.target.closest('.panel')) return; e.preventDefault(); jump(); });
document.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.key === 'ArrowUp') && running) { e.preventDefault(); jump(); } });
$('name').value = store.get('ad-name') || '';
renderSetup(); draw(performance.now());
</script>
</body>
</html>
