  $('nextLevel').addEventListener('click', () => { lv = lv + 1 < LEVELS.length ? lv + 1 : 0; store.set('np-level', String(lv)); levelTabs(); reset(); $('scene').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  const levelTabs = () => {
    $('levels').innerHTML = LEVELS.map((l, i) => `<button type="button" data-l="${i}" aria-pressed="${i === lv}"${i + 1 > unlocked() ? ' disabled' : ''}>${i + 1 > unlocked() ? '🔒 ' : ''}${t('level')(i + 1)}</button>`).join('');
  };
  $('levels').addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (!b || b.disabled) return; lv = Number(b.dataset.l); store.set('np-level', String(lv)); levelTabs(); reset(); });
  const shareText = () => t('shareText')(lv + 1, moves) + `${SITE}?lang=${lang}`;
  $('shareWa').addEventListener('click', () => { window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', () => { const text = shareText(); if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; } (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(() => window.prompt('Copy', text)); });

  // ---- language
  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    document.title = `${t('title')} 🛶 — River Crossing Puzzle | NextGrade`;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    $('go').textContent = t('go'); $('hint').textContent = t('hint'); $('reset').textContent = t('reset');
    $('rules').innerHTML = t('rules')[L().key];
    const p = PREFIX[lang];
    $('home').href = `https://nextgrade.in${p}/`; $('moreGames').href = `https://nextgrade.in${p}/games/`; $('storyLink').href = `https://nextgrade.in${p}/kahani/`;
    $('quizLink').href = `https://nextgrade.in/games/quiz/?lang=${lang}`;
    levelTabs(); draw();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('np-lang', lang); applyLang(); say(''); });
  $('year').textContent = new Date().getFullYear();

  if (lv + 1 > unlocked()) lv = 0;
  setMute(); reset(); applyLang(); say(t('tapHelp'));
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
<script src="/assets/game-share.js?v=2" defer></script>
</body>
</html>
