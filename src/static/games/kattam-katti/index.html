  const strike = (line) => { const c = (i) => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100]; const [a, , d] = line, [x1, y1] = c(a), [x2, y2] = c(d); const ex = (x2 - x1) * 0.18, ey = (y2 - y1) * 0.18; $('strike').innerHTML = `<line x1="${x1 - ex}" y1="${y1 - ey}" x2="${x2 + ex}" y2="${y2 + ey}"/>`; };
  const setStatus = (s) => { $('status').textContent = s; };
  const statusTurn = () => setStatus(t('turn')(nameOf(turn), turn === 'X' ? '❌' : '⭕'));

  // ---------- sound: chalk taps, no music
  let muted = store.get('kk-muted') === '1', ac = null, master = null;
  const setIcons = () => { $('mute').textContent = muted ? '🔇' : '🔊'; }; setIcons();
  $('mute').addEventListener('click', () => { muted = !muted; store.set('kk-muted', muted ? '1' : '0'); setIcons(); if (master) master.gain.value = muted ? 0 : 0.8; });
  const initAudio = () => { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination); };
  const tone = (f, dur, type = 'sine', vol = 0.06, delay = 0, f2 = null) => { if (!ac) return; const w = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, w); if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + dur); g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(vol, w + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, w + dur); o.connect(g); g.connect(master); o.start(w); o.stop(w + dur + 0.03); };
  const sfx = { tap: (m) => tone(m === 'X' ? 1400 : 1000, 0.07, 'triangle', 0.05, 0, m === 'X' ? 900 : 1300), win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, 'sine', 0.06, i * 0.1)), lose: () => tone(330, 0.4, 'triangle', 0.05, 0, 220), draw: () => { tone(440, 0.25, 'sine', 0.05); tone(440, 0.25, 'sine', 0.05, 0.25); } };

  // ---------- game flow
  const finish = (w) => {
    over = true;
    if (w.m === 'D') { score.D += 1; setStatus(t('draw')); sfx.draw(); if (mode === 'hard') store.set('kk-hard-draws', String((parseInt(store.get('kk-hard-draws'), 10) || 0) + 1)); }
    else { score[w.m] += 1; strike(w.line); if (mode !== 'two' && w.m === 'O') { setStatus(t('cpuWin')); sfx.lose(); } else { setStatus(t('win')(nameOf(w.m))); sfx.win(); } }
    if (score.X >= 3 || score.O >= 3) { matchOver = true; setTimeout(() => setStatus(t('matchWin')(nameOf(score.X >= 3 ? 'X' : 'O'))), 900); }
    render();
  };
  const place = (i, m) => { board[i] = m; sfx.tap(m); render(); const w = winner(board); if (w) { finish(w); return true; } turn = m === 'X' ? 'O' : 'X'; return false; };
  const cpuTurn = () => { busy = true; setStatus(t('thinking')); setTimeout(() => { busy = false; if (over) return; if (!place(cpuMove(), 'O')) statusTurn(); }, 380); };
  const newGame = () => {
    board = Array(9).fill(''); over = false; $('strike').innerHTML = ''; turn = starter; render(); statusTurn();
    if (mode !== 'two' && turn === 'O') cpuTurn();
  };
  const newMatch = () => { score = { X: 0, O: 0, D: 0 }; matchOver = false; starter = 'X'; newGame(); };
  $('board').addEventListener('click', (e) => {
    const b = e.target.closest('.cell'); if (!b) return; initAudio();
    const i = +b.dataset.i; if (over || busy || board[i]) return;
    if (mode !== 'two' && turn !== human()) return;
    if (place(i, turn)) return;
    if (mode !== 'two') cpuTurn(); else statusTurn();
  });
  $('again').addEventListener('click', () => { if (matchOver) newMatch(); else { starter = starter === 'X' ? 'O' : 'X'; newGame(); } });
  $('reset').addEventListener('click', newMatch);
  $('modes').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; mode = b.dataset.mode; store.set('kk-mode', mode); setModeUi(); newMatch(); });
  ['nameX', 'nameO'].forEach((id) => { $(id).value = store.get(`kk-${id}`) || ''; $(id).addEventListener('input', () => { store.set(`kk-${id}`, $(id).value); if (!over) statusTurn(); }); });
  const setModeUi = () => { document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.mode === mode)); $('namesBox').classList.toggle('hidden', mode !== 'two'); };
  $('shareWa').addEventListener('click', () => { const u = new URL(SITE); u.searchParams.set('lang', lang); window.open(`https://wa.me/?text=${encodeURIComponent(t('shareText')(u.toString()))}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });

  // ---------- page texts
  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    $('tipList').innerHTML = t('tips').map((li) => `<li>${li}</li>`).join('');
    $('factList').innerHTML = t('facts').map((li) => `<li>${li}</li>`).join('');
    $('faqList').innerHTML = t('faq').map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('');
    const p = PREFIX[lang]; $('home').href = `https://nextgrade.in${p}/`; $('moreGames').href = `https://nextgrade.in${p}/games/`;
    const c = $('challenge'); if (fromName && fromScore) { c.textContent = t('challenge')(fromName, fromScore); c.style.display = 'block'; }
    if (!over) statusTurn();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('kk-lang', lang); applyLang(); });
  $('year').textContent = new Date().getFullYear();
  setModeUi(); applyLang(); newMatch();
  // test hook (local headless tests)
  window.__kk = { get board() { return board.slice(); }, get over() { return over; }, get turn() { return turn; }, get score() { return { ...score }; }, setMode: (m) => { mode = m; setModeUi(); newMatch(); }, tap: (i) => $('board').children[i].click(), winner: () => winner(board), newGame };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
