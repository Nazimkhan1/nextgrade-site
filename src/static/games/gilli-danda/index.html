    if (state === 'ready') {
      const mx = W * 0.5, my = H - 26, mw = Math.min(W * 0.7, 300);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(mx - mw / 2, my - 9, mw, 18);
      ctx.fillStyle = '#51cf66'; ctx.fillRect(mx - mw / 2 + mw * SWEET[0], my - 9, mw * (SWEET[1] - SWEET[0]), 18);
      const v = meterVal(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx - mw / 2 + mw * v, my - 13); ctx.lineTo(mx - mw / 2 + mw * v - 7, my - 24); ctx.lineTo(mx - mw / 2 + mw * v + 7, my - 24); ctx.closePath(); ctx.fill();
    }
    const prompt = state === 'ready' ? t('tapPop') : state === 'pop' && !swingAt ? t('tapHit') : '';
    if (prompt) { ctx.font = `800 ${Math.max(16, Math.min(24, W / 18))}px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillText(prompt, W / 2 + 2, H * 0.32 + 2); ctx.fillStyle = '#fff'; ctx.fillText(prompt, W / 2, H * 0.32); }
    if (banner) { ctx.font = `800 ${Math.max(18, Math.min(28, W / 15))}px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText(banner.text, W / 2 + 2, H * 0.3 + 2); ctx.fillStyle = banner.c; ctx.fillText(banner.text, W / 2, H * 0.3); }
  };

  const frame = (now) => { step(now); draw(now); requestAnimationFrame(frame); };

  // ---------- share
  const shareText = () => { const u = new URL(SITE); if (playerName) u.searchParams.set('from', playerName); u.searchParams.set('score', String(score)); u.searchParams.set('lang', lang); return t('shareText')(playerName, score, u.toString()); };
  $('shareWa').addEventListener('click', (e) => { e.stopPropagation(); window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', (e) => {
    e.stopPropagation(); const text = shareText();
    if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { $('shareOther').textContent = t('copied'); }).catch(() => window.prompt(t('copyPrompt'), text));
  });

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);
  resize(); applyLang(); requestAnimationFrame(frame);
  // test hook (local headless tests): tap(), state, score
  window.__gd = { tap, start, meter: () => meterVal(), get state() { return state; }, get score() { return score; }, get lives() { return lives; }, get hits() { return hits; }, get lastKind() { return lastKind; }, get gilli() { return gilli && { x: gilli.x, y: gilli.y, vy: gilli.vy }; } };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
