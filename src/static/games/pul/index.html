      winLine: (u, l, h) => `${u} মিনিটে সবাই পার (সীমা ${l})! ${h ? `হিন্ট নিয়েছ: ${h}।` : 'হিন্ট ছাড়াই!'}`, share: (lv, u) => `🔦 রাতের সাঁকো লেভেল ${lv}: আমি সবাইকে ${u} মিনিটে পার করিয়েছি! তুমি পারবে? 👉 `,
      target: (l) => `সীমা: ${l} মিনিট`,
      howTitle: 'কীভাবে খেলবে', how: ['যে পাড়ে টর্চ আছে, সেখানে ১ বা ২ জনের উপর ট্যাপ করো।', '"🔦 সাঁকো পার করো" টেপো — তারা টর্চ নিয়ে ওপারে যাবে। ধীর জনের সময় যোগ হবে।', 'টর্চ ফেরাতে কাউকে (বা দুজনকে) ফিরে আসতে হবে।', 'মোট সময় সীমা ছাড়ালে টর্চ নিভে যাবে — লেভেল আবার।', 'টিপ: সবচেয়ে ধীর দুজনকে একসঙ্গে পাঠালে সময় বাঁচে! "💡 হিন্ট" পরের ঠিক চাল দেখায়।'],
      aboutTitle: 'এই ধাঁধা কোথা থেকে এল?', aboutText: 'সাঁকো আর টর্চের ধাঁধা বিংশ শতকের এক বিখ্যাত মাথা খাটানোর ধাঁধা, ধাঁধার বই থেকে চাকরির ইন্টারভিউ পর্যন্ত জিজ্ঞেস করা হয়। এর মজা হলো, সোজা উপায় — সবচেয়ে দ্রুত জন সবাইকে নিয়ে যাবে — সেরা উপায় নয়।',
      aboutText2: 'আসল কৌশল হলো সবচেয়ে ধীর দুজনকে একসঙ্গে পাঠানো, যাতে তাদের লম্বা সময় একবারই যোগ হয়। "ধীর অংশগুলো একসঙ্গে করো" — এই ভাবনা পরিকল্পনা আর কম্পিউটার অ্যালগরিদমেও কাজে লাগে।',
      nadiLink: 'নদী পার ধাঁধা', matkeLink: 'দুই কলসি ধাঁধা',
    },
  };

  let L = null, at = [], torch = 'L', used = 0, sel = [], hist = [], over = false, hints = 0, hintSet = [];
  const kit = window.PuzzleKit({ key: 'pl', site: 'https://nextgrade.in/games/pul/', emoji: '🔦', titleTail: 'Bridge and Torch Puzzle', T, levels: LEVELS.length, onLevel: (i) => start(i), onLang: () => draw() });
  const t = kit.t;
  const name = (i) => P[L.people[i][0]][kit.lang];
  const speed = (i) => L.people[i][1];

  // ---- shortest total time to get everyone across from a state (Dijkstra); returns { cost, first }
  const plan = (pos, side) => {
    const key = (p, s) => p.join('') + s;
    const dist = new Map([[key(pos, side), 0]]), first = new Map([[key(pos, side), null]]);
    const open = [[0, pos, side]];
    while (open.length) {
      open.sort((a, b) => a[0] - b[0]);
      const [d, p, s] = open.shift(), k = key(p, s);
      if (d > dist.get(k)) continue;
      if (p.every((x) => x === 'R')) return { cost: d, first: first.get(k) };
      const here = p.map((x, i) => (x === s ? i : -1)).filter((i) => i >= 0);
      const groups = [];
      here.forEach((a, ai) => { groups.push([a]); here.slice(ai + 1).forEach((b) => groups.push([a, b])); });
      groups.forEach((g) => {
        const ns = s === 'L' ? 'R' : 'L', np = p.map((x, i) => (g.includes(i) ? ns : x)), nd = d + Math.max(...g.map(speed)), nk = key(np, ns);
        if (!dist.has(nk) || nd < dist.get(nk)) { dist.set(nk, nd); first.set(nk, first.get(k) || g); open.push([nd, np, ns]); }
      });
    }
    return null;
  };

  const btn = (i) => `<button type="button" class="p${sel.includes(i) ? ' sel' : ''}${hintSet.includes(i) && !sel.includes(i) ? ' hinted' : ''}" data-i="${i}"><span class="e">${P[L.people[i][0]].e}</span><span>${name(i)}</span><span class="s">${t('min')(speed(i))}</span></button>`;
  const draw = () => {
    kit.$('rules').innerHTML = t('rules')(L.people.length, L.limit);
    kit.$('sideL').innerHTML = at.map((s, i) => (s === 'L' ? btn(i) : '')).join('');
    kit.$('sideR').innerHTML = at.map((s, i) => (s === 'R' ? btn(i) : '')).join('');
    kit.$('torch').style.left = torch === 'L' ? '8%' : '84%';
    kit.$('clockText').textContent = t('clock')(used, L.limit);
    kit.$('clockBar').style.width = `${Math.min(100, (used / L.limit) * 100)}%`;
    kit.$('go').textContent = t('go'); kit.$('go').disabled = over;
    kit.status(null, t('target')(L.limit));
  };
  const tap = (i) => {
    if (over) return;
    if (at[i] !== torch) { kit.sfx.no(); kit.say(t('noTorch'), 'bad'); return; }
    if (sel.includes(i)) sel = sel.filter((x) => x !== i);
    else if (sel.length >= 2) { kit.sfx.no(); kit.say(t('two'), 'bad'); return; } else sel.push(i);
    kit.sfx.tap(); kit.say(''); draw();
  };
  kit.$('night').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) tap(Number(b.dataset.i)); });
  kit.$('go').addEventListener('click', () => {
    if (over) return;
    if (!sel.length) { kit.sfx.no(); kit.say(t('none'), 'bad'); return; }
    hist.push({ at: at.slice(), torch, used });
    const ns = torch === 'L' ? 'R' : 'L';
    used += Math.max(...sel.map(speed)); sel.forEach((i) => { at[i] = ns; }); torch = ns; sel = []; hintSet = [];
    kit.sfx.move(); kit.say(''); draw();
    if (used > L.limit) { over = true; kit.sfx.fail(); kit.shake(); kit.say(t('late')(used, L.limit), 'bad'); draw(); return; }
    if (at.every((x) => x === 'R')) { over = true; draw(); kit.win({ stars: hints === 0 ? 3 : hints <= 2 ? 2 : 1, line: t('winLine')(used, L.limit, hints), share: t('share')(kit.lv + 1, used), bestKey: kit.lv, score: used }); }
  });
  kit.$('undo').addEventListener('click', () => { if (!hist.length) return; const h = hist.pop(); at = h.at; torch = h.torch; used = h.used; over = false; sel = []; hintSet = []; kit.say(''); draw(); });
  kit.$('hint').addEventListener('click', () => {
    if (over) return;
    const p = plan(at, torch); sel = [];
    if (!p || used + p.cost > L.limit) { kit.say(t('hintLate'), 'bad'); hintSet = []; draw(); return; }
    hints += 1; hintSet = p.first || [];
    kit.say(t('hintSay')(hintSet.map(name).join(' + ')), 'good'); draw();
  });
  kit.$('reset').addEventListener('click', () => start(kit.lv));
  const start = (i) => {
    L = LEVELS[i]; at = L.people.map(() => 'L'); torch = 'L'; used = 0; sel = []; hist = []; over = false; hints = 0; hintSet = [];
    kit.hideWin(); kit.say(t('pick')); draw();
  };
  kit.start();
})();

</script>
</body>
</html>
