    $('guideLink').href = `https://nextgrade.in${p}/festivals/guru-nanak-jayanti/`;
    $('wishLink').href = `https://nextgrade.in/celebrate/gurpurab/?lang=${lang}`;
    const c = $('challenge');
    if (fromName && fromScore) { c.textContent = t('challenge')(fromName, fromScore); c.style.display = 'block'; }
    $('bestLine').textContent = best() ? t('best')(best()) : '';
    renderTray();
    if (last) fillEnd();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('ls-lang', lang); applyLang(); });
  $('name').value = store.get('ls-name') || '';
  $('year').textContent = new Date().getFullYear();

  // ---------- sound: soft effects only, no music
  let muted = store.get('ls-muted') === '1';
  let ac = null, master = null;
  const setIcons = () => { $('mute').textContent = muted ? '🔇' : '🔊'; };
  setIcons();
  $('mute').addEventListener('click', () => { muted = !muted; store.set('ls-muted', muted ? '1' : '0'); setIcons(); if (master) master.gain.value = muted ? 0 : 0.8; });
  const initAudio = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
  };
  const tone = (f, dur, type = 'sine', vol = 0.07, delay = 0, f2 = null) => {
    if (!ac) return;
    const w = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, w);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + dur);
    g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(vol, w + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, w + dur);
    o.connect(g); g.connect(master); o.start(w); o.stop(w + dur + 0.03);
  };
  const sfx = {
    pick: () => tone(660, 0.08, 'triangle', 0.05),
    serve: () => { tone(784, 0.25, 'sine', 0.07); tone(1175, 0.35, 'sine', 0.05, 0.08); },
    wrong: () => tone(300, 0.18, 'triangle', 0.05, 0, 240),
    wait: () => tone(440, 0.3, 'sine', 0.035, 0, 392),
    end: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.6, 'sine', 0.06, i * 0.15)); },
  };

  // ---------- state
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  let W = 400, H = 600, dpr = 1;
  let state = 'idle'; // idle | play | over
  let seats = [], T0 = 0, nextSpawn = 0, score = 0, served = 0, missed = 0, streak = 0;
  let pops = [], playerName = '', lastFrame = 0, pausedLeft = 0;
  const COAT = ['#1c7ed6', '#e8590c', '#2f9e44', '#ae3ec9', '#f59f00', '#c92a2a', '#0c8599', '#5f3dc4'];
  const COVER = ['#f76707', '#1971c2', '#fab005', '#e64980', '#2b8a3e', '#ffffff', '#7048e8', '#f03e3e'];

  const layout = () => {
    const cols = W < 520 ? 3 : 4;
    const rows = 2;
    const top = H * 0.38, bottom = H - 96;
    const rowH = (bottom - top) / rows;
    const old = seats;
    seats = [];
    for (let r = 0; r < rows; r += 1) {
      for (let c = 0; c < cols; c += 1) {
        const i = r * cols + c;
        const o = old[i] || { want: -1, born: 0, life: 0, flash: 0, wait: 0, coat: COAT[i % COAT.length], cover: COVER[(i * 3) % COVER.length], kid: Math.random() < 0.3 };
        seats.push(Object.assign(o, { x: ((c + 0.5) / cols) * W, y: top + rowH * (r + 0.72), size: Math.min(W / cols, rowH) * 0.42 }));
      }
    }
  };
  const resize = () => {
    const r = $('stage').getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(280, r.width); H = Math.max(420, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    layout();
  };

  const elapsed = (now) => (state === 'play' ? now - T0 : 0);
  const patience = (now) => 7000 - (elapsed(now) / GAME_MS) * 3200; // 7 s → 3.8 s
  const spawnGap = (now) => 1300 - (elapsed(now) / GAME_MS) * 650; // 1.3 s → 0.65 s
  const updateHud = (now = performance.now()) => {
    $('hudScore').textContent = `🙏 ${served}`;
    $('hudTime').textContent = `⏱ ${state === 'play' ? Math.max(0, Math.ceil((GAME_MS - elapsed(now)) / 1000)) : 60}`;
  };
  const pop = (x, y, text, col) => { pops.push({ x, y, text, col, t0: performance.now() }); };

  const spawn = (now) => {
    const free = seats.filter((s) => s.want < 0 && now - s.wait > 900);
    if (!free.length) return;
    const s = free[Math.floor(Math.random() * free.length)];
    s.want = Math.floor(Math.random() * ITEMS.length); s.born = now; s.life = patience(now);
  };

  const serveSeat = (s, now) => {
    if (state !== 'play' || s.want < 0) return;
    if (s.want === selected) {
      const left = Math.max(0, 1 - (now - s.born) / s.life);
      const pts = 10 + Math.round(left * 10);
      score += pts; served += 1; streak += 1;
      s.want = -1; s.flash = now; s.wait = now;
      const th = t('thanks');
      pop(s.x, s.y - s.size * 1.6, th[served % th.length], '#2b8a3e');
      sfx.serve();
    } else {
      pop(s.x, s.y - s.size * 1.6, t('wrongItem')(t('items')[s.want]), '#c92a2a');
      sfx.wrong(); streak = 0;
    }
    updateHud(now);
  };

  // ---------- frame
  const step = (now) => {
    lastFrame = now;
    if (state === 'play') {
      if (now >= nextSpawn) { spawn(now); nextSpawn = now + spawnGap(now); }
      seats.forEach((s) => {
        if (s.want >= 0 && now - s.born > s.life) { s.want = -1; s.wait = now; missed += 1; streak = 0; pop(s.x, s.y - s.size * 1.6, '⌛', '#868e96'); sfx.wait(); }
      });
      if (debug) {
        const target = seats.filter((s) => s.want >= 0 && now - s.born > (debug >= 2 ? s.life * 0.95 : 450)).sort((a, b) => a.born - b.born)[0];
        if (target && !target.botAt) target.botAt = now;
        if (target && now - target.botAt > 120) { target.botAt = 0; selected = target.want; renderTray(); serveSeat(target, now); }
      }
      if (elapsed(now) >= GAME_MS) gameOver();
      updateHud(now);
    }
    draw(now);
    requestAnimationFrame(step);
  };

  // ---------- drawing
  const drawHall = () => {
    // wall and windows
    const wall = ctx.createLinearGradient(0, 0, 0, H * 0.34);
    wall.addColorStop(0, '#fff9db'); wall.addColorStop(1, '#ffe8cc');
    ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H * 0.34);
    // gurdwara silhouette seen through a wide window: white building, golden domes, Nishan Sahib
    const wx = W * 0.08, wy = H * 0.09, ww = W * 0.84, wh = H * 0.21;
    ctx.fillStyle = '#a5d8ff'; ctx.fillRect(wx, wy, ww, wh);
    const cx = W / 2, base = wy + wh, gw = Math.min(ww * 0.5, 230);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - gw / 2, base - wh * 0.45, gw, wh * 0.45);
    ctx.fillStyle = '#fcc419';
    ctx.beginPath(); ctx.ellipse(cx, base - wh * 0.45, gw * 0.16, wh * 0.28, 0, Math.PI, 0); ctx.fill();
    [-1, 1].forEach((k) => { ctx.beginPath(); ctx.ellipse(cx + k * gw * 0.38, base - wh * 0.45, gw * 0.07, wh * 0.14, 0, Math.PI, 0); ctx.fill(); });
    ctx.fillStyle = '#f08c00'; ctx.fillRect(cx - 1.5, base - wh * 0.45 - wh * 0.36, 3, wh * 0.1);
    ctx.fillStyle = '#e7f5ff';
    for (let i = 0; i < 5; i += 1) { const ax = cx - gw * 0.34 + i * gw * 0.17; ctx.beginPath(); ctx.moveTo(ax - 7, base); ctx.lineTo(ax - 7, base - wh * 0.22); ctx.arc(ax, base - wh * 0.22, 7, Math.PI, 0); ctx.lineTo(ax + 7, base); ctx.fill(); }
    // Nishan Sahib: tall pole with a saffron triangular flag
    const nx = wx + ww * 0.12;
    ctx.strokeStyle = '#495057'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(nx, base); ctx.lineTo(nx, wy + wh * 0.08); ctx.stroke();
    ctx.fillStyle = '#ff922b'; ctx.beginPath(); ctx.moveTo(nx, wy + wh * 0.08); ctx.lineTo(nx + 24, wy + wh * 0.18); ctx.lineTo(nx, wy + wh * 0.28); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e8a87c'; ctx.lineWidth = 5; ctx.strokeRect(wx, wy, ww, wh);
    // floor with long darri mats (pangat)
    ctx.fillStyle = '#f1d9b5'; ctx.fillRect(0, H * 0.34, W, H * 0.66);
    const top = H * 0.38, bottom = H - 96, rowH = (bottom - top) / 2;
    for (let r = 0; r < 2; r += 1) {
      const y = top + rowH * (r + 0.72);
      ctx.fillStyle = r % 2 ? '#c92a2a' : '#1864ab';
      ctx.fillRect(0, y - 4, W, rowH * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      for (let x = 0; x < W; x += 16) ctx.fillRect(x, y - 4, 6, rowH * 0.3);
    }
  };
  const drawPerson = (s, now) => {
    const z = s.size, x = s.x, y = s.y;
    const k = s.kid ? 0.8 : 1;
    const flash = now - s.flash < 500;
    // body (seated, cross-legged)
    ctx.fillStyle = s.coat;
    ctx.beginPath(); ctx.ellipse(x, y + z * 0.15 * k, z * 0.55 * k, z * 0.22 * k, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - z * 0.32 * k, y + z * 0.1); ctx.lineTo(x + z * 0.32 * k, y + z * 0.1); ctx.lineTo(x + z * 0.24 * k, y - z * 0.55 * k); ctx.lineTo(x - z * 0.24 * k, y - z * 0.55 * k); ctx.closePath(); ctx.fill();
    // head with covering (everyone covers the head in the langar hall)
    const hy = y - z * 0.78 * k, hr = z * 0.22 * k;
    ctx.fillStyle = '#e0a370'; ctx.beginPath(); ctx.arc(x, hy, hr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = s.cover; ctx.beginPath(); ctx.ellipse(x, hy - hr * 0.35, hr * 1.2, hr * 0.95, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, hy - hr * 0.45, hr * 1.12, hr * 0.3, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#212529'; [-1, 1].forEach((d) => { ctx.beginPath(); ctx.arc(x + d * hr * 0.38, hy + hr * 0.05, hr * 0.09, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = '#7a3e1d'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, hy + hr * 0.25, hr * 0.32, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    // steel thali in front
    ctx.fillStyle = '#dee2e6'; ctx.beginPath(); ctx.ellipse(x, y + z * 0.42, z * 0.4, z * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#adb5bd'; ctx.lineWidth = 2; ctx.stroke();
    if (flash) {
      ctx.font = `${z * 0.28}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🫓', x - z * 0.15, y + z * 0.38); ctx.fillText('🍲', x + z * 0.15, y + z * 0.4);
    }
    // request bubble with a time ring
    if (s.want >= 0) {
      const br = Math.max(18, z * 0.34), bx = x, by = hy - hr * 1.3 - br * 1.45;
      const left = Math.max(0, 1 - (now - s.born) / s.life);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - br * 0.25, by + br * 0.9); ctx.lineTo(bx, by + br * 1.35); ctx.lineTo(bx + br * 0.25, by + br * 0.9); ctx.fill();
      ctx.strokeStyle = left > 0.5 ? '#40c057' : left > 0.25 ? '#fab005' : '#fa5252'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(bx, by, br + 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke();
      ctx.font = `${br * 1.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ITEMS[s.want], bx, by + 1);
    }
  };
  const draw = (now) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawHall();
    seats.forEach((s) => drawPerson(s, now));
    pops = pops.filter((p) => now - p.t0 < 900);
    pops.forEach((p) => {
      const a = 1 - (now - p.t0) / 900;
      ctx.globalAlpha = a; ctx.fillStyle = p.col; ctx.font = `800 15px "Baloo 2", "Noto Sans Devanagari", "Noto Sans Bengali", Inter, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      const y = p.y - (1 - a) * 24;
      ctx.strokeText(p.text, p.x, y); ctx.fillText(p.text, p.x, y);
      ctx.globalAlpha = 1;
    });
  };

  // ---------- start / end
  const start = () => {
    initAudio();
    playerName = cleanName($('name').value);
    store.set('ls-name', playerName);
    score = 0; served = 0; missed = 0; streak = 0; pops = []; last = null;
    seats.forEach((s) => { s.want = -1; s.wait = 0; s.flash = 0; });
    ['startScreen', 'endScreen', 'pauseScreen'].forEach((id) => $(id).classList.add('hidden'));
    $('shareOther').textContent = t('shareOther');
    state = 'play'; T0 = performance.now(); nextSpawn = T0 + 300;
    updateHud();
  };
  const gameOver = () => {
    state = 'over';
    seats.forEach((s) => { s.want = -1; });
    sfx.end();
    const prev = best();
    if (served > prev) store.set('ls-best', String(served));
    last = { served, missed, isNew: served > prev && prev > 0, name: playerName, fact: FACT_KEYS[Math.floor(Math.random() * FACT_KEYS.length)] };
    fillEnd();
    $('endScreen').classList.remove('hidden');
  };
  const fillEnd = () => {
    $('endTitle').textContent = t('endTitle')(last.name);
    $('finalScore').textContent = String(last.served);
    $('endNote').textContent = t('endNote')(last.served, last.missed, best(), last.isNew);
    $('endFact').textContent = `💡 ${t('facts')[last.fact]}`;
    $('bestLine').textContent = best() ? t('best')(best()) : '';
  };
  const pause = () => {
    if (state !== 'play') return;
    state = 'idle';
    seats.forEach((s) => { s.want = -1; });
    $('pauseScreen').classList.remove('hidden');
  };

  // ---------- input
  $('tray').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    initAudio();
    selected = +b.dataset.i; renderTray(); sfx.pick();
  });
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    e.preventDefault();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let bestS = null, bd = 1e9;
    seats.forEach((s) => {
      const hy = s.y - s.size * 0.78, by = hy - s.size * 0.75;
      const d = Math.min(Math.hypot(x - s.x, y - s.y + s.size * 0.3), Math.hypot(x - s.x, y - by));
      if (d < bd) { bd = d; bestS = s; }
    });
    if (bestS && bd < bestS.size * 1.3) serveSeat(bestS, performance.now());
  });
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    const n = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[e.code];
    if (n !== undefined) { selected = n; renderTray(); }
  });

  // ---------- share
  const shareText = () => {
    const u = new URL(SITE);
    if (playerName) u.searchParams.set('from', playerName);
    u.searchParams.set('score', String(served));
    u.searchParams.set('lang', lang);
    return t('shareText')(playerName, served, u.toString());
  };
  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('restart').addEventListener('click', start);
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });
  $('shareWa').addEventListener('click', () => { window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener'); });
  $('shareFb').addEventListener('click', () => { const c = document.querySelector('link[rel=canonical]'); const u = (c && c.href) || (location.origin + location.pathname); window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u), '_blank', 'noopener,width=620,height=560'); });
  $('shareOther').addEventListener('click', () => {
    const text = shareText();
    if (navigator.share) { navigator.share({ title: t('title'), text }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { $('shareOther').textContent = t('copied'); })
      .catch(() => window.prompt(t('copyPrompt'), text));
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);
  resize();
  applyLang();
  requestAnimationFrame(step);
  if (debug && params.has('auto')) start();
  window.__ls = { get state() { return state; }, get served() { return served; }, get missed() { return missed; } };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
