  // ---- sound: no music, only a calm night made in the browser (breeze, crickets, a bird, a chime). Off by default.
  let soundOn = store.get('jm-sound') === '1';

  const setSoundBtn = () => { const b = $('sound'); b.textContent = soundOn ? t('soundOn') : t('soundOff'); b.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); };
  const ctxA = () => {

  };

    [[880, 0.12], [1320, 0.06], [1760, 0.04]].forEach(([f, v]) => {
      const o = a.createOscillator(); const g = a.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(v, time + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, time + 3.5);

    });
  };
  const cricket = (a, time) => {
    for (let i = 0; i < 3; i += 1) {
      const o = a.createOscillator(); const g = a.createGain(); const t0 = time + i * 0.07; o.type = 'sine'; o.frequency.value = 4300 + Math.random() * 300;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.018, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.06);
    }
  };
  const bird = (a, time) => {
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i += 1) {
      const o = a.createOscillator(); const g = a.createGain(); const t0 = time + i * 0.16; const f = 2400 + Math.random() * 900;
      o.type = 'sine'; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * 1.5, t0 + 0.08);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.03, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.11);
      o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.12);
    }

  // ---- scene: night sky, crescent, stars, a masjid with glowing windows, swinging lanterns, rising light
  const canvas = $('sky'); const ctx = canvas.getContext('2d');
  let W = 0, H = 0, stars = [], motes = [], shooting = null, playing = false, startAt = 0, last = 0, moteAcc = 0;
  const resize = () => {

  };
  let moonC = null, moonR = 0;
  const moonImg = (r) => {
    if (moonC && moonR === r) return moonC;
    moonR = r; moonC = document.createElement('canvas'); const k = 4; moonC.width = moonC.height = Math.ceil(r * 2 * k);
    const m = moonC.getContext('2d'); m.scale(k, k);

    m.globalCompositeOperation = 'destination-out'; m.beginPath(); m.arc(r * 1.45, r * 0.8, r * 0.88, 0, Math.PI * 2); m.fill();
    return moonC;
  };
  const dome = (cx, baseY, w, h) => {
    ctx.beginPath(); ctx.moveTo(cx - w / 2, baseY);
    ctx.bezierCurveTo(cx - w / 2, baseY - h * 0.75, cx - w * 0.12, baseY - h * 0.9, cx, baseY - h);

  };
  const finial = (cx, y, s) => { ctx.fillRect(cx - 1, y - s * 1.6, 2, s * 1.6); ctx.beginPath(); ctx.arc(cx, y - s * 2, s * 0.55, 0, Math.PI * 2); ctx.fill(); };

  const masjid = (light) => {
    const base = H; const s = Math.min(W, 640) / 640; const cx = W / 2;
    const bodyW = 360 * s, bodyH = 120 * s, bodyTop = base - bodyH;
    ctx.fillStyle = '#04161c';
    ctx.fillRect(cx - bodyW / 2, bodyTop, bodyW, bodyH);

    ctx.shadowBlur = 0;
  };
  const lantern = (x, len, sw, now, light) => {
    const a = Math.sin(now / 900 + sw) * 0.12; const ex = x + Math.sin(a) * len, ey = Math.cos(a) * len;
    ctx.strokeStyle = 'rgba(255, 215, 106, 0.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(ex, ey); ctx.stroke();
    const g = ctx.createRadialGradient(ex, ey + 18, 2, ex, ey + 18, 46);
    g.addColorStop(0, `rgba(255, 210, 110, ${0.55 * light})`); g.addColorStop(1, 'rgba(255, 210, 110, 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey + 18, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c99a2e'; ctx.beginPath(); ctx.moveTo(ex - 6, ey + 2); ctx.lineTo(ex + 6, ey + 2); ctx.lineTo(ex + 11, ey + 10); ctx.lineTo(ex - 11, ey + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(255, 226, 150, ${0.5 + 0.5 * light})`; ctx.fillRect(ex - 9, ey + 10, 18, 20);

  };
  const frame = (now) => {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    const light = playing ? Math.min(1, (now - startAt) / 2500) : 0.25;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#020c14'); sky.addColorStop(0.55, '#06303a'); sky.addColorStop(1, `rgb(${20 + 40 * light}, ${70 + 30 * light}, ${70})`);

    ctx.globalCompositeOperation = 'lighter';
    motes.forEach((m) => { m.y -= m.vy * dt; m.life -= dt * 0.12; ctx.globalAlpha = Math.max(0, m.life) * 0.8; ctx.fillStyle = '#ffdc8a'; ctx.beginPath(); ctx.arc(m.x + Math.sin(now / 700 + m.p) * 8, m.y, m.r, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  };

  $('gate').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') play(); });
  $('replay').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); play(); });

  const linkFor = () => {
    const u = new URL(BASE);
    const to = clean($('toName').value), from = clean($('fromName').value);
    if (to) u.searchParams.set('to', to);
    if (from) u.searchParams.set('from', from);
    u.searchParams.set('m', $('msg').value || '0');
    u.searchParams.set('lang', lang);
    return { url: u.toString(), to, from };
  };
  const need = () => { if (clean($('toName').value)) return true; $('makeStatus').textContent = t('needName'); $('toName').focus(); return false; };
  $('sendWa').addEventListener('click', () => { if (!need()) return; store.set('jm-from', clean($('fromName').value)); const l = linkFor(); window.open(`https://wa.me/?text=${encodeURIComponent(t('share')(l.to, l.from, l.url))}`, '_blank', 'noopener'); });
  $('copyLink').addEventListener('click', () => { if (!need()) return; const l = linkFor(); (navigator.clipboard ? navigator.clipboard.writeText(l.url) : Promise.reject()).then(() => { $('makeStatus').textContent = t('copied'); }).catch(() => window.prompt(t('copyLink'), l.url)); });
  $('preview').addEventListener('click', () => {
    if (!need()) return;
    wish = { to: clean($('toName').value), from: clean($('fromName').value), m: Number($('msg').value) || 0 };
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); play();
  });

  applyLang();
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
