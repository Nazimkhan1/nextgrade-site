    const start = (S) => { petals = []; jets = []; nextJet = performance.now() + 2600; };
    const draw = (ctx, S, now, dt) => {
      const L = S.light;
      // morning sky
      const sky = ctx.createLinearGradient(0, 0, 0, S.H);
      sky.addColorStop(0, `rgb(${Math.round(30 + 60 * L)}, ${Math.round(80 + 80 * L)}, ${Math.round(140 + 90 * L)})`);
      sky.addColorStop(1, `rgb(${Math.round(170 + 60 * L)}, ${Math.round(200 + 40 * L)}, ${Math.round(230 + 20 * L)})`);
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      const s = Math.max(0.7, Math.min(S.W, 640) / 640), base = S.H - 26, cx = S.W / 2;
      // sun
      ctx.fillStyle = `rgba(255, 236, 170, ${0.5 + 0.4 * L})`; ctx.beginPath(); ctx.arc(S.W * 0.85, S.H * 0.16, 26 * s, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#d9a066';
      ctx.fillRect(gx - gw / 2, base - gh, gw, gh);
      ctx.fillRect(gx - gw * 0.6, base - gh - 10 * s, gw * 1.2, 12 * s);
      ctx.fillRect(gx - gw * 0.32, base - gh - 26 * s, gw * 0.64, 16 * s);
      ctx.beginPath(); ctx.ellipse(gx, base - gh - 26 * s, gw * 0.24, 9 * s, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = sky; ctx.beginPath(); ctx.moveTo(gx - 15 * s, base); ctx.lineTo(gx - 15 * s, base - gh * 0.55); ctx.arc(gx, base - gh * 0.55, 15 * s, Math.PI, 0); ctx.lineTo(gx + 15 * s, base); ctx.closePath(); ctx.fill();
      // lawns and crowd
      ctx.fillStyle = '#69db7c'; ctx.fillRect(0, base, S.W, S.H - base);
      crowd.forEach((c) => { ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(c.x, base + 8 + Math.sin(now / 300 + c.p) * (S.playing ? 2 : 0.5), 3.5, 0, Math.PI * 2); ctx.fill(); });
      // flag pole and the tricolour: folded before opening, unfurls after
      const px = cx - S.W * 0.2, top = base - 190 * s;
      ctx.strokeStyle = '#adb5bd'; ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.moveTo(px, base); ctx.lineTo(px, top - 6 * s); ctx.stroke();
      ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(px, top - 8 * s, 5 * s, 0, Math.PI * 2); ctx.fill();
      const open = S.playing ? Math.min(1, (now - S.startAt) / 900) : 0;
      if (open < 0.05) {
        ctx.fillStyle = '#ff9933'; ctx.fillRect(px + 2 * s, top, 10 * s, 14 * s);
        ctx.fillStyle = '#138808'; ctx.fillRect(px + 2 * s, top + 14 * s, 10 * s, 6 * s);
      } else {
        const fw = 120 * s * open, fh = 80 * s, cols = ['#ff9933', '#ffffff', '#138808'];
        for (let i = 0; i < 3; i += 1) {
          ctx.fillStyle = cols[i]; ctx.beginPath();
          for (let k = 0; k <= 12; k += 1) { const x = px + 2 * s + (fw * k) / 12; const y = top + (fh * i) / 3 + Math.sin(now / 260 - k * 0.6) * 4 * s * (k / 12); if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
          for (let k = 12; k >= 0; k -= 1) { const x = px + 2 * s + (fw * k) / 12; const y = top + (fh * (i + 1)) / 3 + Math.sin(now / 260 - k * 0.6) * 4 * s * (k / 12); ctx.lineTo(x, y); }
          ctx.fill();
        }
        // Ashoka Chakra: navy wheel with 24 spokes
        const k = 6, ccx = px + 2 * s + fw / 2, ccy = top + fh / 2 + Math.sin(now / 260 - k * 0.6) * 4 * s * 0.5, r = fh / 6 * 0.85;
        ctx.strokeStyle = '#000080'; ctx.lineWidth = 1.5 * s; ctx.beginPath(); ctx.arc(ccx, ccy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 0.8 * s; ctx.beginPath();
        for (let i = 0; i < 24; i += 1) { const a = (i / 24) * Math.PI * 2; ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(a) * r, ccy + Math.sin(a) * r); }
        ctx.stroke();
        // petals fall from the flag as it unfurls
        if (S.playing && now - S.startAt < 4000 && Math.random() < dt * 30) petals.push({ x: px + Math.random() * fw, y: top + Math.random() * fh, vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 30, r: Math.random() * 6, c: Math.random() < 0.6 ? '#ff922b' : '#f06595' });
      }
      petals.forEach((p) => { p.vy += 25 * dt; p.x += (p.vx + Math.sin(now / 400 + p.r) * 12) * dt; p.y += p.vy * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r + now / 500); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, 4 * s, 2.2 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
      petals = petals.filter((p) => p.y < base + 10);
      // flypast: three jets with saffron, white and green smoke, every few seconds
      if (S.playing && now > nextJet) { jets.push({ t0: now, y: S.H * (0.12 + Math.random() * 0.1) }); nextJet = now + 7000; }
      jets.forEach((j) => {
        const tt = (now - j.t0) / 1000, x = -60 + tt * S.W * 0.45;
        ['#ff9933', '#ffffff', '#138808'].forEach((c, i) => {
          const y = j.y + i * 12 * s;
          ctx.globalAlpha = 0.8; ctx.strokeStyle = c; ctx.lineWidth = 9 * s; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(Math.max(-20, x - S.W * 1.2), y); ctx.lineTo(x - 16 * s, y); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.font = `${20 * s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillText('✈️', 0, 0); ctx.restore();
        });
      });
      jets = jets.filter((j) => (now - j.t0) / 1000 < 6);
    };
    return { resize, start, draw };
  })(),
};
