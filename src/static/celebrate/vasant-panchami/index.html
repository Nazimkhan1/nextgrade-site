  scene: (() => {
    let petals = [], acc = 0;
    const resize = () => { petals = []; };
    const kite = (ctx, x, y, s, c1, c2, rot) => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.75, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.75, 0); ctx.closePath(); ctx.fill(); ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.75, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill(); ctx.restore(); };
    const draw = (ctx, S, now, dt) => {
      const sky = ctx.createLinearGradient(0, 0, 0, S.H); sky.addColorStop(0, '#d0ebff'); sky.addColorStop(0.6, '#fff9db'); sky.addColorStop(1, '#fff3bf');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      const s = Math.max(0.75, Math.min(S.W, 640) / 640);
      // darker top so the white and gold greeting text stays readable on the light sky
      const sh = ctx.createLinearGradient(0, 0, 0, S.H * 0.7); sh.addColorStop(0, 'rgba(60, 40, 0, 0.62)'); sh.addColorStop(1, 'rgba(60, 40, 0, 0)'); ctx.fillStyle = sh; ctx.fillRect(0, 0, S.W, S.H * 0.7);
      const sr = Math.min(S.W, S.H) * (0.07 + 0.02 * S.light); ctx.fillStyle = 'rgba(255,212,59,0.35)'; ctx.beginPath(); ctx.arc(S.W * 0.82, S.H * 0.18, sr * 1.7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(S.W * 0.82, S.H * 0.18, sr, 0, Math.PI * 2); ctx.fill();
      [[0.18, 0.2, '#e64980', '#f06595', 0], [0.4, 0.12, '#4263eb', '#748ffc', 1], [0.62, 0.26, '#2f9e44', '#69db7c', 2]].forEach(([kx, ky, c1, c2, k]) => { const x = kx * S.W + Math.sin(now / 1300 + k) * 16, y = ky * S.H + Math.cos(now / 1600 + k) * 10; ctx.strokeStyle = 'rgba(80,60,0,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + 16 * s); ctx.quadraticCurveTo(x + 20, S.H * 0.55, S.W * 0.5, S.H * 0.95); ctx.stroke(); kite(ctx, x, y, 18 * s, c1, c2, Math.sin(now / 800 + k) * 0.2); });
      // mustard field rows
      const top = S.H * 0.62;
      ctx.fillStyle = '#8ce99a'; ctx.fillRect(0, top, S.W, S.H - top);
      for (let row = 0; row < 6; row += 1) { const y = top + 10 + row * ((S.H - top) / 6); for (let x = (row % 2) * 9; x < S.W + 10; x += 18) { const sway = Math.sin(now / 900 + x * 0.05 + row) * 2.5; ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + 16); ctx.lineTo(x + sway, y); ctx.stroke(); ctx.fillStyle = row % 2 ? '#fcc419' : '#ffd43b'; ctx.beginPath(); ctx.arc(x + sway, y - 2, (5 + row * 0.7) * s, 0, Math.PI * 2); ctx.fill(); } }
      acc += dt; const rate = S.playing ? 0.08 : 0.4; while (acc > rate) { acc -= rate; petals.push({ x: Math.random() * S.W, y: -10, vy: 30 + Math.random() * 40, ph: Math.random() * 6, c: Math.random() < 0.7 ? '#fab005' : '#ffffff' }); }
      petals.forEach((p) => { p.y += p.vy * dt; p.x += Math.sin(now / 600 + p.ph) * 0.6; ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(p.x, p.y, 4 * s, 2.4 * s, now / 500 + p.ph, 0, Math.PI * 2); ctx.fill(); });
      petals = petals.filter((p) => p.y < S.H);
    };
    return { resize, draw };
  })(),
