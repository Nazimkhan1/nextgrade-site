      aboutNote: "रंग बरसाओ गेम भी खेलो — नीचे लिंक है।",

    },
    en: {

      hello: (to) => `Happy Holi, ${to}`,
      from: (f) => `— with love from ${f} 🎨`,
      defaultTo: "Ji",
      msgs: ["May your life be as colourful and joyful as Holi itself. Happy Holi!", "The scent of gulal, sweet gujiya and the love of family — Happy Holi to you and yours!", "Bura na mano, Holi hai! Forget old quarrels, hug it out and splash the colours.", "This Holi may every colour bring you a new joy — red for love, green for plenty, yellow for health!"],
      listen: "🗣️ Listen",
      makeH: "🎨 Send the colours of Holi to your loved ones",
      makeP: "Type a name, pick a message or write your own, and send the link on WhatsApp. They will see clouds of gulal, pichkari streams and a greeting with their name.",
      toLabel: "Who is it for (name)",
      fromLabel: "Your name",
      toPh: "e.g. Riya, Bhaiya",
      fromPh: "e.g. Aman",
      customPh: "e.g. May every day this year be colourful…",
      share: (to, f, url) => `🎨 Happy Holi ${to}! ${f ? f + ' has' : 'Someone has'} sent you a colourful greeting 🌈 Open 👉 ${url}`,
      aboutH: "About Holi",
      about: ["Holi falls on the full moon of Phalgun, usually in March (check your local panchang for the date). On the night of the full moon, Holika Dahan recalls the story of Prahlad — the victory of good over evil. The next day is the festival of colours.", "Holi also welcomes spring. People forget old quarrels, hug each other, and share gujiya, thandai and dahi vada.", "Some good Holi habits:"],
      list: ["Use dry, herbal gulal and save water", "Never force colour on someone who says no", "Never put colour on animals", "Keep colour away from eyes and mouth"],
      aboutNote: "Play the Rang Barsao game too — link below.",
      links: [["All about Holi", "/festivals/holi/"], ["🎨 Rang Barsao game", "/games/rang-barsao/"], ["More wishes", "/wishes/"]],
    },
    bn: {
      title: "শুভ দোলযাত্রা!",
      gate: (f) => (f ? `${f} তোমার জন্য দোলের রং পাঠিয়েছে!` : 'তোমার জন্য দোলের রং এসেছে!'),
      hello: (to) => `শুভ দোল, ${to}`,
      from: (f) => `— ${f}-এর পক্ষ থেকে 🎨`,
      defaultTo: "জি",
      msgs: ["রঙের মতো তোমার জীবনও আনন্দে রঙিন হোক। দোলযাত্রার অনেক শুভেচ্ছা!", "আবিরের গন্ধ, মিষ্টির স্বাদ আর আপনজনের ভালোবাসা — তোমাকে ও তোমার পরিবারকে শুভ দোল!", "বুরা না মানো, হোলি হ্যায়! পুরোনো রাগ ভুলে কোলাকুলি করো আর রং মাখাও।", "এই দোলে প্রতিটি রং তোমার জন্য নতুন আনন্দ আনুক — লাল ভালোবাসার, সবুজ সমৃদ্ধির, হলুদ সুস্বাস্থ্যের!"],
      listen: "🗣️ শুভেচ্ছা শোনো",
      makeH: "🎨 প্রিয়জনকে দোলের রং পাঠাও",
      makeP: "নাম লেখো, বার্তা বাছো বা নিজের ভাষায় লেখো, আর লিংক WhatsApp-এ পাঠাও। যে খুলবে সে দেখবে আবিরের মেঘ, পিচকারির ধারা আর তার নামে শুভেচ্ছা।",
      toLabel: "কাকে পাঠাবে (নাম)",
      fromLabel: "তোমার নাম",
      toPh: "যেমন: রিয়া, দাদা",
      fromPh: "যেমন: অমন",
      customPh: "যেমন: এ বছর প্রতিটা দিন রঙিন হোক…",
      share: (to, f, url) => `🎨 শুভ দোল ${to}! ${f ? f + ' ' : ''}তোমার জন্য রঙিন শুভেচ্ছা পাঠিয়েছে 🌈 খোলো 👉 ${url}`,
      aboutH: "দোলযাত্রা সম্পর্কে",
      about: ["দোল আসে ফাল্গুনী পূর্ণিমায়, সাধারণত মার্চে (সঠিক তারিখ পঞ্জিকায় দেখে নাও)। আগের রাতে ন্যাড়াপোড়া বা হোলিকা দহন হয় — অশুভের ওপর শুভের জয়। বাংলায় রাধা-কৃষ্ণকে দোলায় চড়িয়ে আবির খেলা হয়।", "শান্তিনিকেতনের বসন্ত উৎসব বিখ্যাত — হলুদ পোশাক, গান আর আবির।", "দোলের কিছু ভালো অভ্যাস:"],

      aboutNote: "রং বরষাও খেলাটাও খেলো — নিচে লিংক আছে।",
      links: [["দোল নিয়ে পুরোটা", "/festivals/holi/"], ["🎨 রং বরষাও খেলা", "/games/rang-barsao/"], ["আরও শুভেচ্ছা", "/wishes/"]],

  scene: (() => {
    const COLS = ['#e64980', '#fab005', '#40c057', '#228be6', '#be4bdb', '#fd7e14', '#15aabf'];
    let puffs = [], drops = [], acc = 0;
    const resize = () => { puffs = []; drops = []; };
    const draw = (ctx, S, now, dt) => {
      const sky = ctx.createLinearGradient(0, 0, 0, S.H); sky.addColorStop(0, '#fff0f6'); sky.addColorStop(1, '#fff9db');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      const s = Math.max(0.7, Math.min(S.W, 640) / 640), base = S.H - 26;
      // houses of a lane
      const n = S.W < 500 ? 4 : 6;
      for (let i = 0; i < n; i += 1) { const w = S.W / n, x = i * w, h = S.H * (0.22 + (i % 3) * 0.05); ctx.fillStyle = ['#ffd8a8', '#d0ebff', '#ffdeeb', '#d3f9d8', '#fff3bf', '#e5dbff'][i % 6]; ctx.fillRect(x, base - h, w + 1, h); ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(x + w * 0.35, base - h * 0.55, w * 0.3, h * 0.55); }
      ctx.fillStyle = '#e9d8c4'; ctx.fillRect(0, base, S.W, S.H - base);
      // darker top so the white and gold greeting text stays readable on the light sky
      const sh = ctx.createLinearGradient(0, 0, 0, S.H * 0.7); sh.addColorStop(0, 'rgba(45, 12, 40, 0.62)'); sh.addColorStop(1, 'rgba(45, 12, 40, 0)'); ctx.fillStyle = sh; ctx.fillRect(0, 0, S.W, S.H * 0.7);
      // gulal clouds rising from below, more after the envelope opens
      acc += dt; const rate = S.playing ? 0.22 : 0.45;
      while (acc > rate) { acc -= rate; if (puffs.length > 26) break; puffs.push({ x: Math.random() * S.W, y: base, r: (14 + Math.random() * 22) * s, vy: -(30 + Math.random() * 40), vx: (Math.random() - 0.5) * 30, c: COLS[Math.floor(Math.random() * COLS.length)], life: 4 + Math.random() * 2 }); }
      puffs.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.r += 6 * dt * s; p.life -= dt; ctx.globalAlpha = Math.max(0, Math.min(0.45, p.life / 4)); ctx.fillStyle = p.c; for (let k = 0; k < 5; k += 1) { const a = k * 1.26 + now / 900; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * p.r * 0.5, p.y + Math.sin(a) * p.r * 0.4, p.r * 0.7, 0, Math.PI * 2); ctx.fill(); } });
      puffs = puffs.filter((p) => p.life > 0);
      // pichkari streams from both sides after opening
      if (S.playing && Math.random() < dt * 3) { const side = Math.random() < 0.5 ? 0 : 1; const c = COLS[Math.floor(Math.random() * COLS.length)]; for (let k = 0; k < 14; k += 1) drops.push({ x: side ? S.W : 0, y: base - S.H * 0.25, vx: (side ? -1 : 1) * (160 + Math.random() * 120) * s, vy: -140 - Math.random() * 80 + k * 4, c, life: 2 }); }
      drops.forEach((d) => { d.vy += 300 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; ctx.globalAlpha = Math.max(0, Math.min(1, d.life)); ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, 3.5 * s, 0, Math.PI * 2); ctx.fill(); });
      drops = drops.filter((d) => d.life > 0 && d.y < base);
      ctx.globalAlpha = 1;
    };
    return { resize, draw };
  })(),
};
</script>
