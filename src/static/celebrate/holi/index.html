  scene: (() => {
    const COLS = ['#f03e3e', '#e64980', '#be4bdb', '#4c6ef5', '#15aabf', '#40c057', '#fab005', '#fd7e14'];
    let dust = [], streams = [], balloons = [], nextBurst = 0, nextStream = 0;
    const resize = () => {};
    const start = (S) => { dust = []; streams = []; balloons = []; nextBurst = performance.now(); nextStream = performance.now() + 1200; };

    const draw = (ctx, S, now, dt) => {
      const L = S.light;
      const sky = ctx.createLinearGradient(0, 0, 0, S.H);
      sky.addColorStop(0, `rgb(${Math.round(50 + 40 * L)}, ${Math.round(20 + 25 * L)}, ${Math.round(100 + 40 * L)})`);
      sky.addColorStop(1, `rgb(${Math.round(150 + 50 * L)}, ${Math.round(30 + 35 * L)}, ${Math.round(100 + 40 * L)})`);
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      const s = Math.max(0.7, Math.min(S.W, 640) / 640), base = S.H - 26, cx = S.W / 2;
      ctx.fillStyle = `rgba(255, 224, 102, ${0.5 + 0.4 * L})`; ctx.beginPath(); ctx.arc(S.W * 0.86, S.H * 0.15, 24 * s, 0, Math.PI * 2); ctx.fill();
      // a coloured ground that gets splashed
      ctx.fillStyle = '#4a0d33'; ctx.fillRect(0, base, S.W, S.H - base);
      // thali with heaps of gulal
      const ty = base - 2 * s;
      ctx.fillStyle = '#ced4da'; ctx.beginPath(); ctx.ellipse(cx, ty, 92 * s, 16 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#adb5bd'; ctx.beginPath(); ctx.ellipse(cx, ty, 92 * s, 16 * s, 0, 0, Math.PI); ctx.fill();
      ['#f03e3e', '#fab005', '#40c057', '#4c6ef5', '#e64980'].forEach((c, i) => { const x = cx + (i - 2) * 32 * s; ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, ty - 4 * s, 15 * s, 13 * s, 0, Math.PI, 0); ctx.fill(); });
      // balloons rising
      if (S.playing && Math.random() < dt * 1.4) balloons.push({ x: Math.random() * S.W, y: S.H + 20, v: 40 + Math.random() * 30, c: COLS[Math.floor(Math.random() * COLS.length)], p: Math.random() * 6 });
      balloons.forEach((b) => {
        b.y -= b.v * dt; const x = b.x + Math.sin(now / 700 + b.p) * 10 * s;
        ctx.strokeStyle = 'rgba(80,80,80,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, b.y + 14 * s); ctx.lineTo(x + 3, b.y + 34 * s); ctx.stroke();
        ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(x, b.y, 10 * s, 13 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(x - 3 * s, b.y - 4 * s, 2.5 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
      });
      balloons = balloons.filter((b) => { if (b.y < S.H * 0.18 && Math.random() < dt * 1.2) { burst(S, b.x, b.y, b.c, 24); return false; } return b.y > -40; });
      // gulal bursts
      if (S.playing && now > nextBurst) {
        const first = now - S.startAt < 600;
        const x = first ? cx : S.W * (0.15 + Math.random() * 0.7), y = first ? base - 20 * s : S.H * (0.2 + Math.random() * 0.45);
        burst(S, x, y, COLS[Math.floor(Math.random() * COLS.length)], first ? 120 : 70);
        if (first) ['#f03e3e', '#fab005', '#40c057', '#4c6ef5'].forEach((c) => burst(S, cx + (Math.random() - 0.5) * 120 * s, base - 30 * s, c, 40));
        nextBurst = now + 700 + Math.random() * 700;
      }
      // pichkari streams arcing in from both sides
      if (S.playing && now > nextStream) { const left = Math.random() < 0.5; streams.push({ t0: now, left, c: COLS[Math.floor(Math.random() * COLS.length)] }); nextStream = now + 1800 + Math.random() * 1200; }
      streams.forEach((st) => {
        const tt = (now - st.t0) / 1000, x0 = st.left ? 0 : S.W, dir = st.left ? 1 : -1, len = Math.min(1, tt * 1.4);
        ctx.strokeStyle = st.c; ctx.lineCap = 'round'; ctx.globalAlpha = Math.max(0, 1 - Math.max(0, tt - 1.2)); ctx.lineWidth = 9 * s;
        ctx.beginPath();
        for (let k = 0; k <= 30 * len; k += 1) { const u = k / 30; const x = x0 + dir * u * S.W * 0.62, y = base - 40 * s - Math.sin(u * Math.PI) * S.H * 0.35 + u * 30 * s; if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
        ctx.stroke(); ctx.globalAlpha = 1;
        if (len >= 1 && !st.splashed) { st.splashed = true; burst(S, x0 + dir * S.W * 0.62, base - 10 * s, st.c, 40); }
      });
      streams = streams.filter((st) => (now - st.t0) / 1000 < 2.3);
      // dust particles: soft growing puffs that fade
      dust.forEach((p) => { p.vx *= 1 - 1.6 * dt; p.vy = p.vy * (1 - 1.6 * dt) + 18 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += 14 * dt; p.life -= dt * 0.45; ctx.globalAlpha = Math.max(0, p.life) * 0.7; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * s, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      dust = dust.filter((p) => p.life > 0);
      if (dust.length > 900) dust.splice(0, dust.length - 900);
    };
    return { resize, start, draw };
  })(),
};
