    bn: {
      title: "ঈদ মোবারক!",
      gate: (f) => (f ? `${f} তোমার জন্য ঈদের শুভেচ্ছা পাঠিয়েছে!` : 'তোমার জন্য ঈদের শুভেচ্ছা এসেছে!'),

      makeH: "🌙 প্রিয়জনকে ঈদের শুভেচ্ছা পাঠাও",
      makeP: "নাম লেখো, বার্তা বাছো বা নিজের ভাষায় লেখো, আর লিংক WhatsApp-এ পাঠাও। যে খুলবে সে দেখবে নতুন চাঁদ, তারা, আলোকিত মসজিদ আর তার নামে শুভেচ্ছা।",

  scene: (() => {
    let stars = [], sparkles = [];
    const resize = (S) => { stars = Array.from({ length: Math.round(S.W * S.H / 2600) }, () => ({ x: Math.random() * S.W, y: Math.random() * S.H * 0.6, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6 })); };
    const lantern = (ctx, x, top, len, s, col, now, k) => {
      const sw = Math.sin(now / 900 + k) * 0.12; ctx.save(); ctx.translate(x, top); ctx.rotate(sw);
      ctx.strokeStyle = 'rgba(255,215,120,0.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
      ctx.translate(0, len); const g = ctx.createRadialGradient(0, 18 * s, 2, 0, 18 * s, 34 * s); g.addColorStop(0, 'rgba(255,220,120,0.5)'); g.addColorStop(1, 'rgba(255,220,120,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 18 * s, 34 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#facc15'; ctx.fillRect(-7 * s, 0, 14 * s, 4 * s);
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-6 * s, 4 * s); ctx.quadraticCurveTo(-14 * s, 18 * s, -6 * s, 32 * s); ctx.lineTo(6 * s, 32 * s); ctx.quadraticCurveTo(14 * s, 18 * s, 6 * s, 4 * s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,245,200,0.9)'; ctx.beginPath(); ctx.ellipse(0, 18 * s, 3 * s, 7 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    };
    const draw = (ctx, S, now, dt) => {
      const sky = ctx.createLinearGradient(0, 0, 0, S.H); sky.addColorStop(0, '#04121a'); sky.addColorStop(0.7, '#0b3b3a'); sky.addColorStop(1, '#0f5132');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      stars.forEach((st) => { ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(now / 1200 + st.p)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      const s = Math.max(0.75, Math.min(S.W, 640) / 640), base = S.H - 24, cx = S.W / 2;
      // crescent and a star
      const mx = S.W * 0.8, my = S.H * 0.16, mr = Math.min(S.W, S.H) * 0.07;
      ctx.fillStyle = 'rgba(253,230,138,0.25)'; ctx.beginPath(); ctx.arc(mx, my, mr * 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#04121a'; ctx.beginPath(); ctx.arc(mx + mr * 0.42, my - mr * 0.15, mr * 0.86, 0, Math.PI * 2); ctx.fill();
      // masjid: dome, two minarets, arches, glowing after opening
      const glow = 0.4 + 0.6 * S.light, w = Math.min(S.W * 0.62, 420 * s), h = w * 0.32;
      ctx.fillStyle = '#0a2622'; ctx.fillRect(cx - w / 2, base - h, w, h);
      ctx.beginPath(); ctx.ellipse(cx, base - h, w * 0.2, w * 0.22, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - 2 * s, base - h - w * 0.3, 4 * s, w * 0.09);
      [-1, 1].forEach((d) => { const x = cx + d * w * 0.56; ctx.fillRect(x - 9 * s, base - h * 2.3, 18 * s, h * 2.3); ctx.beginPath(); ctx.ellipse(x, base - h * 2.3, 11 * s, 14 * s, 0, Math.PI, 0); ctx.fill(); });
      for (let i = 0; i < 5; i += 1) { const ax = cx - w * 0.36 + i * w * 0.18; ctx.fillStyle = `rgba(255, 214, 102, ${0.35 + 0.5 * glow})`; ctx.beginPath(); ctx.moveTo(ax - 12 * s, base); ctx.lineTo(ax - 12 * s, base - h * 0.45); ctx.arc(ax, base - h * 0.45, 12 * s, Math.PI, 0); ctx.lineTo(ax + 12 * s, base); ctx.fill(); }
      ctx.fillStyle = '#062019'; ctx.fillRect(0, base, S.W, S.H - base);
      lantern(ctx, S.W * 0.1, 0, S.H * 0.12, s, '#f59f00', now, 0); lantern(ctx, S.W * 0.22, 0, S.H * 0.2, s, '#12b886', now, 1); lantern(ctx, S.W * 0.62, 0, S.H * 0.08, s, '#e64980', now, 2);
      if (S.playing && Math.random() < dt * 6) sparkles.push({ x: Math.random() * S.W, y: S.H * 0.7, vy: -30 - Math.random() * 40, life: 2.5 });
      sparkles.forEach((p) => { p.y += p.vy * dt; p.life -= dt; ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill(); });
      sparkles = sparkles.filter((p) => p.life > 0); ctx.globalAlpha = 1;
    };
    return { resize, draw };
  })(),
};
</script>
