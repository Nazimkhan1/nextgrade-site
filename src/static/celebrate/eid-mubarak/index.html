  scene: (() => {
    let stars = [], sparks = [], lamps = [];
    const resize = (S) => {

    const start = () => { sparks = []; };

      sky.addColorStop(1, `rgb(${Math.round(12 + 40 * L)}, ${Math.round(70 + 50 * L)}, ${Math.round(72 + 40 * L)})`);

      ctx.globalAlpha = 1;
      const s = Math.max(0.7, Math.min(S.W, 640) / 640), base = S.H - 26, cx = S.W / 2;
      // the Eid crescent and star; a ring of light when the moon is "sighted"
      const mx = S.W * 0.84, my = S.H * 0.1, mr = 22 * s;
      if (S.playing) { const tt = ((now - S.startAt) % 2600) / 2600; ctx.strokeStyle = `rgba(255, 236, 153, ${0.5 * (1 - tt)})`; ctx.lineWidth = 3 * s; ctx.beginPath(); ctx.arc(mx, my, mr + tt * 60 * s, 0, Math.PI * 2); ctx.stroke(); }
      ctx.shadowColor = 'rgba(255, 236, 153, 0.9)'; ctx.shadowBlur = 24 * s;
      ctx.fillStyle = '#ffec99'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = sky; ctx.beginPath(); ctx.arc(mx + mr * 0.42, my - mr * 0.15, mr * 0.86, 0, Math.PI * 2); ctx.fill();
      const star = (x, y, r) => { ctx.beginPath(); for (let i = 0; i < 10; i += 1) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); };
      ctx.fillStyle = '#ffec99'; star(mx + mr * 0.55, my + mr * 0.05, 9 * s);
      // masjid silhouette: central dome, two minarets, side domes; windows glow as the light comes up
      const mw = Math.min(S.W * 0.86, 520 * s), x0 = cx - mw / 2, body = 80 * s;
      ctx.fillStyle = '#04201d';
      ctx.fillRect(x0, base - body, mw, body);
      const dome = (x, w, h, y) => { ctx.beginPath(); ctx.moveTo(x - w, y); ctx.bezierCurveTo(x - w, y - h * 0.9, x - w * 0.2, y - h, x, y - h * 1.15); ctx.bezierCurveTo(x + w * 0.2, y - h, x + w, y - h * 0.9, x + w, y); ctx.closePath(); ctx.fill(); ctx.fillRect(x - 1.2 * s, y - h * 1.15 - 12 * s, 2.4 * s, 12 * s); };
      dome(cx, 70 * s, 78 * s, base - body);
      dome(x0 + mw * 0.22, 34 * s, 40 * s, base - body);
      dome(x0 + mw * 0.78, 34 * s, 40 * s, base - body);
      [x0 + 12 * s, x0 + mw - 12 * s].forEach((x) => { ctx.fillRect(x - 9 * s, base - 190 * s, 18 * s, 190 * s); ctx.fillRect(x - 13 * s, base - 150 * s, 26 * s, 6 * s); ctx.fillRect(x - 13 * s, base - 100 * s, 26 * s, 6 * s); dome(x, 10 * s, 18 * s, base - 190 * s); });
      ctx.fillStyle = `rgba(255, 212, 59, ${0.35 + 0.6 * L})`;
      for (let i = 0; i < 7; i += 1) { const wx = x0 + mw * (0.16 + i * 0.113); ctx.beginPath(); ctx.moveTo(wx - 7 * s, base - 14 * s); ctx.lineTo(wx - 7 * s, base - 42 * s); ctx.arc(wx, base - 42 * s, 7 * s, Math.PI, 0); ctx.lineTo(wx + 7 * s, base - 14 * s); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = '#03302b'; ctx.fillRect(0, base, S.W, S.H - base);
      // hanging lanterns (fanoos) swinging from the top
      lamps.forEach((l) => {
        const sw = Math.sin(now / 900 + l.p) * (S.playing ? 0.12 : 0.04), len = l.len * s;
        ctx.save(); ctx.translate(l.x, 0); ctx.rotate(sw);
        ctx.strokeStyle = 'rgba(255, 236, 153, 0.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
        const g = ctx.createRadialGradient(0, len + 14 * s, 2, 0, len + 14 * s, 30 * s); g.addColorStop(0, `${l.c}aa`); g.addColorStop(1, `${l.c}00`);
        ctx.fillStyle = g; ctx.fillRect(-30 * s, len - 16 * s, 60 * s, 60 * s);
        ctx.fillStyle = l.c; ctx.beginPath(); ctx.moveTo(0, len); ctx.lineTo(9 * s, len + 8 * s); ctx.lineTo(9 * s, len + 20 * s); ctx.lineTo(0, len + 28 * s); ctx.lineTo(-9 * s, len + 20 * s); ctx.lineTo(-9 * s, len + 8 * s); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(-3 * s, len + 10 * s, 6 * s, 8 * s);
        ctx.restore();
      });
      // golden sparkles falling once the wish is opened
      if (S.playing && Math.random() < dt * (now - S.startAt < 4000 ? 40 : 8)) sparks.push({ x: Math.random() * S.W, y: -6, vy: 30 + Math.random() * 40, r: 1 + Math.random() * 2.2, p: Math.random() * 6 });
      ctx.fillStyle = '#ffe066';
      sparks.forEach((p) => { p.y += p.vy * dt; ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(now / 200 + p.p)); star(p.x, p.y, p.r * 2.2 * s); });
      ctx.globalAlpha = 1;
      sparks = sparks.filter((p) => p.y < base);
    };
    return { resize, start, draw };
  })(),
};
