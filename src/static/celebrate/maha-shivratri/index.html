  scene: (() => {
    let stars = [], leaves = [], acc = 0;
    const resize = (S) => { stars = Array.from({ length: Math.round(S.W * S.H / 2400) }, () => ({ x: Math.random() * S.W, y: Math.random() * S.H * 0.6, r: Math.random() * 1.2 + 0.3, p: Math.random() * 6 })); leaves = []; };
    const bel = (ctx, x, y, s, rot) => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = '#51cf66'; [-0.9, 0, 0.9].forEach((a) => { ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(0, -6 * s, 3.2 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }); ctx.restore(); };
    const draw = (ctx, S, now, dt) => {
      const sky = ctx.createLinearGradient(0, 0, 0, S.H); sky.addColorStop(0, '#05061a'); sky.addColorStop(0.7, '#1b1f4a'); sky.addColorStop(1, '#2b2f6b');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, S.W, S.H);
      stars.forEach((st) => { ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(now / 1400 + st.p)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      const s = Math.max(0.75, Math.min(S.W, 640) / 640), base = S.H - 26;
      const mx = S.W * 0.5, my = S.H * 0.15, mr = Math.min(S.W, S.H) * 0.06;
      ctx.fillStyle = 'rgba(219,228,255,0.25)'; ctx.beginPath(); ctx.arc(mx, my, mr * 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#edf2ff'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#05061a'; ctx.beginPath(); ctx.arc(mx + mr * 0.45, my - mr * 0.2, mr * 0.88, 0, Math.PI * 2); ctx.fill();
      // snowy peaks
      const peaks = [[0, 0.62], [0.18, 0.4], [0.34, 0.55], [0.5, 0.3], [0.66, 0.52], [0.82, 0.38], [1, 0.6]];
      ctx.fillStyle = '#3b4170'; ctx.beginPath(); ctx.moveTo(0, base); peaks.forEach(([px, py]) => ctx.lineTo(px * S.W, py * S.H)); ctx.lineTo(S.W, base); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e7ecff'; for (let i = 1; i < peaks.length - 1; i += 1) { const [px, py] = peaks[i]; const [lx, ly] = peaks[i - 1]; const [rx, ry] = peaks[i + 1]; const k = 0.22; ctx.beginPath(); ctx.moveTo(px * S.W, py * S.H); ctx.lineTo((px + (lx - px) * k) * S.W, (py + (ly - py) * k) * S.H); ctx.lineTo((px + (rx - px) * k) * S.W, (py + (ry - py) * k) * S.H); ctx.closePath(); ctx.fill(); }
      // river shimmer and a row of diyas
      ctx.fillStyle = '#1c2a5e'; ctx.fillRect(0, base - 18 * s, S.W, 18 * s);
      for (let x = 0; x < S.W; x += 26) { ctx.fillStyle = `rgba(219,228,255,${0.15 + 0.15 * Math.sin(now / 400 + x)})`; ctx.fillRect(x, base - 10 * s, 12, 2); }
      ctx.fillStyle = '#141838'; ctx.fillRect(0, base, S.W, S.H - base);
      const n = S.W < 500 ? 6 : 9;
      for (let i = 0; i < n; i += 1) { const x = S.W * (i + 0.5) / n, y = base + 2; const g = ctx.createRadialGradient(x, y - 12 * s, 1, x, y - 12 * s, (22 + 10 * S.light) * s); g.addColorStop(0, 'rgba(255,200,80,0.6)'); g.addColorStop(1, 'rgba(255,200,80,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 12 * s, (22 + 10 * S.light) * s, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#c2410c'; ctx.beginPath(); ctx.ellipse(x, y, 9 * s, 4 * s, 0, 0, Math.PI); ctx.fill(); ctx.fillStyle = '#fde047'; const fh = (9 + Math.sin(now / 120 + i) * 1.5) * s; ctx.beginPath(); ctx.moveTo(x, y - fh); ctx.quadraticCurveTo(x + 3 * s, y - 4 * s, x, y - 1 * s); ctx.quadraticCurveTo(x - 3 * s, y - 4 * s, x, y - fh); ctx.fill(); }
      acc += dt; const rate = S.playing ? 0.12 : 0.6; while (acc > rate) { acc -= rate; leaves.push({ x: Math.random() * S.W, y: -10, vy: 25 + Math.random() * 30, ph: Math.random() * 6 }); }
      leaves.forEach((l) => { l.y += l.vy * dt; l.x += Math.sin(now / 700 + l.ph) * 0.5; bel(ctx, l.x, l.y, s, now / 900 + l.ph); });
      leaves = leaves.filter((l) => l.y < base);
    };
    return { resize, draw };
  })(),
};
