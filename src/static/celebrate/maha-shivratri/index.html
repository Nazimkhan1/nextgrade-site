      ctx.globalAlpha = 1;
      const s = Math.max(0.7, Math.min(S.W, 640) / 640), base = S.H - 26, cx = S.W / 2;

      const mx = S.W * 0.86, my = S.H * 0.09, mr = 20 * s;
      ctx.shadowColor = 'rgba(255, 243, 191, 0.8)'; ctx.shadowBlur = 20 * s;
      ctx.fillStyle = '#fff3bf'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#adb5bd'; ctx.beginPath(); ctx.ellipse(cx, ly - 8 * s, 58 * s, 14 * s, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#495057'; ctx.beginPath(); ctx.moveTo(cx - lw, ly - 10 * s); ctx.lineTo(cx - lw, ly - lh); ctx.arc(cx, ly - lh, lw, Math.PI, 0); ctx.lineTo(cx + lw, ly - 10 * s); ctx.closePath(); ctx.fill();

      ctx.save(); ctx.translate(kx, ky); ctx.rotate(0.5);

      ctx.fillRect(-8 * s, -20 * s, 16 * s, 8 * s); ctx.fillStyle = '#ffa94d'; ctx.fillRect(-11 * s, -23 * s, 22 * s, 4 * s);
      ctx.restore();
      if (S.playing && now > nextDrop) { drops.push({ x: kx + 10 * s + (Math.random() - 0.5) * 3 * s, y: ky + 8 * s, vy: 30 }); nextDrop = now + 110; }
      ctx.fillStyle = '#a5d8ff';
      drops.forEach((d) => { d.vy += 420 * dt; d.y += d.vy * dt; ctx.beginPath(); ctx.ellipse(d.x, d.y, 2 * s, 3.4 * s, 0, 0, Math.PI * 2); ctx.fill(); });
      drops = drops.filter((d) => d.y < ly - lh - lw * 0.6);

      if (S.playing && now - S.startAt < 6000 && Math.random() < dt * 6) leaves.push({ x: Math.random() * S.W, y: -10, vy: 30 + Math.random() * 25, a: Math.random() * 6, va: (Math.random() - 0.5) * 2 });
      leaves.forEach((l) => { l.y += l.vy * dt; l.x += Math.sin(now / 600 + l.a) * 18 * dt; l.a += l.va * dt; leaf(ctx, l.x, l.y, l.a, s); });

    };
    return { resize, start, draw };
