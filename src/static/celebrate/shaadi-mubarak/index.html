      aboutP2: 'এই উইশ তোমার ফোনের ব্রাউজারেই চলে। আতশবাজি আর সুরও ব্রাউজার নিজেই বাজায় — কোনো সিনেমার গান নয়, কিছু ডাউনলোডও নয়।',
      moreWishes: 'আরও শুভেচ্ছা', cardLink: 'উইশ কার্ড বানাও',
    },
  };

  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
  };
  const params = new URLSearchParams(location.search);
  const LANGS = ['hinglish', 'hi', 'en', 'bn'];
  const deviceLang = () => {
    const l = (navigator.language || '').toLowerCase();
    if (l.startsWith('bn')) return 'bn';
    if (l.startsWith('hi')) return 'hi';
    return l.endsWith('-in') ? 'hinglish' : 'en';
  };
  const urlLang = params.get('lang');
  let lang = LANGS.includes(urlLang) ? urlLang : LANGS.includes(store.get('sm-lang')) ? store.get('sm-lang') : deviceLang();
  const t = (k) => T[lang][k];
  const clean = (s) => String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 30);

  // What is shown: from the link, or a demo for someone who just opened the page.
  let wish = { to: clean(params.get('to')), partner: clean(params.get('with')), from: clean(params.get('from')), m: Math.max(0, Math.min(2, parseInt(params.get('m'), 10) || 0)) };

  const render = () => {
    $('title').textContent = t('title');
    $('names').textContent = wish.partner ? `${wish.to || t('defaultTo')} & ${wish.partner}` : wish.to || t('defaultTo');
    $('text').textContent = t('msgs')[wish.m];
    $('from').textContent = wish.from ? t('from')(wish.from) : '';
  };

  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    $('lang').value = lang;
    $('gateTitle').textContent = t('gate')(wish.from);
    $('gateTap').textContent = t('tap');
    ['replay', 'makeOwn', 'makeH', 'makeP', 'toLabel', 'partnerLabel', 'fromLabel', 'msgLabel', 'sendWa', 'preview', 'copyLink', 'aboutH', 'aboutP1', 'aboutP2', 'moreWishes', 'cardLink'].forEach((id) => { $(id).textContent = t(id); });
    $('toName').placeholder = t('toPh'); $('partnerName').placeholder = t('partnerPh'); $('fromName').placeholder = t('fromPh');
    const sel = $('msg'); const keep = sel.value;
    sel.innerHTML = '';
    t('msgs').forEach((m, i) => sel.add(new Option(m.length > 60 ? `${m.slice(0, 60)}…` : m, String(i))));
    sel.value = keep || '0';
    const p = PREFIX[lang];
    $('home').href = `https://nextgrade.in${p}/`; $('moreWishes').href = `https://nextgrade.in${p}/wishes/`; $('cardLink').href = `https://nextgrade.in${p}/wish-card/`;
    render(); setMute();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('sm-lang', lang); applyLang(); });
  $('year').textContent = new Date().getFullYear();
  $('fromName').value = store.get('sm-from') || '';

  // ---- sound: an original dhol beat + a shehnai-like tune made in the browser (no recordings)
  let muted = store.get('sm-muted') !== '0';
  let audio = null, master = null, musicTimer = null;
  const setMute = () => { $('mute').textContent = muted ? t('soundOff') : t('soundOn'); $('mute').setAttribute('aria-pressed', muted ? 'false' : 'true'); if (master) master.gain.value = muted ? 0 : 0.9; };
  setMute();
  $('mute').addEventListener('click', () => { muted = !muted; store.set('sm-muted', muted ? '1' : '0'); setMute(); });
  const ctxA = () => {
    try {
      if (!audio) { audio = new (window.AudioContext || window.webkitAudioContext)(); master = audio.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(audio.destination); }
      if (audio.state === 'suspended') audio.resume();
      return audio;
    } catch (e) { return null; }
  };
  const noise = (a, dur) => {
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i += 1) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf; return src;
  };
  const dhol = (a, time, low) => {
    const o = a.createOscillator(); const g = a.createGain();
    o.frequency.setValueAtTime(low ? 95 : 190, time); o.frequency.exponentialRampToValueAtTime(low ? 45 : 120, time + 0.18);
    g.gain.setValueAtTime(low ? 0.9 : 0.45, time); g.gain.exponentialRampToValueAtTime(0.001, time + (low ? 0.35 : 0.15));
    o.connect(g).connect(master); o.start(time); o.stop(time + 0.4);
    const n = noise(a, 0.08); const f = a.createBiquadFilter(); const ng = a.createGain();
    f.type = 'bandpass'; f.frequency.value = low ? 900 : 2600; ng.gain.setValueAtTime(0.25, time); ng.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
    n.connect(f).connect(ng).connect(master); n.start(time);
  };
  const reed = (a, time, freq, dur) => {
    const o = a.createOscillator(); const o2 = a.createOscillator(); const f = a.createBiquadFilter(); const g = a.createGain(); const vib = a.createOscillator(); const vg = a.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = freq; o2.frequency.value = freq * 1.003;
    vib.frequency.value = 5.5; vg.gain.value = freq * 0.012; vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
    f.type = 'lowpass'; f.frequency.value = 1800; f.Q.value = 3;
    g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(0.11, time + 0.04); g.gain.setValueAtTime(0.11, time + dur - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(f); o2.connect(f); f.connect(g).connect(master);
    [o, o2, vib].forEach((x) => { x.start(time); x.stop(time + dur + 0.05); });
  };
  // Original tune (our own notes): a bright 8-bar phrase in a raga-like scale.
  const NOTE = (n) => 293.66 * 2 ** (n / 12); // n semitones above D4
  const TUNE = [[7, 1], [9, 0.5], [11, 0.5], [12, 1], [11, 0.5], [9, 0.5], [7, 1], [4, 1], [5, 0.5], [7, 0.5], [9, 1], [7, 0.5], [5, 0.5], [4, 2], [12, 1], [14, 0.5], [12, 0.5], [11, 1], [9, 1], [7, 0.5], [9, 0.5], [11, 0.5], [9, 0.5], [7, 2], [4, 1], [5, 0.5], [7, 0.5], [9, 1], [11, 1], [12, 3], [-1, 1]];
  const startMusic = () => {
    const a = ctxA(); if (!a) return;
    stopMusic();
    const beat = 0.3;
    let t0 = a.currentTime + 0.1;
    const scheduleBar = () => {
      // one loop of the tune, with dhol under it
      let t1 = t0;
      TUNE.forEach(([n, len]) => { if (n >= 0) reed(a, t1, NOTE(n), len * beat * 1.9); t1 += len * beat * 2; });
      for (let k = 0, x = t0; x < t1; k += 1, x += beat) dhol(a, x, k % 4 === 0 || k % 4 === 3);
      t0 = t1;
      musicTimer = setTimeout(scheduleBar, (t1 - a.currentTime - 1) * 1000);
    };
    scheduleBar();
  };
  const stopMusic = () => { clearTimeout(musicTimer); musicTimer = null; };
  const cracker = (a, time) => {
    const n = noise(a, 0.12); const g = a.createGain(); const f = a.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 600; g.gain.setValueAtTime(0.5, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
    n.connect(f).connect(g).connect(master); n.start(time);
  };
  const boom = (a) => {
    const n = noise(a, 0.6); const g = a.createGain(); const f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 700; g.gain.setValueAtTime(0.6, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.6);
    n.connect(f).connect(g).connect(master); n.start();
  };

  // ---- visuals: fireworks in the sky, crackers on the ground, falling flowers
  const canvas = $('sky'); const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const resize = () => { const DPR = Math.min(window.devicePixelRatio || 1, 2); const r = canvas.getBoundingClientRect(); W = r.width; H = r.height; canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); };
  const COLORS = ['#ffd43b', '#ff6b6b', '#f783ac', '#74c0fc', '#8ce99a', '#ff922b', '#e599f7', '#ffffff'];
  const FLOWERS = ['🌸', '🌼', '🌺', '🏵️'];
  let rockets = [], sparks = [], petals = [], crackles = [], playing = false, last = 0, launchAcc = 0, crackAcc = 0, petalAcc = 0;
  const launch = () => { const tx = W * (0.15 + Math.random() * 0.7); const ty = H * (0.12 + Math.random() * 0.3); rockets.push({ x: tx + (Math.random() - 0.5) * 60, y: H, tx, ty, sp: 520 + Math.random() * 180, color: COLORS[Math.floor(Math.random() * COLORS.length)] }); };
  const burst = (x, y, color) => {
    const n = 70 + Math.floor(Math.random() * 40); const ring = Math.random() < 0.3;
    for (let i = 0; i < n; i += 1) { const a = (Math.PI * 2 * i) / n; const sp = ring ? 170 : 60 + Math.random() * 160; sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.2 + Math.random() * 0.5, color: Math.random() < 0.15 ? '#ffffff' : color }); }
    if (audio && !muted) boom(audio);
  };
  const frame = (now) => {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    ctx.fillStyle = 'rgba(18, 2, 10, 0.28)'; ctx.fillRect(0, 0, W, H);
    // little strings of lights at the top (a wedding pandal)
    for (let i = 0; i < 24; i += 1) { const x = (i + 0.5) * (W / 24); const y = 14 + Math.sin(i * 0.9) * 6; ctx.fillStyle = ['#ffd43b', '#ff6b6b', '#8ce99a', '#74c0fc'][(i + Math.floor(now / 400)) % 4]; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }
    if (playing) {
      launchAcc += dt; crackAcc += dt; petalAcc += dt;
      if (launchAcc > 0.55) { launchAcc = 0; launch(); if (Math.random() < 0.35) launch(); }
      if (crackAcc > 0.12) { crackAcc = 0; const x = Math.random() * W; for (let i = 0; i < 6; i += 1) crackles.push({ x: x + (Math.random() - 0.5) * 30, y: H - 6 - Math.random() * 18, life: 0.25 + Math.random() * 0.2, color: Math.random() < 0.5 ? '#fff3bf' : '#ffa94d' }); if (audio && !muted && Math.random() < 0.6) cracker(audio, audio.currentTime); }
      if (petalAcc > 0.2) { petalAcc = 0; petals.push({ x: Math.random() * W, y: -20, vy: 40 + Math.random() * 50, sway: Math.random() * 6, rot: Math.random() * 6, e: FLOWERS[Math.floor(Math.random() * FLOWERS.length)], size: 16 + Math.random() * 14 }); }
    }
    rockets.forEach((r) => { const dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy); r.x += (dx / d) * r.sp * dt; r.y += (dy / d) * r.sp * dt; ctx.fillStyle = '#ffe8cc'; ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2); ctx.fill(); if (d < 12) { burst(r.x, r.y, r.color); r.done = true; } });
    rockets = rockets.filter((r) => !r.done);
    ctx.globalCompositeOperation = 'lighter';
    sparks.forEach((s) => { s.vy += 70 * dt; s.vx *= 0.985; s.vy *= 0.985; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 0.8; ctx.globalAlpha = Math.max(0, Math.min(1, s.life)); ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, 2.2, 0, Math.PI * 2); ctx.fill(); });
    crackles.forEach((c) => { c.life -= dt; ctx.globalAlpha = Math.max(0, c.life * 3); ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(c.x, c.y, 3 + Math.random() * 3, 0, Math.PI * 2); ctx.fill(); });
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    sparks = sparks.filter((s) => s.life > 0); crackles = crackles.filter((c) => c.life > 0);
    petals.forEach((p) => { p.y += p.vy * dt; p.rot += dt; ctx.save(); ctx.translate(p.x + Math.sin(p.rot * 1.5 + p.sway) * 14, p.y); ctx.rotate(Math.sin(p.rot) * 0.6); ctx.font = `${p.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.fillText(p.e, 0, 0); ctx.restore(); });
    petals = petals.filter((p) => p.y < H + 30);
    requestAnimationFrame(frame);
  };

  const play = () => {
    $('gate').classList.add('hidden');
    $('message').classList.add('hidden'); void $('message').offsetWidth; $('message').classList.remove('hidden');
    playing = true; ctxA(); startMusic();
    for (let i = 0; i < 5; i += 1) setTimeout(launch, i * 160);
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  };
  $('gate').addEventListener('click', play);
  $('gate').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') play(); });
  $('replay').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); play(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopMusic(); playing = false; } });

  // ---- make your own
  const linkFor = () => {
    const u = new URL(BASE);
    const to = clean($('toName').value), partner = clean($('partnerName').value), from = clean($('fromName').value);
    if (to) u.searchParams.set('to', to);
    if (partner) u.searchParams.set('with', partner);
    if (from) u.searchParams.set('from', from);
    u.searchParams.set('m', $('msg').value || '0');
    u.searchParams.set('lang', lang);
    return { url: u.toString(), to: partner ? `${to} & ${partner}` : to, from };
  };
  const need = () => { if (clean($('toName').value)) return true; $('makeStatus').textContent = t('needName'); $('toName').focus(); return false; };
  $('sendWa').addEventListener('click', () => { if (!need()) return; store.set('sm-from', clean($('fromName').value)); const l = linkFor(); window.open(`https://wa.me/?text=${encodeURIComponent(t('share')(l.to, l.from, l.url))}`, '_blank', 'noopener'); });
  $('copyLink').addEventListener('click', () => { if (!need()) return; const l = linkFor(); (navigator.clipboard ? navigator.clipboard.writeText(l.url) : Promise.reject()).then(() => { $('makeStatus').textContent = t('copied'); }).catch(() => window.prompt(t('copyLink'), l.url)); });
  $('preview').addEventListener('click', () => {
    if (!need()) return;
    wish = { to: clean($('toName').value), partner: clean($('partnerName').value), from: clean($('fromName').value), m: Number($('msg').value) || 0 };
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); play();
  });

  applyLang();
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
