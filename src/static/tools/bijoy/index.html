      warn: (list) => `ये निशान पहचाने नहीं गए और वैसे ही छोड़ दिए गए: ${list} — इन जगहों को एक बार देख लो।`,

      howTitle: 'कैसे इस्तेमाल करें', how: ['ऊपर से दिशा चुनो: <b>बिजॉय → यूनिकोड</b> (पुराना टेक्स्ट बदलना) या <b>यूनिकोड → बिजॉय</b>।', 'बाएँ बॉक्स में टेक्स्ट पेस्ट करो — दाएँ बॉक्स में तुरंत बदला हुआ टेक्स्ट आ जाएगा।', '<b>कॉपी</b> दबाओ और जहाँ चाहिए पेस्ट करो। <b>उल्टा करो</b> से नतीजे को वापस दूसरी दिशा में बदलकर मिला सकते हो।', 'Word या PDF से SutonnyMJ वाला टेक्स्ट कॉपी करोगे तो वह "Avgvi" जैसा दिखेगा — वही यहाँ पेस्ट करो।'],
      aboutTitle: 'बिजॉय और यूनिकोड में क्या फ़र्क़ है?', aboutText: 'बिजॉय (SutonnyMJ और दूसरे "MJ" फ़ॉन्ट) एक पुराना ASCII तरीक़ा है: अंग्रेज़ी अक्षर और निशान बांग्ला अक्षरों की शक्ल में दिखाए जाते हैं। फ़ॉन्ट न हो तो बिजॉय टेक्स्ट "Avgvi †mvbvi evsjv" जैसा दिखता है, और Google, Facebook या फ़ोन उसे बांग्ला नहीं मानते। यूनिकोड दुनिया भर का नियम है — हर बांग्ला अक्षर का अपना कोड होता है, इसलिए किसी भी फ़ॉन्ट, किसी भी डिवाइस पर सही दिखता है।',
      aboutText2: 'बांग्लादेश और पश्चिम बंगाल के सरकारी दफ़्तर, प्रेस, कंपोज़ की दुकानें और कई स्कूल अब भी बिजॉय में टाइप करते हैं। वह टेक्स्ट ऑनलाइन डालना हो तो यूनिकोड में बदलना पड़ता है; पुरानी फ़ाइल में जोड़ना या प्रेस भेजना हो तो यूनिकोड से बिजॉय। यह टूल दोनों करता है। बिजॉय → यूनिकोड वाले हिस्से में MIT लाइसेंस वाली ओपन-सोर्स bijoy2unicode लाइब्रेरी इस्तेमाल हुई है; उल्टी दिशा हमारा अपना कोड है।',
      faqTitle: 'सवाल-जवाब', faq: [['क्या बदला हुआ टेक्स्ट 100% सही होगा?', 'आम बांग्ला — कार, फला, रेफ़ (র্), संयुक्त अक्षर, ো/ৌ — सही बदलता है। कोई बहुत कम इस्तेमाल वाला निशान न पहचाना जाए तो टूल उसे छुपाता नहीं, ऊपर अलग से दिखाता है। ज़रूरी काग़ज़ एक बार मिला लो।'], ['क्या मेरा टेक्स्ट कहीं भेजा जाता है?', 'नहीं। पूरा बदलाव आपके ब्राउज़र में होता है — किसी सर्वर पर कुछ नहीं जाता, पेज खुला हो तो इंटरनेट के बिना भी चलता है।'], ['फ़ोन पर बिजॉय टेक्स्ट "Avgvi" जैसा क्यों दिखता है?', 'क्योंकि फ़ोन में SutonnyMJ फ़ॉन्ट नहीं है। यहाँ बिजॉय → यूनिकोड कर लो, फिर किसी भी फ़ोन पर बांग्ला दिखेगा।'], ['यूनिकोड → बिजॉय कब चाहिए?', 'जब प्रेस या दफ़्तर SutonnyMJ फ़ॉन्ट वाली फ़ाइल माँगे, या पुराने बिजॉय डॉक्यूमेंट में नया टेक्स्ट जोड़ना हो। नतीजा Word में पेस्ट करके फ़ॉन्ट SutonnyMJ कर दो।'], ['Avro और बिजॉय एक ही हैं?', 'नहीं। Avro टाइप करने का तरीक़ा है जो सीधे यूनिकोड लिखता है। बिजॉय अपने कीबोर्ड और ASCII फ़ॉन्ट से लिखता है — यह टूल उसी ASCII टेक्स्ट को बदलता है।']],
    },
  };

  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private */ } } };
  const params = new URLSearchParams(location.search);
  const LANGS = ['bn', 'en', 'hinglish', 'hi'];
  const deviceLang = () => { const l = (navigator.language || '').toLowerCase(); if (l.startsWith('bn')) return 'bn'; if (l.startsWith('hi')) return 'hi'; return l.endsWith('-in') ? 'hinglish' : 'bn'; };
  let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : LANGS.includes(store.get('bj-lang')) ? store.get('bj-lang') : deviceLang();
  let dir = params.get('dir') === 'u2k' ? 'u2k' : (store.get('bj-dir') === 'u2k' ? 'u2k' : 'k2u');
  const t = (k) => T[lang][k];

  const convert = () => {
    const v = $('inp').value;
    const out = dir === 'k2u' ? window.BJ.toUnicode(v) : window.BJ.toBijoy(v);
    $('out').value = out;
    const unknown = dir === 'k2u' ? window.BJ.unknownGlyphs(out) : [];
    $('warn').classList.toggle('hidden', !unknown.length);
    if (unknown.length) $('warn').textContent = t('warn')(unknown.join(' '));
  };
  const applyDir = () => {
    document.querySelectorAll('#dirSeg button').forEach((b) => b.classList.toggle('on', b.dataset.d === dir));
    $('inLabel').textContent = dir === 'k2u' ? t('inK') : t('inU');
    $('outLabel').textContent = dir === 'k2u' ? t('outU') : t('outK');
    $('inp').classList.toggle('kd', dir === 'k2u'); $('out').classList.toggle('kd', dir === 'u2k');
    $('fontNote').textContent = dir === 'k2u' ? t('fontK2U') : t('fontU2K');
    convert();
  };
  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { const v = t(el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    $('faqList').innerHTML = t('faq').map(([q, a]) => `<h3>${q}</h3><p>${a}</p>`).join('');
    $('home').href = `https://nextgrade.in${PREFIX[lang]}/`;
    applyDir();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('bj-lang', lang); applyLang(); });
  $('dirSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; dir = b.dataset.d; store.set('bj-dir', dir); applyDir(); });
  $('inp').addEventListener('input', convert);
  $('swap').addEventListener('click', () => { const o = $('out').value; dir = dir === 'k2u' ? 'u2k' : 'k2u'; store.set('bj-dir', dir); $('inp').value = o; applyDir(); });
  $('sample').addEventListener('click', () => { $('inp').value = SAMPLE[dir]; convert(); });
  $('clear').addEventListener('click', () => { $('inp').value = ''; convert(); $('inp').focus(); });
  $('copy').addEventListener('click', () => {
    const text = $('out').value; if (!text) return;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { $('copy').textContent = t('copied'); setTimeout(() => { $('copy').textContent = t('copy'); }, 1500); }).catch(() => { $('out').select(); });
  });
  $('year').textContent = new Date().getFullYear();
  window.__bj = { get out() { return $('out').value; }, get warn() { return $('warn').classList.contains('hidden') ? '' : $('warn').textContent; } };
  applyLang();
  if (params.get('t')) { $('inp').value = params.get('t'); convert(); }
})();
</script>
