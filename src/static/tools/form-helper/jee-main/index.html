// ---------- helpers
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

const LANGS = ['hinglish', 'hi', 'en', 'bn'];

let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : LANGS.includes(store.get('fh-lang')) ? store.get('fh-lang') : deviceLang();
const t = (k) => T[lang][k];

let toastTimer = 0;
const toast = (msg) => { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = msg; el.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 2600); };
const today = () => { const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`; };

// ---------- state
// Exam pages (e.g. ./ssc/) set window.FH_PAGE = { exam, base, T: { lang: { title, sub, info } } } before this script.
const PAGE = window.FH_PAGE || null;
const BASE = PAGE ? PAGE.base || '../' : './';
if (PAGE) for (const l in PAGE.T) { if (T[l]) { if (PAGE.T[l].title) T[l].title = PAGE.T[l].title; if (PAGE.T[l].sub) T[l].sub = PAGE.T[l].sub; } }
let examId = PAGE ? PAGE.exam : store.get('fh-exam') || 'ssc';
if (!EXAMS.some((e) => e.id === examId)) examId = 'ssc';
let kind = 'photo';
let raw = null;      // decoded picture, downscaled, as a canvas
let src = null;      // raw after rotation + processing (brightness or ink clean-up / crop)
let rot = 0, zoom = 1, offX = 0, offY = 0;
let lastOut = null;
const exam = () => EXAMS.find((e) => e.id === examId);
const isInk = () => kind !== 'photo';
const spec = () => ({ w: Number($('ow').value) || 0, h: Number($('oh').value) || 0, min: Math.max(0, Number($('kmin').value) || 0), max: Math.max(1, Number($('kmax').value) || 1) });

// ---------- UI text
const applyLang = () => {
  document.documentElement.lang = lang === 'hinglish' ? 'hi-Latn' : lang;
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  $('langSel').value = lang;

  $('tipList').innerHTML = t('tips').map((s) => `<li>${s}</li>`).join('');

  $('sizeTable').innerHTML = `<tr><th>${t('thExam')}</th><th>${t('thPhoto')}</th><th>${t('thSign')}</th><th>${t('thOther')}</th></tr>` + EXAMS.filter((e) => e.id !== 'custom').map((e) => `<tr><td>${e.page ? `<a href="${BASE}${e.page}/?lang=${lang}">${e.name}</a>` : e.name}</td><td>${e.photo ? cell(e.photo) : t('liveCell')}</td><td>${cell(e.sign)}</td><td>${e.thumb ? `${t('kThumb')}: ${cell(e.thumb)}<br>` : ''}${e.decl ? `${t('kDecl')}: ${cell(e.decl)}` : ''}</td></tr>`).join('');

const refreshKind = () => {

  const p = e[kind];
  $('needLine').textContent = e.id === 'custom' ? '' : t('need')(p[4] && p[4] !== '—' ? p[4] : '', p[0], p[1], p[2], p[3]) + (e.live ? ` · ${t('liveNote')}` : '');

};

const setPreset = () => {

  $('ow').value = p[0]; $('oh').value = p[1]; $('kmin').value = p[2]; $('kmax').value = p[3];
  $('stampOn').checked = kind === 'photo' && !!p[5];

// ---------- loading a picture
const MAX_SIDE = 2000;
const loadFile = async (file) => {
  if (!file) return;
  try {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {
      bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    }
    const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    raw = mk(w * s, h * s); const rx = raw.getContext('2d'); rx.imageSmoothingQuality = 'high'; rx.drawImage(bmp, 0, 0, raw.width, raw.height);
    rot = 0;
    $('pick').classList.add('hidden'); $('editor').classList.remove('hidden');
    rebuild(true);
  } catch (e) { toast(t('failed')); }
};

// ---------- processing
const rotated = () => {
  if (rot % 180 === 0 && rot === 0) return raw;
  const c = rot % 180 === 0 ? mk(raw.width, raw.height) : mk(raw.height, raw.width);
  const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate((rot * Math.PI) / 180); x.drawImage(raw, -raw.width / 2, -raw.height / 2);
  return c;
};

const brighten = (c, b) => {
  if (!b) return c;
  const o = mk(c.width, c.height), x = o.getContext('2d'); x.drawImage(c, 0, 0);
  const d = x.getImageData(0, 0, o.width, o.height), p = d.data, k = b * 2.2;
  for (let i = 0; i < p.length; i += 4) { p[i] = clamp(p[i] + k, 0, 255); p[i + 1] = clamp(p[i + 1] + k, 0, 255); p[i + 2] = clamp(p[i + 2] + k, 0, 255); }
  x.putImageData(d, 0, 0); return o;
};

// Signature / thumb / declaration: make the paper white and the ink dark, then crop to the ink with a margin.
const inkClean = (c) => {
  const w = c.width, h = c.height, x0 = c.getContext('2d'), d = x0.getImageData(0, 0, w, h), p = d.data;
  const n = w * h, lum = new Float32Array(n);
  for (let i = 0; i < n; i += 1) lum[i] = 0.299 * p[i * 4] + 0.587 * p[i * 4 + 1] + 0.114 * p[i * 4 + 2];
  // uneven light: estimate the local paper brightness on a coarse grid (max filter) and divide it out
  const G = 24, gw = Math.ceil(w / G), gh = Math.ceil(h / G), grid = new Float32Array(gw * gh);
  for (let gy = 0; gy < gh; gy += 1) for (let gx = 0; gx < gw; gx += 1) {
    const vals = [];
    for (let y = gy * G; y < Math.min(h, gy * G + G); y += 3) for (let x = gx * G; x < Math.min(w, gx * G + G); x += 3) vals.push(lum[y * w + x]);
    vals.sort((a, b) => a - b); grid[gy * gw + gx] = vals[Math.floor(vals.length * 0.9)] || 255;
  }
  const g2 = new Float32Array(gw * gh); // spread the paper estimate so ink strokes do not pull it down
  for (let gy = 0; gy < gh; gy += 1) for (let gx = 0; gx < gw; gx += 1) {
    let m = 0; for (let yy = Math.max(0, gy - 1); yy <= Math.min(gh - 1, gy + 1); yy += 1) for (let xx = Math.max(0, gx - 1); xx <= Math.min(gw - 1, gx + 1); xx += 1) m = Math.max(m, grid[yy * gw + xx]);
    g2[gy * gw + gx] = Math.max(40, m);
  }
  const paperAt = (x, y) => { // bilinear
    const fx = clamp(x / G - 0.5, 0, gw - 1), fy = clamp(y / G - 0.5, 0, gh - 1), x1 = Math.floor(fx), y1 = Math.floor(fy), x2 = Math.min(gw - 1, x1 + 1), y2 = Math.min(gh - 1, y1 + 1), ax = fx - x1, ay = fy - y1;
    return (g2[y1 * gw + x1] * (1 - ax) + g2[y1 * gw + x2] * ax) * (1 - ay) + (g2[y2 * gw + x1] * (1 - ax) + g2[y2 * gw + x2] * ax) * ay;
  };
  const lvl = Number($('inkLvl').value) / 100; // 0 = light, 1 = very dark
  const white = 0.88 - lvl * 0.18, black = 0.35 + lvl * 0.3; // ratio above `white` -> paper, below `black` -> full ink
  const col = $('inkCol').value, inkRGB = col === 'blue' ? [16, 42, 140] : [12, 12, 16];
  const A = new Float32Array(n); // ink amount 0..1
  for (let y = 0; y < h; y += 1) for (let x = 0; x < w; x += 1) {
    const i = y * w + x, r = lum[i] / paperAt(x, y);
    const a = r >= white ? 0 : r <= black ? 1 : (white - r) / (white - black);
    A[i] = a * a * (3 - 2 * a);
  }
  // drop specks and dirt: ink blobs that are tiny and far away from the main writing
  const f = Math.max(1, Math.ceil(Math.max(w, h) / 500)), cw = Math.ceil(w / f), ch = Math.ceil(h / f), cell = new Uint8Array(cw * ch);
  for (let y = 0; y < h; y += 1) for (let x = 0; x < w; x += 1) if (A[y * w + x] > 0.5) cell[Math.floor(y / f) * cw + Math.floor(x / f)] = 1;
  const lab = new Int32Array(cw * ch).fill(-1), comps = [];
  for (let s0 = 0; s0 < cw * ch; s0 += 1) {
    if (!cell[s0] || lab[s0] >= 0) continue;
    const c = { area: 0, x0: cw, y0: ch, x1: 0, y1: 0, keep: false }, st = [s0]; lab[s0] = comps.length;
    while (st.length) {
      const i = st.pop(), x = i % cw, y = (i - x) / cw; c.area += 1; c.x0 = Math.min(c.x0, x); c.x1 = Math.max(c.x1, x); c.y0 = Math.min(c.y0, y); c.y1 = Math.max(c.y1, y);
      for (let dy = -2; dy <= 2; dy += 1) for (let dx = -2; dx <= 2; dx += 1) { const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= cw || yy >= ch) continue; const j = yy * cw + xx; if (cell[j] && lab[j] < 0) { lab[j] = comps.length; st.push(j); } }
    }
    comps.push(c);
  }
  if (comps.length) {
    const big = Math.max(...comps.map((c) => c.area));
    const box = { x0: cw, y0: ch, x1: 0, y1: 0 };
    comps.forEach((c) => { if (c.area >= big * 0.08) { c.keep = true; box.x0 = Math.min(box.x0, c.x0); box.y0 = Math.min(box.y0, c.y0); box.x1 = Math.max(box.x1, c.x1); box.y1 = Math.max(box.y1, c.y1); } });
    const m = Math.max(box.x1 - box.x0, box.y1 - box.y0) * 0.12 + 2; // small marks (dots of i, full stops) close to the writing stay
    comps.forEach((c) => { if (!c.keep && c.x1 >= box.x0 - m && c.x0 <= box.x1 + m && c.y1 >= box.y0 - m && c.y0 <= box.y1 + m) c.keep = true; });
  }
  const dropped = (x, y) => { // a cell (or its neighbour) that belongs to a dropped speck
    const cx = Math.floor(x / f), cy = Math.floor(y / f);
    for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) { const xx = cx + dx, yy = cy + dy; if (xx < 0 || yy < 0 || xx >= cw || yy >= ch) continue; const l = lab[yy * cw + xx]; if (l >= 0) return !comps[l].keep; }
    return false;
  };
  const out = x0.createImageData(w, h), q = out.data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y += 1) for (let x = 0; x < w; x += 1) {
    const i = y * w + x;
    let a = A[i];
    if (a > 0.02 && dropped(x, y)) a = 0;
    const j = i * 4;
    if (col === 'orig') { const k = 1 - a; q[j] = 255 * k + p[j] * a * 0.7; q[j + 1] = 255 * k + p[j + 1] * a * 0.7; q[j + 2] = 255 * k + p[j + 2] * a * 0.7; } else { q[j] = 255 + (inkRGB[0] - 255) * a; q[j + 1] = 255 + (inkRGB[1] - 255) * a; q[j + 2] = 255 + (inkRGB[2] - 255) * a; }
    q[j + 3] = 255;
    if (a > 0.5) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  const o = mk(w, h); o.getContext('2d').putImageData(out, 0, 0);
  if (maxX < 0) return o;
  // ignore specks: shrink the box to where 99% of the ink is
  const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.06) + 6;
  const bx = clamp(minX - pad, 0, w - 1), by = clamp(minY - pad, 0, h - 1), bw = clamp(maxX - minX + pad * 2, 1, w - bx), bh = clamp(maxY - minY + pad * 2, 1, h - by);
  const crop = mk(bw, bh); crop.getContext('2d').drawImage(o, bx, by, bw, bh, 0, 0, bw, bh);
  return crop;
};

const rebuild = (refit) => {
  if (!raw) return;
  const r = rotated();
  if (isInk()) src = $('cleanOn').checked ? inkClean(r) : r;
  else src = brighten(r, Number($('bright').value));
  if (refit) { zoom = 1; offX = 0; offY = 0; $('zoom').value = '1'; }
  draw();
};

// ---------- drawing: picture placed into the output frame. Photo: cover; ink: contain (whole signature visible).
const stampH = (h) => ($('stampOn').checked && kind === 'photo' ? Math.round(h * 0.16) : 0);
const render = (ctx, w, h) => {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
  if (!src) return;
  const sh = stampH(h), ah = h - sh;
  const base = isInk() ? Math.min(w / src.width, ah / src.height) * 0.94 : Math.max(w / src.width, ah / src.height);
  const s = base * zoom;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, ah); ctx.clip();
  ctx.imageSmoothingQuality = 'high';
  const dx = w / 2 - (src.width * s) / 2 + offX * w, dy = ah / 2 - (src.height * s) / 2 + offY * ah;
  if (isInk() && s < 0.4) {
    // big shrink makes thin pen strokes break up: thicken them by about one output pixel
    const tmp = mk(w, ah), tx = tmp.getContext('2d'); tx.fillStyle = '#fff'; tx.fillRect(0, 0, w, ah); tx.imageSmoothingQuality = 'high';
    tx.drawImage(src, dx, dy, src.width * s, src.height * s);
    tx.globalCompositeOperation = 'darken'; tx.globalAlpha = 0.8; tx.drawImage(tmp, 0.7, 0); tx.drawImage(tmp, 0, 0.7);
    ctx.drawImage(tmp, 0, 0);
  } else ctx.drawImage(src, dx, dy, src.width * s, src.height * s);
  ctx.restore();
  if (sh) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, ah, w, sh);
    ctx.fillStyle = '#000000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const name = ($('stName').value || '').trim().toUpperCase(), date = ($('stDate').value || '').trim();
    const lines = [name, date].filter(Boolean);
    let fs = Math.max(8, Math.floor((sh / Math.max(1, lines.length)) * 0.72));
    ctx.font = `700 ${fs}px Inter, Arial, sans-serif`;
    while (fs > 8 && lines.some((l) => ctx.measureText(l).width > w * 0.94)) { fs -= 1; ctx.font = `700 ${fs}px Inter, Arial, sans-serif`; }
    lines.forEach((l, i) => ctx.fillText(l, w / 2, ah + (sh / lines.length) * (i + 0.5)));
  }
};

const draw = () => {
  const sp = spec(); if (sp.w < 10 || sp.h < 10) return;
  const v = $('view'), k = Math.min(1, 700 / Math.max(sp.w, sp.h)) * (Math.max(sp.w, sp.h) < 300 ? 2 : 1);
  v.width = Math.round(sp.w * k); v.height = Math.round(sp.h * k);
  render(v.getContext('2d'), v.width, v.height);
  $('outBox').classList.add('hidden');
};

// ---------- JPEG within a KB range
const toBlob = (c, q) => new Promise((r) => c.toBlob(r, 'image/jpeg', q));
// Adds a JPEG comment (COM) segment right after the start marker, to reach a minimum file size. The picture is unchanged.
const padJpeg = async (blob, target) => {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let need = target - buf.length; if (need <= 0) return blob;
  const parts = [buf.slice(0, 2)];
  while (need > 0) { const n = Math.min(65533, Math.max(1, need - 4)); const seg = new Uint8Array(n + 4); seg[0] = 0xff; seg[1] = 0xfe; seg[2] = ((n + 2) >> 8) & 0xff; seg[3] = (n + 2) & 0xff; seg.fill(0x20, 4); parts.push(seg); need -= n + 4; }
  parts.push(buf.slice(2));
  return new Blob(parts, { type: 'image/jpeg' });
};
const makeOut = async () => {
  const sp = spec();
  if (sp.w < 50 || sp.h < 50 || sp.w > 3000 || sp.h > 3000) { toast(t('badSize')); return null; }
  const c = mk(sp.w, sp.h); render(c.getContext('2d'), sp.w, sp.h);
  const maxB = sp.max * 1024 - 512, minB = sp.min * 1024 + 512;
  let lo = 0.05, hi = 0.97, best = null, bestQ = 0;
  let b = await toBlob(c, hi);
  if (b.size <= maxB) { best = b; bestQ = hi; } else {
    for (let i = 0; i < 9; i += 1) { const q = (lo + hi) / 2; b = await toBlob(c, q); if (b.size <= maxB) { best = b; bestQ = q; lo = q; } else hi = q; }
    if (!best) { best = await toBlob(c, 0.05); bestQ = 0.05; }
  }
  let padded = false;
  if (best.size < minB && best.size <= maxB) { const p = await padJpeg(best, Math.min(minB, maxB)); padded = p.size !== best.size; best = p; }
  return { b: best, w: sp.w, h: sp.h, q: bestQ, padded, ok: best.size <= sp.max * 1024 && best.size >= sp.min * 1024 };
};
const fileName = () => `${examId}-${kind}-${spec().w}x${spec().h}.jpg`;
const showOut = (r) => {
  const kb = Math.round(r.b.size / 1024), sp = spec();
  if (lastOut) URL.revokeObjectURL(lastOut);
  lastOut = URL.createObjectURL(r.b); $('outImg').src = lastOut;
  $('result').textContent = r.b.size <= sp.max * 1024 ? t('made')(r.w, r.h, kb, sp.min, sp.max) : t('tooBig')(kb, sp.max);
  $('result').classList.toggle('bad', r.b.size > sp.max * 1024);
  $('resultHint').textContent = r.padded ? t('padded') : '';
  $('outBox').classList.remove('hidden');
};
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast(t('saved')); };

// ---------- events
$('langSel').addEventListener('change', (e) => { lang = e.target.value; store.set('fh-lang', lang); applyLang(); });
$('exam').addEventListener('change', (e) => { examId = e.target.value; if (!PAGE) store.set('fh-exam', examId); refreshKind(); setPreset(); rebuild(true); });
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b || b.disabled) return; kind = b.dataset.kind; refreshKind(); setPreset(); rebuild(true); });
$('pickBtn').addEventListener('click', (e) => { e.stopPropagation(); $('file').click(); });
$('camBtn').addEventListener('click', (e) => { e.stopPropagation(); $('cam').click(); });
$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('dragover', (e) => e.preventDefault());
$('drop').addEventListener('drop', (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
$('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
$('cam').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
$('newBtn').addEventListener('click', () => { raw = null; src = null; $('editor').classList.add('hidden'); $('pick').classList.remove('hidden'); });
$('rotBtn').addEventListener('click', () => { rot = (rot + 90) % 360; rebuild(true); });
$('fitBtn').addEventListener('click', () => rebuild(true));
$('zoom').addEventListener('input', (e) => { zoom = Number(e.target.value); draw(); });
let bt = 0; const later = (fn) => { clearTimeout(bt); bt = setTimeout(fn, 120); };
$('bright').addEventListener('input', () => later(() => rebuild(false)));
$('inkLvl').addEventListener('input', () => later(() => rebuild(false)));
$('cleanOn').addEventListener('change', () => rebuild(true));
$('inkCol').addEventListener('change', () => rebuild(false));
$('stampOn').addEventListener('change', () => { $('stampBox').classList.toggle('hidden', !$('stampOn').checked); if (!$('stDate').value) $('stDate').value = today(); draw(); });
['stName', 'stDate', 'ow', 'oh', 'kmin', 'kmax'].forEach((id) => $(id).addEventListener('input', () => later(draw)));
$('dlBtn').addEventListener('click', async () => { const r = await makeOut(); if (!r) return; showOut(r); download(r.b, fileName()); });
$('shareBtn').addEventListener('click', async () => {
  const r = await makeOut(); if (!r) return; showOut(r);
  const file = new File([r.b], fileName(), { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {}); else download(r.b, file.name);
});

// drag + pinch on the preview
const pts = new Map(); let pinch0 = 0, zoom0 = 1;
const view = $('view');
view.addEventListener('pointerdown', (e) => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = zoom; } });
view.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = view.getBoundingClientRect();
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const dd = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) { zoom = clamp(zoom0 * (dd / pinch0), 0.5, 4); $('zoom').value = String(zoom); } }
  else { offX += (e.clientX - prev.x) / r.width; offY += (e.clientY - prev.y) / r.height; }
  draw();
});
const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; };
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('wheel', (e) => { e.preventDefault(); zoom = clamp(zoom * (e.deltaY < 0 ? 1.06 : 0.94), 0.5, 4); $('zoom').value = String(zoom); draw(); }, { passive: false });

// ---------- start
$('year').textContent = new Date().getFullYear();
$('stDate').value = today();
applyLang(); setPreset();

// test hook (used by local headless tests only)
window.__fh = {
  load: async (url) => { const b = await (await fetch(url)).blob(); await loadFile(b); },
  set: (o) => { if (o.exam) { examId = o.exam; $('exam').value = o.exam; refreshKind(); } if (o.kind) { kind = o.kind; refreshKind(); } setPreset(); if (o.stamp !== undefined) { $('stampOn').checked = o.stamp; } if (o.name) $('stName').value = o.name; rebuild(true); },
  out: async () => { const r = await makeOut(); showOut(r); const fr = new FileReader(); const url = await new Promise((res) => { fr.onload = () => res(fr.result); fr.readAsDataURL(r.b); }); return { w: r.w, h: r.h, kb: +(r.b.size / 1024).toFixed(1), q: +r.q.toFixed(2), padded: r.padded, ok: r.ok, url }; },
  state: () => ({ examId, kind, w: spec().w, h: spec().h, min: spec().min, max: spec().max, loaded: !!raw }),
};

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(`${BASE}sw.js`).catch(() => {});
</script>
</body>
