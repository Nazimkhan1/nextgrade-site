    const w = Math.abs(mr.u - ml.u) * 0.5, top = lo.v - 0.005, bot = chin.v + 0.035;
    const pts = [];
    for (let a = 0; a <= Math.PI; a += Math.PI / 16) pts.push({ u: Math.cos(a) * w, v: top + Math.sin(a) * (bot - top) });
    pts.push({ u: -w * 0.9, v: top - 0.01 }, { u: w * 0.9, v: top - 0.01 });
    return pts.map(f.toXY);
  }
  const grow = kind === 'full' ? 1.07 : 1.0, drop = kind === 'full' ? 0.06 : 0.012;
  const cy = (up.v + chin.v) / 2;
  const jaw = JAW.map((i) => { const p = uv(i); return { u: p.u * grow, v: cy + (p.v - cy) * grow + drop * Math.max(0, (p.v - up.v) / (chin.v - up.v)) }; });
  const midV = (up.v + mr.v) / 2;
  const upper = [
    { u: mr.u + 0.17, v: midV - 0.05 }, { u: mr.u + 0.05, v: up.v - 0.015 }, { u: 0, v: up.v * 0.45 },
    { u: ml.u - 0.05, v: up.v - 0.015 }, { u: ml.u - 0.17, v: midV - 0.05 },
  ];
  return [...jaw, ...upper].map(f.toXY);
};
const mousRegion = (f, kind) => {
  const uv = (i) => f.toUV(face[i]);
  const ml = uv(61), mr = uv(291), up = uv(0);
  const top = kind === 'pencil' ? up.v - 0.022 : kind === 'thick' ? up.v * 0.08 : up.v * 0.3;
  const droop = kind === 'thick' ? 0.07 : kind === 'pencil' ? 0.004 : 0.025;
  const ext = kind === 'pencil' ? 0.0 : 0.025;
  const R = mr.u + ext, L = ml.u - ext;
  const pts = [
    { u: L - 0.01, v: up.v + droop }, { u: L + 0.03, v: top + 0.02 }, { u: L * 0.4, v: top }, { u: 0, v: top + 0.008 },
    { u: R * 0.4, v: top }, { u: R - 0.03, v: top + 0.02 }, { u: R + 0.01, v: up.v + droop },
    { u: R - 0.02, v: up.v + 0.004 }, { u: 0, v: up.v - 0.004 }, { u: L + 0.02, v: up.v + 0.004 },
  ];
  return pts.map(f.toXY);
};
const applyFaceHair = (x) => {
  if (!face || (beard === 'none' && mous === 'none')) return;
  const f = frame(), col = (FACE_SHADES.find((s) => s[0] === faceShade) || FACE_SHADES[0])[1];
  const unit = f.fw;
  if (beard !== 'none') {
    const kind = beard;
    const stubble = kind === 'stubble';
    const layer = fillHair(beardRegion(f, kind), col, stubble ? density * 0.55 : density, unit * (stubble ? 0.008 : kind === 'full' ? 0.035 : 0.022), Math.max(1, unit * (stubble ? 0.0035 : 0.004)), 7, f);
    if (kind !== 'goatee' && kind !== 'french') lipsHole(layer.getContext('2d'), f);
    x.save(); x.globalCompositeOperation = stubble ? 'multiply' : 'source-over'; x.drawImage(layer, 0, 0); x.restore();
  }
  const m = beard === 'french' && mous === 'none' ? 'classic' : mous;
  if (m !== 'none') {
    const layer = fillHair(mousRegion(f, m), col, Math.min(1, density * 1.1), unit * 0.02, Math.max(1, unit * 0.0045), 11, f);
    x.drawImage(layer, 0, 0);
    if (m === 'handlebar') {
      // curled tips
      const uv = (i) => f.toUV(face[i]); const up = uv(0), ml = uv(61), mr = uv(291);
      x.save(); x.strokeStyle = col; x.lineCap = 'round'; x.globalAlpha = 0.85 * density; x.lineWidth = Math.max(2, unit * 0.014);
      [[mr.u + 0.035, 1], [ml.u - 0.035, -1]].forEach(([u0, s]) => {
        const a = f.toXY({ u: u0, v: up.v + 0.02 }), b = f.toXY({ u: u0 + s * 0.05, v: up.v - 0.005 }), c2 = f.toXY({ u: u0 + s * 0.045, v: up.v - 0.045 });
        x.beginPath(); x.moveTo(a.x, a.y); x.quadraticCurveTo(b.x, b.y, c2.x, c2.y); x.stroke();
      });
      x.restore();
    }
  }
};

// ---------- render (before | after split)
const view = $('view');
let resultCache = null, cacheKey = '';
const result = () => {
  const key = [shade, strength, beard, mous, faceShade, density].join('|');
  if (resultCache && key === cacheKey) return resultCache;
  const c = mk(W, H), x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  applyColour(x);
  applyFaceHair(x);
  resultCache = c; cacheKey = key;
  return c;
};
const render = () => {
  if (!img) return;
  view.width = W; view.height = H;
  const x = view.getContext('2d'), sx = Math.round(W * split);
  x.drawImage(img, 0, 0);
  const r = result();
  x.drawImage(r, sx, 0, W - sx, H, sx, 0, W - sx, H);
  const vr = view.getBoundingClientRect(), br = $('stagebox').getBoundingClientRect();
  $('split').style.left = `${vr.left - br.left + vr.width * split}px`;
};
const setSplitFrom = (e) => { const r = view.getBoundingClientRect(); split = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); render(); };
let dragging = false;
$('stagebox').addEventListener('pointerdown', (e) => { if (!img) return; dragging = true; $('stagebox').setPointerCapture(e.pointerId); setSplitFrom(e); });
$('stagebox').addEventListener('pointermove', (e) => { if (dragging) setSplitFrom(e); });
['pointerup', 'pointercancel'].forEach((ev) => $('stagebox').addEventListener(ev, () => { dragging = false; }));
window.addEventListener('resize', render);

// ---------- controls
const drawStyles = () => {
  $('shades').innerHTML = SHADES.map(([id, hex]) => `<button type="button" class="sw ${shade === id ? 'on' : ''}" data-v="${id}"><i style="background:${hex || 'linear-gradient(135deg,#ccc,#fff)'}"></i>${t('shades')[id]}</button>`).join('');
  $('beardShades').innerHTML = FACE_SHADES.map(([id, hex]) => `<button type="button" class="sw ${faceShade === id ? 'on' : ''}" data-v="${id}"><i style="background:${hex}"></i>${t('faceShades')[id]}</button>`).join('');
  $('beards').innerHTML = BEARDS.map((id) => `<button type="button" class="st ${beard === id ? 'on' : ''}" data-v="${id}" ${face || id === 'none' ? '' : 'disabled'}>${t('beards')[id]}</button>`).join('');
  $('mouss').innerHTML = MOUSS.map((id) => `<button type="button" class="st ${mous === id ? 'on' : ''}" data-v="${id}" ${face || id === 'none' ? '' : 'disabled'}>${t('mouss')[id]}</button>`).join('');
  $('strVal').textContent = `${Math.round(strength * 100)}%`; $('denVal').textContent = `${Math.round(density * 100)}%`;
};
const pick = (id, fn) => $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || b.disabled) return; fn(b.dataset.v); drawStyles(); render(); });
pick('shades', (v) => { shade = v; });
pick('beardShades', (v) => { faceShade = v; });
pick('beards', (v) => { beard = v; });
pick('mouss', (v) => { mous = v; });
$('strength').addEventListener('input', (e) => { strength = Number(e.target.value) / 100; drawStyles(); render(); });
$('density').addEventListener('input', (e) => { density = Number(e.target.value) / 100; drawStyles(); render(); });
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('paneColour').classList.toggle('hidden', tab !== 'colour'); $('paneBeard').classList.toggle('hidden', tab !== 'beard'); $('paneMous').classList.toggle('hidden', tab !== 'mous');
  $('faceColour').classList.toggle('hidden', tab === 'colour');
  $('noFace').classList.toggle('hidden', Boolean(face) || tab === 'colour' || !img);
});
$('resetBtn').addEventListener('click', () => { shade = 'none'; beard = 'none'; mous = 'none'; drawStyles(); render(); });

// ---------- load
const loadBitmap = (file) => new Promise((resolve, reject) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(url); resolve(im); }; im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); }; im.src = url; });
const fail = (err) => { busy(''); console.error(err); toast(t('failed')); };
const useImage = async (im) => {
  const w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height, k = Math.min(1, MAX_SIDE / Math.max(w0, h0));
  W = Math.round(w0 * k); H = Math.round(h0 * k);
  img = mk(W, H); img.getContext('2d').drawImage(im, 0, 0, W, H);
  hairMask = null; face = null; resultCache = null; split = 0.5;
  $('pickCard').classList.add('hidden'); $('editor').classList.remove('hidden');
  render();
  await analyse();
};
const onFile = (f) => { if (f) loadBitmap(f).then(useImage).catch(fail); };
$('pickBtn').addEventListener('click', (e) => { e.stopPropagation(); $('file').click(); });
$('camBtn').addEventListener('click', (e) => { e.stopPropagation(); $('cam').click(); });
$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { onFile(e.target.files[0]); e.target.value = ''; });
$('cam').addEventListener('change', (e) => { onFile(e.target.files[0]); e.target.value = ''; });
$('newBtn').addEventListener('click', () => $('file').click());

// ---------- save (on the device): the "after" picture
const resultBlob = () => new Promise((r) => result().toBlob(r, 'image/jpeg', 0.92));
const stamp = () => new Date().toISOString().slice(0, 10);
$('dlBtn').addEventListener('click', async () => {
  const blob = await resultBlob(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `new-look-${stamp()}.jpg`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600); toast(t('saved'));
});
$('shareBtn').addEventListener('click', async () => {
  const blob = await resultBlob(); const file = new File([blob], `new-look-${stamp()}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], text: t('shareText') }).catch(() => {}); else $('dlBtn').click();
});

// ---------- language
const applyLang = () => {
  document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
  $('lang').value = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  $('howList').innerHTML = t('how').map((x) => `<li>${x}</li>`).join('');
  $('tipList').innerHTML = t('tips').map((x) => `<li>${x}</li>`).join('');
  drawStyles();
};
$('lang').addEventListener('change', (e) => { lang = e.target.value; store.set('ht-lang', lang); applyLang(); });
$('year').textContent = new Date().getFullYear();
applyLang();

// local testing: ?test=<image url>
if (params.get('test')) { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => useImage(im).catch(fail); im.src = params.get('test'); }
window.__ht = {
  get state() { return { img: Boolean(img), hair: Boolean(hairMask), face: Boolean(face), W, H, shade, beard, mous }; },
  set: (o) => { if (o.shade) shade = o.shade; if (o.beard) beard = o.beard; if (o.mous) mous = o.mous; if (o.faceShade) faceShade = o.faceShade; if (o.split != null) split = o.split; drawStyles(); render(); },
  resultUrl: (maxW) => { const r = result(), k = Math.min(1, (maxW || 600) / r.width), c = mk(r.width * k, r.height * k); c.getContext('2d').drawImage(r, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.85); },
};
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
