// confidence (0..1, mw x mh) -> full-res mask canvas
const maskFromConfidence = (data, mw, mh) => {
  const small = mk(mw, mh), sctx = small.getContext('2d');
  const id = sctx.createImageData(mw, mh);
  for (let i = 0; i < mw * mh; i += 1) {
    const c = data[i];

// The model sees 256x256. A full-length person in a big photo then gets only a few pixels, so the
// edges come out rough and people in the background are picked up too. So: pass 1 on the whole photo
// finds the main person (largest connected blob); pass 2 runs on a crop around that person only, split
// into overlapping tiles along its long side, and the tiles are blended back together.
const personConf = (seg, source) => {
  let out = null;
  seg.segment(source, (res) => {
    // selfie_multiclass: 0 background, 1 hair, 2 body-skin, 3 face-skin, 4 clothes, 5 others
    const bgm = res.confidenceMasks[0];
    const b = bgm.getAsFloat32Array();
    const keep = new Float32Array(b.length);
    for (let i = 0; i < b.length; i += 1) keep[i] = 1 - b[i];
    out = { keep, mw: bgm.width, mh: bgm.height };
  });
  return out;
};
const mainBlobBox = ({ keep, mw, mh }) => {
  // largest 4-connected blob above 0.5 -> its box in 0..1 coordinates, or null
  const seen = new Uint8Array(mw * mh); let best = null;
  const stack = [];
  for (let s0 = 0; s0 < mw * mh; s0 += 1) {
    if (seen[s0] || keep[s0] < 0.5) continue;
    let n = 0, x0 = mw, y0 = mh, x1 = 0, y1 = 0;
    stack.push(s0); seen[s0] = 1;
    while (stack.length) {
      const i = stack.pop(), x = i % mw, y = (i - x) / mw; n += 1;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      const nb = [x > 0 ? i - 1 : -1, x < mw - 1 ? i + 1 : -1, y > 0 ? i - mw : -1, y < mh - 1 ? i + mw : -1];
      for (const j of nb) if (j >= 0 && !seen[j] && keep[j] >= 0.5) { seen[j] = 1; stack.push(j); }
    }
    if (!best || n > best.n) best = { n, x0, y0, x1, y1 };
  }
  if (!best || best.n < mw * mh * 0.002) return null;
  return { x0: best.x0 / mw, y0: best.y0 / mh, x1: (best.x1 + 1) / mw, y1: (best.y1 + 1) / mh };
};
const runPerson = async () => {
  busy(personSeg ? t('working') : t('loading'));
  const seg = await getPersonSeg();
  busy(t('working'));
  await new Promise((r) => setTimeout(r, 30));
  const first = personConf(seg, img);
  const box = mainBlobBox(first);
  if (!box) { busy(''); toast(t('noPerson')); setMode('object'); return; }
  // crop around the person with a margin
  const padX = (box.x1 - box.x0) * 0.12 + 0.02, padY = (box.y1 - box.y0) * 0.06 + 0.02;
  const cx0 = Math.max(0, Math.floor((box.x0 - padX) * W)), cy0 = Math.max(0, Math.floor((box.y0 - padY) * H));
  const cx1 = Math.min(W, Math.ceil((box.x1 + padX) * W)), cy1 = Math.min(H, Math.ceil((box.y1 + padY) * H));
  const cw = cx1 - cx0, ch = cy1 - cy0;

  const k = Math.min(1, 1024 / Math.max(cw, ch)), aw = Math.max(1, Math.round(cw * k)), ah = Math.max(1, Math.round(ch * k));
  const acc = new Float32Array(aw * ah), wsum = new Float32Array(aw * ah);
  const vertical = ah >= aw;
  const long = vertical ? ah : aw, short = vertical ? aw : ah;
  const n = Math.min(4, Math.max(1, Math.round(long / (short * 1.15))));

  const ramp = Math.max(1, Math.round(tileLen * 0.15));
  for (let ti = 0; ti < n; ti += 1) {
    const start = n === 1 ? 0 : Math.round((long - tileLen) * (ti / (n - 1)));
    const tw = vertical ? aw : tileLen, th = vertical ? tileLen : ah;
    const sx = vertical ? 0 : start, sy = vertical ? start : 0;
    const tile = mk(tw, th);
    tile.getContext('2d').drawImage(img, cx0 + sx / k, cy0 + sy / k, tw / k, th / k, 0, 0, tw, th);

    const sm = mk(r.mw, r.mh), sx2 = sm.getContext('2d'), sd = sx2.createImageData(r.mw, r.mh);

};

const runObject = async (nx, ny) => {
  busy(objectSeg ? t('working') : t('loading'));
  const seg = await getObjectSeg();
  busy(t('working'));
  await new Promise((r) => setTimeout(r, 30));
  let out = null;
  seg.segment(img, { keypoint: { x: nx, y: ny } }, (res) => {
    const m = res.confidenceMasks[0];
    out = { keep: Float32Array.from(m.getAsFloat32Array()), mw: m.width, mh: m.height };
  });
  pushUndo();

// ---------- compositing
const softMask = () => {
  if (!soft) return mask;
  const c = mk(W, H), x = c.getContext('2d');
  if ('filter' in x) { x.filter = `blur(${soft * Math.max(1, Math.round(Math.max(W, H) / 1000))}px)`; x.drawImage(mask, 0, 0); x.filter = 'none'; return c; }

  x.imageSmoothingQuality = 'high'; x.drawImage(s, 0, 0, W, H);
  return c;
};
const blurredOriginal = () => {
  const k = 24, s = mk(Math.max(1, Math.round(W / k)), Math.max(1, Math.round(H / k)));
  s.getContext('2d').drawImage(img, 0, 0, s.width, s.height);
  const c = mk(W, H), x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(s, 0, 0, W, H);
  return c;
};
const drawBackground = (x) => {
  if (bg === 'none') return;

  if (bg === 'image' && bgImg) {
    const r = Math.max(W / bgImg.width, H / bgImg.height), bw = bgImg.width * r, bh = bgImg.height * r;
    x.drawImage(bgImg, (W - bw) / 2, (H - bh) / 2, bw, bh); return;

};
const composite = () => {

  cx.globalCompositeOperation = 'destination-in';

  x.drawImage(cut, 0, 0);

};
const view = $('view');
const render = () => {
  if (!img) return;
  view.width = W; view.height = H;
  const x = view.getContext('2d');
  x.clearRect(0, 0, W, H);
  if (comparing || !mask) { x.drawImage(img, 0, 0); return; }
  x.drawImage(composite(), 0, 0);
};

// ---------- undo + brush
const pushUndo = () => {
  if (!mask) return;
  const c = mk(W, H); c.getContext('2d').drawImage(mask, 0, 0);
  undoStack.push(c); if (undoStack.length > 6) undoStack.shift();
  $('undoBtn').disabled = false;
};
$('undoBtn').addEventListener('click', () => {
  const c = undoStack.pop(); if (!c) return;
  mask = c; $('undoBtn').disabled = undoStack.length === 0; render();
});
const toImg = (e) => { const r = view.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H, scale: W / r.width }; };
let painting = false, lastPt = null;
const paint = (p) => {

let rafPending = false;

view.addEventListener('pointerdown', (e) => {
  if (!img) return;
  const p = toImg(e);
  if (mode === 'object' && brush === 'off') { runObject(Math.min(1, Math.max(0, p.x / W)), Math.min(1, Math.max(0, p.y / H))).catch(fail); return; }
  if (brush === 'off' || !mask) return;
  e.preventDefault(); view.setPointerCapture(e.pointerId);
  pushUndo(); painting = true; lastPt = null; paint(p); renderSoon();
});
view.addEventListener('pointermove', (e) => { if (!painting) return; paint(toImg(e)); renderSoon(); });
const stopPaint = () => { painting = false; lastPt = null; };
view.addEventListener('pointerup', stopPaint); view.addEventListener('pointercancel', stopPaint);

// ---------- controls
const setMode = (m) => {
  mode = m;
  document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
  $('modeHint').textContent = m === 'person' ? t('hintPerson') : t('hintObject');
  if (m === 'person' && img) runPerson().catch(fail);
  if (m === 'object' && img) { setBrush('off'); toast(t('tapFirst')); }
};
$('modeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
const setBrush = (b) => { brush = b; document.querySelectorAll('#brushSeg button').forEach((x) => x.classList.toggle('on', x.dataset.brush === b)); };
$('brushSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setBrush(b.dataset.brush); });
$('soft').addEventListener('input', (e) => { soft = Number(e.target.value); $('softVal').textContent = soft; renderSoon(); });
$('brushSize').addEventListener('input', (e) => { $('sizeVal').textContent = e.target.value; });
$('softVal').textContent = soft; $('sizeVal').textContent = $('brushSize').value;
const drawSwatches = () => {
  $('swatches').innerHTML = BGS.map((b) => `<button type="button" class="sw ${b.cls || ''} ${bg === b.key ? 'on' : ''}" data-bg="${b.key}" style="${b.style || (b.key.startsWith('#') ? `background:${b.key}` : '')}" aria-label="${b.key}">${b.label}</button>`).join('');
};
$('swatches').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; bg = b.dataset.bg; drawSwatches(); render(); });
$('customColor').addEventListener('input', (e) => { bg = e.target.value; drawSwatches(); render(); });
$('bgImgBtn').addEventListener('click', () => $('bgFile').click());
$('bgFile').addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; bgImg = await loadBitmap(f); bg = 'image'; drawSwatches(); render(); e.target.value = ''; });
const holdCompare = (on) => { comparing = on; render(); };
$('compareBtn').addEventListener('pointerdown', () => holdCompare(true));
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => $('compareBtn').addEventListener(ev, () => holdCompare(false)));
$('newBtn').addEventListener('click', () => $('file').click());

// ---------- load
const loadBitmap = (file) => new Promise((resolve, reject) => {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
  im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
  im.src = url;
});
const fail = (err) => { busy(''); console.error(err); toast(t('failed')); };
const useImage = async (im) => {
  const r = Math.min(1, MAX_SIDE / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));
  W = Math.round((im.naturalWidth || im.width) * r); H = Math.round((im.naturalHeight || im.height) * r);
  img = mk(W, H); img.getContext('2d').drawImage(im, 0, 0, W, H);
  mask = null; undoStack.length = 0; $('undoBtn').disabled = true;
  $('pickCard').classList.add('hidden'); $('editor').classList.remove('hidden');
  $('sizeInfo').textContent = t('sizeInfo')(W, H);
  render();
  if (mode === 'person') await runPerson(); else toast(t('tapFirst'));
};
const onFile = (f) => { if (!f) return; loadBitmap(f).then(useImage).catch(fail); };
$('pickBtn').addEventListener('click', (e) => { e.stopPropagation(); $('file').click(); });
$('camBtn').addEventListener('click', (e) => { e.stopPropagation(); $('cam').click(); });
$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { onFile(e.target.files[0]); e.target.value = ''; });
$('cam').addEventListener('change', (e) => { onFile(e.target.files[0]); e.target.value = ''; });
['dragover', 'dragenter'].forEach((ev) => $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', (e) => onFile(e.dataTransfer.files[0]));

// ---------- save (all on the device)
const toBlob = (type, q) => new Promise((r) => (mask ? composite() : img).toBlob(r, type, q));
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(t('saved')); };
const stamp = () => new Date().toISOString().slice(0, 10);
$('dlPng').addEventListener('click', async () => download(await toBlob('image/png'), `no-background-${stamp()}.png`));
$('dlJpg').addEventListener('click', async () => {
  // JPG has no transparency: a transparent choice is saved on white
  const keep = bg; if (bg === 'none') bg = '#ffffff';
  const blob = await toBlob('image/jpeg', 0.92); bg = keep;
  download(blob, `new-background-${stamp()}.jpg`);
});
$('shareBtn').addEventListener('click', async () => {
  const blob = await toBlob('image/png');
  const file = new File([blob], `photo-${stamp()}.png`, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); } else download(blob, file.name);
});

drawSwatches();
applyLang();
// local testing: ?test=<image url> loads that image (same-origin or CORS-enabled)
if (params.get('test')) { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => useImage(im).catch(fail); im.src = params.get('test'); }
window.__bg = { get state() { return { hasImg: Boolean(img), hasMask: Boolean(mask), W, H, mode, bg }; }, setBg: (b) => { bg = b; drawSwatches(); render(); }, tapObject: (x, y) => runObject(x, y) };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
