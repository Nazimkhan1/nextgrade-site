      fontK2U: 'আউটপুট ইউনিকোড — সব ফোন আর কম্পিউটারে ঠিক দেখাবে।', fontU2K: 'কৃতিদেব আউটপুট ইংরেজি অক্ষরের মতো দেখাবে। Word-এ পেস্ট করে "Kruti Dev 010" ফন্ট বাছলে হিন্দি দেখা যাবে।',
      howTitle: 'কীভাবে ব্যবহার করবে', how: ['ওপর থেকে দিক বাছো: <b>কৃতিদেব → ইউনিকোড</b> (পুরোনো লেখা বদলানো) বা <b>ইউনিকোড → কৃতিদেব</b>।', 'বাঁদিকের বাক্সে লেখা পেস্ট করো — ডানদিকে সঙ্গে সঙ্গে বদলানো লেখা আসবে।', '<b>📋 কপি</b> টিপে যেখানে দরকার পেস্ট করো।', 'কোনো পুরোনো গ্লিফ চেনা না গেলে হলুদ লাইনে দেখাবে — সেই শব্দগুলো একবার মিলিয়ে নাও।'],
      aboutTitle: 'কৃতিদেব আর ইউনিকোডের তফাত কী?', aboutText: 'কৃতিদেব একটা পুরোনো "ফন্ট" কৌশল: ইংরেজি কি (যেমন d, k, f) হিন্দি অক্ষরের মতো আঁকা হয়। তাই ফন্ট ছাড়া কৃতিদেবের লেখা অদ্ভুত ইংরেজি অক্ষরের মতো দেখায়, আর Google, মোবাইল বা WhatsApp তা হিন্দি বলে বোঝে না। ইউনিকোড আসল হিন্দি, যা সব জায়গায় ঠিক দেখায় আর খোঁজা যায়।', aboutText2: 'অনেক সরকারি অফিস, আদালত আর টাইপিং পরীক্ষায় এখনও কৃতিদেব চলে, তাই দুদিকেই বদলানোর দরকার পড়ে। এই কনভার্টার তোমার ব্রাউজারেই কাজ করে; লেখা কোনো সার্ভারে যায় না।',
      faqTitle: 'প্রশ্ন-উত্তর', faq: [['বদলানো লেখা কি ১০০% ঠিক হবে?', 'সাধারণ হিন্দি — মাত্রা, অর্ধেক অক্ষর, রেফ (র্), ি-কার, যুক্তাক্ষর — ঠিকঠাক বদলায়। খুব পুরোনো বা কম-ব্যবহৃত গ্লিফ চেনা না গেলে টুল সেগুলো লুকোয় না, হলুদ লাইনে দেখায়।'], ['ইউনিকোড → কৃতিদেবের লেখা অদ্ভুত লাগছে কেন?', 'কারণ সেটা কৃতিদেব ফন্টের জন্য। Word বা টাইপিং সফটওয়্যারে পেস্ট করে "Kruti Dev 010" ফন্ট বাছো।'], ['আমার লেখা কি সেভ হয়?', 'না। সবকিছু তোমার ফোন বা কম্পিউটারের ব্রাউজারেই হয়।']],
    },
  };

  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private */ } } };
  const params = new URLSearchParams(location.search);
  const LANGS = ['hinglish', 'hi', 'en', 'bn'];
  const deviceLang = () => { const l = (navigator.language || '').toLowerCase(); if (l.startsWith('bn')) return 'bn'; if (l.startsWith('hi')) return 'hi'; return l.endsWith('-in') ? 'hinglish' : 'en'; };
  let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : LANGS.includes(store.get('kd-lang')) ? store.get('kd-lang') : deviceLang();
  let dir = params.get('dir') === 'u2k' ? 'u2k' : (store.get('kd-dir') === 'u2k' ? 'u2k' : 'k2u');
  const t = (k) => T[lang][k];

  const convert = () => {
    const v = $('inp').value;
    const out = dir === 'k2u' ? window.KD.toUnicode(v) : window.KD.toKrutidev(v);
    $('out').value = out;
    const unknown = dir === 'k2u' ? window.KD.unknownGlyphs(out) : [];
    $('warn').classList.toggle('hidden', !unknown.length);
    if (unknown.length) $('warn').textContent = t('warn')(unknown.join(' '));
  };
  const applyDir = () => {
    document.querySelectorAll('#dirSeg button').forEach((b) => b.classList.toggle('on', b.dataset.d === dir));
    $('inLabel').textContent = dir === 'k2u' ? t('inK') : t('inU');
    $('outLabel').textContent = dir === 'k2u' ? t('outU') : t('outK');
    $('inp').classList.toggle('kd', dir === 'k2u'); $('out').classList.toggle('kd', dir === 'u2k');
    $('fontNote').textContent = dir === 'k2u' ? t('fontK2U') : t('fontU2K');
    convert();
  };
  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { const v = t(el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    $('faqList').innerHTML = t('faq').map(([q, a]) => `<h3>${q}</h3><p>${a}</p>`).join('');
    $('home').href = `https://nextgrade.in${PREFIX[lang]}/`;
    applyDir();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('kd-lang', lang); applyLang(); });
  $('dirSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; dir = b.dataset.d; store.set('kd-dir', dir); applyDir(); });
  $('inp').addEventListener('input', convert);
  $('swap').addEventListener('click', () => { const o = $('out').value; dir = dir === 'k2u' ? 'u2k' : 'k2u'; store.set('kd-dir', dir); $('inp').value = o; applyDir(); });
  $('sample').addEventListener('click', () => { $('inp').value = SAMPLE[dir]; convert(); });
  $('clear').addEventListener('click', () => { $('inp').value = ''; convert(); $('inp').focus(); });
  $('copy').addEventListener('click', () => {
    const text = $('out').value; if (!text) return;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { $('copy').textContent = t('copied'); setTimeout(() => { $('copy').textContent = t('copy'); }, 1500); }).catch(() => { $('out').select(); });
  });
  $('year').textContent = new Date().getFullYear();
  window.__kd = { get out() { return $('out').value; }, get warn() { return $('warn').classList.contains('hidden') ? '' : $('warn').textContent; } };
  applyLang();
  if (params.get('t')) { $('inp').value = params.get('t'); convert(); }
})();
</script>
</body>
</html>
