    faq: [['क्या मेरी फ़ोटो किसी सर्वर पर जाती है?', 'नहीं। फ़ोटो आपके फ़ोन/ब्राउज़र में ही काटी और घुमाई जाती है। पेज एक बार खुल जाए तो इंटरनेट बंद करके भी चलता है।'], ['फ़ोटो उलटी क्यों खुलती थी, अब कैसे ठीक है?', 'फ़ोन कैमरा फ़ोटो के साथ "दिशा" की जानकारी रखता है। यह टूल उसे पढ़कर फ़ोटो सही दिशा में खोलता है, फिर आप जैसे चाहें घुमाएँ।'], ['क्वालिटी कम तो नहीं होगी?', 'काटने और घुमाने में फ़ोटो के px वही रहते हैं (जितना हिस्सा आपने रखा)। JPG/WebP में क्वालिटी स्लाइडर 92 पर अच्छी रहती है; ज़्यादा चाहिए तो 100 करें या PNG लें।'], ['आईना (फ़्लिप) कब चाहिए?', 'सेल्फ़ी कैमरा कई बार लिखाई उलटी दिखाता है। आईना दबाने से बाएँ-दाएँ सीधा हो जाता है।'], ['फ़ोटो का साइज़ (KB) भी कम करना है?', 'यहाँ "लंबी साइड" px कम करके या क्वालिटी घटाकर फ़ाइल छोटी कर सकते हैं। सही KB चाहिए तो इमेज कंप्रेसर इस्तेमाल करें।']],

    guide: "<h2>इमेज क्रॉप और रोटेट क्या है?</h2><p>यह एक फ़्री टूल है जिससे फ़ोटो का बेकार हिस्सा काट सकते हैं, उसे 90° घुमा सकते हैं, आईने जैसा पलट सकते हैं और थोड़ी टेढ़ी फ़ोटो को सीधा कर सकते हैं। सब कुछ आपके फ़ोन या कंप्यूटर के ब्राउज़र में होता है — न कोई ऐप इंस्टॉल करना, न खाता बनाना, न फ़ोटो कहीं भेजनी।</p>\n<h3>कब काम आता है?</h3><ul><li><b>प्रोफ़ाइल फ़ोटो:</b> ग्रुप फ़ोटो से सिर्फ़ अपना चेहरा 1:1 में काट लें।</li><li><b>डॉक्यूमेंट:</b> मार्कशीट या पहचान-पत्र की फ़ोटो में मेज़, उँगली और परछाईं काट दें, ताकि सिर्फ़ काग़ज़ दिखे।</li><li><b>स्टेटस और स्टोरी:</b> 9:16 में काटें ताकि फ़ोन की पूरी स्क्रीन भरे।</li><li><b>प्रेज़ेंटेशन, थंबनेल, वॉलपेपर:</b> 16:9 सबसे सही बैठता है।</li><li><b>फ़ॉर्म की फ़ोटो:</b> पासपोर्ट नाप (3.5:4.5) में चेहरा बीच में रखकर काटें।</li></ul>\n<h3>क्रॉप करते समय ध्यान रखें</h3><p>पहले नाप चुनें, फिर फ़्रेम खिसकाएँ। फ़्री में फ़्रेम को किसी भी तरफ़ खींच सकते हैं; तय नाप में सिर्फ़ कोने दिखते हैं ताकि अनुपात न बिगड़े। \"नई फ़ोटो\" में px दिखते रहते हैं — बहुत छोटा हिस्सा काटेंगे तो फ़ोटो धुँधली लगेगी, इसलिए ज़रूरत से ज़्यादा ज़ूम न करें।</p>\n<h3>आम दिक़्क़तें और हल</h3><ul><li><b>फ़ोटो उलटी या लेटी हुई खुल रही है:</b> यह टूल फ़ोन की दिशा की जानकारी पढ़ लेता है। फिर भी ग़लत हो तो \"90° दाएँ/बाएँ\" दबाएँ।</li><li><b>सीधा करने पर किनारे कट गए:</b> घुमाने पर ख़ाली कोने न दिखें, इसलिए फ़ोटो थोड़ी ज़ूम होती है। कम कोण रखेंगे तो कम कटेगा।</li><li><b>फ़ाइल बहुत बड़ी बन रही है:</b> JPG या WebP चुनें, क्वालिटी 80–90 रखें, या \"लंबी साइड\" में 1600 जैसा px लिखें।</li><li><b>PNG का पारदर्शी हिस्सा काला/सफ़ेद हो गया:</b> JPG पारदर्शिता नहीं रख सकता — PNG या WebP चुनें।</li><li><b>डाउनलोड नहीं हो रहा:</b> कुछ फ़ोन में डाउनलोड की जगह \"शेयर\" से गैलरी में सेव करना आसान होता है।</li></ul>",

    faq: [['Does my photo go to any server?', 'No. The photo is cut and turned inside your phone/browser. Once the page has loaded, it even works with the internet off.'], ['Why did my photo open sideways before, and why not here?', 'A phone camera stores which way up a photo was taken. This tool reads that and opens the photo upright; after that you can turn it however you like.'], ['Will the quality drop?', 'Cropping and rotating keep the photo\'s own px (for the part you keep). For JPG/WebP a quality of 92 looks good; go to 100 or choose PNG if you want more.'], ['When do I need Mirror?', 'Selfie cameras often show writing back to front. Mirror turns it the right way round.'], ['I also need a smaller file (KB).', 'Here you can lower the "longest side" px or the quality. For an exact KB target, use the Image Compressor.']],
    privH: 'Your photo stays with you', privText: 'This tool runs inside your phone/browser without any server. Your photo is never uploaded or stored, and we cannot see it. Closing the page clears everything.',
    guide: "<h2>What is Image Crop &amp; Rotate?</h2><p>It is a free tool for cutting away the parts of a photo you don't need, turning it by 90°, mirroring it, and straightening a photo that came out slightly tilted. Everything happens in your phone's or computer's browser — nothing to install, no account to make, and the photo is not sent anywhere.</p>\n<h3>When is it useful?</h3><ul><li><b>Profile picture:</b> cut just your face out of a group photo at 1:1.</li><li><b>Documents:</b> remove the table, your fingers and shadows from a photo of a marksheet or ID, so only the paper shows.</li><li><b>Status and stories:</b> crop to 9:16 so it fills the whole phone screen.</li><li><b>Slides, thumbnails, wallpapers:</b> 16:9 fits best.</li><li><b>Form photos:</b> crop to the passport shape (3.5:4.5) with the face in the middle.</li></ul>\n<h3>Things to keep in mind while cropping</h3><p>Choose the shape first, then move the frame. In Free you can pull the frame in any direction; with a fixed shape only the corners show, so the proportions stay right. The \"New photo\" line keeps showing the px — if you cut out a very small part, the picture will look soft, so don't zoom in more than you need.</p>\n<h3>Common problems and fixes</h3><ul><li><b>The photo opens upside down or sideways:</b> this tool reads the direction the phone stored with the photo. If it is still wrong, tap \"90° right/left\".</li><li><b>Straightening cut off the edges:</b> the photo zooms in a little so no empty corners show after turning. A smaller angle cuts less.</li><li><b>The file is too big:</b> choose JPG or WebP, keep the quality at 80–90, or enter a px like 1600 for the longest side.</li><li><b>The transparent part of a PNG turned black or white:</b> JPG cannot keep transparency — choose PNG or WebP.</li><li><b>The download does not start:</b> on some phones it is easier to use \"Share\" and save to the gallery.</li></ul>",

    moreH: 'আরও টুল', lCrop: ['ছবি ক্রপ করুন', 'মাপ মেনে কাটুন'], lRot: ['ছবি রোটেট করুন', 'ঘোরান, আয়না, সোজা করুন'], lComp: ['ছবির KB কমান', '20 KB, 50 KB, 100 KB…'], lForm: ['ফর্ম ফটো রিসাইজার', 'SSC · UPSC · ব্যাংক · NEET'], lSig: ['সিগনেচার মেকার', 'সই বানান, PNG/JPG'],
    howH: 'কীভাবে করবেন', how: ['<b>গ্যালারি থেকে ছবি বাছুন</b> বা <b>ক্যামেরায় তুলুন</b>।', '<b>✂️ ক্রপ</b>-এ মাপ বাছুন (ফ্রি, 1:1, 4:3, 16:9, পাসপোর্ট…) আর ফ্রেম সরান।', 'ছবি ঘোরাতে <b>🔄 ঘোরান / উল্টান</b> খুলুন: 90° ঘোরান, আয়না করুন বা স্লাইডারে বাঁকা ছবি সোজা করুন।', 'JPG, PNG বা WebP বেছে <b>ডাউনলোড</b> চাপুন — বা সরাসরি <b>শেয়ার</b> করুন।'],
    tipsH: 'কাজের কথা', tips: ['প্রোফাইল ছবির (WhatsApp, Instagram) জন্য <b>1:1</b> সবচেয়ে ভালো।', 'YouTube থাম্বনেল বা ল্যাপটপ ওয়ালপেপারের জন্য <b>16:9</b>, ফোনের স্ট্যাটাস/স্টোরির জন্য <b>9:16</b>।', 'পাসপোর্ট মাপ (3.5:4.5) শুধু কাটার মাপ। ফর্মের ঠিক px আর KB লাগলে ফর্ম ফটো রিসাইজার ব্যবহার করুন।', 'বাঁকা ছবি সোজা করার সময় ছবি একটু জুম হয়, যাতে কোণ ফাঁকা না থাকে।', 'PNG-তে ফাইল বড় হয়; সাধারণ ছবির জন্য JPG বা WebP ভালো।'],

    faq: [['আমার ছবি কি কোনো সার্ভারে যায়?', 'না। ছবি আপনার ফোন/ব্রাউজারেই কাটা আর ঘোরানো হয়। পেজ একবার খুলে গেলে ইন্টারনেট বন্ধ রেখেও চলে।'], ['আগে ছবি উল্টো খুলত কেন, এখানে ঠিক কেন?', 'ফোনের ক্যামেরা ছবির সঙ্গে "দিক"-এর তথ্য রাখে। এই টুল সেটা পড়ে ছবি সোজা খোলে; তারপর আপনি যেমন খুশি ঘোরান।'], ['কোয়ালিটি কি কমবে?', 'কাটা আর ঘোরানোয় ছবির নিজের px একই থাকে (যে অংশ রাখলেন)। JPG/WebP-তে কোয়ালিটি 92-তে ভালো দেখায়; আরও চাইলে 100 করুন বা PNG নিন।'], ['আয়না (ফ্লিপ) কখন লাগে?', 'সেলফি ক্যামেরা অনেক সময় লেখা উল্টো দেখায়। আয়না চাপলে বাঁ-ডান ঠিক হয়ে যায়।'], ['ছবির সাইজ (KB)-ও কমাতে চাই।', 'এখানে "লম্বা দিক" px বা কোয়ালিটি কমিয়ে ফাইল ছোট করা যায়। ঠিক KB চাইলে ইমেজ কম্প্রেসার ব্যবহার করুন।']],
    privH: 'আপনার ছবি আপনার কাছেই', privText: 'এই টুল কোনো সার্ভার ছাড়াই আপনার ফোন/ব্রাউজারে চলে। আপনার ছবি কোথাও আপলোড বা সেভ হয় না, আমরা দেখতেও পাই না। পেজ বন্ধ করলেই সব মুছে যায়।',
    guide: "<h2>ইমেজ ক্রপ ও রোটেট কী?</h2><p>এটি একটি ফ্রি টুল, যা দিয়ে ছবির অদরকারি অংশ কাটা যায়, 90° ঘোরানো যায়, আয়নার মতো উল্টানো যায় আর একটু বাঁকা ছবি সোজা করা যায়। সব কাজ আপনার ফোন বা কম্পিউটারের ব্রাউজারে হয় — কোনো অ্যাপ ইনস্টল করতে হয় না, অ্যাকাউন্ট খুলতে হয় না, ছবিও কোথাও পাঠানো হয় না।</p>\n<h3>কখন কাজে লাগে?</h3><ul><li><b>প্রোফাইল ছবি:</b> গ্রুপ ছবি থেকে শুধু নিজের মুখ 1:1-এ কেটে নিন।</li><li><b>ডকুমেন্ট:</b> মার্কশিট বা পরিচয়পত্রের ছবি থেকে টেবিল, আঙুল আর ছায়া কেটে দিন, যাতে শুধু কাগজ দেখা যায়।</li><li><b>স্ট্যাটাস আর স্টোরি:</b> 9:16-এ কাটুন, যাতে ফোনের পুরো স্ক্রিন ভরে।</li><li><b>প্রেজেন্টেশন, থাম্বনেল, ওয়ালপেপার:</b> 16:9 সবচেয়ে ভালো মানায়।</li><li><b>ফর্মের ছবি:</b> পাসপোর্ট মাপে (3.5:4.5) মুখ মাঝখানে রেখে কাটুন।</li></ul>\n<h3>ক্রপ করার সময় খেয়াল রাখুন</h3><p>আগে মাপ বাছুন, তারপর ফ্রেম সরান। ফ্রি-তে ফ্রেম যে কোনো দিকে টানা যায়; নির্দিষ্ট মাপে শুধু কোণগুলো দেখা যায়, যাতে অনুপাত ঠিক থাকে। \"নতুন ছবি\" লাইনে px দেখা যায় — খুব ছোট অংশ কাটলে ছবি ঝাপসা লাগবে, তাই দরকারের বেশি জুম করবেন না।</p>\n<h3>সাধারণ সমস্যা আর সমাধান</h3><ul><li><b>ছবি উল্টো বা কাত হয়ে খুলছে:</b> এই টুল ফোনের রাখা দিকের তথ্য পড়ে নেয়। তবুও ভুল হলে \"90° ডাইনে/বাঁয়ে\" চাপুন।</li><li><b>সোজা করতে গিয়ে ধার কেটে গেল:</b> ঘোরানোর পরে যাতে ফাঁকা কোণ না দেখা যায়, তাই ছবি একটু জুম হয়। কম কোণে কম কাটে।</li><li><b>ফাইল খুব বড় হচ্ছে:</b> JPG বা WebP বাছুন, কোয়ালিটি 80–90 রাখুন, বা \"লম্বা দিক\"-এ 1600-র মতো px লিখুন।</li><li><b>PNG-র স্বচ্ছ অংশ কালো/সাদা হয়ে গেল:</b> JPG স্বচ্ছতা রাখতে পারে না — PNG বা WebP বাছুন।</li><li><b>ডাউনলোড হচ্ছে না:</b> কিছু ফোনে ডাউনলোডের বদলে \"শেয়ার\" করে গ্যালারিতে সেভ করা সহজ।</li></ul>",
    footer: 'ফ্রি টুল · কিছুই আপলোড হয় না',
  },
};

// ---------- helpers
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
const params = new URLSearchParams(location.search);
const LANGS = ['hinglish', 'hi', 'en', 'bn'];
const deviceLang = () => { const l = (navigator.language || '').toLowerCase(); if (l.startsWith('bn')) return 'bn'; if (l.startsWith('hi')) return 'hi'; return l.endsWith('-in') ? 'hinglish' : 'en'; };
let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : LANGS.includes(store.get('cr-lang')) ? store.get('cr-lang') : deviceLang();
const t = (k) => T[lang][k];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtSize = (b) => (b >= 1024 * 1024 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);
let toastTimer = 0;
const toast = (msg) => { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = msg; el.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 3200); };

// Sub-pages (e.g. ./rotate/) set window.CR_PAGE = { tab, base, T: { lang: { title, sub, info } } } before this script.
const PAGE = window.CR_PAGE || null;
const BASE = PAGE ? PAGE.base || '../' : './';
if (PAGE) for (const l in PAGE.T) { if (T[l]) ['title', 'sub', 'faq'].forEach((k) => { if (PAGE.T[l][k]) T[l][k] = PAGE.T[l][k]; }); }

const webpOk = (() => { try { return mk(2, 2).toDataURL('image/webp').startsWith('data:image/webp'); } catch (e) { return false; } })();
if (!webpOk) $('webpOpt').classList.add('hidden');
let fmt = ['jpeg', 'png', 'webp'].includes(store.get('cr-fmt')) ? store.get('cr-fmt') : 'jpeg';
if (fmt === 'webp' && !webpOk) fmt = 'jpeg';

// ---------- state
// The view is R(st) · F · R(rot) applied to the photo: rot is a multiple of 90, F the flips, st the fine tilt.
// Work space = the turned photo (W × H). The crop box lives in work-space pixels.
let src = null;      // decoded photo (EXIF orientation already applied)
let prev = null;     // smaller copy for the on-screen view
let w0 = 0, h0 = 0;  // photo size
const S = { rot: 0, fh: 1, fv: 1, st: 0, ar: 0 };
let crop = { x: 0, y: 0, w: 1, h: 1 };
let k = 1;           // screen px per work px
let tab = PAGE && PAGE.tab === 'rotate' ? 'rotate' : 'crop';
const MAX_AREA = 16e6; // iPhone canvas limit is about 16.7 MP

const workDims = () => (S.rot % 180 === 0 ? [w0, h0] : [h0, w0]);
const coverScale = (W, H, deg) => { const a = Math.abs((deg * Math.PI) / 180), c = Math.cos(a), s = Math.sin(a); return Math.max((W * c + H * s) / W, (W * s + H * c) / H); };
// Draws the turned photo; kk = output px per work px; (ox, oy) = work point at the canvas's top-left.
const drawWork = (ctx, img, kk, ox, oy) => {
  const [W, H] = workDims();
  ctx.save();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.translate((W / 2 - ox) * kk, (H / 2 - oy) * kk);
  ctx.rotate((S.st * Math.PI) / 180);
  ctx.scale(S.fh, S.fv);
  ctx.rotate((S.rot * Math.PI) / 180);
  const cs = coverScale(W, H, S.st) * kk; ctx.scale(cs, cs);
  ctx.drawImage(img, -w0 / 2, -h0 / 2, w0, h0);
  ctx.restore();
};

// ---------- decode (EXIF rotation applied by the browser)
const decode = async (file) => {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* fall back */ } }
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; } finally { URL.revokeObjectURL(url); }
};
const dims = (s) => [s.naturalWidth || s.width, s.naturalHeight || s.height];
const shrinkTo = (img, maxSide) => {
  const [w, h] = dims(img); const s = Math.min(1, maxSide / Math.max(w, h)); if (s === 1) return img;
  let cur = img, cw = w, ch = h;
  while (cw / 2 >= w * s && ch / 2 >= h * s) { const c = mk(cw / 2, ch / 2); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, c.width, c.height); cur = c; cw = c.width; ch = c.height; }
  const out = mk(w * s, h * s); const x = out.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, out.width, out.height); return out;
};

let fileName = 'photo';
const loadFile = async (file) => {
  if (!file) return false;
  let img;
  try { img = await decode(file); } catch (e) { toast(t('failed')); return false; }
  let [w, h] = dims(img); let capped = false;
  if (w * h > MAX_AREA) { const s = Math.sqrt(MAX_AREA / (w * h)); img = shrinkTo(img, Math.floor(Math.max(w, h) * s)); [w, h] = dims(img); capped = true; }
  if (src && src.close) src.close();
  src = img; w0 = w; h0 = h; prev = shrinkTo(img, 1600);
  fileName = (file.name || 'photo').replace(/\.[^.]+$/, '').replace(/[^\wऀ-ॿঀ-৿-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'photo';
  S.rot = 0; S.fh = 1; S.fv = 1; S.st = 0; $('straight').value = '0';
  $('capNote').classList.toggle('hidden', !capped);
  $('drop').classList.add('hidden'); $('editor').classList.remove('hidden');
  resetCrop(); layout(); $('madeInfo').textContent = '';
  return true;
};

// ---------- crop box
const maxBox = (ar) => { const [W, H] = workDims(); if (!ar) return { x: 0, y: 0, w: W, h: H }; let w = W, h = W / ar; if (h > H) { h = H; w = H * ar; } return { x: (W - w) / 2, y: (H - h) / 2, w, h }; };
const resetCrop = () => { crop = maxBox(S.ar); };
const MIN = () => Math.max(8, 24 / k);
// Moves or resizes the box from `st0` by (dx, dy) work px; h = handle ('move', 'n', 'se', …).
const applyDrag = (h, st0, dx, dy) => {
  const [W, H] = workDims(); const min = Math.min(MIN(), W, H);
  if (h === 'move') { crop = { x: clamp(st0.x + dx, 0, W - st0.w), y: clamp(st0.y + dy, 0, H - st0.h), w: st0.w, h: st0.h }; return; }
  const ar = S.ar;
  if (ar && h.length === 2) {
    const east = h.includes('e'), south = h.includes('s');
    const ax = east ? st0.x : st0.x + st0.w, ay = south ? st0.y : st0.y + st0.h; // fixed opposite corner
    const px = (east ? st0.x + st0.w : st0.x) + dx, py = (south ? st0.y + st0.h : st0.y) + dy;
    let w = Math.abs(px - ax), hh = Math.abs(py - ay);
    if ((east ? px < ax : px > ax)) w = 0; if ((south ? py < ay : py > ay)) hh = 0;
    if (Math.abs(dx) >= Math.abs(dy) * ar) hh = w / ar; else w = hh * ar; // the bigger finger movement decides
    const maxW = east ? W - ax : ax, maxH = south ? H - ay : ay;
    if (w > maxW) { w = maxW; hh = w / ar; } if (hh > maxH) { hh = maxH; w = hh * ar; }
    const mw = ar >= 1 ? min * ar : min; if (w < mw) { w = mw; hh = w / ar; }
    crop = { x: east ? ax : ax - w, y: south ? ay : ay - hh, w, h: hh };
    return;
  }
  let x1 = st0.x, y1 = st0.y, x2 = st0.x + st0.w, y2 = st0.y + st0.h;
  if (h.includes('w')) x1 = clamp(x1 + dx, 0, x2 - min); if (h.includes('e')) x2 = clamp(x2 + dx, x1 + min, W);
  if (h.includes('n')) y1 = clamp(y1 + dy, 0, y2 - min); if (h.includes('s')) y2 = clamp(y2 + dy, y1 + min, H);
  crop = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
};
const outSize = () => {
  const cw = Math.max(1, Math.round(crop.w)), ch = Math.max(1, Math.round(crop.h));
  const ms = Math.round(Number($('maxSide').value) || 0);
  if (ms >= 16 && Math.max(cw, ch) > ms) { const s = ms / Math.max(cw, ch); return [Math.max(1, Math.round(cw * s)), Math.max(1, Math.round(ch * s)), s]; }
  return [cw, ch, 1];
};

// ---------- view
const layout = () => {
  if (!src) return;
  const [W, H] = workDims();
  const maxW = Math.max(120, $('stagewrap').clientWidth - 28), maxH = Math.max(200, Math.min(window.innerHeight * 0.58, 560));
  k = Math.min(maxW / W, maxH / H);
  const dw = Math.round(W * k), dh = Math.round(H * k), dpr = Math.min(2, window.devicePixelRatio || 1);
  $('stage').style.width = `${dw}px`; $('stage').style.height = `${dh}px`;
  const v = $('view'); v.width = Math.round(dw * dpr); v.height = Math.round(dh * dpr);
  const ctx = v.getContext('2d'); ctx.clearRect(0, 0, v.width, v.height);
  drawWork(ctx, prev, k * dpr, 0, 0);
  showFrame();
};
const showFrame = () => {
  const f = $('frame');
  f.style.left = `${crop.x * k}px`; f.style.top = `${crop.y * k}px`; f.style.width = `${crop.w * k}px`; f.style.height = `${crop.h * k}px`;
  f.classList.toggle('locked', !!S.ar);
  const [w, h] = outSize(); $('pxInfo').textContent = t('pxInfo')(w, h);
};

// ---------- transforms
const sgn = () => S.fh * S.fv;
const rotate = (dir) => { S.rot = (((S.rot + dir * sgn() * 90) % 360) + 360) % 360; resetCrop(); layout(); $('madeInfo').textContent = ''; };
const flip = (axis) => {
  const [W, H] = workDims();
  if (axis === 'h') { S.fh = -S.fh; crop.x = W - crop.x - crop.w; } else { S.fv = -S.fv; crop.y = H - crop.y - crop.h; }
  S.st = -S.st; $('straight').value = String(S.st); $('stVal').textContent = `${S.st}°`; // mirroring also mirrors the tilt
  layout(); $('madeInfo').textContent = '';
};
const setStraight = (v) => { S.st = clamp(Number(v) || 0, -15, 15); $('stVal').textContent = `${S.st}°`; layout(); $('madeInfo').textContent = ''; };
const setAspect = (ar) => { S.ar = ar; resetCrop(); document.querySelectorAll('#aspects .chip').forEach((b) => b.classList.toggle('on', Math.abs(Number(b.dataset.ar) - ar) < 1e-6)); if (src) showFrame(); };
const resetAll = () => { S.rot = 0; S.fh = 1; S.fv = 1; S.st = 0; $('straight').value = '0'; $('stVal').textContent = '0°'; setAspect(0); layout(); $('madeInfo').textContent = ''; };

// ---------- output
const encode = (c, type, q) => new Promise((r) => c.toBlob(r, type, q));
const exportBlob = async () => {
  const [ow, oh, s] = outSize();
  const c = mk(ow, oh); const ctx = c.getContext('2d');
  const type = fmt === 'png' ? 'image/png' : fmt === 'webp' ? 'image/webp' : 'image/jpeg';
  if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, ow, oh); }
  // big shrink in one draw looks jagged: go through a half-size copy of the photo first
  const img = s < 0.5 ? shrinkTo(src, Math.max(w0, h0) * s * 2) : src;
  drawWork(ctx, img, ow / crop.w, crop.x, crop.y);
  const q = Number($('quality').value) / 100;
  const blob = await encode(c, type, type === 'image/png' ? undefined : q);
  return { blob, w: ow, h: oh };
};
const extOf = (type) => (type === 'image/webp' ? 'webp' : type === 'image/png' ? 'png' : 'jpg');
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
const make = async () => { const r = await exportBlob(); $('madeInfo').textContent = t('made')(r.w, r.h, fmtSize(r.blob.size)); r.name = `${fileName}-${r.w}x${r.h}.${extOf(r.blob.type)}`; return r; };

// ---------- UI text
const applyTab = () => {
  $('panelCrop').classList.toggle('hidden', tab !== 'crop'); $('panelRot').classList.toggle('hidden', tab !== 'rotate');
  $('tabCrop').classList.toggle('on', tab === 'crop'); $('tabRot').classList.toggle('on', tab === 'rotate');
  // rotate page: its tab comes first
  if (PAGE && PAGE.tab === 'rotate') $('tabRot').parentNode.insertBefore($('tabRot'), $('tabCrop'));
};
const applyFmt = () => { document.querySelector(`input[name=fmt][value=${fmt}]`).checked = true; $('qBox').classList.toggle('hidden', fmt === 'png'); };
const setFaqLd = () => {
  let el = $('faqLd'); if (!el) { el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'faqLd'; document.head.appendChild(el); }
  const plain = (s) => s.replace(/<[^>]+>/g, '');
  el.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: t('faq').map(([q, a]) => ({ '@type': 'Question', name: plain(q), acceptedAnswer: { '@type': 'Answer', text: plain(a) } })) });
};
const applyLang = () => {
  document.documentElement.lang = lang === 'hinglish' ? 'hi-Latn' : lang;
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  $('langSel').value = lang;
  $('howList').innerHTML = t('how').map((s) => `<li>${s}</li>`).join('');
  $('tipList').innerHTML = t('tips').map((s) => `<li>${s}</li>`).join('');
  $('faqList').innerHTML = t('faq').map(([q, a]) => `<details class="faq"><summary>${q}</summary><p>${a}</p></details>`).join('');
  const L = (href, key, emoji, here) => `<a href="${href}?lang=${lang}"${here ? ' class="here"' : ''}>${emoji} ${esc(t(key)[0])}<small>${esc(t(key)[1])}</small></a>`;
  $('links').innerHTML = L(BASE, 'lCrop', '✂️', !PAGE) + L(`${BASE}rotate/`, 'lRot', '🔄', PAGE && PAGE.tab === 'rotate')
    + L(`/tools/image-compress/`, 'lComp', '🗜️') + L(`/tools/form-helper/`, 'lForm', '📝') + L(`/tools/signature-maker/`, 'lSig', '✍️');
  const info = PAGE && PAGE.T[lang] && PAGE.T[lang].info;
  $('pageInfo').classList.toggle('hidden', !info); if (info) $('pageInfo').innerHTML = info;
  // a sub-page has its own long text instead of the main page's guide
  $('guideSec').classList.toggle('hidden', !!PAGE); if (!PAGE) $('guideSec').innerHTML = t('guide');
  setFaqLd();
  if (src) showFrame();
};

// ---------- events
$('langSel').addEventListener('change', (e) => { lang = e.target.value; store.set('cr-lang', lang); applyLang(); });
$('pickBtn').addEventListener('click', (e) => { e.stopPropagation(); $('file').click(); });
$('camBtn').addEventListener('click', (e) => { e.stopPropagation(); $('cam').click(); });
$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', (e) => { e.preventDefault(); $('drop').classList.remove('over'); loadFile(e.dataTransfer.files[0]); });
document.addEventListener('paste', (e) => { const f = e.clipboardData && e.clipboardData.files[0]; if (f) loadFile(f); });
['file', 'cam'].forEach((id) => $(id).addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; }));
$('newBtn').addEventListener('click', () => $('file').click());
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; applyTab(); }));
$('aspects').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) setAspect(Number(b.dataset.ar)); });
$('rotL').addEventListener('click', () => rotate(-1));
$('rotR').addEventListener('click', () => rotate(1));
$('flipH').addEventListener('click', () => flip('h'));
$('flipV').addEventListener('click', () => flip('v'));
$('straight').addEventListener('input', (e) => setStraight(e.target.value));
$('straight').addEventListener('dblclick', () => { $('straight').value = '0'; setStraight(0); });
$('resetBtn').addEventListener('click', resetAll);
document.querySelectorAll('input[name=fmt]').forEach((r) => r.addEventListener('change', (e) => { fmt = e.target.value; store.set('cr-fmt', fmt); applyFmt(); $('madeInfo').textContent = ''; }));
$('quality').addEventListener('input', (e) => { $('qVal').textContent = e.target.value; $('madeInfo').textContent = ''; });
$('maxSide').addEventListener('input', () => { if (src) showFrame(); $('madeInfo').textContent = ''; });
let drag = null;
$('stage').addEventListener('pointerdown', (e) => {
  const h = e.target.dataset && e.target.dataset.h ? e.target.dataset.h : e.target.closest('#frame') ? 'move' : null;
  if (!h) return;
  e.preventDefault(); $('stage').setPointerCapture(e.pointerId);
  drag = { h, id: e.pointerId, sx: e.clientX, sy: e.clientY, st0: { ...crop } };
});
$('stage').addEventListener('pointermove', (e) => { if (!drag || e.pointerId !== drag.id) return; applyDrag(drag.h, drag.st0, (e.clientX - drag.sx) / k, (e.clientY - drag.sy) / k); showFrame(); $('madeInfo').textContent = ''; });
const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
$('stage').addEventListener('pointerup', endDrag); $('stage').addEventListener('pointercancel', endDrag);
$('dlBtn').addEventListener('click', async () => { if (!src) return; const r = await make(); download(r.blob, r.name); toast(t('saved')); });
$('shareBtn').addEventListener('click', async () => {
  if (!src) return; const r = await make(); const f = new File([r.blob], r.name, { type: r.blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) { /* cancelled */ } return; }
  download(r.blob, r.name); toast(t('saved'));
});
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

// ---------- start
$('year').textContent = new Date().getFullYear();
applyFmt(); applyTab(); setAspect(0); applyLang();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(`${BASE}sw.js`).catch(() => {});

// ---------- self test (?selftest): checks crop shapes, turns, flips and colours on a drawn test picture
const selftest = async () => {
  const box = $('selftest'); box.classList.remove('hidden'); let pass = 0, fail = 0;
  const log = (ok, name, info) => { if (ok) pass += 1; else fail += 1; box.textContent += `${ok ? 'PASS' : 'FAIL'} ${name}${info ? ` — ${info}` : ''}\n`; };
  try {
    // 400 × 200 picture: red | green on top, blue | yellow below
    const tc = mk(400, 200), tx = tc.getContext('2d');
    [['#ff0000', 0, 0], ['#00ff00', 200, 0], ['#0000ff', 0, 100], ['#ffff00', 200, 100]].forEach(([c, x, y]) => { tx.fillStyle = c; tx.fillRect(x, y, 200, 100); });
    const tb = await encode(tc, 'image/png');
    await loadFile(new File([tb], 'test.png', { type: 'image/png' }));
    const COL = { red: [255, 0, 0], green: [0, 255, 0], blue: [0, 0, 255], yellow: [255, 255, 0] };
    const near = (p, c, tol = 40) => Math.abs(p[0] - c[0]) < tol && Math.abs(p[1] - c[1]) < tol && Math.abs(p[2] - c[2]) < tol;
    const grab = async () => { const r = await exportBlob(); const b = await createImageBitmap(r.blob); const c = mk(b.width, b.height); const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(b, 0, 0); return { r, w: b.width, h: b.height, px: (X, Y) => [...x.getImageData(X, Y, 1, 1).data] }; };
    const check = async (name, fn, w, h, corners) => {
      resetAll(); fmt = 'png'; applyFmt(); await fn(); const g = await grab();
      const sizeOk = g.w === w && g.h === h;
      const cs = Object.entries(corners).map(([pos, col]) => { const X = pos.includes('r') ? g.w - 3 : 2, Y = pos.includes('b') ? g.h - 3 : 2; const p = g.px(X, Y); return [pos, col, near(p, COL[col]), p.slice(0, 3).join(',')]; });
      log(sizeOk && cs.every((c) => c[2]), name, `${g.w}×${g.h} (want ${w}×${h}); ${cs.map((c) => `${c[0]}=${c[3]} want ${c[1]}`).join('; ')}`);
    };
    await check('no change', () => {}, 400, 200, { tl: 'red', tr: 'green', bl: 'blue', br: 'yellow' });
    await check('rotate 90 right', () => rotate(1), 200, 400, { tl: 'blue', tr: 'red', bl: 'yellow', br: 'green' });
    await check('rotate 90 left', () => rotate(-1), 200, 400, { tl: 'green', tr: 'yellow', bl: 'red', br: 'blue' });
    await check('rotate 180', () => { rotate(1); rotate(1); }, 400, 200, { tl: 'yellow', br: 'red' });
    await check('flip horizontal', () => flip('h'), 400, 200, { tl: 'green', tr: 'red', bl: 'yellow' });
    await check('flip vertical', () => flip('v'), 400, 200, { tl: 'blue', bl: 'red', tr: 'yellow' });
    await check('rotate right then mirror', () => { rotate(1); flip('h'); }, 200, 400, { tl: 'red', tr: 'blue' });
    await check('mirror then rotate right', () => { flip('h'); rotate(1); }, 200, 400, { tl: 'yellow', tr: 'green' });
    await check('crop 1:1 (centred)', () => setAspect(1), 200, 200, { tl: 'red', tr: 'green', bl: 'blue', br: 'yellow' });
    await check('crop 4:3', () => setAspect(4 / 3), 267, 200, { tl: 'red', br: 'yellow' });
    await check('crop 3:4', () => setAspect(0.75), 150, 200, { tl: 'red', br: 'yellow' });
    await check('crop 16:9', () => setAspect(16 / 9), 356, 200, { tl: 'red', br: 'yellow' });
    await check('crop 9:16', () => setAspect(9 / 16), 113, 200, { tl: 'red', br: 'yellow' });
    await check('crop passport 3.5:4.5', () => setAspect(3.5 / 4.5), 156, 200, { tl: 'red', br: 'yellow' });
    await check('rotate right + 16:9', () => { rotate(1); setAspect(16 / 9); }, 200, 113, { tl: 'blue', tr: 'red' });
    await check('drag: free box, pull top-left corner to centre', () => { applyDrag('nw', { ...crop }, 200, 100); }, 200, 100, { tl: 'yellow', br: 'yellow' });
    await check('drag: 1:1 box, shrink by corner then move left', () => { setAspect(1); applyDrag('se', { ...crop }, -100, -10); applyDrag('move', { ...crop }, -500, -500); }, 100, 100, { tl: 'red', br: 'red' });
    await check('drag: free box, pull right side', () => { applyDrag('e', { ...crop }, -250, 0); }, 150, 200, { tl: 'red', br: 'blue' });
    // straighten: same size, no empty corners
    resetAll(); fmt = 'png'; applyFmt(); setStraight(10);
    let g = await grab(); const alphas = [g.px(0, 0)[3], g.px(399, 0)[3], g.px(0, 199)[3], g.px(399, 199)[3]];
    log(g.w === 400 && g.h === 200 && alphas.every((a) => a === 255), 'straighten +10°: size kept, corners filled', `${g.w}×${g.h}, corner alpha ${alphas.join(',')}`);
    const cpx = g.px(200, 100); log(!near(cpx, [0, 0, 0], 30), 'straighten: centre has picture', cpx.join(','));
    setStraight(-15); g = await grab(); log([g.px(0, 0)[3], g.px(399, 199)[3]].every((a) => a === 255), 'straighten −15°: corners filled');
    resetAll(); setStraight(8); flip('h'); log(S.st === -8 && $('straight').value === '-8', 'mirror flips the tilt too', `st=${S.st}`);
    // output size + formats
    resetAll(); $('maxSide').value = '100'; fmt = 'png'; applyFmt(); g = await grab(); log(g.w === 100 && g.h === 50, 'longest side 100 px', `${g.w}×${g.h}`); $('maxSide').value = '';
    fmt = 'jpeg'; applyFmt(); g = await grab(); log(g.r.blob.type === 'image/jpeg' && near(g.px(2, 2), COL.red), 'JPG output', `${g.r.blob.type} ${g.r.blob.size} B`);
    if (webpOk) { fmt = 'webp'; applyFmt(); g = await grab(); log(g.r.blob.type === 'image/webp', 'WebP output', g.r.blob.type); }
    $('quality').value = '50'; fmt = 'jpeg'; const lo = (await exportBlob()).blob.size; $('quality').value = '100'; const hi = (await exportBlob()).blob.size; $('quality').value = '92';
    log(lo < hi, 'quality changes size', `q50 ${lo} B < q100 ${hi} B`);
    // EXIF orientation 6 (turn right): 40×20 JPEG red|blue must open as 20×40 with red on top
    const ec = mk(40, 20), ex = ec.getContext('2d'); ex.fillStyle = '#ff0000'; ex.fillRect(0, 0, 20, 20); ex.fillStyle = '#0000ff'; ex.fillRect(20, 0, 20, 20);
    const jb = new Uint8Array(await (await encode(ec, 'image/jpeg', 0.95)).arrayBuffer());
    const app1 = new Uint8Array([0xff, 0xe1, 0, 34, 0x45, 0x78, 0x69, 0x66, 0, 0, 0x4d, 0x4d, 0, 0x2a, 0, 0, 0, 8, 0, 1, 0x01, 0x12, 0, 3, 0, 0, 0, 1, 0, 6, 0, 0, 0, 0, 0, 0]);
    const exifFile = new File([jb.slice(0, 2), app1, jb.slice(2)], 'exif.jpg', { type: 'image/jpeg' });
    await loadFile(exifFile); fmt = 'png'; applyFmt(); resetAll(); g = await grab();
    log(g.w === 20 && g.h === 40 && near(g.px(10, 3), COL.red, 70) && near(g.px(10, 36), COL.blue, 70), 'EXIF orientation 6 opens upright', `${g.w}×${g.h}, top=${g.px(10, 3).slice(0, 3)}, bottom=${g.px(10, 36).slice(0, 3)}`);
    // languages: same keys everywhere, every label filled
    const keys = Object.keys(T.hinglish).sort().join();
    for (const l of LANGS) {
      lang = l; applyLang();
      const empty = [...document.querySelectorAll('[data-t]')].filter((el) => !el.textContent.trim()).map((el) => el.dataset.t);
      const ld = JSON.parse($('faqLd').textContent); const words = document.querySelector('.wrap').innerText.split(/\s+/).length;
      log(Object.keys(T[l]).sort().join() === keys && !empty.length && ld.mainEntity.length === t('faq').length && ld.mainEntity[0].name === t('faq')[0][0], `language ${l}`, empty.length ? `empty: ${empty.join(',')}` : `${document.querySelectorAll('[data-t]').length} labels, ${ld.mainEntity.length} FAQ in JSON-LD, ~${words} words on page`);
    }
    lang = 'hinglish'; applyLang();
  } catch (e) { log(false, 'crashed', String(e && e.stack || e)); }
  box.textContent += `SELFTEST DONE: ${pass} pass, ${fail} fail\n`;
  fmt = 'jpeg'; applyFmt();
};
// Headless Chrome's virtual clock runs ahead while the page waits on picture decoding; a chain of tiny
// image loads keeps it paused until the test is done (test only).
const holdClock = (p) => { let done = false; p.then(() => { done = true; }, () => { done = true; }); const tiny = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='; let n = 0; const tick = () => { if (done || (n += 1) > 3000000) return; const i = new Image(); i.onload = tick; i.onerror = tick; i.src = `${tiny}#${Math.random()}`; }; tick(); return p; };
if (params.has('selftest')) holdClock(selftest());
</script>
</body>
