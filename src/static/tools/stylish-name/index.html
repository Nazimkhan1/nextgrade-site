  const mapStr = (fn) => (s) => [...s].map(fn).join('');
  const SC = { a: 'ᴀ', b: 'ʙ', c: 'ᴄ', d: 'ᴅ', e: 'ᴇ', f: 'ꜰ', g: 'ɢ', h: 'ʜ', i: 'ɪ', j: 'ᴊ', k: 'ᴋ', l: 'ʟ', m: 'ᴍ', n: 'ɴ', o: 'ᴏ', p: 'ᴘ', q: 'ǫ', r: 'ʀ', s: 'ꜱ', t: 'ᴛ', u: 'ᴜ', v: 'ᴠ', w: 'ᴡ', x: 'x', y: 'ʏ', z: 'ᴢ' };
  const UD = { a: 'ɐ', b: 'q', c: 'ɔ', d: 'p', e: 'ǝ', f: 'ɟ', g: 'ƃ', h: 'ɥ', i: 'ᴉ', j: 'ɾ', k: 'ʞ', l: 'l', m: 'ɯ', n: 'u', o: 'o', p: 'd', q: 'b', r: 'ɹ', s: 's', t: 'ʇ', u: 'n', v: 'ʌ', w: 'ʍ', x: 'x', y: 'ʎ', z: 'z', '.': '˙', ',': "'", '?': '¿', '!': '¡', '(': ')', ')': '(' };
  const circled = (ch) => { const c = ch.codePointAt(0); if (c >= 65 && c <= 90) return String.fromCodePoint(0x24B6 + c - 65); if (c >= 97 && c <= 122) return String.fromCodePoint(0x24D0 + c - 97); if (c >= 49 && c <= 57) return String.fromCodePoint(0x2460 + c - 49); if (c === 48) return '⓪'; return ch; };
  const squared = (ch) => { const c = ch.toUpperCase().codePointAt(0); return c >= 65 && c <= 90 ? String.fromCodePoint(0x1F170 + c - 65) : ch; };
  const combine = (mark) => (s) => [...s].map((ch) => (ch === ' ' ? ch : ch + mark)).join('');
  const LATIN = [
    ['Bold', mapStr(range(0x1D400, 0x1D41A, 0x1D7CE))],
    ['Italic', mapStr(withHoles(range(0x1D434, 0x1D44E, 0), { h: 'ℎ' }))],
    ['Bold italic', mapStr(range(0x1D468, 0x1D482, 0))],
    ['Script', mapStr(withHoles(range(0x1D49C, 0x1D4B6, 0), { B: 'ℬ', E: 'ℰ', F: 'ℱ', H: 'ℋ', I: 'ℐ', L: 'ℒ', M: 'ℳ', R: 'ℛ', e: 'ℯ', g: 'ℊ', o: 'ℴ' }))],
    ['Bold script', mapStr(range(0x1D4D0, 0x1D4EA, 0))],
    ['Fraktur', mapStr(withHoles(range(0x1D504, 0x1D51E, 0), { C: 'ℭ', H: 'ℌ', I: 'ℑ', R: 'ℜ', Z: 'ℨ' }))],
    ['Bold fraktur', mapStr(range(0x1D56C, 0x1D586, 0))],
    ['Double-struck', mapStr(withHoles(range(0x1D538, 0x1D552, 0x1D7D8), { C: 'ℂ', H: 'ℍ', N: 'ℕ', P: 'ℙ', Q: 'ℚ', R: 'ℝ', Z: 'ℤ' }))],
    ['Sans', mapStr(range(0x1D5A0, 0x1D5BA, 0x1D7E2))],
    ['Sans bold', mapStr(range(0x1D5D4, 0x1D5EE, 0x1D7EC))],
    ['Sans italic', mapStr(range(0x1D608, 0x1D622, 0))],
    ['Sans bold italic', mapStr(range(0x1D63C, 0x1D656, 0))],
    ['Monospace', mapStr(range(0x1D670, 0x1D68A, 0x1D7F6))],
    ['Small caps', mapStr((ch) => SC[ch.toLowerCase()] || ch)],
    ['Circled', mapStr(circled)],
    ['Squared', mapStr(squared)],
    ['Wide', mapStr(range(0xFF21, 0xFF41, 0xFF10))],
    ['Upside down', (s) => [...s].map((ch) => UD[ch.toLowerCase()] || ch).reverse().join('')],
    ['Strikethrough', combine('̶')],
    ['Underline', combine('̲')],
  ];
  // decorations work for any script, including Hindi and Bangla names
  const DECOR = [
    (s) => `꧁ ${s} ꧂`, (s) => `꧁༺ ${s} ༻꧂`, (s) => `★彡 ${s} 彡★`, (s) => `✿ ${s} ✿`, (s) => `♡ ${s} ♡`, (s) => `『${s}』`, (s) => `【${s}】`,
    (s) => `•´¯\`•. ${s} .•´¯\`•`, (s) => `ıllıllı ${s} ıllıllı`, (s) => `▄︻デ ${s} ══━一`, (s) => `×͜× ${s}`, (s) => `🌸 ${s} 🌸`, (s) => `👑 ${s} 👑`, (s) => `⚡ ${s} ⚡`,
  ];

  // ---------- page
  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private */ } } };
  const params = new URLSearchParams(location.search);
  const LANGS = ['hinglish', 'hi', 'en', 'bn'];
  const deviceLang = () => { const l = (navigator.language || '').toLowerCase(); if (l.startsWith('bn')) return 'bn'; if (l.startsWith('hi')) return 'hi'; return l.endsWith('-in') ? 'hinglish' : 'en'; };
  let lang = LANGS.includes(params.get('lang')) ? params.get('lang') : LANGS.includes(store.get('sn-lang')) ? store.get('sn-lang') : deviceLang();
  const t = (k) => T[lang][k];
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let outputs = [];
  const render = () => {
    const raw = $('name').value.slice(0, 40);
    const text = raw.trim() ? raw : t('sample');
    const hasLatin = /[A-Za-z0-9]/.test(text), hasIndic = /[ऀ-ॿঀ-৿]/.test(text);
    $('hindiNote').hidden = !hasIndic;
    outputs = [];
    if (hasLatin) LATIN.forEach(([label, fn]) => outputs.push([label, fn(text)]));
    DECOR.forEach((fn) => outputs.push(['', fn(text)]));
    if (hasLatin) [[LATIN[0][1], DECOR[0]], [LATIN[3][1], DECOR[3]], [LATIN[13][1], DECOR[2]], [LATIN[7][1], DECOR[10]]].forEach(([f, d]) => outputs.push(['', d(f(text))]));
    $('list').innerHTML = outputs.map(([label, out], i) => `<div class="row"><div><span class="lbl">${esc(label)}</span><span class="out">${esc(out)}</span></div><button class="copy" type="button" data-i="${i}">${esc(t('copy'))}</button></div>`).join('');
  };
  const applyLang = () => {
    document.documentElement.lang = lang === 'hinglish' ? 'en-IN' : lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { const v = t(el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    $('howList').innerHTML = t('how').map((li) => `<li>${li}</li>`).join('');
    $('faqList').innerHTML = t('faq').map(([q, a]) => `<h3>${q}</h3><p>${a}</p>`).join('');
    const p = PREFIX[lang];
    $('home').href = `https://nextgrade.in${p}/`; $('moreLink').href = `https://nextgrade.in${p}/games/`;
    render();
  };
  $('lang').addEventListener('change', (e) => { lang = LANGS.includes(e.target.value) ? e.target.value : 'en'; store.set('sn-lang', lang); applyLang(); });
  $('name').addEventListener('input', render);
  $('list').addEventListener('click', (e) => {
    const b = e.target.closest('.copy'); if (!b) return;
    const text = outputs[+b.dataset.i][1];
    const done = () => { b.textContent = t('copied'); b.classList.add('done'); setTimeout(() => { b.textContent = t('copy'); b.classList.remove('done'); }, 1500); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done).catch(() => { window.prompt(t('copy'), text); });
  });
  if (params.get('name')) $('name').value = params.get('name').slice(0, 40);
  $('year').textContent = new Date().getFullYear();
  window.__sn = { get count() { return outputs.length; }, get first() { return outputs[0] && outputs[0][1]; } };
  applyLang();
})();
</script>
</body>
</html>
