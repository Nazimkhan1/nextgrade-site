<script>window.SM_PAGE = {"mode": "text", "base": "../", "slug": "text-sticker", "T": {"hinglish": {"title": "Text sticker banao — Hinglish, Hindi, Bangla mein", "sub": "Kuch shabd likho, font aur rang chuno — safed kinare wala 512×512 WebP sticker, 100 KB se kam. Good morning, Shukriya, Ha ha… sab apni bhasha mein.", "art": "<h2>Apni bhasha mein text sticker</h2>\n<p>Kabhi-kabhi photo se zyada kaam do shabd kar dete hain: family group mein ek \"Good morning\", dost ko ek \"Shukriya\", ya kisi mazaak par zor se \"Ha ha ha\". Yeh page seedha text mode mein khulta hai. Koi bhi chhoti line likho, font aur rang chuno, aur tool use safed kinare wala sticker bana deta hai — 512 × 512 pixel, WebP, 100 KB se kam. Roman akshar (Hinglish aur English), Devanagari (Hindi, Marathi) aur Bangla lipi, teeno chalti hain. Fonts tool ke andar hi rakhe hain, isliye har phone par akshar ek jaise dikhte hain, chahe phone mein woh font ho ya na ho.</p>\n<h2>Text sticker banane ke steps</h2>\n<ol><li>Box mein apni line likho, ya neeche diye gaye taiyaar shabdon mein se kisi par tap karo.</li><li>Lambi line apne aap do ya teen hisson mein toot jaati hai taaki sticker chaukor rahe. Apni marzi se todna ho to Enter dabakar nayi line shuru karo.</li><li>Font chuno: <b>Baloo</b> gol aur mota hai, <b>Kalam</b> haath ki likhai jaisa, <b>Galada</b> Bangla ke liye design wala, aur <b>Bangers</b> English ke liye comic style.</li><li>Akshar ka rang, akshar ka kinara aur kinare ki motai set karo. Chaho to <b>peeche rang ka patch</b> on karo — shabdon ke peeche ek gol kono wala rangeen dibba aa jaata hai.</li><li><b>Tray mein daalo</b> dabao, doosri line likho, aur aise poora set bana lo.</li><li>Tray se ek-ek download karo, sab ek ZIP mein lo, ya seedha share karo.</li></ol>\n<h2>Text sticker set ke ideas</h2>\n<ul><li><b>Roz ki duaa-salaam:</b> Good morning, Good night, Shubh din, Jai Shri Krishna jaisa apna roz ka salaam.</li><li><b>Jhatpat jawab:</b> OK, Aa raha hoon, Baad mein call karta hoon, Shukriya, Sorry yaar.</li><li><b>Reactions:</b> Waah!, Ha ha ha, Kya baat hai!, Sach mein?</li><li><b>Family group ke liye:</b> Khana kha liya?, Ghar pahunch gaye?, Dhyan rakhna.</li><li><b>Tyohaar:</b> Diwali, Eid, Holi, Durga Puja, Chhath ki badhai — har tyohaar ka chhota sa set.</li><li><b>Apna andaaz:</b> apna ya kisi dost ka pyaar ka naam, ya woh line jo aap hamesha bolte ho.</li></ul>\n<h2>Akshar saaf padhe jaayein, iske liye</h2>\n<p>Chat mein sticker chhota dikhta hai, isliye ek se chaar shabd sabse achhe rehte hain. Halke rang (peela, safed) ke saath gehra kinara, ya gehre rang ke saath safed patch, dono theme par padhe jaate hain. Kinare ki motai 8 se 12 ke beech rakho. Hindi ki matraayein aur Bangla ke upar-neeche ke chinh jagah lete hain — tool unke liye jagah chhodta hai, phir bhi bahut lambi line ki jagah do chhoti lines achhi lagti hain.</p>\n<h2>Bhejna aur WhatsApp mein lagana</h2>\n<p>Save hui WebP file ko chat mein seedha bhej sakte ho. Sticker ki tarah tray mein rakhna ho to Android par koi sticker-pack app lo, usmein kam se kam teen sticker import karo aur pack WhatsApp mein add karo. Yeh tool alag se bana hai, WhatsApp se iska koi rishta nahi hai.</p>\n<h2>Kuch gadbad lage to</h2>\n<ul><li><b>Akshar ki jagah chaukor dibba:</b> chuna hua font us lipi ko nahi jaanta — Baloo (auto) chuno.</li><li><b>Akshar bahut chhote:</b> line chhoti karo ya do lines mein todo.</li><li><b>PNG save hua:</b> kuch iPhone browser WebP nahi banate; Chrome mein kholo ya sticker-pack app se badlo.</li></ul>", "faq": [["Kaun-kaun si bhasha mein likh sakte hain?", "Hinglish aur English (Roman akshar), Hindi aur Marathi (Devanagari), aur Bangla. Teeno lipiyon ke fonts tool ke andar hain, kuch download nahi karna padta."], ["Kya emoji bhi daal sakte hain?", "Haan. Emoji aapke phone ke apne emoji font se banta hai aur sticker ki tasveer mein hi chhap jaata hai, isliye jisko bhejoge use bhi waisa hi dikhega."], ["Line kahan se tootegi, yeh khud chun sakte hain?", "Haan. Box mein Enter dabakar nayi line shuru karo. Ek hi lambi line ho to tool use khud do ya teen barabar hisson mein todta hai."], ["Safed kinara kyon zaroori hai?", "Kinara sticker ko dark aur light dono chat background par alag dikhata hai. Na chahiye to \"Kinara lagao\" band kar do."], ["Kya yeh free hai aur kya kuch upload hota hai?", "Poora free hai, login nahi chahiye. Sticker aapke phone/browser mein hi banta hai; koi text ya tasveer kisi server par nahi jaati."]]}, "hi": {"title": "टेक्स्ट स्टिकर बनाएँ — हिंदी, बांग्ला, हिंग्लिश में", "sub": "कुछ शब्द लिखें, फ़ॉन्ट और रंग चुनें — सफ़ेद किनारे वाला 512×512 WebP स्टिकर, 100 KB से कम। सुप्रभात, धन्यवाद, हा हा… सब अपनी भाषा में।", "art": "<h2>अपनी भाषा में टेक्स्ट स्टिकर</h2>\n<p>कभी-कभी फ़ोटो से ज़्यादा काम दो शब्द कर देते हैं: परिवार के ग्रुप में एक \"सुप्रभात\", दोस्त को एक \"धन्यवाद\", या किसी मज़ाक पर ज़ोर से \"हा हा हा\"। यह पेज सीधे टेक्स्ट मोड में खुलता है। कोई भी छोटी लाइन लिखें, फ़ॉन्ट और रंग चुनें, और टूल उसे सफ़ेद किनारे वाला स्टिकर बना देता है — 512 × 512 पिक्सेल, WebP, 100 KB से कम। रोमन अक्षर (हिंग्लिश और अंग्रेज़ी), देवनागरी (हिंदी, मराठी) और बांग्ला लिपि, तीनों चलती हैं। फ़ॉन्ट टूल के अंदर ही रखे हैं, इसलिए हर फ़ोन पर अक्षर एक जैसे दिखते हैं, चाहे फ़ोन में वह फ़ॉन्ट हो या न हो।</p>\n<h2>टेक्स्ट स्टिकर बनाने के क़दम</h2>\n<ol><li>बॉक्स में अपनी लाइन लिखें, या नीचे दिए तैयार शब्दों में से किसी पर टैप करें।</li><li>लंबी लाइन अपने आप दो या तीन हिस्सों में टूट जाती है ताकि स्टिकर चौकोर रहे। अपनी मर्ज़ी से तोड़ना हो तो Enter दबाकर नई लाइन शुरू करें।</li><li>फ़ॉन्ट चुनें: <b>Baloo</b> गोल और मोटा है, <b>Kalam</b> हाथ की लिखाई जैसा, <b>Galada</b> बांग्ला के लिए डिज़ाइन वाला, और <b>Bangers</b> अंग्रेज़ी के लिए कॉमिक शैली।</li><li>अक्षर का रंग, अक्षर का किनारा और किनारे की मोटाई सेट करें। चाहें तो <b>पीछे रंग का पैच</b> चालू करें — शब्दों के पीछे गोल कोनों वाला रंगीन डिब्बा आ जाता है।</li><li><b>ट्रे में डालें</b> दबाएँ, दूसरी लाइन लिखें, और ऐसे पूरा सेट बना लें।</li><li>ट्रे से एक-एक डाउनलोड करें, सब एक ZIP में लें, या सीधे शेयर करें।</li></ol>\n<h2>टेक्स्ट स्टिकर सेट के विचार</h2>\n<ul><li><b>रोज़ की दुआ-सलाम:</b> सुप्रभात, शुभ रात्रि, शुभ दिन, राम राम जैसा अपना रोज़ का अभिवादन।</li><li><b>झटपट जवाब:</b> ठीक है, आ रहा हूँ, बाद में फ़ोन करता हूँ, धन्यवाद, माफ़ करना।</li><li><b>प्रतिक्रियाएँ:</b> वाह!, हा हा हा, क्या बात है!, सच में?</li><li><b>परिवार के ग्रुप के लिए:</b> खाना खा लिया?, घर पहुँच गए?, ध्यान रखना।</li><li><b>त्योहार:</b> दीवाली, ईद, होली, दुर्गा पूजा, छठ की बधाई — हर त्योहार का छोटा सा सेट।</li><li><b>अपना अंदाज़:</b> अपना या किसी दोस्त का प्यार का नाम, या वह लाइन जो आप हमेशा बोलते हैं।</li></ul>\n<h2>अक्षर साफ़ पढ़े जाएँ, इसके लिए</h2>\n<p>चैट में स्टिकर छोटा दिखता है, इसलिए एक से चार शब्द सबसे अच्छे रहते हैं। हल्के रंग (पीला, सफ़ेद) के साथ गहरा किनारा, या गहरे रंग के साथ सफ़ेद पैच, दोनों थीम पर पढ़े जाते हैं। किनारे की मोटाई 8 से 12 के बीच रखें। हिंदी की मात्राएँ और बांग्ला के ऊपर-नीचे के चिह्न जगह लेते हैं — टूल उनके लिए जगह छोड़ता है, फिर भी बहुत लंबी लाइन की जगह दो छोटी लाइनें अच्छी लगती हैं।</p>\n<h2>भेजना और WhatsApp में लगाना</h2>\n<p>सेव हुई WebP फ़ाइल को चैट में सीधे भेज सकते हैं। स्टिकर की तरह ट्रे में रखना हो तो Android पर कोई स्टिकर-पैक ऐप लें, उसमें कम से कम तीन स्टिकर इम्पोर्ट करें और पैक WhatsApp में जोड़ें। यह टूल अलग से बना है, WhatsApp से इसका कोई संबंध नहीं है।</p>\n<h2>कुछ गड़बड़ लगे तो</h2>\n<ul><li><b>अक्षर की जगह चौकोर डिब्बा:</b> चुना हुआ फ़ॉन्ट उस लिपि को नहीं जानता — Baloo (ऑटो) चुनें।</li><li><b>अक्षर बहुत छोटे:</b> लाइन छोटी करें या दो लाइनों में तोड़ें।</li><li><b>PNG सेव हुआ:</b> कुछ iPhone ब्राउज़र WebP नहीं बनाते; Chrome में खोलें या स्टिकर-पैक ऐप से बदलें।</li></ul>", "faq": [["किन-किन भाषाओं में लिख सकते हैं?", "हिंग्लिश और अंग्रेज़ी (रोमन अक्षर), हिंदी और मराठी (देवनागरी), और बांग्ला। तीनों लिपियों के फ़ॉन्ट टूल के अंदर हैं, कुछ डाउनलोड नहीं करना पड़ता।"], ["क्या इमोजी भी डाल सकते हैं?", "हाँ। इमोजी आपके फ़ोन के अपने इमोजी फ़ॉन्ट से बनता है और स्टिकर की तस्वीर में ही छप जाता है, इसलिए जिसे भेजेंगे उसे भी वैसा ही दिखेगा।"], ["लाइन कहाँ से टूटेगी, यह ख़ुद चुन सकते हैं?", "हाँ। बॉक्स में Enter दबाकर नई लाइन शुरू करें। एक ही लंबी लाइन हो तो टूल उसे ख़ुद दो या तीन बराबर हिस्सों में तोड़ता है।"], ["सफ़ेद किनारा क्यों ज़रूरी है?", "किनारा स्टिकर को गहरे और हल्के दोनों चैट बैकग्राउंड पर अलग दिखाता है। न चाहिए तो \"किनारा लगाएँ\" बंद कर दें।"], ["क्या यह फ़्री है और क्या कुछ अपलोड होता है?", "पूरी तरह फ़्री है, लॉगिन नहीं चाहिए। स्टिकर आपके फ़ोन/ब्राउज़र में ही बनता है; कोई टेक्स्ट या तस्वीर किसी सर्वर पर नहीं जाती।"]]}, "en": {"title": "Make a text sticker — in Hinglish, Hindi or Bengali", "sub": "Type a few words, pick a font and colours — get a 512×512 WebP sticker with a white border, under 100 KB. Good morning, Thank you, Ha ha… in your own language.", "art": "<h2>Text stickers in your own language</h2>\n<p>Sometimes two words do more than a photo: a quick \"Good morning\" for the family group, a \"Shukriya\" for a friend, or a loud \"Ha ha ha\" in reply to a joke. This page opens straight in text mode. Type any short line, choose a font and colours, and the tool turns it into a sticker with a clean white border — 512 × 512 pixels, WebP, under 100 KB. It handles Roman letters (Hinglish and English), Devanagari (Hindi, Marathi) and Bengali script. The fonts are stored inside the tool, so the letters look the same on every phone, whether or not that phone has the font.</p>\n<h2>Steps to make a text sticker</h2>\n<ol><li>Type your line in the box, or tap one of the ready phrases below it.</li><li>A long line is split into two or three parts on its own so the sticker stays square. To choose the break yourself, press Enter to start a new line.</li><li>Pick a font: <b>Baloo</b> is round and bold, <b>Kalam</b> looks handwritten, <b>Galada</b> is a display style for Bengali, and <b>Bangers</b> is a comic style for English.</li><li>Set the letter colour, the letter edge and its thickness. Turn on the <b>colour patch behind</b> if you want a rounded coloured box behind the words.</li><li>Tap <b>Add to tray</b>, type the next line, and build a whole set this way.</li><li>Download them one by one from the tray, all together as a ZIP, or share them directly.</li></ol>\n<h2>Ideas for a text sticker set</h2>\n<ul><li><b>Daily greetings:</b> Good morning, Good night, Have a nice day, or the greeting your family always uses.</li><li><b>Quick replies:</b> OK, On my way, Will call later, Thank you, Sorry.</li><li><b>Reactions:</b> Wow!, Ha ha ha, Well said!, Really?</li><li><b>For the family group:</b> Had lunch?, Reached home?, Take care.</li><li><b>Festivals:</b> a small set of wishes for Diwali, Eid, Holi, Durga Puja or Chhath.</li><li><b>Your own style:</b> your nickname or a friend's, or the line you always say.</li></ul>\n<h2>Making the words easy to read</h2>\n<p>A sticker looks small in a chat, so one to four words work best. Light letters (yellow, white) with a dark edge, or dark letters on a white patch, can be read on both light and dark themes. Keep the edge thickness between 8 and 12. Hindi vowel signs and the marks above and below Bengali letters need room — the tool leaves space for them, but two short lines still look better than one very long one.</p>\n<h2>Sending and adding to WhatsApp</h2>\n<p>You can send the saved WebP file straight into a chat. To keep it in the sticker tray, use a sticker-pack app on Android, import at least three stickers and add the pack to WhatsApp. This tool is made independently and has no connection with WhatsApp.</p>\n<h2>If something looks wrong</h2>\n<ul><li><b>Boxes instead of letters:</b> the chosen font does not know that script — pick Baloo (auto).</li><li><b>Letters too small:</b> shorten the line or split it into two lines.</li><li><b>Saved as PNG:</b> some iPhone browsers cannot make WebP; open the page in Chrome or convert it in a sticker-pack app.</li></ul>", "faq": [["Which languages can I write in?", "Hinglish and English (Roman letters), Hindi and Marathi (Devanagari), and Bengali. Fonts for all three scripts are inside the tool, so nothing extra has to be installed."], ["Can I add emoji?", "Yes. Emoji are drawn with your phone's own emoji font and printed into the sticker picture, so the person you send it to sees exactly the same."], ["Can I choose where the line breaks?", "Yes. Press Enter in the box to start a new line. If there is just one long line, the tool splits it into two or three even parts by itself."], ["Why the white border?", "The border makes the sticker stand out on both dark and light chat backgrounds. If you do not want it, switch off \"Add a border\"."], ["Is it free, and is anything uploaded?", "It is completely free and needs no login. The sticker is made inside your phone or browser; no text or picture is sent to any server."]]}, "bn": {"title": "লেখার স্টিকার বানান — বাংলা, হিন্দি, হিংলিশে", "sub": "কয়েকটা শব্দ লিখুন, ফন্ট আর রং বাছুন — সাদা বর্ডারসহ 512×512 WebP স্টিকার, 100 KB-র কম। শুভ সকাল, ধন্যবাদ, হা হা… সব নিজের ভাষায়।", "art": "<h2>নিজের ভাষায় লেখার স্টিকার</h2>\n<p>কখনো কখনো ছবির চেয়ে দুটো শব্দ বেশি কাজ করে: পরিবারের গ্রুপে একটা \"শুভ সকাল\", বন্ধুকে একটা \"ধন্যবাদ\", বা কোনো মজার কথায় জোরে \"হা হা হা\"। এই পেজ সরাসরি লেখার মোডে খোলে। যেকোনো ছোট লাইন লিখুন, ফন্ট আর রং বাছুন, আর টুল সেটাকে সাদা বর্ডারওয়ালা স্টিকার বানিয়ে দেয় — 512 × 512 পিক্সেল, WebP, 100 KB-র কম। রোমান অক্ষর (হিংলিশ আর ইংরেজি), দেবনাগরী (হিন্দি, মারাঠি) আর বাংলা লিপি, তিনটেই চলে। ফন্টগুলো টুলের ভেতরেই রাখা, তাই ফোনে সেই ফন্ট থাকুক বা না থাকুক, সব ফোনে অক্ষর একই রকম দেখায়।</p>\n<h2>লেখার স্টিকার বানানোর ধাপ</h2>\n<ol><li>বাক্সে নিজের লাইন লিখুন, বা নিচের তৈরি শব্দগুলোর কোনো একটায় ট্যাপ করুন।</li><li>লম্বা লাইন নিজে থেকেই দুই বা তিন ভাগে ভেঙে যায়, যাতে স্টিকার চৌকো থাকে। নিজের মতো ভাঙতে চাইলে Enter চেপে নতুন লাইন শুরু করুন।</li><li>ফন্ট বাছুন: <b>Baloo</b> গোল আর মোটা, <b>Kalam</b> হাতের লেখার মতো, <b>Galada</b> বাংলার জন্য ডিজাইন করা, আর <b>Bangers</b> ইংরেজির জন্য কমিক ধাঁচের।</li><li>অক্ষরের রং, অক্ষরের কিনারা আর কিনারার মোটা ঠিক করুন। চাইলে <b>পেছনে রঙের প্যাচ</b> চালু করুন — শব্দের পেছনে গোল কোণের রঙিন বাক্স চলে আসে।</li><li><b>ট্রে-তে রাখুন</b> চাপুন, পরের লাইন লিখুন, এভাবে পুরো সেট বানিয়ে ফেলুন।</li><li>ট্রে থেকে একটা একটা করে ডাউনলোড করুন, সব একসাথে ZIP-এ নিন, বা সরাসরি শেয়ার করুন।</li></ol>\n<h2>লেখার স্টিকার সেটের আইডিয়া</h2>\n<ul><li><b>রোজকার শুভেচ্ছা:</b> শুভ সকাল, শুভ রাত্রি, দিনটা ভালো কাটুক, বা আপনার পরিবারের নিজস্ব সম্ভাষণ।</li><li><b>চটজলদি উত্তর:</b> ঠিক আছে, আসছি, পরে ফোন করছি, ধন্যবাদ, দুঃখিত।</li><li><b>প্রতিক্রিয়া:</b> দারুণ!, হা হা হা, কী কাণ্ড!, সত্যি?</li><li><b>পরিবারের গ্রুপের জন্য:</b> খেয়েছ?, বাড়ি পৌঁছেছ?, সাবধানে থেকো।</li><li><b>উৎসব:</b> দুর্গাপুজো, দীপাবলি, ঈদ, পয়লা বৈশাখের শুভেচ্ছা — প্রতিটা উৎসবের ছোট একটা সেট।</li><li><b>নিজের ঢং:</b> নিজের বা বন্ধুর আদরের নাম, বা যে কথাটা আপনি সবসময় বলেন।</li></ul>\n<h2>কেন লেখার স্টিকার?</h2>\n<p>লেখার স্টিকার পাঠাতে এক সেকেন্ডও লাগে না, আর টাইপ করা মেসেজের চেয়ে অনেক বেশি চোখে পড়ে। বয়স্ক আত্মীয়রা, যাঁরা ছোট অক্ষর পড়তে কষ্ট পান, তাঁরাও বড় রঙিন অক্ষর সহজে পড়তে পারেন। নিজের ভাষায়, নিজের কথায় বানানো স্টিকার পরিবার আর বন্ধুদের কাছে বেশি আপন লাগে — বাজারের তৈরি প্যাকে যা পাওয়া যায় না, সেটাও আপনি নিজেই বানিয়ে নিতে পারেন।</p>\n<h2>অক্ষর যাতে পরিষ্কার পড়া যায়</h2>\n<p>চ্যাটে স্টিকার ছোট দেখায়, তাই এক থেকে চারটে শব্দই সবচেয়ে ভালো। হালকা রঙের অক্ষর (হলুদ, সাদা) গাঢ় কিনারাসহ, বা গাঢ় অক্ষর সাদা প্যাচের ওপর — দুটোই হালকা আর গাঢ় থিমে পড়া যায়। কিনারার মোটা 8 থেকে 12-র মধ্যে রাখুন। হিন্দির মাত্রা আর বাংলা অক্ষরের ওপর-নিচের চিহ্ন জায়গা নেয় — টুল তার জন্য জায়গা রাখে, তবু একটা খুব লম্বা লাইনের চেয়ে দুটো ছোট লাইন ভালো দেখায়।</p>\n<h2>পাঠানো আর WhatsApp-এ যোগ করা</h2>\n<p>সেভ করা WebP ফাইলটা চ্যাটে সরাসরি পাঠাতে পারেন। স্টিকার ট্রে-তে রাখতে চাইলে Android-এ একটা স্টিকার-প্যাক অ্যাপ নিন, তাতে কমপক্ষে তিনটে স্টিকার ইমপোর্ট করুন আর প্যাকটা WhatsApp-এ যোগ করুন। এই টুল আলাদাভাবে তৈরি, WhatsApp-এর সঙ্গে এর কোনো সম্পর্ক নেই।</p>\n<h2>কিছু ভুল দেখালে</h2>\n<ul><li><b>অক্ষরের জায়গায় চৌকো বাক্স:</b> বাছা ফন্টটা সেই লিপি জানে না — Baloo (অটো) বাছুন।</li><li><b>অক্ষর খুব ছোট:</b> লাইন ছোট করুন বা দুই লাইনে ভাঙুন।</li><li><b>PNG সেভ হল:</b> কিছু iPhone ব্রাউজার WebP বানায় না; Chrome-এ খুলুন বা স্টিকার-প্যাক অ্যাপে বদলে নিন।</li></ul>", "faq": [["কোন কোন ভাষায় লেখা যায়?", "হিংলিশ আর ইংরেজি (রোমান অক্ষর), হিন্দি আর মারাঠি (দেবনাগরী), আর বাংলা। তিনটে লিপির ফন্টই টুলের ভেতরে আছে, আলাদা কিছু ইনস্টল করতে হয় না।"], ["ইমোজি দেওয়া যায়?", "হ্যাঁ। ইমোজি আপনার ফোনের নিজস্ব ইমোজি ফন্টে আঁকা হয় আর স্টিকারের ছবিতেই ছাপা হয়ে যায়, তাই যাকে পাঠাবেন সেও একই দেখবে।"], ["লাইন কোথায় ভাঙবে, নিজে ঠিক করা যায়?", "হ্যাঁ। বাক্সে Enter চেপে নতুন লাইন শুরু করুন। একটাই লম্বা লাইন থাকলে টুল নিজেই সেটাকে দুই বা তিনটে সমান ভাগে ভাঙে।"], ["সাদা বর্ডার কেন?", "বর্ডার স্টিকারটাকে গাঢ় আর হালকা দুই রকম চ্যাট ব্যাকগ্রাউন্ডেই আলাদা করে দেখায়। না চাইলে \"বর্ডার দিন\" বন্ধ করে দিন।"], ["এটা কি ফ্রি, আর কিছু কি আপলোড হয়?", "পুরোপুরি ফ্রি, লগইন লাগে না। স্টিকার আপনার ফোন/ব্রাউজারেই তৈরি হয়; কোনো লেখা বা ছবি কোনো সার্ভারে যায় না।"]]}}};</script>

    art: `<h2>Yeh sticker maker kya hai?</h2>
<p>Yeh ek free tool hai jo aapki apni photo ya kuch shabdon ko chat sticker bana deta hai. Sticker ek chhoti tasveer hoti hai jiska background transparent hota hai, isliye woh chat mein kisi dibbe ke andar nahi, seedha screen par tairti hui dikhti hai. Tool aapki photo se insaan, pet ya kisi cheez ko kaat kar alag karta hai, uske chaaron taraf asli kaagaz ke sticker jaisa safed kinara lagata hai, aur use 512 × 512 pixel, WebP format aur 100 KB se kam mein save karta hai — wahi size aur format jo WhatsApp ke sticker packs maangte hain. "Good morning" ya "Shukriya" jaisi line likh kar Hinglish, Hindi, Bangla ya English mein text sticker bhi bana sakte ho.</p>
<h2>Photo se sticker kaise banayein — step by step</h2>

<h2>WhatsApp mein sticker kaise lagayein</h2>
<p>Koi bhi website WhatsApp mein seedha sticker nahi daal sakti. Android par Play Store se koi sticker-pack app lena padta hai: usmein naya pack banao, yahan save ki hui WebP files import karo aur pack ko WhatsApp mein add karo. Ek pack mein kam se kam 3 sticker chahiye, isliye shuru karne se pehle teen ya zyada bana lo. iPhone ya Android par save ki hui image ko chat mein seedha bhej bhi sakte ho; woh transparent background wali tasveer ki tarah dikhti hai. WhatsApp ke kuch naye versions mein image se sticker banane ka apna option bhi hota hai — dikhe to yahan se save ki hui file chuno. Yeh tool alag se bana hai, WhatsApp se iska koi rishta nahi hai.</p>
<h2>Achha sticker banane ke tips</h2>
<ul><li>Aisi photo lo jismein cheez badi, saaf aur achhi roshni mein ho, aur background alag rang ka ho.</li><li>Chehre ka close-up, saaf expression ke saath, sabse achha lagta hai: hansta hua, hairaan, thumbs up.</li><li>Line chhoti rakho — do-teen shabd phone par chhote size mein bhi padh liye jaate hain.</li><li>Peele ya safed akshar, gehre kinare ke saath, light aur dark dono chat theme par padhe jaate hain.</li><li>Ek idea par poora set banao (greetings, reactions, tyohaar ki badhai), taaki pack poora lage.</li></ul>
<h2>Aam dikkatein aur unka hal</h2>
<ul><li><b>Insaan ka koi hissa kat gaya:</b> <b>Jodo</b> chuno aur us hisse par tap karo.</li><li><b>Thoda background bach gaya:</b> <b>Hatao</b> chuno aur us hisse par tap karo.</li><li><b>AI load nahi hua:</b> pehli baar lagbhag 15 MB download hota hai, ek baar internet check karo. Uske baad offline bhi chalta hai. Tab tak <b>Poori photo</b> ya text sticker use kar sakte ho.</li><li><b>WebP ki jagah PNG save hua:</b> kuch browser (zyada tar iPhone par) WebP file nahi bana paate. Sticker theek hai; sticker-pack app use badal leti hai.</li></ul>`,

    art: `<h2>यह स्टिकर मेकर क्या है?</h2>
<p>यह एक फ़्री टूल है जो आपकी अपनी फ़ोटो या कुछ शब्दों को चैट स्टिकर बना देता है। स्टिकर एक छोटी तस्वीर होती है जिसका बैकग्राउंड पारदर्शी (transparent) होता है, इसलिए वह चैट में किसी डिब्बे के अंदर नहीं, सीधे स्क्रीन पर तैरती हुई दिखती है। टूल आपकी फ़ोटो से इंसान, पालतू जानवर या किसी चीज़ को काटकर अलग करता है, उसके चारों ओर असली काग़ज़ के स्टिकर जैसा सफ़ेद किनारा लगाता है, और उसे 512 × 512 पिक्सेल, WebP फ़ॉर्मेट और 100 KB से कम में सेव करता है — वही साइज़ और फ़ॉर्मेट जो WhatsApp के स्टिकर पैक माँगते हैं। "सुप्रभात" या "धन्यवाद" जैसी लाइन लिखकर हिंदी, हिंग्लिश, बांग्ला या अंग्रेज़ी में टेक्स्ट स्टिकर भी बना सकते हैं।</p>
<h2>फ़ोटो से स्टिकर कैसे बनाएँ — एक-एक क़दम</h2>
<ol><li>ऊपर <b>फ़ोटो से स्टिकर</b> चुनें और गैलरी से फ़ोटो लें, या कैमरे से खींचें।</li><li>टूल ख़ुद फ़ोटो के बीच वाली मुख्य चीज़ पकड़ने की कोशिश करता है। ग़लत हिस्सा आया हो तो जिस इंसान या चीज़ को रखना है, उस पर टैप करें। <b>जोड़ें</b> से दूसरा हिस्सा मिलाएँ (जैसे चेहरा और कमीज़), और <b>हटाएँ</b> से फ़ालतू हिस्सा निकालें।</li><li>सफ़ेद किनारा सेट करें: असली स्टिकर जैसा रूप चाहिए तो चालू रखें, स्लाइडर से पतला या मोटा करें।</li><li>चाहें तो ऊपर या नीचे एक लाइन लिखें, और फ़ॉन्ट, रंग और साइज़ चुनें।</li><li><b>ट्रे में डालें</b> दबाएँ। इसी तरह और स्टिकर बनाएँ।</li><li>एक-एक करके डाउनलोड करें, सब एक ZIP में लें, या ट्रे से सीधे शेयर करें।</li></ol>
<h2>WhatsApp में स्टिकर कैसे लगाएँ</h2>
<p>कोई भी वेबसाइट WhatsApp में सीधे स्टिकर नहीं डाल सकती। Android पर Play Store से कोई स्टिकर-पैक ऐप लेना पड़ता है: उसमें नया पैक बनाएँ, यहाँ सेव की गई WebP फ़ाइलें इम्पोर्ट करें और पैक को WhatsApp में जोड़ें। एक पैक में कम से कम 3 स्टिकर चाहिए, इसलिए शुरू करने से पहले तीन या ज़्यादा बना लें। iPhone या Android पर सेव की गई तस्वीर को चैट में सीधे भेज भी सकते हैं; वह पारदर्शी बैकग्राउंड वाली तस्वीर की तरह दिखती है। WhatsApp के कुछ नए वर्ज़न में तस्वीर से स्टिकर बनाने का अपना विकल्प भी होता है — दिखे तो यहाँ से सेव की गई फ़ाइल चुनें। यह टूल अलग से बना है, WhatsApp से इसका कोई संबंध नहीं है।</p>
<h2>अच्छा स्टिकर बनाने के सुझाव</h2>
<ul><li>ऐसी फ़ोटो लें जिसमें चीज़ बड़ी, साफ़ और अच्छी रोशनी में हो, और बैकग्राउंड अलग रंग का हो।</li><li>चेहरे का क्लोज़-अप, साफ़ भाव के साथ, सबसे अच्छा लगता है: हँसता हुआ, हैरान, अँगूठा ऊपर।</li><li>लाइन छोटी रखें — दो-तीन शब्द फ़ोन पर छोटे साइज़ में भी पढ़ लिए जाते हैं।</li><li>पीले या सफ़ेद अक्षर, गहरे किनारे के साथ, हल्की और गहरी दोनों चैट थीम पर पढ़े जाते हैं।</li><li>एक विचार पर पूरा सेट बनाएँ (शुभकामनाएँ, प्रतिक्रियाएँ, त्योहार की बधाई), ताकि पैक पूरा लगे।</li></ul>
<h2>आम दिक़्क़तें और उनका हल</h2>

    art: `<h2>What is this sticker maker?</h2>
<p>This is a free tool that turns your own photo, or a few words, into a chat sticker. A sticker is a small picture with a transparent background, so it floats on the chat screen instead of sitting inside a box. The tool cuts the person, pet or object out of your photo, adds a white border around it like a real paper sticker, and saves it at 512 × 512 pixels, in WebP format and under 100 KB — the size and format that sticker packs for WhatsApp expect. You can also type a line such as "Good morning" or "Shukriya" and get a text sticker in Hinglish, Hindi, Bengali or English.</p>
<h2>How to make a sticker from a photo, step by step</h2>
<ol><li>Choose <b>Photo sticker</b> above and pick a photo from the gallery, or take one with the camera.</li><li>The tool tries to pick the main thing in the middle of the photo on its own. If it picked the wrong part, tap the person or object you want to keep. Use <b>Add</b> to join another part (for example the face and the shirt), and <b>Remove</b> to drop a piece you do not want.</li><li>Set the white border: keep it on for the classic sticker look, and move the slider for a thinner or thicker edge.</li><li>If you like, type a line for the top or bottom, and choose the font, colour and size.</li><li>Tap <b>Add to tray</b>. Make a few more stickers the same way.</li><li>Download them one by one, all together as a ZIP, or share them straight from the tray.</li></ol>
<h2>How to use the stickers in WhatsApp</h2>
<p>No website can put stickers into WhatsApp directly. On Android you need a sticker-pack app from the Play Store: create a new pack in it, import the WebP files you saved here, and add the pack to WhatsApp. A pack needs at least 3 stickers, so make three or more before you start. On an iPhone or Android you can also simply send the saved image in a chat; it shows as a picture with a transparent background. Some newer versions of WhatsApp also have their own option to make a sticker from an image — if you see it, pick the file saved from here. This tool is made independently and has no connection with WhatsApp.</p>
<h2>Tips for a good sticker</h2>
<ul><li>Use a photo where the subject is large, sharp and well lit, against a background of a different colour.</li><li>Close-ups of a face with a clear expression work best: laughing, surprised, thumbs up.</li><li>Keep the caption short — two or three words can still be read at a small size on a phone.</li><li>Yellow or white letters with a dark edge stay readable on both light and dark chat themes.</li><li>Make a set around one idea (greetings, reactions, festival wishes) so the pack feels complete.</li></ul>
<h2>Common problems and fixes</h2>
<ul><li><b>Part of the person is missing:</b> choose <b>Add</b> and tap the missing part.</li><li><b>Some background is left:</b> choose <b>Remove</b> and tap that part.</li><li><b>The AI does not load:</b> the first time it downloads about 15 MB, so check the internet once. After that it works offline too. Meanwhile you can use <b>Whole photo</b> or make a text sticker.</li><li><b>Saved as PNG, not WebP:</b> some browsers (mostly on iPhone) cannot create WebP files. The sticker is fine; a sticker-pack app converts it.</li></ul>`,

    art: `<h2>এই স্টিকার মেকার কী?</h2>
<p>এটা একটা ফ্রি টুল, যা আপনার নিজের ছবি বা কয়েকটা শব্দকে চ্যাট স্টিকারে বদলে দেয়। স্টিকার হল একটা ছোট ছবি যার ব্যাকগ্রাউন্ড স্বচ্ছ (transparent), তাই সেটা চ্যাটে কোনো বাক্সের ভেতরে নয়, সরাসরি স্ক্রিনের ওপর ভেসে থাকে। টুলটি আপনার ছবি থেকে মানুষ, পোষা প্রাণী বা কোনো জিনিস কেটে আলাদা করে, তার চারপাশে আসল কাগজের স্টিকারের মতো সাদা বর্ডার দেয়, আর সেটা 512 × 512 পিক্সেল, WebP ফরম্যাটে ও 100 KB-র কমে সেভ করে — WhatsApp-এর স্টিকার প্যাক ঠিক এই মাপ আর ফরম্যাটই চায়। "শুভ সকাল" বা "ধন্যবাদ"-এর মতো লাইন লিখে বাংলা, হিন্দি, হিংলিশ বা ইংরেজিতে লেখার স্টিকারও বানাতে পারেন।</p>
<h2>ছবি থেকে স্টিকার কীভাবে বানাবেন — ধাপে ধাপে</h2>
<ol><li>ওপরে <b>ছবি থেকে স্টিকার</b> বাছুন আর গ্যালারি থেকে ছবি নিন, বা ক্যামেরায় তুলুন।</li><li>টুল নিজেই ছবির মাঝখানের প্রধান জিনিসটা ধরার চেষ্টা করে। ভুল অংশ এলে যে মানুষ বা জিনিসটা রাখবেন, তাতে ট্যাপ করুন। <b>জুড়ুন</b> দিয়ে আরেকটা অংশ যোগ করুন (যেমন মুখ আর জামা), আর <b>সরান</b> দিয়ে বাড়তি অংশ বাদ দিন।</li><li>সাদা বর্ডার ঠিক করুন: আসল স্টিকারের মতো দেখাতে চালু রাখুন, স্লাইডারে সরু বা মোটা করুন।</li><li>চাইলে ওপরে বা নিচে একটা লাইন লিখুন, আর ফন্ট, রং ও মাপ বাছুন।</li><li><b>ট্রে-তে রাখুন</b> চাপুন। এভাবেই আরও স্টিকার বানান।</li><li>একটা একটা করে ডাউনলোড করুন, সব একসাথে ZIP-এ নিন, বা ট্রে থেকে সরাসরি শেয়ার করুন।</li></ol>
<h2>WhatsApp-এ স্টিকার কীভাবে যোগ করবেন</h2>

applyLang();
setMode(mode);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(`${BASE}sw.js`).catch(() => {});

// ---------- hidden self-test: ?selftest (local headless checks; writes PASS/FAIL into #selftest)
const runSelftest = async () => {
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = 'SELFTEST: running'; document.body.prepend(pre);
  const res = []; const info = [];
  const check = (name, pass, detail = '') => { res.push(`${pass ? 'PASS' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`); pre.textContent = ['SELFTEST: running', ...res].join('\n'); };
  const px = (c, x, y) => ctx2d(c).getImageData(x, y, 1, 1).data;
  const cornersClear = (c) => [[0, 0], [511, 0], [0, 511], [511, 511], [8, 8], [503, 8], [8, 503], [503, 503]].every(([x, y]) => px(c, x, y)[3] === 0);
  const inMargin = (c) => { const b = alphaBox(c, 0); return Boolean(b) && b.x >= MARGIN - 1 && b.y >= MARGIN - 1 && b.x + b.w <= OUT - MARGIN + 1 && b.y + b.h <= OUT - MARGIN + 1; };
  const coverage = (c) => { const d = ctx2d(c).getImageData(0, 0, c.width, c.height).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n += 1; return n / (c.width * c.height); };
  const words = (s) => s.trim().split(/\s+/).filter(Boolean).length;
  const step = async (name, fn) => { try { await fn(); } catch (e) { check(name, false, `error ${e && e.message}`); } };
  const lang0 = lang;
  try {
    // 1. four languages: every text filled, same keys, ~500+ words of content, FAQ + JSON-LD match
    await step('languages', async () => {
      const keysEn = Object.keys(T.en).sort().join();
      const ldEn = JSON.parse(STATIC_LD);
      const staticOk = ldEn.mainEntity.length === T.en.faq.length && ldEn.mainEntity.every((q, i) => q.name === T.en.faq[i][0] && q.acceptedAnswer.text === T.en.faq[i][1]);
      check('static FAQPage JSON-LD = English FAQ', staticOk, `${ldEn.mainEntity.length} questions`);
      for (const L of LANGS) {
        lang = L; applyLang();
        const empty = [...document.querySelectorAll('[data-t]')].filter((el) => !el.textContent.trim()).map((el) => el.dataset.t);
        const same = Object.keys(T[L]).sort().join() === keysEn;
        const ld = JSON.parse($('faqld').textContent);
        const faqOk = ld['@type'] === 'FAQPage' && ld.mainEntity.length >= 4 && ld.mainEntity.length === document.querySelectorAll('#faqList details').length && ld.mainEntity[0].name === t('faq')[0][0];
        const wArt = words($('art').textContent); const wAll = wArt + words($('faqList').textContent) + words(t('privText'));
        check(`lang ${L}`, !empty.length && same && faqOk && wAll >= 500, `empty=[${empty.join(',')}] keys=${same} faq=${ld.mainEntity.length} words: article ${wArt}, with FAQ+privacy ${wAll}`);
      }
      lang = 'hinglish'; applyLang();
    });
    // 2. fonts
    await step('fonts', async () => {
      const r = await Promise.all(Object.keys(FONTS).map(loadFont));
      check('fonts (5 OFL, local)', r.every(Boolean) && Object.values(FONTS).every((f) => document.fonts.check(`40px "${f.fam}"`)), Object.values(FONTS).map((f) => f.fam).join(', '));
    });
    // 3. text stickers
    setMode('text');
    for (const [txt, font, bubble] of [['Shukriya!', 'auto', false], ['धन्यवाद!', 'kalam', false], ['ভালো থেকো', 'galada', true], ['Ha ha ha', 'bangers', false], ['Good morning sab ko', 'auto', false]]) {
      await step(`text "${txt}"`, async () => {
        $('txt').value = txt; $('font').value = font; $('bubbleOn').checked = bubble; txtTouched = true;
        const c = await current(); const r = await encodeSticker(c);
        const cov = coverage(c);
        check(`text sticker "${txt}" (${font}${bubble ? ', bubble' : ''})`, c.width === 512 && c.height === 512 && cornersClear(c) && inMargin(c) && cov > 0.08 && r.ext === 'webp' && r.blob.type === 'image/webp' && r.blob.size < LIMIT,
          `512x512 corners clear, margin ok, cover ${(cov * 100).toFixed(0)}%, ${r.blob.type} ${fmtSize(r.blob.size)} q=${r.q}`);
      });
    }
    $('bubbleOn').checked = false; $('font').value = 'auto';
    // 4. synthetic photo with a known alpha mask: noisy picture, circle r=200 at (400,300) in 800x600
    await step('synthetic photo', async () => {
      const src = mk(800, 600); const sx = ctx2d(src); const id = sx.createImageData(800, 600);
      let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      for (let y = 0; y < 600; y += 1) for (let x = 0; x < 800; x += 1) { const i = (y * 800 + x) * 4; id.data[i] = (x * 0.3 + rnd() * 160) | 0; id.data[i + 1] = (y * 0.3 + rnd() * 160) | 0; id.data[i + 2] = (rnd() * 200) | 0; id.data[i + 3] = 255; }
      sx.putImageData(id, 0, 0);
      useImage(src, false);
      mask = mk(W, H); const mx = ctx2d(mask); mx.fillStyle = '#fff'; mx.beginPath(); mx.arc(400, 300, 200, 0, Math.PI * 2); mx.fill(); cutCache = null;
      const b = alphaBox(cutout(), 8);
      check('auto-crop to known mask', Math.abs(b.x - 200) <= 2 && Math.abs(b.y - 100) <= 2 && Math.abs(b.w - 400) <= 4 && Math.abs(b.h - 400) <= 4, `box ${b.x},${b.y} ${b.w}x${b.h} (expected 200,100 400x400)`);
      $('olOn').checked = true; $('olW').value = '10'; $('olColor').value = '#ffffff'; $('capTop').value = ''; $('capBot').value = '';
      const c = await current();
      const ring = px(c, 21, 256); const outside = px(c, 12, 256); const mid = px(c, 256, 256);
      check('white outline 10px', ring[3] > 240 && ring[0] > 240 && ring[1] > 240 && ring[2] > 240 && outside[3] === 0 && mid[3] === 255, `ring(21,256)=${[...ring]} outside(12,256)a=${outside[3]} centre a=${mid[3]}`);
      const fb = alphaBox(c, 0);
      check('fit 512 with 16px margin', c.width === 512 && c.height === 512 && cornersClear(c) && inMargin(c), `content box ${fb.x},${fb.y} ${fb.w}x${fb.h}`);
      const r = await encodeSticker(c);
      check('photo sticker WebP < 100 KB', r.ext === 'webp' && r.blob.type === 'image/webp' && r.blob.size < LIMIT, `${fmtSize(r.blob.size)} at q=${r.q} (noisy test image forces the quality search)`);
      $('olOn').checked = false; const c2 = await current(); const b2 = alphaBox(c2, 0);
      check('outline off', Math.abs(b2.x - 16) <= 2 && Math.abs(b2.w - 480) <= 3 && cornersClear(c2), `box ${b2.x},${b2.y} ${b2.w}x${b2.h}`);
      $('olOn').checked = true; $('capTop').value = 'Ha ha'; $('capBot').value = 'बहुत बढ़िया';
      const c3 = await current(); const r3 = await encodeSticker(c3);
      check('captions top + bottom', cornersClear(c3) && inMargin(c3) && coverage(c3) > 0 && r3.blob.size < LIMIT, `${fmtSize(r3.blob.size)} q=${r3.q}`);
      $('capTop').value = ''; $('capBot').value = '';
    });
    // 5. tray + ZIP
    await step('tray + zip', async () => {
      for (let i = 0; i < 3; i += 1) await addCurrent();
      const z = await zipBytes(tray);
      const dv = new DataView(z.buffer); const eocd = z.length - 22;
      check('tray of 3 + ZIP', tray.length === 3 && $('tray').querySelectorAll('img').length === 3 && dv.getUint32(0, true) === 0x04034b50 && dv.getUint32(eocd, true) === 0x06054b50 && dv.getUint16(eocd + 10, true) === 3, `${tray.map((x) => x.name).join(', ')} · zip ${fmtSize(z.length)}`);
    });
    const fails0 = res.filter((l) => l.startsWith('FAIL')).length;
    const head = [`SELFTEST: ${fails0 ? `FAIL (${res.length - fails0}/${res.length} passed)` : `ALL PASS (${res.length}/${res.length})`}`, `webp encode: ${WEBP_OK}`, ...res];
    pre.textContent = [...head, 'INFO ml: running…'].join('\n');
    // 6. AI model (informational: may not run headless)
    try {
      const s = mk(384, 384); const x = ctx2d(s); x.fillStyle = '#dee2e6'; x.fillRect(0, 0, 384, 384); x.fillStyle = '#e8590c'; x.beginPath(); x.arc(192, 192, 110, 0, Math.PI * 2); x.fill();
      const t0 = performance.now();
      const r = await Promise.race([segmentAt(s, 0.5, 0.5), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout 60s')), 60000))]);
      let inter = 0; let uni = 0;
      for (let y = 0; y < r.mh; y += 1) for (let xx = 0; xx < r.mw; xx += 1) { const a = r.keep[y * r.mw + xx] > 0.5; const gx = ((xx + 0.5) / r.mw) * 384 - 192; const gy = ((y + 0.5) / r.mh) * 384 - 192; const b = gx * gx + gy * gy <= 110 * 110; if (a && b) inter += 1; if (a || b) uni += 1; }
      info.push(`INFO ml: magic_touch ran headless in ${Math.round(performance.now() - t0)} ms, mask ${r.mw}x${r.mh}, IoU with the drawn circle ${(inter / uni).toFixed(2)}`);
    } catch (e) { info.push(`INFO ml: not run headless (${e && e.message}) — pipeline tested with a synthetic mask instead`); }
  } finally {
    lang = lang0; applyLang();
    const fails = res.filter((l) => l.startsWith('FAIL')).length;
    pre.textContent = [`SELFTEST: ${fails ? `FAIL (${res.length - fails}/${res.length} passed)` : `ALL PASS (${res.length}/${res.length})`}`, `webp encode: ${WEBP_OK}`, ...res, ...(info.length ? info : ['INFO ml: not finished'])].join('\n');
    pre.dataset.done = '1';
  }
};
if (params.has('selftest')) runSelftest();
window.__sm = { current, onTap, encodeSticker, buildSticker, alphaBox, addCurrent, get tray() { return tray; }, setMode, useImage };
</script>
